[project]
name = "week2-py"
version = "0.1.0"
description = "Week 2 of Ed Donner's Agentic AI Engineering course (OpenAI Agents SDK) run against local Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.0.19",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.uv]
# nothing special; `uv sync` creates the venv and installs the deps above
