[project]
name = "week4-py"
version = "0.1.0"
description = "Week 4 (LangGraph) runnable examples from Ed Donner's Agentic AI course, wired to a local Ollama model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.14",
    "langchain-community>=0.3.13",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
]

# Heavy / browser-only extras. The runnable core (lab2 + lab3 + the slimmed sidekick)
# does NOT need these. Install with:  UV_NATIVE_TLS=1 uv sync --extra browser
[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
    "nest-asyncio>=1.6.0",
]

[tool.uv]
# (no build backend needed; this is an app, not a library)
package = false
