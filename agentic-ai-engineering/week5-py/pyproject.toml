[project]
name = "week5-py"
version = "0.1.0"
description = "Week 5 of Ed Donner's Agentic AI Engineering course (Microsoft AutoGen: AgentChat + Core) run against local Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autogen-agentchat>=0.7.0",
    "autogen-ext[openai,ollama]>=0.7.0",
    "autogen-core>=0.7.0",
    "pydantic>=2.0.0",
]

[tool.uv]
# `uv sync` creates the venv and installs the deps above.
# IMPORTANT on this machine: run with UV_NATIVE_TLS=1 (otherwise TLS "UnknownIssuer").
