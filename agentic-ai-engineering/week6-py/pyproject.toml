[project]
name = "week6-py"
version = "0.1.0"
description = "Week 6 of Ed Donner's Agentic AI Engineering course (MCP): build your own FastMCP accounts server + an OpenAI Agents SDK agent that uses it over stdio, verified against local Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.2.0,<0.3.0",
    "mcp>=1.9.0,<2.0.0",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# `uv sync` creates the venv and installs the deps above.
# On this machine run it with UV_NATIVE_TLS=1 to avoid a TLS "UnknownIssuer" error.
