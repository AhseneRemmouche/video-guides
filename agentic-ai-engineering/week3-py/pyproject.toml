[project]
name = "stock_picker"
version = "0.1.0"
description = "Week 3 (CrewAI) of the Agentic AI guide: the stock_picker crew, adapted to run against local Ollama (no paid APIs, no Serper/Pushover keys)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Agentic AI Guide" }]
dependencies = [
    # Course uses crewai[tools]>=0.108.0. We pin a recent, pure-wheel range.
    "crewai>=0.108.0,<1.0.0",
    "crewai-tools>=0.40.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    # Used by chromadb's Ollama embedding function for crew memory embeddings.
    "ollama>=0.3.0,<1.0.0",
]

[project.scripts]
stock_picker = "stock_picker.main:run"
run_crew = "stock_picker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_picker"]

[tool.crewai]
type = "crew"
