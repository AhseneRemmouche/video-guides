<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Airplanes Fly - 2D explainer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b1020; height: 100%; }
  #wrap { display: grid; place-items: center; min-height: 100%; gap: 12px; padding: 16px; box-sizing: border-box; }
  /* The stage is a fixed 1280x720 canvas scaled to fit. Everything is drawn in SVG. */
  #stage { width: min(100%, 1280px); aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
           box-shadow: 0 20px 60px rgba(0,0,0,.5); background: linear-gradient(#8ec5ff, #cfe9ff); }
  #bar { display: flex; gap: 10px; align-items: center; color: #cdd6f4; font: 14px system-ui, sans-serif; }
  button { font: 600 14px system-ui; padding: 8px 16px; border-radius: 10px; border: 0; cursor: pointer;
           background: #7c5cff; color: #fff; }
  .scene { opacity: 0; }                 /* scenes are toggled by render(t) */
  text { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="How airplanes fly - animated explainer">
    <!-- sky gradient and ground stay visible across every scene -->
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ec5ff"/><stop offset="1" stop-color="#e8f4ff"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#ffe27a"/>
      </radialGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#sky)"/>
    <circle cx="1120" cy="130" r="70" fill="url(#sun)"/>

    <!-- SCENE 0: a giant plane over the clouds -->
    <g class="scene" id="s0">
      <g id="clouds0" fill="#ffffff" opacity="0.95">
        <ellipse cx="300" cy="500" rx="150" ry="55"/><ellipse cx="900" cy="560" rx="190" ry="65"/>
        <ellipse cx="640" cy="620" rx="220" ry="70"/>
      </g>
      <g id="plane0"><!-- plane drawn by JS transform --></g>
    </g>

    <!-- SCENE 1: heavier than ten elephants -->
    <g class="scene" id="s1">
      <text x="640" y="90" text-anchor="middle" font-size="44" font-weight="800" fill="#1b2a4a">So heavy!</text>
      <g id="scale">
        <rect x="610" y="560" width="60" height="90" fill="#6b7280"/>
        <rect x="470" y="545" width="340" height="24" rx="12" fill="#374151"/>
      </g>
      <g id="elephants"></g>
    </g>

    <!-- SCENE 2: how does it stay up? -->
    <g class="scene" id="s2">
      <text x="640" y="330" text-anchor="middle" font-size="150" font-weight="900" fill="#1b2a4a" opacity="0.9">?</text>
      <text x="640" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#1b2a4a">How does it stay up?</text>
    </g>

    <!-- SCENE 3: the secret is the wings -->
    <g class="scene" id="s3">
      <text x="640" y="110" text-anchor="middle" font-size="46" font-weight="800" fill="#1b2a4a">The wings</text>
      <ellipse cx="640" cy="420" rx="360" ry="70" fill="#2b3a67"/>
      <ellipse cx="640" cy="405" rx="360" ry="60" fill="#3f5591"/>
    </g>

    <!-- SCENE 4: speeding down the runway, air over the wings -->
    <g class="scene" id="s4">
      <rect x="0" y="600" width="1280" height="120" fill="#4b5563"/>
      <g id="runwayMarks" fill="#f9fafb"></g>
      <g id="plane4"></g>
      <g id="stream4" stroke="#1d4ed8" stroke-width="4" fill="none" opacity="0.8"></g>
    </g>

    <!-- SCENE 5: wing cross-section, air faster on top -->
    <g class="scene" id="s5">
      <text x="640" y="90" text-anchor="middle" font-size="40" font-weight="800" fill="#1b2a4a">Air moves faster on top</text>
      <path id="airfoil" d="M 360 430 C 560 360, 820 360, 960 420 C 820 450, 560 455, 360 430 Z" fill="#334155"/>
      <g id="streamTop" stroke="#ef4444" stroke-width="5" fill="none"></g>
      <g id="streamBot" stroke="#2563eb" stroke-width="5" fill="none"></g>
    </g>

    <!-- SCENE 6: lift pushes the plane up -->
    <g class="scene" id="s6">
      <g id="plane6"></g>
      <g id="liftArrows" stroke="#16a34a" stroke-width="10" fill="#16a34a"></g>
      <text x="640" y="660" text-anchor="middle" font-size="40" font-weight="800" fill="#16a34a">LIFT</text>
    </g>

    <!-- SCENE 7: engines push forward, wings hold up -->
    <g class="scene" id="s7">
      <g id="plane7"></g>
      <g id="thrust" stroke="#f97316" stroke-width="10" fill="#f97316"></g>
      <g id="lift7" stroke="#16a34a" stroke-width="10" fill="#16a34a"></g>
      <text x="300" y="640" text-anchor="middle" font-size="34" font-weight="800" fill="#f97316">THRUST</text>
      <text x="980" y="200" text-anchor="middle" font-size="34" font-weight="800" fill="#16a34a">LIFT</text>
    </g>

    <!-- SCENE 8: finale -->
    <g class="scene" id="s8">
      <g id="plane8"></g>
      <text x="640" y="140" text-anchor="middle" font-size="52" font-weight="900" fill="#1b2a4a">That's how planes fly!</text>
    </g>
  </svg>

  <div id="bar">
    <button id="play">Play with voice-over</button>
    <span id="clock">0.0s / 37.3s</span>
  </div>
</div>

<audio id="vo" src="../remotion/public/voiceover.mp3" preload="auto"></audio>

<script>
// The whole animation is a pure function of time: render(t) draws the exact frame
// for second t. The Play button just advances t from the audio clock; a ?t=SECONDS
// URL parameter freezes one frame (used for screenshots and for rendering to video).
const TL = {"fps":30,"durationSec":37.295,"lines":[
  {"i":0,"start":0.0,"end":5.664},{"i":1,"start":5.664,"end":10.842},
  {"i":2,"start":10.842,"end":14.696},{"i":3,"start":14.696,"end":17.03},
  {"i":4,"start":17.03,"end":22.174},{"i":5,"start":22.174,"end":26.443},
  {"i":6,"start":26.443,"end":30.412},{"i":7,"start":30.412,"end":34.691},
  {"i":8,"start":34.691,"end":37.295}
]};
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
// smooth 0..1 ramp used everywhere for gentle easing
const ease = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p));

// progress 0..1 through scene i (by its timeline line)
function sp(t, i) {
  const l = TL.lines[i];
  return clamp((t - l.start) / (l.end - l.start), 0, 1);
}
// fade a scene in at its start and out near its end
function sceneOpacity(t, i) {
  const l = TL.lines[i], d = l.end - l.start;
  const fin = clamp((t - l.start) / Math.min(0.5, d / 3), 0, 1);
  const fout = clamp((l.end - t) / Math.min(0.5, d / 3), 0, 1);
  return (t >= l.start - 0.01 && t <= l.end + 0.01) ? Math.min(fin, fout) : 0;
}

function planePath(cx, cy, s, flip) {
  const dir = flip ? -1 : 1;
  return `<g transform="translate(${cx} ${cy}) scale(${s * dir} ${s})">
    <ellipse cx="0" cy="0" rx="120" ry="30" fill="#e5e7eb"/>
    <path d="M -120 0 q -40 0 -55 -8 l 10 8 l -10 8 q 15 -8 55 -8 Z" fill="#cbd5e1"/>
    <polygon points="20,-8 95,-70 60,-6" fill="#93c5fd"/>
    <polygon points="20,8 95,70 60,6" fill="#60a5fa"/>
    <polygon points="-95,-6 -120,-48 -80,-6" fill="#93c5fd"/>
    <circle cx="70" cy="-2" r="7" fill="#1d4ed8"/><circle cx="90" cy="-1" r="6" fill="#1d4ed8"/>
  </g>`;
}

function render(t) {
  t = clamp(t, 0, TL.durationSec);
  for (let i = 0; i < 9; i++) $('s' + i).style.opacity = sceneOpacity(t, i);

  // Scene 0: plane drifts left->right, clouds drift slowly
  let p = sp(t, 0);
  $('plane0').innerHTML = planePath(lerp(120, 1160, ease(p)), lerp(250, 210, p), 1.0, false);
  $('clouds0').setAttribute('transform', `translate(${-40 * p} 0)`);

  // Scene 1: elephants stack onto the scale one by one
  p = sp(t, 1);
  let eh = '';
  const n = Math.floor(ease(p) * 10 + 0.001);
  for (let k = 0; k < n; k++) {
    const row = Math.floor(k / 5), col = k % 5;
    eh += `<g transform="translate(${500 + col * 60} ${520 - row * 44})"><ellipse rx="26" ry="18" fill="#9ca3af"/><circle cx="-22" cy="2" r="10" fill="#9ca3af"/></g>`;
  }
  $('elephants').innerHTML = eh;

  // Scene 4: plane accelerates along the runway, streamlines trail the wing
  p = sp(t, 4);
  const px = lerp(-150, 900, ease(p));
  $('plane4').innerHTML = planePath(px, 520, 0.9, false);
  let marks = '';
  for (let k = 0; k < 12; k++) { const mx = ((k * 140) - (px * 0.6) % 140 + 1400) % 1400 - 60; marks += `<rect x="${mx}" y="652" width="70" height="10"/>`; }
  $('runwayMarks').innerHTML = marks;
  let st = '';
  for (let k = 0; k < 3; k++) { const y = 495 + k * 14; st += `<path d="M ${px - 10} ${y} q -120 ${-20 + k * 12}, -260 ${k * 6}" opacity="${0.3 + 0.2 * k}"/>`; }
  $('stream4').innerHTML = st;

  // Scene 5: two streams race over/under the airfoil; the top one leads
  p = sp(t, 5);
  const adv = ease(p);
  $('streamTop').innerHTML = `<path d="M 300 405 C 520 330, 820 330, ${lerp(300, 1000, adv)} 388"/>`;
  $('streamBot').innerHTML = `<path d="M 300 455 C 520 470, 820 470, ${lerp(300, 820, adv * 0.72)} 452"/>`;

  // Scene 6: lift arrows grow and the plane rises
  p = sp(t, 6);
  $('plane6').innerHTML = planePath(640, lerp(470, 300, ease(p)), 1.1, false);
  const la = lerp(0, 90, ease(p));
  $('liftArrows').innerHTML = [520, 640, 760].map(x => `<line x1="${x}" y1="560" x2="${x}" y2="${560 - la}"/><polygon points="${x - 10},${560 - la} ${x + 10},${560 - la} ${x},${560 - la - 20}"/>`).join('');

  // Scene 7: thrust forward + lift up on a steady plane
  p = sp(t, 7);
  $('plane7').innerHTML = planePath(640, 400, 1.15, false);
  const g = ease(Math.min(1, p * 1.4));
  $('thrust').innerHTML = `<line x1="${520 - 120 * g}" y1="400" x2="520" y2="400"/><polygon points="520,390 520,410 545,400"/>`;
  $('lift7').innerHTML = `<line x1="640" y1="360" x2="640" y2="${360 - 120 * g}"/><polygon points="630,${360 - 120 * g} 650,${360 - 120 * g} 640,${340 - 120 * g}"/>`;

  // Scene 8: happy fly-off
  p = sp(t, 8);
  $('plane8').innerHTML = planePath(lerp(500, 820, ease(p)), lerp(430, 360, p), 1.25, false);

  $('clock').textContent = t.toFixed(1) + 's / ' + TL.durationSec.toFixed(1) + 's';
}

// Playback: drive render() from the audio clock so visuals stay in sync.
const vo = $('vo');
let raf = 0;
function loop() { render(vo.currentTime); if (!vo.paused && !vo.ended) raf = requestAnimationFrame(loop); }
$('play').addEventListener('click', () => {
  if (vo.paused) { vo.play(); raf = requestAnimationFrame(loop); $('play').textContent = 'Pause'; }
  else { vo.pause(); cancelAnimationFrame(raf); $('play').textContent = 'Play with voice-over'; }
});

// Freeze one frame when a ?t= parameter is present (screenshots / frame rendering).
const qp = new URLSearchParams(location.search);
const frozen = qp.get('t');
render(frozen !== null ? parseFloat(frozen) : 0);
window.renderFrame = render;   // exposed so a headless renderer can step frames
</script>
</body>
</html>
