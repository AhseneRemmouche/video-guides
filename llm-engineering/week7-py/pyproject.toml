[project]
name = "week7-qlora-pricer"
version = "0.1.0"
description = "Week 7 of Ed Donner's LLM Engineering course: QLoRA fine-tuning of Llama 3.1 8B to predict product prices (the 'Pricer')."
readme = "README.md"
requires-python = ">=3.10"

# ----------------------------------------------------------------------------
# DEPENDENCIES
# ----------------------------------------------------------------------------
# These are the REAL packages this project would need to actually run the
# QLoRA training (day3_4_train.py) and evaluation (day5_evaluate.py).
#
# !!! THEY ARE INTENTIONALLY NOT INSTALLED ON THIS MACHINE. !!!
#
#   - QLoRA training requires a CUDA GPU (e.g. Google Colab T4 / A100).
#   - `bitsandbytes` only provides 4-bit/8-bit kernels on CUDA; it is of no
#     use on a CPU-only Windows box like this one.
#   - `torch` + `transformers` + `peft` + `trl` + CUDA wheels are multi-GB.
#
# Do NOT run `uv sync` / `pip install` for these here: it would download
# gigabytes and still could not train or quantize without a GPU. This project
# is verified on this machine by SYNTAX CHECK ONLY (python -m py_compile).
#
# To actually run it, use a GPU environment (see README.md) and install the
# deps there, e.g.  `pip install -r` the list below (CUDA torch wheels).
dependencies = [
    "torch",          # CUDA build required for GPU training/inference
    "transformers",   # AutoModelForCausalLM / AutoTokenizer / BitsAndBytesConfig
    "peft",           # LoRA adapters (LoraConfig, PeftModel)
    "trl",            # SFTTrainer, SFTConfig, DataCollatorForCompletionOnlyLM
    "bitsandbytes",   # 4-bit / 8-bit quantization kernels -- CUDA ONLY
    "accelerate",     # device_map="auto" placement, training backend
    "datasets",       # load_dataset (the Week 6 pricer-data from the HF Hub)
    "huggingface-hub",# login(), push_to_hub()
    "wandb",          # training-loss logging
    "matplotlib",     # evaluation scatter chart (day5)
]

# NOTE: on Colab most of these (torch, transformers, datasets, accelerate) are
# preinstalled; the course notebook pip-installs pinned peft/trl/bitsandbytes/
# wandb at the top of each notebook.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
