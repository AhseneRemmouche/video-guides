[project]
name = "llm-eng-week1"
version = "0.1.0"
description = "Week 1 of Ed Donner's LLM Engineering course, runnable against a local Ollama (no paid keys)."
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv",
    "beautifulsoup4",
    "requests",
    "tiktoken",
]

[tool.uv]
# Nothing special; uv will provision Python 3.12 and a .venv on `uv sync`.
