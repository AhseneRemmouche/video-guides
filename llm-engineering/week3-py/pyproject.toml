[project]
name = "week3-py"
version = "0.1.0"
description = "Week 3 of Ed Donner's LLM Engineering course (open-source HuggingFace), adapted to run on a CPU-only machine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pin to transformers 4.x: the course uses the classic pipeline API, and
    # transformers 5.x removed task pipelines like `summarization` (Day 2).
    "transformers>=4.44.0,<5",
    "torch>=2.3.0",
    "huggingface-hub>=0.24.0",
    # Xet download backend. On this Windows machine the standard OpenSSL
    # download path crashes (OPENSSL_Applink); the xet path works.
    "hf-xet>=1.0.0",
]

# Pull the CPU-only PyTorch wheels (no CUDA), which are much smaller than the
# default GPU builds and are all this machine can use anyway.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
