[project]
name = "week5-py"
version = "0.1.0"
description = "Week 5 of Ed Donner's LLM Engineering course - a fully local RAG pipeline over Ollama (llama3.2 + nomic-embed-text)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# nothing special; using default resolver
