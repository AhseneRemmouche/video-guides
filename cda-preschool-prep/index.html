y","paragraphs":["Temperament is a child's inborn style of reacting to the world. Some children are easygoing, some are slow to warm up, and some are very active or intense. Temperament is not good or bad. Goodness of fit means adjusting your expectations and the environment to suit each child's style, such as giving a slow-to-warm child time to watch before joining a group, or giving an active child chances to move.","Emotional literacy is the ability to recognize, name and express feelings. Preschoolers often feel big emotions before they have words for them. Teachers help by naming feelings out loud: You look frustrated. The tower keeps falling. This tells the child the feeling is understood and gives them a word to use next time. Books, feeling charts and puppets also teach a wider feelings vocabulary, beyond happy, sad and mad.","Validating feelings means accepting the emotion even when you must limit the behavior. You can say, It is okay to feel angry. It is not okay to hit. Avoid telling children not to cry or that a feeling is silly, because that teaches them to hide emotions rather than manage them. Children who feel understood calm down faster and are more open to learning a better way to act."],"example":"When Lena sobs because her mother left, Mr. Chen kneels and says, You miss Mommy. You feel sad. She will come back after nap. Do you want to hold your family picture?"},{"heading":"Culture, Identity and Belonging","paragraphs":["A child's identity includes family, culture, language, race, gender and abilities. Children notice differences early and form ideas about themselves and others during the preschool years. A classroom that reflects each child's home life tells children that who they are is welcome. Display family photos, include books and dolls that show many skin tones and family types, and learn a few words in each child's home language.","Dual language learners are children learning their home language and English at the same time. Their home language is a strength, not a problem to fix. Encourage families to keep using the home language, because it supports thinking skills and family bonds. In class, pair words with gestures and pictures, use simple repeated phrases and give children time to listen before expecting them to speak English.","Respect for culture also means understanding that families have different practices around eating, sleeping, independence and expressing feelings. Ask families about their routines and goals instead of assuming. When a family practice differs from program habits, look for ways to honor both while keeping children safe and healthy. This shows children that their family's ways are respected at school."],"example":"During circle time, children share photos of their families. Ms. Okafor points out that some families have two moms, some live with grandparents and some have many cousins at home, and each family is special."},{"heading":"Friendship Skills and Cooperative Play","paragraphs":["Play develops in stages. Toddlers and young preschoolers often engage in solitary play, playing alone, and parallel play, playing beside another child with similar materials. Next comes associative play, where children share materials and talk but do not have a common goal. Older preschoolers move into cooperative play, working together toward a shared plan, such as building a store or acting out a story with roles.","Friendship skills must be taught. Teachers coach children on how to join play (Can I be the doctor?), how to offer ideas, how to trade and how to take turns. Sharing is hard for young children, so use timers, waiting lists and duplicate popular toys. Model polite words and point out specific cooperative acts. Short, positive phrases such as You can say, My turn when you are done are easy for children to remember.","Children with disabilities may need extra support to build social skills. A teacher might pair a child with a friendly peer buddy, use picture cards to show steps for joining play, or adapt materials so everyone can take part. The goal is real participation in play with classmates, not only parallel activity beside them. Work with the specialists named on a child's IEP, an Individualized Education Program, to use consistent strategies."],"example":"Two children both want the red truck. Mr. Patel sets a sand timer and says, Ava, you have the truck until the sand runs out. Then it is Leo's turn. Leo, while you wait, would you like to load the blocks?"},{"heading":"Empathy, Conflict Resolution and Inclusion","paragraphs":["Empathy is understanding and caring about how someone else feels. Preschoolers are just beginning to see other points of view. Teachers grow empathy by pointing out feelings in others (Look at Sam's face. He is sad because his tower fell), reading stories about feelings and inviting children to help: What could we do to help Sam feel better? Adults who show kindness every day are the strongest model.","Conflicts are normal and are chances to learn. A simple problem-solving process helps: first, calm everyone down; second, let each child say what happened and how they feel; third, restate the problem; fourth, ask children for ideas; fifth, choose an idea to try; and sixth, follow up to see if it worked. Teachers guide, but let children do as much of the thinking as possible.","Inclusion means every child, including children with disabilities and children from all backgrounds, is a full member of the group. Anti-bias practice goes further: teachers help children notice differences respectfully, use accurate words and speak up against unfair or hurtful comments. If a child says, You can't play, you're brown, respond right away, calmly and clearly, that this is hurtful and untrue, and support both children."],"example":"When Mia and Carlos argue over the dress-up cape, Ms. Lee helps each say how they feel, then asks, What can we do so you both get to be a superhero? Carlos suggests they take turns being the rescuer, and they agree."},{"heading":"Positive Guidance and Preventing Challenging Behavior","paragraphs":["Guidance is everything adults do to help children learn self-control and appropriate behavior. Positive guidance teaches skills and protects the child's dignity. Punishment, by contrast, tries to stop behavior through shame, pain or loss and does not teach what to do instead. Physical punishment, threats, humiliation, and withholding food, rest or outdoor time are never acceptable in early childhood programs.","Most challenging behavior can be prevented. A well-arranged room with clear areas, enough materials and open but short paths reduces crowding and conflict. Predictable routines and a picture schedule help children know what comes next. Give warnings before transitions, keep waiting times short and plan active learning instead of long periods of sitting. When children are engaged, they have little reason to act out.","Rules should be few, simple and stated positively, telling children what to do rather than what not to do. Walking feet inside is clearer than No running. Involve children in making the rules, post them with pictures and review them often. Consistent adults who follow through calmly help children feel safe and understand what is expected of them each day."],"example":"Ms. Brooks notices children push each other while waiting to wash hands. She starts sending two children at a time while the others sing a song, and the pushing stops."},{"heading":"Guidance Strategies That Teach","paragraphs":["Redirection guides a child from an unacceptable action to an acceptable one: Blocks are not for throwing. You can throw the soft balls outside. Offering choices gives children a sense of control within limits: Do you want to walk to the sink or hop like a bunny? Both choices must be acceptable to you. These simple tools prevent many power struggles before they start.","Natural consequences happen on their own: a child who will not wear mittens feels cold hands, as long as it is safe. Logical consequences are set by adults and directly related to the behavior: if a child draws on the table, they help wash it. Logical consequences should be respectful, related and reasonable, never a disguised punishment. Explain them calmly and without shaming the child.","Encouragement describes effort and progress: You worked hard on that puzzle. You kept trying different pieces. Praise often judges the child or the product: Good job, or You are so smart. Encouragement builds inner motivation, while too much general praise can make children depend on adult approval. Try describing what you see and asking children how they feel about their own work.","A calm-down space is a cozy area with soft items and feeling cards that a child can choose to use to regain control, with an adult's support. Unlike time-out, it is not a punishment and does not isolate the child. Teach children how to use it when they are calm, practice breathing and other calming steps there, and invite, rather than send, children to use it."],"example":"When Tyler grows upset and starts kicking chairs, Mr. Ruiz says calmly, Your body needs to calm down. Do you want to go to the cozy corner or squeeze the stress ball here with me?"},{"heading":"Understanding and Responding to Challenging Behavior","paragraphs":["All behavior is communication. A child who hits may be saying I want that toy, I am tired, or I don't know how to join you. Observe and record when the behavior happens, what comes right before it and what follows. Patterns help you understand the purpose of the behavior so you can teach a better way for the child to meet the same need.","The Pyramid Model is a widely used framework for supporting social and emotional skills. At the base are a strong, well-trained staff and nurturing, responsive relationships. Next are high-quality, supportive environments. The next level is targeted teaching of social and emotional skills for children who need extra help. At the top, a small number of children receive individualized, intensive support plans developed with families and specialists.","When a child bites or hits, respond quickly and calmly. First comfort and care for the hurt child, washing any bite with soap and water. Then tell the child who bit, in a firm, simple voice, Biting hurts. I won't let you bite. Watch for patterns and teach replacement words or actions. Follow program policy for informing both families, without sharing the other child's name.","If challenging behavior continues, partner with the family. Share observations factually and ask what they see at home. With family permission, involve specialists such as a mental health consultant or an early intervention team. A child with persistent challenges needs a consistent plan across home and school, not expulsion, threats or labels."],"example":"Ms. Kim's notes show that Andre usually hits right before lunch. After she adds a small morning snack and teaches him to say I need a break, the hitting decreases."}],"terms":[{"term":"Secure attachment","def":"A trusting emotional bond between a child and a caregiver who responds warmly and reliably. It gives the child a safe base for exploring."},{"term":"Self-concept","def":"The ideas a child holds about who they are, such as their abilities, looks and family."},{"term":"Self-esteem","def":"How a child feels about themselves; their sense of worth and competence."},{"term":"Temperament","def":"A child's inborn style of reacting to people and situations, such as easygoing, slow to warm up or intense."},{"term":"Goodness of fit","def":"How well adult expectations and the environment match a child's temperament. Teachers adjust care to improve the fit."},{"term":"Emotional literacy","def":"The ability to recognize, name and express feelings in oneself and others."},{"term":"Parallel play","def":"Playing beside another child with similar materials but without interacting much."},{"term":"Cooperative play","def":"Play in which children work together toward a shared goal, often with roles and a plan."},{"term":"Empathy","def":"Understanding and caring about another person's feelings."},{"term":"Anti-bias practice","def":"Teaching that helps children respect differences, use fair and accurate words and stand up against unfair treatment."},{"term":"Positive guidance","def":"Respectful strategies that teach children self-control and appropriate behavior rather than punishing them."},{"term":"Redirection","def":"Guiding a child from an unacceptable activity to an acceptable one that meets the same need."},{"term":"Logical consequence","def":"An adult-set result that is related, respectful and reasonable, such as helping clean a mess the child made."},{"term":"Encouragement","def":"Specific feedback about a child's effort or progress that builds inner motivation, as opposed to general praise."},{"term":"Calm-down space","def":"A cozy, inviting area where a child can choose to go to regain control, with adult support. It is not a punishment."},{"term":"Pyramid Model","def":"A tiered framework for promoting social and emotional skills: relationships and environments for all children, targeted teaching for some and intensive support for a few."}],"questions":[{"type":"scenario","section":"Secure Relationships and a Healthy Sense of Self","prompt":"Four-year-old Rosa struggles to put on her jacket before outdoor play, and the group is almost ready to go. What is the BEST response?","choices":["Zip the jacket for her so the group is not delayed.","Show her one step at a time and encourage her to try while you support her.","Tell her she can stay inside until she learns to do it herself.","Ask an older child to dress her every day."],"answer":1,"explain":["Not quite. Doing it for her is faster but takes away a chance to build independence and competence.","Correct. Breaking the task into steps and supporting her effort builds self-help skills and confidence.","Not quite. Keeping her inside is punitive and withholds outdoor time.","Not quite. A daily helper makes her dependent instead of teaching the skill."]},{"type":"scenario","section":"Temperament, Feelings and Emotional Literacy","prompt":"Noah, a new child, stands at the edge of the room and watches for long periods before joining any activity. What is the BEST way to support him?","choices":["Lead him by the hand into the busiest play area.","Tell his family he may have a developmental problem.","Let him watch, stay nearby, and gently invite him to a small, quiet activity when he seems ready.","Leave him alone until he decides to play."],"answer":2,"explain":["Not quite. Pushing a slow-to-warm child into a busy area can increase anxiety.","Not quite. Watching before joining is a normal temperament style, not a sign of a problem.","Correct. Respecting his slow-to-warm temperament while offering gentle invitations creates a good fit.","Not quite. He needs a warm, available adult, not to be left on his own."]},{"type":"scenario","section":"Temperament, Feelings and Emotional Literacy","prompt":"Kayla throws herself on the floor crying because snack time means she must stop painting. What is the BEST first response?","choices":["Say, You are sad and mad that painting is over. You can paint again after snack.","Say, Stop crying. Big girls don't cry over paint.","Tell her she will lose painting tomorrow if she keeps crying.","Walk away so she does not get attention for crying."],"answer":0,"explain":["Correct. Naming and validating her feelings while keeping the limit helps her calm down and learn feeling words.","Not quite. Dismissing feelings teaches children to hide emotions rather than manage them.","Not quite. Threats are punitive and do not teach emotional skills.","Not quite. She needs support to calm down, not to be left alone with big feelings."]},{"type":"scenario","section":"Culture, Identity and Belonging","prompt":"Diego's family speaks Spanish at home. His father asks whether they should switch to English so Diego learns it faster. What is the BEST response?","choices":["Yes, speak only English at home so he does not get confused.","Encourage the family to keep using Spanish, because a strong home language supports his learning and family bonds.","Tell the father it does not matter what they do at home.","Suggest Diego stop speaking Spanish at school."],"answer":1,"explain":["Not quite. Dropping the home language can weaken family communication and does not speed up English learning.","Correct. The home language is a strength that supports thinking skills and identity while children learn English.","Not quite. This misses a chance to share helpful information and sounds dismissive.","Not quite. Discouraging the home language sends a message that his culture is not welcome."]},{"type":"scenario","section":"Culture, Identity and Belonging","prompt":"You notice that the books and dolls in your classroom show mostly one skin tone and one type of family. What is the BEST next step?","choices":["Leave them, since young children do not notice differences.","Remove all dolls and books that show people.","Add materials that reflect the races, cultures, abilities and family types of the children and the wider community.","Wait until a family complains."],"answer":2,"explain":["Not quite. Children notice differences very early and form ideas about themselves from what they see.","Not quite. Removing materials takes away learning instead of making it inclusive.","Correct. Diverse materials help every child see themselves and respect others.","Not quite. Teachers should create an inclusive environment before problems arise."]},{"type":"scenario","section":"Friendship Skills and Cooperative Play","prompt":"Ethan keeps grabbing toys from other children in the block area. What is the BEST teaching approach?","choices":["Keep Ethan out of the block area for the rest of the week.","Make him apologize each time and say nothing else.","Take all the blocks away until everyone can share.","Teach him words to ask, such as Can I have a turn?, and help him practice with a peer."],"answer":3,"explain":["Not quite. Long exclusion is punitive and does not teach a new skill.","Not quite. A forced apology does not teach him how to get a turn appropriately.","Not quite. Punishing the whole group is unfair and teaches nothing.","Correct. Teaching and practicing replacement words gives him a better way to meet his need."]},{"type":"scenario","section":"Friendship Skills and Cooperative Play","prompt":"Amira, who uses a wheelchair, often watches the other children play house but rarely joins. What is the BEST way to support her social participation?","choices":["Adapt the house area so she can reach the materials, and invite a friendly peer to play with her.","Give her a separate activity she can do alone.","Let her keep watching, because she seems content.","Tell the other children they must play with her."],"answer":0,"explain":["Correct. Adapting the space and supporting peer connections promotes real inclusion in play.","Not quite. A separate activity isolates her instead of including her.","Not quite. Watching may mean barriers are in the way; teachers should remove them.","Not quite. Forcing play rarely creates real friendships; coaching and adapting work better."]},{"type":"scenario","section":"Empathy, Conflict Resolution and Inclusion","prompt":"Two children are arguing loudly over who gets to use the toy cash register. Both are very upset. What should you do FIRST?","choices":["Decide who gets it and move on.","Put the cash register away for the day.","Help both children calm down before talking about the problem.","Ask which child had it first and give it to that child."],"answer":2,"explain":["Not quite. Deciding for them skips the chance to learn problem-solving.","Not quite. Removing the toy does not teach conflict resolution.","Correct. Children cannot solve problems while upset; calming down is the first step.","Not quite. Focusing only on who was first skips feelings and solutions."]},{"type":"scenario","section":"Empathy, Conflict Resolution and Inclusion","prompt":"During play, you hear a child tell a classmate who is a dual language learner, You can't play with us because you talk funny. What is the BEST response?","choices":["Ignore it, since children say things like this.","Respond right away that the words are hurtful, that everyone can play, and that speaking two languages is a special skill, then help them include her.","Send the child who spoke to time-out without explanation.","Talk to the families later but say nothing now."],"answer":1,"explain":["Not quite. Ignoring biased comments lets children think they are acceptable.","Correct. Anti-bias practice means responding calmly and immediately, giving accurate information and supporting inclusion.","Not quite. Punishment without teaching does not build understanding or empathy.","Not quite. The moment needs a response so both children learn and feel supported."]},{"type":"scenario","section":"Positive Guidance and Preventing Challenging Behavior","prompt":"Children often run in your classroom because there is a long, open path from the door to the window. What is the BEST way to prevent running?","choices":["Post a sign that says No running.","Remind children many times a day to stop running.","Keep children seated at tables most of the day.","Rearrange shelves to break up the long path and create clear play areas."],"answer":3,"explain":["Not quite. Preschoolers do not read signs, and negative rules are harder to follow.","Not quite. Frequent reminders do little if the room itself invites running.","Not quite. Long sitting is not developmentally appropriate and causes other behavior problems.","Correct. Changing the environment prevents the behavior at its source."]},{"type":"scenario","section":"Guidance Strategies That Teach","prompt":"Jada is throwing sand out of the sandbox, and it lands near other children. What is the BEST response?","choices":["Say, Sand stays low in the sandbox. If you want to throw, you can throw beanbags at the target.","Make her leave the playground and sit inside.","Say, Bad girl! You know better.","Close the sandbox for everyone."],"answer":0,"explain":["Correct. Redirection states the limit positively and offers an acceptable way to meet her need to throw.","Not quite. Taking away outdoor time is not appropriate guidance.","Not quite. Labeling a child as bad harms self-esteem and teaches nothing.","Not quite. Group punishment is unfair to the other children."]},{"type":"scenario","section":"Guidance Strategies That Teach","prompt":"Marcus becomes very upset after losing a game and starts shouting. Your classroom has a cozy area with pillows and feeling cards. What is the BEST response?","choices":["Send him to the time-out chair for four minutes.","Tell him he cannot play games anymore today.","Offer him a choice to use the cozy area or take deep breaths with you, and stay close to help him calm down.","Laugh it off so he sees it is not a big deal."],"answer":2,"explain":["Not quite. Time-out isolates and punishes rather than teaching calming skills.","Not quite. Taking away activities does not help him manage feelings next time.","Correct. A calm-down space chosen with adult support teaches self-regulation without punishment.","Not quite. Laughing dismisses his feelings and may embarrass him."]},{"type":"scenario","section":"Understanding and Responding to Challenging Behavior","prompt":"Three-year-old Leo bites a classmate during play. What should you do FIRST?","choices":["Bite Leo back gently so he learns how it feels.","Comfort the child who was bitten and wash the area with soap and water.","Call Leo's family to pick him up right away.","Tell the bitten child's family Leo's full name and history."],"answer":1,"explain":["Not quite. Biting a child is physical punishment and is never acceptable.","Correct. Caring for the hurt child comes first; then you calmly address the child who bit.","Not quite. Sending him home does not teach and is not the first priority.","Not quite. Sharing the other child's name breaks confidentiality."]},{"type":"scenario","section":"Understanding and Responding to Challenging Behavior","prompt":"Over several weeks, Sofia has hit classmates almost every day despite consistent guidance in the classroom. What is the BEST next step?","choices":["Tell the family Sofia will be expelled if it continues.","Keep doing the same thing and hope it improves.","Keep Sofia inside during outdoor play until the hitting stops.","Share your observation notes with her family, ask what they see at home and, with permission, involve a specialist to build a plan together."],"answer":3,"explain":["Not quite. Threats of expulsion damage trust and do not help the child.","Not quite. Persistent behavior signals a need for more support, not waiting.","Not quite. Withholding outdoor time is never appropriate guidance.","Correct. A family partnership and specialist support lead to a consistent, individualized plan."]},{"type":"mc","section":"Secure Relationships and a Healthy Sense of Self","prompt":"Which statement BEST describes secure attachment?","choices":["A child who never cries when a parent leaves.","A trusting bond with a responsive caregiver that gives a child a safe base to explore.","A child who prefers to play alone.","A rule that only one adult may comfort a child."],"answer":1,"explain":["Not quite. Securely attached children often protest separation; not crying is not the definition.","Correct. Secure attachment grows from warm, reliable care and supports exploration.","Not quite. Playing alone is a play style, not attachment.","Not quite. Children can form secure bonds with several caring adults."]},{"type":"mc","section":"Friendship Skills and Cooperative Play","prompt":"Two children play side by side at the water table with similar cups but do not interact. What type of play is this?","choices":["Cooperative play","Associative play","Parallel play","Dramatic play"],"answer":2,"explain":["Not quite. Cooperative play involves a shared goal and working together.","Not quite. Associative play includes sharing and talking without a common goal.","Correct. Parallel play is playing beside another child without much interaction.","Not quite. Dramatic play is pretend play with roles."]},{"type":"mc","section":"Guidance Strategies That Teach","prompt":"Which statement is an example of encouragement rather than general praise?","choices":["You used three colors and filled the whole page. Tell me about it.","Good job!","You are the best artist in the class.","I love it!"],"answer":0,"explain":["Correct. Encouragement describes specific effort and invites the child to reflect.","Not quite. Good job is general praise that gives little information.","Not quite. Comparing children judges and can harm others' self-esteem.","Not quite. This focuses on adult approval rather than the child's effort."]},{"type":"mc","section":"Positive Guidance and Preventing Challenging Behavior","prompt":"Which classroom rule is stated in the most positive and helpful way?","choices":["No hitting.","Don't run inside.","Stop yelling.","Use gentle hands with friends."],"answer":3,"explain":["Not quite. It tells children what not to do but not what to do.","Not quite. This is a negative rule; Walking feet inside is clearer.","Not quite. This is a command, not a positive rule.","Correct. Positive rules tell children exactly what to do."]},{"type":"mc","section":"Understanding and Responding to Challenging Behavior","prompt":"In the Pyramid Model, what forms the foundation that supports all children?","choices":["Individualized intensive behavior plans","Nurturing, responsive relationships and supportive environments","Time-out and loss of privileges","Formal testing for every child"],"answer":1,"explain":["Not quite. Intensive plans are at the top, for a small number of children.","Correct. Relationships and high-quality environments support every child and prevent most challenges.","Not quite. Punitive strategies are not part of the Pyramid Model.","Not quite. Testing is not the foundation of the model."]},{"type":"mc","section":"Positive Guidance and Preventing Challenging Behavior","prompt":"Which practice is never acceptable in an early childhood program?","choices":["Giving a warning before a transition","Offering two acceptable choices","Withholding a snack as a consequence for misbehavior","Using a picture schedule"],"answer":2,"explain":["Not quite. Transition warnings are a positive prevention strategy.","Not quite. Offering choices is a helpful guidance tool.","Correct. Food must never be withheld as punishment.","Not quite. Picture schedules help children predict routines."]}]},{"id":"m04","num":4,"title":"Building Productive Relationships with Families","areas":[11],"tagline":"How to welcome every family, communicate in both directions, support children through transitions and partner with families as children's first teachers.","objectives":["Explain why families are children's first and most important teachers and how partnership benefits children.","Welcome diverse family structures, cultures and languages with respect and without assumptions.","Use daily two-way communication and plan productive family-teacher conferences.","Support children and families through separation, new enrollment and the move to kindergarten.","Protect the confidentiality of family information and share concerns sensitively.","Connect families with community resources, referrals and support during times of stress or change."],"sections":[{"heading":"Families as Children's First Teachers","paragraphs":["Families know their children better than anyone else. They have been teaching their children language, values, routines and skills since birth, and they will stay in their children's lives long after preschool ends. Treating families as partners, not visitors, is a core part of good early childhood practice. When families and teachers work together, children feel more secure and learn more.","A partnership means respect flows both ways. Teachers bring knowledge of child development and group care; families bring deep knowledge of their own child's history, likes, fears and culture. Ask families what works at home, what they hope their child will learn and how they like to be contacted. Use what they tell you in your planning so the classroom feels connected to home.","Strength-based language matters. Describe what a child and family can do rather than focusing on problems. Instead of saying a family is uninvolved, consider what might be getting in the way, such as work schedules, transportation or language, and look for new ways to connect. Every family wants their child to do well, even when they show it in different ways."],"example":"On the first day, Ms. Harris gives each family an All About My Child sheet in their home language, asking about favorite foods, comfort items and words the child uses for the bathroom."},{"heading":"Welcoming Every Family","paragraphs":["Families come in many forms: two parents, single parents, grandparents raising grandchildren, foster families, adoptive families, same-sex parents, blended families and extended families living together. Use inclusive words such as your family or the grown-ups at home instead of assuming every child has a mom and a dad. Make sure books, photos and forms reflect these different families.","Culture shapes how families feed, comfort, discipline and talk with their children. Learn about each family's culture from the family itself rather than from stereotypes. Greet families by name, learn to pronounce names correctly and invite families to share songs, foods or traditions if they wish. Families should never feel they have to leave their culture at the door.","For families who speak a language other than English, provide written information in their home language when possible and arrange interpreters for important meetings. Avoid asking a child to interpret for a parent, especially about sensitive topics. Use pictures, gestures and simple words in everyday conversations, and learn key greetings in the family's language to show respect and welcome."],"example":"Mr. Nguyen changes the program's enrollment form from Mother's name and Father's name to Parent or guardian 1 and Parent or guardian 2, so every family can fill it out comfortably."},{"heading":"Two-Way Communication and Conferences","paragraphs":["Two-way communication means information flows from teacher to family and from family to teacher. Daily informal talks at drop-off and pick-up are the most powerful tool. Share one specific, positive moment about the child, and ask families how the evening or morning went. Short notes, photos, messaging apps, newsletters and bulletin boards add to these daily connections. Ask each family which methods work best for them.","Family-teacher conferences are planned meetings to share a child's progress and set goals together. Prepare by gathering observation notes, work samples and photos. Choose a private space and a time that fits the family's schedule, and offer an interpreter if needed. Begin with the child's strengths, share specific examples, invite the family's views and agree on next steps for home and school.","Good listening builds trust. Make eye contact if culturally comfortable, avoid jargon and pause to let families talk. Restate what you hear: It sounds like you are worried about bedtime. When families disagree with you, stay calm and curious rather than defensive. Write down what was agreed and follow up so families see that their input truly matters."],"example":"At pick-up, Ms. Diaz tells a father, Kofi counted all the steps on the slide today, up to fourteen! The father smiles and says Kofi has been counting stairs at home too."},{"heading":"Separation and Transitions","paragraphs":["Saying goodbye is hard for many preschoolers and their families. A consistent drop-off routine helps: a hug, a short special goodbye, a wave at the window and a clear goodbye from the parent. Encourage families never to sneak out, because that can damage trust. Comfort items such as a family photo or a small soft toy can help, and a warm teacher ready to greet the child makes a big difference.","Starting a new program is a big change. Before the first day, invite families to visit, share information about routines and learn about the child from them. Some programs offer a gradual start with shorter days. Expect some tears, clinging or regression, such as toileting accidents, in the first weeks, and reassure families that this is common. Keep families updated with quick messages during the first days.","Moving to kindergarten is another major transition. Help children get ready by reading books about kindergarten, practicing self-help skills and, if possible, visiting a kindergarten classroom. Share information about registration and what to expect with families. With family permission, programs may share helpful information with the new school. Celebrate this step so children feel proud and excited rather than worried."],"example":"Each morning, Grace and her mom do their special goodbye: two hugs, a high five and a wave from the window. Grace then helps Mr. Lopez feed the class fish."},{"heading":"Respecting Family Values and Engagement","paragraphs":["Families may have different views on feeding, sleep, toileting, dress, independence and discipline. When a family request differs from your usual practice, listen first to understand the reason behind it. Many requests can be honored. If a request conflicts with health, safety or licensing rules, explain the rule respectfully and work together to find a solution that meets the family's goal.","Family engagement means families take an active part in their child's learning, not only attending events. Offer many kinds of opportunities so every family can take part: reading a story, sharing a skill or tradition, helping with a field trip, joining a family advisory group, sending materials from home or doing a learning activity together at home. Respect families who cannot come in during the day; their involvement at home counts too.","Families also make decisions about their children's care. Invite family input on program policies, events and goals, and explain the reasons behind program decisions. When families feel that their ideas are welcomed and used, they become stronger partners and advocates for their children's learning. Simple tools such as a suggestion box, a short family survey or a parent committee give every family a voice."],"example":"A family asks that their son not be served pork for religious reasons. Ms. Ali notes it on the meal plan, tells the cook and makes sure he has an equally appealing protein at every meal."},{"heading":"Confidentiality and Sharing Concerns","paragraphs":["Confidentiality means keeping information about children and families private. Do not discuss a family's situation, a child's behavior or health, or records with other families, friends or on social media. Share information with coworkers only when they need it to care for the child. Keep files in a secure place and get written family permission before sharing records with outside professionals, except when the law requires it, such as reporting suspected child abuse or neglect.","Sometimes teachers need to share a concern, such as a possible developmental delay or a pattern of behavior. Choose a private time, not a rushed pick-up in front of others. Start with the child's strengths, describe what you observed with specific, factual examples and avoid labels or diagnoses. Ask what the family sees at home, and listen carefully to their perspective.","Families may react with worry, denial, anger or relief. Give them time and respect their feelings. Offer clear next steps, such as a developmental screening or a meeting with a specialist, and explain that early support can make a real difference. Continue to communicate and build trust; one conversation is often just the beginning."],"example":"Ms. Park asks Ty's grandmother to meet after nap. She shares Ty's love of building, then describes notes showing he rarely uses words to communicate, and asks what the grandmother has noticed at home."},{"heading":"Supporting Families Through Change and Challenges","paragraphs":["Families face stress from job loss, illness, divorce, moving, a new baby, military deployment, a death or money worries. Children often show stress through changes in behavior, sleep or eating. Let families know they can share changes at home so you can support the child. Keep classroom routines steady, offer extra comfort and read books about the change if appropriate, without taking sides in family conflicts.","Programs can connect families to community resources such as food banks, health clinics, housing help, parenting classes, mental health services and early intervention. Keep an up-to-date list and offer referrals privately and respectfully. A referral is a suggestion and connection to a service, and the family decides whether to use it. Follow up gently to see whether the connection was helpful.","Families of children with disabilities are key members of the team. They may be working with an IFSP, an Individualized Family Service Plan for children from birth to age three, or an IEP, an Individualized Education Program for children three and older. Ask families about their child's goals and strategies that work, attend planning meetings when invited and share progress regularly so home and school support each other.","The CDA process also recognizes the importance of families. Candidates distribute a Family Questionnaire to the families of children in their care, which gives families a chance to share feedback on the candidate's work. It is one more reminder that strong family relationships are part of being a competent early childhood professional."],"example":"After Maya's parents separate, her father mentions she is waking at night. Mr. Brown keeps her routine consistent, offers extra cuddle time with books and shares a list of family support services in a private envelope."}],"terms":[{"term":"Family engagement","def":"An ongoing partnership in which families actively take part in their child's learning and in program decisions."},{"term":"Two-way communication","def":"Communication in which information and ideas flow from teachers to families and from families to teachers."},{"term":"Family-teacher conference","def":"A planned, private meeting where teachers and families share a child's progress and set goals together."},{"term":"Diverse family structures","def":"The many forms families take, such as single-parent, grandparent-led, foster, adoptive, blended and same-sex parent families."},{"term":"Home language","def":"The language a family mainly uses at home with the child."},{"term":"Interpreter","def":"A trained adult who translates spoken conversation between languages. Children should not be used as interpreters for important matters."},{"term":"Separation anxiety","def":"Distress a child feels when apart from a familiar caregiver. It is common in young children and eases with consistent routines and warm care."},{"term":"Transition","def":"A change from one setting or stage to another, such as starting a new program or moving to kindergarten."},{"term":"Regression","def":"A temporary return to earlier behavior, such as toileting accidents, often during stress or change."},{"term":"Confidentiality","def":"Keeping information about children and families private and sharing it only with people who need it or with family permission."},{"term":"Referral","def":"Connecting a family to an outside service or specialist that may help. The family decides whether to use it."},{"term":"Community resources","def":"Local services that support families, such as clinics, food banks, housing help, parenting classes and early intervention."},{"term":"IFSP","def":"Individualized Family Service Plan; a plan for early intervention services for infants and toddlers with disabilities and their families."},{"term":"IEP","def":"Individualized Education Program; a written plan of special education goals and services for a child with a disability, usually age three and older."},{"term":"Family Questionnaire","def":"A form in the CDA process that families of children in the candidate's care complete to share feedback on the candidate's work."}],"questions":[{"type":"scenario","section":"Families as Children's First Teachers","prompt":"A mother tells you her daughter calms down at home when she sings a certain lullaby in their home language. What is the BEST way to use this information?","choices":["Thank her and ask her to teach you the lullaby so you can use it at nap time.","Explain that you only sing English songs in class.","Tell her the child needs to learn to calm down without songs.","Write it down but do not use it, since home and school are different."],"answer":0,"explain":["Correct. Using family knowledge builds continuity between home and school and honors the family as the child's first teacher.","Not quite. Refusing home-language songs sends a message that the family's culture is not welcome.","Not quite. Familiar comfort routines are helpful, not something to remove.","Not quite. Family information is most valuable when it shapes your care."]},{"type":"scenario","section":"Families as Children's First Teachers","prompt":"A father rarely attends classroom events. A coworker calls him uninvolved. What is the BEST response?","choices":["Agree and stop inviting him.","Consider what might be getting in the way, such as work hours, and offer other ways to stay connected, like photos and home activities.","Send home a note saying his child needs more support from him.","Tell the director the family does not care."],"answer":1,"explain":["Not quite. Giving up on a family closes the door to partnership.","Correct. A strength-based view looks for barriers and offers flexible ways to engage.","Not quite. A blaming note damages trust.","Not quite. Assuming families do not care is not supported by the facts and harms the relationship."]},{"type":"scenario","section":"Welcoming Every Family","prompt":"You are planning a Mother's Day art project. Two children in your group live with their grandfather, and one has two dads. What is the BEST approach?","choices":["Have the three children make cards for their teacher instead.","Skip those children during the activity.","Change it to a project honoring a special grown-up in each child's life.","Tell those children to make cards for a mother anyway."],"answer":2,"explain":["Not quite. Making them do a different activity singles them out.","Not quite. Leaving children out makes them feel their family does not count.","Correct. An inclusive project lets every child honor the important people in their own family.","Not quite. This ignores the real families of these children."]},{"type":"scenario","section":"Welcoming Every Family","prompt":"You need to talk with a parent who speaks mostly Vietnamese about her child's ear infection medicine schedule. Her five-year-old speaks some English. What is the BEST plan?","choices":["Ask the five-year-old to translate for her mother.","Speak slowly and loudly in English.","Send a note in English and hope someone reads it to her.","Arrange a trained interpreter or bilingual staff member and provide written instructions in Vietnamese if possible."],"answer":3,"explain":["Not quite. Children should not interpret important health information; mistakes are likely and it is unfair to the child.","Not quite. Speaking louder does not help understanding.","Not quite. This may leave the parent without the information she needs.","Correct. An interpreter and home-language materials ensure accurate, respectful communication."]},{"type":"scenario","section":"Two-Way Communication and Conferences","prompt":"Pick-up times are rushed, and you realize you only talk with families when something goes wrong. What is the BEST change to make?","choices":["Share one specific positive moment about each child regularly, and ask families how things are going at home.","Stop talking at pick-up and use only a monthly newsletter.","Save all comments for the yearly conference.","Post a list of children who misbehaved each day."],"answer":0,"explain":["Correct. Regular positive, two-way exchanges build trust so families are ready to partner when concerns arise.","Not quite. A newsletter is one-way and not personal.","Not quite. Waiting all year misses daily chances to connect.","Not quite. Posting misbehavior is shaming and breaks confidentiality."]},{"type":"scenario","section":"Two-Way Communication and Conferences","prompt":"You are preparing for a family-teacher conference about a child who is doing well in most areas but struggles with fine motor tasks. How should you BEGIN the conference?","choices":["Hand the family a list of skills the child cannot do yet.","Share the child's strengths with specific examples, then invite the family to share what they see at home.","Tell the family their child is behind and needs therapy.","Ask the family why they have not practiced writing at home."],"answer":1,"explain":["Not quite. Starting with weaknesses can make families defensive.","Correct. Beginning with strengths and inviting family views sets a respectful, collaborative tone.","Not quite. Teachers should not diagnose, and this skips partnership.","Not quite. This blames the family and harms trust."]},{"type":"scenario","section":"Separation and Transitions","prompt":"A parent asks whether she should slip out quietly at drop-off while her son is busy, so he will not cry. What is the BEST advice?","choices":["Yes, sneaking out avoids tears.","Stay the whole morning until he stops crying.","Say a short, loving goodbye every day, tell him when you will return and let the teacher help him settle.","Bring him late so he misses the goodbye time."],"answer":2,"explain":["Not quite. Sneaking out can make children feel unsafe and more anxious about future goodbyes.","Not quite. Long stays can make the goodbye harder; a short, consistent routine works better.","Correct. A predictable goodbye routine builds trust and helps children cope with separation.","Not quite. Avoiding goodbyes does not teach the child to manage separation."]},{"type":"scenario","section":"Separation and Transitions","prompt":"Three weeks after starting your program, a fully toilet-trained four-year-old begins having accidents. His mother is upset. What is the BEST response?","choices":["Put him back in diapers at school.","Tell her he is not ready for preschool.","Ask her to keep him home until it stops.","Reassure her that regression is common during big changes, handle accidents calmly and agree on a shared plan."],"answer":3,"explain":["Not quite. This may embarrass him and treats a temporary setback as permanent.","Not quite. Temporary regression does not mean a child is not ready.","Not quite. Excluding him disrupts his adjustment and burdens the family.","Correct. Calm reassurance and a shared plan support the child through the transition."]},{"type":"scenario","section":"Separation and Transitions","prompt":"Several children in your group will start kindergarten in the fall. What is the BEST way to support this transition?","choices":["Read books about kindergarten, practice self-help skills, arrange a visit if possible and share registration information with families.","Begin drilling children on worksheets all day.","Avoid mentioning kindergarten so children will not worry.","Tell children kindergarten is much harder and they must behave."],"answer":0,"explain":["Correct. Preparing children and families with information and experiences makes the move positive.","Not quite. Worksheet drills are not developmentally appropriate preparation.","Not quite. Silence leaves children unprepared and more anxious.","Not quite. Warnings create fear rather than excitement."]},{"type":"scenario","section":"Respecting Family Values and Engagement","prompt":"A family asks that their daughter not nap at school because she then stays up late at home. Your program has a rest time for all children. What is the BEST response?","choices":["Refuse, because rules are rules.","Listen to their concerns, explain the rest time policy and work out a plan, such as quiet rest with books if she does not fall asleep.","Agree, but secretly let her sleep anyway.","Tell them to find a different program."],"answer":1,"explain":["Not quite. A flat refusal ignores the family's real concern.","Correct. Listening and problem-solving together respects the family while meeting program requirements.","Not quite. Secretly going against a family's wishes breaks trust.","Not quite. This ends the partnership instead of solving the problem."]},{"type":"scenario","section":"Respecting Family Values and Engagement","prompt":"Many families in your program work during the day and cannot attend classroom events. What is the BEST way to increase family engagement?","choices":["Hold all events at 10 a.m. so the room is quiet.","Accept that these families will not be involved.","Offer varied options, such as evening events, take-home learning bags and ways to share skills or materials from home.","Require each family to volunteer a set number of hours in class."],"answer":2,"explain":["Not quite. Daytime-only events exclude working families.","Not quite. Families can engage in many ways beyond being present in class.","Correct. Flexible options let every family take part in their child's learning.","Not quite. Rigid requirements can create barriers and stress for families."]},{"type":"scenario","section":"Confidentiality and Sharing Concerns","prompt":"At pick-up, a parent asks you, Why does Jordan have a different teacher come in to work with him? Is something wrong with him? What is the BEST response?","choices":["Explain Jordan's diagnosis so she understands.","Say you don't know, even though you do.","Tell her to ask other parents.","Kindly say you cannot share information about other children, just as you would protect her child's privacy."],"answer":3,"explain":["Not quite. Sharing another child's information breaks confidentiality.","Not quite. Being dishonest harms trust; a clear, polite boundary is better.","Not quite. This encourages gossip about a child.","Correct. A respectful, clear statement protects confidentiality and reassures her about her own child's privacy."]},{"type":"scenario","section":"Confidentiality and Sharing Concerns","prompt":"Your observations show that a four-year-old rarely speaks and does not respond to his name. You want to share this with his family. What is the BEST approach?","choices":["Mention it quickly at pick-up while other parents are nearby.","Tell the family you think he has autism.","Ask for a private meeting, start with his strengths, share specific observations and ask what they notice at home.","Wait and say nothing in case he outgrows it."],"answer":2,"explain":["Not quite. Sensitive concerns need privacy and time.","Not quite. Teachers do not diagnose; they describe what they observe.","Correct. A private, strength-based, factual conversation invites partnership and next steps such as screening.","Not quite. Waiting can delay helpful early support."]},{"type":"scenario","section":"Supporting Families Through Change and Challenges","prompt":"A father shares that his family recently lost their apartment and is staying with relatives. His daughter has seemed tired and clingy. What is the BEST response?","choices":["Thank him for telling you, keep the information private, offer extra comfort and routine for his daughter, and privately share community resources.","Tell the other teachers and parents so they can help.","Suggest he keep her home until things settle down.","Tell him this is not something the program can help with."],"answer":0,"explain":["Correct. Supporting the child, protecting confidentiality and offering resources respectfully helps the whole family.","Not quite. Sharing with other parents breaks confidentiality.","Not quite. School routines often bring stability during stressful times.","Not quite. Programs can connect families to community resources."]},{"type":"mc","section":"Two-Way Communication and Conferences","prompt":"Which example BEST shows two-way communication with families?","choices":["A monthly printed newsletter","A daily conversation where the teacher shares news and asks about the child's evening","A poster of the menu on the wall","An email about a holiday closure"],"answer":1,"explain":["Not quite. A newsletter sends information one way.","Correct. Information and questions flow in both directions.","Not quite. A menu poster is one-way information.","Not quite. A closure email is one-way information."]},{"type":"mc","section":"Supporting Families Through Change and Challenges","prompt":"What is an IFSP?","choices":["A health form required for all preschoolers","A daily lesson plan","A family tuition agreement","A plan for early intervention services for infants and toddlers with disabilities and their families"],"answer":3,"explain":["Not quite. An IFSP is not a general health form.","Not quite. An IFSP is not a lesson plan.","Not quite. An IFSP has nothing to do with tuition.","Correct. The Individualized Family Service Plan guides early intervention from birth to age three."]},{"type":"mc","section":"Confidentiality and Sharing Concerns","prompt":"When may a teacher share a child's records with an outside specialist without written family permission?","choices":["When another parent asks","When the teacher thinks it would be helpful","When the law requires it, such as reporting suspected child abuse or neglect","Whenever the specialist calls"],"answer":2,"explain":["Not quite. Other parents are never entitled to a child's records.","Not quite. Good intentions do not replace family permission.","Correct. Legal requirements, such as mandated reporting, are an exception to the need for permission.","Not quite. Specialists need family consent to receive records."]},{"type":"mc","section":"Separation and Transitions","prompt":"Which is a common, temporary sign of stress when a preschooler starts a new program?","choices":["Regression, such as toileting accidents or wanting to be carried","Learning to read quickly","Never wanting to go home","Sudden interest in new foods"],"answer":0,"explain":["Correct. Regression is a common, temporary response to big changes.","Not quite. Rapid reading is not a sign of stress.","Not quite. This is not a typical stress response.","Not quite. Children under stress are more likely to resist new foods."]},{"type":"mc","section":"Welcoming Every Family","prompt":"Which phrase is the most inclusive way to address families in a note home?","choices":["Dear Moms and Dads","Dear Mothers","Dear Families","Dear Parents of Normal Children"],"answer":2,"explain":["Not quite. This leaves out grandparents, foster parents and other caregivers.","Not quite. This excludes many family members.","Correct. Dear Families includes every family structure.","Not quite. This is exclusionary and disrespectful."]},{"type":"mc","section":"Families as Children's First Teachers","prompt":"In which CDA Functional Area does building positive relationships with families belong?","choices":["Functional Area 9, Social","Functional Area 11, Families","Functional Area 12, Program Management","Functional Area 3, Learning Environment"],"answer":1,"explain":["Not quite. Social covers children's relationships with peers and adults in the group.","Correct. Functional Area 11, Families, falls under Competency Goal IV.","Not quite. Program Management covers running a well-organized program.","Not quite. Learning Environment covers space, materials and routines."]}]},{"id":"m05","num":5,"title":"Managing an Effective Program Operation","areas":[12],"tagline":"How to plan from observation, individualize for each child, keep accurate records, follow the rules and work as a team so your program runs smoothly and keeps getting better.","objectives":["Plan curriculum that grows from observations of children and their interests","Write lesson and weekly plans and explain the difference between theme-based and emergent or project approaches","Individualize goals and activities for each child, including children with IEPs or IFSPs","Keep accurate attendance, sign-in and sign-out, incident, health and enrollment records","Work as a team with co-teachers, the director and specialists while following licensing rules and program policies","Use program assessment and continuous quality improvement to make the program better over time"],"sections":[{"heading":"Planning Curriculum from Observation","paragraphs":["Program management in a preschool classroom starts with the children. Curriculum means everything children experience in a day: activities, routines, materials, conversations and relationships. Good teachers do not simply pick activities from a book. They watch children closely, take short notes and use what they learn to decide what to offer next. This cycle is often called observe, plan, teach and reflect.","Observation is watching and listening to children with a purpose and writing down what you actually see and hear, not your opinions. An anecdotal record is a brief, factual note about one moment, such as who was involved, what the child did and said, and the date. Over time these notes show each child's strengths, skills and interests, and they guide your planning.","Children's interests are powerful starting points. When several children are fascinated by the worms they found after a rain, that interest can lead to books, drawing, counting, measuring and new words. Planning from interests keeps children engaged and helps them connect new skills to things they already care about. Interest-based plans still include clear learning goals."],"example":"Ms. Rosa notices three children building ramps for cars in the block area every day. She writes notes, then adds tubes, measuring tape and books about wheels to next week's plan."},{"heading":"Lesson Plans, Weekly Plans and Project Work","paragraphs":["A weekly plan maps out what will happen in each learning center, at group times and outdoors. A lesson plan describes one activity in more detail: the goal, the materials, the steps, how you will adapt it for different children and how you will know if it worked. Written plans help the whole team know what to prepare, and they show families and licensing staff that learning is intentional.","Some programs use themes, such as a week about families or the seasons, chosen ahead of time by adults. Others use an emergent curriculum, where topics grow from children's questions and interests. The project approach is a form of emergent curriculum in which children investigate a real topic in depth for days or weeks, asking questions, visiting, representing what they learn and sharing it.","Both approaches can work when they are flexible and connected to children's lives. A good plan leaves room for change. If an activity is not working or children discover something exciting, a skilled teacher adjusts. Plans should balance active and quiet times, indoor and outdoor play, child-chosen and teacher-guided activities, and small and large groups."],"example":"After children ask why the classroom fish tank gets cloudy, the teachers start a two-week project. Children draw the tank, interview the custodian who cleans it and make a chart of feeding days."},{"heading":"Individualizing for Every Child","paragraphs":["Individualizing means planning so that each child can take part and grow from where they are. Teachers use observations and assessment information to set a few goals for each child and then think about how daily activities can support those goals. One painting activity might help one child practice holding a brush and another child practice naming colors in English.","Some children have an Individualized Education Program (IEP), a plan for children 3 and older with a disability. Others may still have an Individualized Family Service Plan (IFSP), which serves infants and toddlers and sometimes continues into the preschool years. These plans list goals and accommodations, such as a visual schedule, a special seat or extra time. Teachers follow the plan, work with specialists and share progress with families.","Individualizing also includes culture and language. Dual language learners benefit from labels and books in their home language, gestures and pictures, and time to listen before speaking. Ask families about their child's routines, comfort items and strengths. Small changes, made thoughtfully, help every child feel capable and included. Review goals often and update them as each child grows."],"example":"Jamal's IEP lists using a picture schedule. His teacher posts photos of each part of the day at his eye level and points to the next picture before every transition."},{"heading":"Record Keeping That Protects Children","paragraphs":["Accurate records keep children safe and keep the program accountable. Daily attendance shows exactly who is present, which matters during fire drills and emergencies. Sign-in and sign-out sheets record when each child arrives and leaves and who brought or picked up the child. Staff release a child only to an adult listed as an authorized pick-up person, and they check photo identification if they do not know the adult.","An incident or accident report is written whenever a child is hurt, becomes ill or is involved in an unusual event. It records the date, time, place, what happened, what staff did and who was notified. Families receive a copy, usually the same day, and the program keeps one on file. Write reports with facts, not blame or guesses.","Each child also has an enrollment file with contact and emergency information, health records such as immunizations and allergies, permission forms and any medication authorizations. Files are kept up to date, stored securely and shared only with people who need the information. Follow your state licensing rules about which records are required and how long to keep them."],"example":"A grandfather the teacher has never met arrives for Lily. The teacher checks the authorized pick-up list, asks for his photo ID, confirms his name matches, and then records the time he signed her out."},{"heading":"Licensing Rules and Program Policies","paragraphs":["Licensing rules are the minimum health and safety standards set by your state for child care programs. They cover topics such as staff-to-child ratios, group sizes, staff training, background checks, space, food and record keeping. Because these rules vary from state to state, always follow your state licensing rules and ask your director when you are unsure.","Programs also have their own written policies, often collected in a staff handbook and a family handbook. Policies explain how the program handles arrivals and departures, illness, medication, emergencies, guidance, meals and communication with families. Some programs follow extra standards, such as Head Start Program Performance Standards or accreditation criteria, which are often higher than licensing minimums.","Knowing the rules is part of being a responsible team member. Read the handbooks, keep required training current and model the policies in daily practice. If you see a rule being broken in a way that could harm a child, tell your supervisor right away. Following policies consistently protects children, families, staff and the program."],"example":"A new assistant asks if he can leave the playground to get a child's jacket. The lead teacher reminds him that program policy is to tell a co-teacher first so ratios and supervision stay in place."},{"heading":"Teamwork with Co-Teachers, Directors and Specialists","paragraphs":["Most preschool classrooms are run by a team: a lead teacher, co-teachers, assistants, floaters and sometimes volunteers. Clear roles help everyone know who sets up centers, who leads circle time, who supervises outside and who writes notes. Short daily check-ins and a regular planning meeting help the team share observations, solve problems and stay consistent with children.","Respectful communication matters. Talk about disagreements privately, not in front of children or families, and focus on what is best for the children. Share credit, ask for help and offer it. When each adult's skills are valued, the classroom runs more smoothly and children feel the calm. Teams that plan together also give children more consistent routines.","Teachers also work with the director and with specialists, such as speech-language therapists, special educators, mental health consultants, health consultants and family service workers. The director supports staff, manages the budget and ensures the program meets regulations. Specialists offer ideas you can use in the classroom. Bring your observations, ask questions and follow through on agreed strategies. Record what happens so the team can see whether a strategy is helping."],"example":"Two co-teachers disagree about how long circle time should last. They talk after the children leave, review their notes on attention, and agree to try a shorter circle for two weeks."},{"heading":"Organizing Time, Materials and Resources","paragraphs":["Good time management keeps the day predictable for children and manageable for adults. Prepare materials before children arrive, plan smooth transitions and use children's waiting time well. A posted daily schedule helps staff and children know what comes next, while still allowing flexibility when children are deeply engaged. Build in time each week for planning, cleaning and preparing materials.","Organize materials so children can find and return them on their own. Use low, open shelves, labels with pictures and words, and clear containers. Rotate materials based on observations and interests, and check regularly for broken or unsafe items. A well-organized room supports independence and reduces conflicts. It also helps adults find what they need quickly during busy times.","Teachers often help with simple budgeting and ordering. Keep a running list of supplies that are low, compare prices, choose durable and open-ended materials, and request items through the program's process. Use free and recycled materials, such as boxes, fabric scraps and natural items, when they are safe and clean. Family child care providers run a small business and must also track income, expenses, contracts and insurance."],"example":"At the end of each week, Mr. Chen checks the art shelf, writes down glue sticks and paper that are low, and gives the list to the director by Friday."},{"heading":"Continuous Quality Improvement","paragraphs":["Continuous quality improvement means regularly asking two questions: how well are we doing, and how can we do better? Programs gather information, set goals, make changes and then check the results again. This ongoing cycle helps a program keep growing instead of staying the same year after year, and it gives every staff member a part in making the program stronger.","Program assessment tools help teams look at the classroom with fresh eyes. Many programs use environment rating scales, classroom observation tools, child assessment summaries and family surveys. Some states have a Quality Rating and Improvement System that recognizes programs for meeting higher standards. The purpose is not to judge individual teachers but to guide improvement.","Teachers contribute by reflecting on their own practice, welcoming feedback, sharing ideas at staff meetings and trying new strategies. Families' input is valuable, too. When the whole team works on a few clear goals at a time, such as more conversations at meals or better outdoor materials, quality improves in ways children feel every day."],"example":"Family surveys show that parents want more information about what children learn. The team decides to post a short daily note with photos by the sign-in sheet and asks families about it a month later."}],"terms":[{"term":"Curriculum","def":"Everything children experience in the program, including activities, routines, materials, interactions and the plans that guide them."},{"term":"Observation","def":"Watching and listening to children with a purpose and recording what they actually do and say, without opinions."},{"term":"Anecdotal record","def":"A short, factual written note describing one event or behavior, including the date and who was involved."},{"term":"Emergent curriculum","def":"A way of planning in which topics and activities grow from children's interests, questions and experiences."},{"term":"Project approach","def":"An in-depth investigation of a real topic by children over days or weeks, guided by their questions."},{"term":"Lesson plan","def":"A written plan for one activity that lists the goal, materials, steps, adaptations and how learning will be checked."},{"term":"Individualizing","def":"Adjusting goals, activities and support so that each child can participate and grow from where they are."},{"term":"IEP","def":"Individualized Education Program: a written plan for a child 3 or older with a disability that lists goals, services and accommodations."},{"term":"Accommodation","def":"A change in how a child takes part, such as a visual schedule or special seating, that gives equal access without changing the goal."},{"term":"Authorized pick-up","def":"An adult the family has listed in writing as allowed to take the child from the program."},{"term":"Incident report","def":"A written record of an injury, illness or unusual event, describing what happened, what staff did and who was told."},{"term":"Licensing rules","def":"Minimum health and safety standards set by a state that child care programs must meet to operate legally."},{"term":"Program policies","def":"A program's written procedures, often in staff and family handbooks, for how daily operations are handled."},{"term":"Continuous quality improvement","def":"An ongoing cycle of gathering information, setting goals, making changes and checking results to improve a program."},{"term":"Environment rating scale","def":"A program assessment tool that looks at the classroom space, materials, interactions and routines to guide improvement."}],"questions":[{"type":"scenario","section":"Planning Curriculum from Observation","prompt":"For several days, a group of children has been collecting leaves on the playground and sorting them by color. What is the BEST way to use this in your planning?","choices":["Move on to the planned unit on transportation so the children stay on schedule","Add magnifying glasses, leaf books and sorting trays to the science area and plan related activities","Tell the children to leave the leaves outside because they make the room messy","Wait until next fall to plan a leaf unit when it fits the calendar"],"answer":1,"explain":["Not quite. Ignoring a strong interest misses a chance for engaged, meaningful learning.","Correct. Building on observed interests extends learning in science, math and language.","Not quite. Banning the leaves discourages curiosity and ignores what children are learning.","Not quite. Interests are most powerful when you respond to them while children care about them."]},{"type":"scenario","section":"Planning Curriculum from Observation","prompt":"Your co-teacher writes in a child's file, \"Marcus was being lazy at cleanup again.\" What is the BEST suggestion for improving this note?","choices":["Add more details about why Marcus is lazy","Delete the note because cleanup is not important","Rewrite it to describe what Marcus actually did and said, with the date and time","Share the note with the other parents so they understand the problem"],"answer":2,"explain":["Not quite. Labels like lazy are opinions, not observations, no matter how much detail is added.","Not quite. Cleanup behavior can be useful information when it is recorded objectively.","Correct. Good observation notes are factual and specific, without judgments.","Not quite. Sharing one child's records with other families breaks confidentiality."]},{"type":"scenario","section":"Lesson Plans, Weekly Plans and Project Work","prompt":"Halfway through a planned shape-sorting activity, a heavy rain starts and the children rush to the window, excited about the puddles. What is the BEST response?","choices":["Talk with the children about the rain, then add a puddle observation and water-measuring activity","Close the blinds so children focus on the shape activity","Tell the children they can only look at the rain after they finish the activity","Skip the rest of the day's plans and let children do whatever they want"],"answer":0,"explain":["Correct. Flexible plans follow children's natural curiosity while still offering intentional learning.","Not quite. Blocking out an exciting event wastes a learning opportunity and frustrates children.","Not quite. Using the rain as a reward misses its value as a learning experience.","Not quite. Flexibility does not mean abandoning planning and structure."]},{"type":"scenario","section":"Lesson Plans, Weekly Plans and Project Work","prompt":"You are writing a lesson plan for a small-group counting game. Which detail is MOST important to include besides the materials and steps?","choices":["The price of each material","How you will adapt the game for children with different skills and how you will know what they learned","A script of exactly what every child should say","A list of children who are not allowed to play"],"answer":1,"explain":["Not quite. Costs belong in a supply budget, not a lesson plan.","Correct. Adaptations and a way to check learning make a lesson plan useful for every child.","Not quite. Scripting children's words is not developmentally appropriate.","Not quite. Activities should be planned so all children can take part."]},{"type":"scenario","section":"Individualizing for Every Child","prompt":"Ana, a dual language learner who speaks Spanish at home, rarely talks during group time but watches closely. What is the BEST way to individualize for her?","choices":["Require her to answer one question in English at every group time","Seat her away from the group until she is ready to speak","Ask her family to speak only English at home","Use pictures and gestures, learn key words in Spanish and give her time to listen before expecting her to speak"],"answer":3,"explain":["Not quite. Pressuring a child to speak can raise anxiety and slow language learning.","Not quite. Excluding Ana removes her from the language she is learning.","Not quite. The home language is a strength and supports learning English.","Correct. Visual support, home-language words and a listening period are normal and helpful for dual language learners."]},{"type":"scenario","section":"Individualizing for Every Child","prompt":"A new child's IEP says he needs a cushion seat and short breaks during group time. Your co-teacher says, \"We can't treat one child differently.\" What is the BEST response?","choices":["Agree and ignore the accommodations to keep things fair","Explain that following the IEP is required and that accommodations give him a fair chance to participate","Tell the family the program cannot follow the IEP","Remove the child from group time altogether"],"answer":1,"explain":["Not quite. Ignoring IEP accommodations fails the child and the program's legal responsibilities.","Correct. Fair means each child gets what they need, and IEP accommodations must be followed.","Not quite. Programs work with families and specialists to carry out the plan.","Not quite. Exclusion is the opposite of inclusion; accommodations help him join in."]},{"type":"scenario","section":"Record Keeping That Protects Children","prompt":"A woman you have never seen arrives and says she is Kai's aunt and his mom asked her to pick him up. She is not on the authorized pick-up list. What is the BEST next step?","choices":["Release Kai because she knows his name","Keep Kai with you, contact his parent using the number on file and follow program policy before releasing him","Release Kai if she signs the sign-out sheet","Ask Kai if he knows her and let him decide"],"answer":1,"explain":["Not quite. Knowing a child's name does not make someone authorized.","Correct. Children may only be released to authorized adults; contact the parent and follow policy.","Not quite. A signature does not replace written authorization from the family.","Not quite. Children should never make release decisions."]},{"type":"scenario","section":"Record Keeping That Protects Children","prompt":"During outdoor play, Mia trips and scrapes her knee. You clean and bandage it. What should you do next?","choices":["Write an incident report with the facts and share it with her family that day","Do nothing more because it was a small scrape","Tell her parent only if Mia complains at pickup","Write a note blaming the child who was running near her"],"answer":0,"explain":["Correct. Injuries, even minor ones, are documented factually and shared with families.","Not quite. Programs document injuries so families are informed and patterns can be noticed.","Not quite. Families should be told about every injury, not only when a child mentions it.","Not quite. Reports should state facts, not blame."]},{"type":"scenario","section":"Record Keeping That Protects Children","prompt":"A parent tells you at drop-off that her son is now allergic to peanuts, confirmed by his doctor. What is the BEST action?","choices":["Remember it and tell the other teachers when you see them","Tell her it is her job to pack safe food","Follo
