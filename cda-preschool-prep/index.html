w program policy to update his health record and allergy plan and inform all staff who care for him","Post his name and allergy on the front door for all families to see"],"answer":2,"explain":["Not quite. Important health information must be written down, not left to memory.","Not quite. The program shares responsibility for keeping the child safe.","Correct. Health records and allergy plans must be updated and shared with staff who need them.","Not quite. Posting health details publicly can break confidentiality; share it with staff who need to know."]},{"type":"scenario","section":"Licensing Rules and Program Policies","prompt":"Your co-teacher wants to take three children to the office while you stay with the rest of the class. You are not sure this keeps the room within required ratios. What is the BEST step?","choices":["Let her go, since it will only take a few minutes","Have the oldest child watch the others while you help","Send the three children to the office by themselves","Check your state licensing rules and program policy, and ask for a floater or the director if needed"],"answer":3,"explain":["Not quite. Ratios apply at all times, even briefly.","Not quite. Children can never be responsible for supervising other children.","Not quite. Preschoolers must be supervised by adults at all times.","Correct. Follow licensing rules and policy, and get help so supervision stays safe."]},{"type":"scenario","section":"Teamwork with Co-Teachers, Directors and Specialists","prompt":"In front of the children, your assistant says loudly that your plan for the art center is a waste of time. What is the BEST response?","choices":["Argue with her right away so the children see who is in charge","Report her to the director without speaking to her","Stay calm, continue with the children and ask to talk privately later about her concerns","Change the plan immediately to avoid conflict"],"answer":2,"explain":["Not quite. Arguing in front of children models conflict and upsets the classroom.","Not quite. Talking with a colleague directly first is usually the respectful step.","Correct. Disagreements are best handled privately and respectfully, focused on the children.","Not quite. Avoiding the conversation does not solve the disagreement."]},{"type":"scenario","section":"Teamwork with Co-Teachers, Directors and Specialists","prompt":"A speech-language therapist visits and suggests offering a choice between two items during snack to encourage a child to use words. What is the BEST way to respond?","choices":["Thank the therapist, add the strategy to your daily routine and share what you notice at the next visit","Say that therapy should happen only in therapy sessions","Try it once and stop if the child does not talk right away","Ask the child's family to do it at home instead"],"answer":0,"explain":["Correct. Using specialists' strategies consistently and sharing observations supports the child's progress.","Not quite. Children make the most progress when strategies are used throughout the day.","Not quite. New skills take time and consistent practice.","Not quite. Families can help too, but the classroom team should also carry out the strategy."]},{"type":"scenario","section":"Organizing Time, Materials and Resources","prompt":"Transitions in your classroom are chaotic, and children wait several minutes with nothing to do while adults set up lunch. What is the BEST change?","choices":["Make children sit silently with hands in laps while they wait","Prepare lunch materials before the transition and use songs or simple games during short waits","Skip handwashing to make the transition faster","Give the children screen time while adults set up"],"answer":1,"explain":["Not quite. Long, silent waits are hard for preschoolers and lead to behavior problems.","Correct. Advance preparation and engaging transition activities reduce waiting and chaos.","Not quite. Handwashing before meals is an essential health practice.","Not quite. Screens are not an appropriate fix for poor planning."]},{"type":"scenario","section":"Continuous Quality Improvement","prompt":"Your director shares results from a program assessment showing that children have few books in the classroom. What is the BEST response from the teaching team?","choices":["Feel embarrassed and avoid discussing it","Argue that the assessment was unfair","Make a plan together to add books, perhaps from the library or family donations, and check again later","Wait for the next assessment to see if it changes on its own"],"answer":2,"explain":["Not quite. Assessment results are tools for improvement, not personal criticism.","Not quite. Defensiveness blocks improvement.","Correct. Quality improvement means setting a goal, making changes and checking the results.","Not quite. Improvement requires action."]},{"type":"mc","section":"Planning Curriculum from Observation","prompt":"Which statement is an objective observation?","choices":["Sophie was in a bad mood today.","Sophie is a natural leader.","Sophie was bored during story time.","Sophie built a tower of 8 blocks and said, \"Look, it's taller than me!\""],"answer":3,"explain":["Not quite. A bad mood is an interpretation, not something directly observed.","Not quite. This is an opinion or label.","Not quite. Bored is a guess about feelings.","Correct. It records exactly what the child did and said."]},{"type":"mc","section":"Lesson Plans, Weekly Plans and Project Work","prompt":"Which BEST describes the project approach?","choices":["Teachers choose a new topic every Monday and finish it by Friday","Children study a real topic in depth over time, guided by their own questions","Children complete worksheets on a topic chosen by the publisher","Each child works alone on a craft that looks the same as the model"],"answer":1,"explain":["Not quite. That describes a fixed weekly theme.","Correct. Projects are in-depth investigations driven by children's questions.","Not quite. Worksheets are not an in-depth, child-led investigation.","Not quite. Copying a model is not a project investigation."]},{"type":"mc","section":"Individualizing for Every Child","prompt":"What is an IEP?","choices":["A written plan for a child 3 or older with a disability that lists goals, services and accommodations","A daily lesson plan used for the whole class","A form families sign to allow field trips","A report written after a child is injured"],"answer":0,"explain":["Correct. An Individualized Education Program guides services for an eligible child with a disability.","Not quite. An IEP is for one child, not the whole class.","Not quite. That is a permission form.","Not quite. That is an incident or accident report."]},{"type":"mc","section":"Record Keeping That Protects Children","prompt":"Why is accurate daily attendance especially important?","choices":["It decides which children get snack","It shows which teachers are most popular","It lets staff account for every child during emergencies such as fire drills","It replaces the need for sign-out sheets"],"answer":2,"explain":["Not quite. Attendance is not used to decide who eats.","Not quite. Attendance tracks children, not teacher popularity.","Correct. Knowing exactly who is present is critical for safety in emergencies.","Not quite. Sign-in and sign-out records are still needed."]},{"type":"mc","section":"Licensing Rules and Program Policies","prompt":"What are licensing rules?","choices":["The highest possible quality standards for every program in the country","Suggestions that programs may choose to follow","Rules that families write for teachers","Minimum health and safety standards set by the state that programs must meet"],"answer":3,"explain":["Not quite. Licensing sets minimums; accreditation and other standards are often higher.","Not quite. Licensing rules are required, not optional.","Not quite. Licensing rules come from the state.","Correct. Licensing rules are the state's required minimum standards."]},{"type":"mc","section":"Continuous Quality Improvement","prompt":"Which BEST describes continuous quality improvement?","choices":["A cycle of gathering information, setting goals, making changes and checking results","A one-time inspection that a program passes or fails","A system for ranking individual teachers","A way to choose the curriculum for the year"],"answer":0,"explain":["Correct. It is a continuing cycle aimed at getting better.","Not quite. Quality improvement is ongoing, not one time.","Not quite. The goal is program improvement, not ranking people.","Not quite. Curriculum choice may be part of it, but it is not the definition."]}]},{"id":"m06","num":6,"title":"Maintaining a Commitment to Professionalism","areas":[13],"tagline":"What it means to be an early childhood professional: acting ethically, protecting confidentiality, reporting suspected abuse, growing through reflection and learning, advocating for children and caring for yourself.","objectives":["Describe what professionalism looks like in an early childhood program","Use the NAEYC Code of Ethical Conduct to guide decisions and resolve ethical dilemmas","Protect the confidentiality of children, families and colleagues, including on social media","Explain your duty as a mandated reporter of suspected child abuse and neglect","Plan ongoing professional development through reflective practice, mentoring and training","Identify ways to advocate for children and the profession and to manage stress"],"sections":[{"heading":"What Professionalism Means in Early Childhood","paragraphs":["Professionalism in early childhood education means doing your work with knowledge, care, honesty and responsibility. An early childhood professional understands how children grow and learn, uses that knowledge every day, and treats children, families and colleagues with respect. Professionalism is not about having a title. It shows in how you act when no one is watching. Every member of the staff, from assistants to directors, can show it.","Professionals make decisions based on what is best for children, not what is easiest for adults. They follow laws, licensing rules and program policies. They keep learning, admit mistakes and work to correct them. They speak positively about children and families, even when a day is hard. They are honest and fair with everyone.","The CDA Competency Goal for this area is to maintain a commitment to professionalism. Functional Area 13, Professionalism, asks you to make decisions based on knowledge of research-based early childhood practices, to promote high-quality care and education, and to take advantage of opportunities to improve your competence for the benefit of children and families."],"example":"A teacher realizes she gave a parent the wrong date for the field trip. She calls the parent right away, apologizes and gives the correct information."},{"heading":"The NAEYC Code of Ethical Conduct","paragraphs":["Ethics are shared beliefs about right and wrong behavior. The National Association for the Education of Young Children (NAEYC) publishes a Code of Ethical Conduct for early childhood educators. It begins with core values, such as appreciating childhood as a unique and valuable stage of life, supporting the bond between child and family, and respecting the dignity, worth and diversity of every person.","The Code describes responsibilities to four groups: children, families, colleagues, and the community and society. For each group it lists ideals, which describe the best practice to aim for, and principles, which describe what professionals must or must not do. The first and most important principle is that above all, we shall not harm children. No practice that is disrespectful, degrading, dangerous, frightening or harmful is acceptable.","An ethical responsibility has a clear answer, such as keeping information confidential. An ethical dilemma is harder: two responsibilities seem to conflict and each choice has some justification. To work through a dilemma, identify the conflict, review the Code, think about each person's interests, talk with a supervisor and choose the action that best protects children and keeps trust."],"example":"A parent asks staff not to let her child nap because he stays up late at home. The team, unsure, uses the Code to weigh the child's need for rest against the family's wishes and looks for a compromise with the parent, such as a shorter rest time."},{"heading":"Protecting Confidentiality","paragraphs":["Confidentiality means keeping private information private. Families share personal details with the program, such as health conditions, family changes, income and custody arrangements. Children's records, assessments and behavior notes are also confidential. Professionals share this information only with people who need it to care for the child, such as the director or a co-teacher, and only as program policy allows.","Do not discuss one child or family with another family, in the parking lot or at the grocery store. Keep files in a secure place and close computer screens when you step away. When a parent asks about another child, such as who bit their child, you can explain how the situation was handled without naming the other child.","There are important exceptions. When you suspect child abuse or neglect, the law requires you to report it, even if a family shared the information in confidence. Information may also be shared with written family permission, such as with a child's therapist or a kindergarten teacher. When in doubt, ask your director before sharing anything."],"example":"At pickup, a parent asks, \"Is Jordan the child who keeps hitting? I want to know.\" The teacher answers, \"I can't share information about other children, but I can tell you what we are doing to keep everyone safe.\""},{"heading":"Mandated Reporting of Abuse and Neglect","paragraphs":["Early childhood educators are mandated reporters. This means the law requires you to report any reasonable suspicion of child abuse or neglect to the agency your state requires, such as child protective services or a child abuse hotline. You do not need proof. Your job is to report your concern, not to decide whether abuse happened.","Possible signs include injuries that are unexplained or do not match the explanation given, frequent injuries, a child who is often hungry or unclean or has untreated medical needs, sudden changes in behavior, extreme fear of going home, or a child telling you that someone hurt them. One sign alone does not prove abuse, but it may be enough for a reasonable suspicion.","If a child tells you about abuse, stay calm, listen, believe the child, and tell them they did the right thing by telling you. Do not ask leading questions, investigate, examine the child or contact the family to ask about it. Write down the facts, including the child's exact words, the date and what you observed. Then make the report promptly and follow your program's procedures. Reports made in good faith are protected by law."],"example":"A child says, \"Daddy's friend hit me with a belt,\" and the teacher sees marks on his arm. She listens calmly, writes down his exact words and what she saw, tells her director, and calls the state hotline that day."},{"heading":"Professional Growth and Reflective Practice","paragraphs":["Professionals never stop learning. Professional development includes workshops, college courses, conferences, online training, reading and learning from colleagues. Many states require a certain number of training hours each year; follow your state licensing rules. Choose training that matches your goals and the needs of the children you serve. Keep a record of the training you complete.","Reflective practice means regularly thinking about your own teaching: what went well, what did not and why, and what you will try next. You might keep a journal, review observation notes or ask a colleague to watch a group time. Reflection also includes noticing your own feelings, biases and cultural assumptions and how they affect your work with children and families. Honest reflection helps you treat every child fairly.","Mentoring and coaching support growth. A mentor is an experienced professional who offers guidance, encouragement and honest feedback. Accept feedback with an open mind, and later, as you gain experience, mentor newer staff. Setting a few specific professional goals each year keeps your learning focused. Write the goals down and review them with your supervisor during the year."],"example":"After a rough morning circle, a teacher writes in her journal that the story was too long. She plans a shorter book with movement for tomorrow and asks her mentor for other ideas."},{"heading":"Advocacy and Professional Organizations","paragraphs":["Advocacy means speaking up for children, families and the early childhood profession. It can be small or large: explaining to a family why play matters, sharing information about child development with your community, contacting a lawmaker about child care funding, or supporting better pay and working conditions for early educators.","Professional organizations connect educators and support their growth. Examples include NAEYC and its state and local affiliates, the National Association for Family Child Care, the Division for Early Childhood for those working with children with disabilities, and Head Start associations. Members can attend conferences, read journals, find resources and join advocacy efforts.","Advocates rely on accurate information and respectful communication. Learn the facts, share real examples from your work while protecting confidentiality, and join with others who share your goals. When early educators speak up together, they help the public understand how important the early years are. Even one story, told well, can change how a decision maker sees child care."],"example":"A family child care provider joins a local association and, with other members, writes letters to the city council explaining how a proposed rule change would affect families who need care."},{"heading":"Self-Care and Respectful Relationships at Work","paragraphs":["Caring for young children is rewarding but tiring. Stress and burnout can affect your patience, health and teaching. Self-care means taking care of your own physical and emotional health so you can care for others. Get enough rest, eat well, take your breaks, build supportive friendships and ask for help when you feel overwhelmed. Many programs offer employee assistance or mental health support.","Respectful communication with colleagues builds a positive workplace. Speak directly and kindly, listen, avoid gossip, and bring concerns to the person involved or to a supervisor through proper channels. Respect differences in culture, background and teaching style while keeping the focus on children's needs. Thank colleagues for their help and share credit for successes.","Social media requires extra care. Do not post photos, names or stories about children or families without program permission and written family consent. Never complain about children, families, coworkers or your program online. Keep personal accounts private, think before you post, and follow your program's social media and technology policies."],"example":"A teacher takes a delightful photo of the class painting. Instead of posting it on her personal page, she follows program policy and shares it only through the program's secure family app, with photo consent on file."},{"heading":"Appearance, Dependability and Your CDA Journey","paragraphs":["Families and colleagues judge professionalism partly by everyday habits. Dependability means arriving on time, giving notice when you are sick, being prepared, following through on commitments and being fully present with children rather than on your phone. A professional appearance is clean, neat and practical, with clothing and shoes that let you sit on the floor, move quickly and play outdoors safely.","Professionals also speak positively about their work and represent their program well. Use respectful, clear language with families, avoid slang or sarcasm, and keep personal problems out of conversations with families and children. Respond to messages promptly and keep the promises you make. Show respect for the program by supporting its policies in public, and raise any disagreements privately with your supervisor.","As part of earning the credential, CDA candidates write a Professional Philosophy Statement that describes their beliefs about how young children learn and the role of the teacher. The CDA credential must also be renewed periodically, which encourages continued learning and growth. Check the Council for Professional Recognition's current requirements for details."],"example":"A teacher who wakes up with a fever calls her director before her shift begins so a substitute can be found and ratios stay safe."}],"terms":[{"term":"Professionalism","def":"Doing early childhood work with knowledge, ethics, responsibility and respect, and continuing to learn and improve."},{"term":"Ethics","def":"Shared beliefs about right and wrong behavior that guide professional decisions."},{"term":"NAEYC Code of Ethical Conduct","def":"A set of core values, ideals and principles that guides ethical behavior for early childhood educators."},{"term":"Core values","def":"The basic commitments of the profession, such as appreciating childhood and respecting each person's dignity and diversity, on which the Code is built."},{"term":"Ideals","def":"Statements in the Code that describe the best professional practice to aim for."},{"term":"Principles","def":"Statements in the Code that describe what professionals must or must not do, beginning with not harming children."},{"term":"Ethical dilemma","def":"A situation in which two professional responsibilities conflict and each possible choice has some justification."},{"term":"Confidentiality","def":"Keeping private information about children, families and colleagues private and sharing it only with those who need it."},{"term":"Mandated reporter","def":"A person required by law to report suspected child abuse or neglect to the proper agency; early childhood educators are mandated reporters."},{"term":"Reasonable suspicion","def":"A belief, based on facts and observations, that a child may have been abused or neglected; proof is not required to report."},{"term":"Neglect","def":"Failure to provide a child with basic needs such as food, shelter, supervision, medical care or emotional support."},{"term":"Professional development","def":"Ongoing learning, such as training, courses and conferences, that improves an educator's knowledge and skills."},{"term":"Reflective practice","def":"Regularly thinking about your own teaching, feelings and assumptions to understand and improve your work."},{"term":"Advocacy","def":"Speaking up and taking action on behalf of children, families and the early childhood profession."},{"term":"Burnout","def":"Physical and emotional exhaustion caused by long-term stress, which can reduce the quality of care."},{"term":"Professional Philosophy Statement","def":"A short written statement in the CDA portfolio describing the candidate's beliefs about how children learn and the role of the teacher."}],"questions":[{"type":"scenario","section":"What Professionalism Means in Early Childhood","prompt":"Your co-teacher often says in front of other staff that a certain child is \"just a bad kid.\" What is the MOST professional response?","choices":["Agree, since the child does have frequent challenging behavior","Ignore it because it is not your business","Gently point out the child's strengths and suggest observing to understand what the behavior is telling you","Tell the child's parents what your co-teacher said"],"answer":2,"explain":["Not quite. Labeling children negatively is not professional and can affect how adults treat them.","Not quite. Professionals help keep the focus on children's needs and strengths.","Correct. Strength-based language and observation help the team understand and support the child.","Not quite. Repeating the comment to the family would hurt them and damage team trust."]},{"type":"scenario","section":"The NAEYC Code of Ethical Conduct","prompt":"A parent asks you to make her 4-year-old stand in a corner for an hour when he misbehaves, the way she does at home. What is the BEST response?","choices":["Explain kindly that the program cannot use practices that may harm or frighten children, and share the positive guidance strategies you use","Agree to do it because families know their children best","Agree but only use the corner for thirty minutes","Tell the parent her approach is wrong and refuse to discuss it"],"answer":0,"explain":["Correct. The Code's first principle is not to harm children; respectful communication keeps the partnership strong.","Not quite. Respecting families does not include practices that could harm children or break policy.","Not quite. A shorter version is still an inappropriate, harmful practice.","Not quite. Professionals stay respectful and look for shared goals with families."]},{"type":"scenario","section":"The NAEYC Code of Ethical Conduct","prompt":"A father wants you to tell him whenever his ex-partner visits the classroom. The mother has equal custody rights, and no court order limits her. What is the BEST next step?","choices":["Agree, because he asked first","Refuse to speak to the father about anything","Tell the mother what the father asked","Talk with your director, review program policy and the custody documents, and treat both parents fairly"],"answer":3,"explain":["Not quite. Both parents have equal rights; secretly reporting on one would be unfair.","Not quite. Cutting off communication does not serve the child.","Not quite. Repeating the request could create conflict and break trust.","Correct. This is a dilemma; consult your supervisor, follow policy and legal documents, and respect both parents."]},{"type":"scenario","section":"Protecting Confidentiality","prompt":"At the grocery store, another parent from your class asks why a classmate has been absent all week. You know the child's grandmother died. What is the BEST response?","choices":["Explain about the grandmother so the parent can send a card","Say that you cannot share information about other families and change the subject politely","Say that the child is sick to avoid the question","Give a few hints without saying it directly"],"answer":1,"explain":["Not quite. Even well-meant sharing of private family information breaks confidentiality.","Correct. Kindly declining protects the family's privacy.","Not quite. Making up a reason is dishonest.","Not quite. Hints still reveal private information."]},{"type":"scenario","section":"Protecting Confidentiality","prompt":"A parent asks for the name of the child who bit her daughter. What is the BEST response?","choices":["Give her the name so she can talk to the other family","Tell her to ask her daughter","Explain that you cannot share other children's names, and describe how staff responded and what they are doing to prevent more biting","Avoid her until she stops asking"],"answer":2,"explain":["Not quite. Sharing the other child's name breaks confidentiality and can create conflict between families.","Not quite. Directing her to the child avoids your responsibility and may still reveal the name.","Correct. You protect confidentiality while showing the parent you take the situation seriously.","Not quite. Avoiding a parent damages trust."]},{"type":"scenario","section":"Mandated Reporting of Abuse and Neglect","prompt":"For two weeks, a child has come to school hungry, in the same dirty clothes, with an untreated ear infection. Your co-teacher says, \"Let's wait until we're sure.\" What is the BEST response?","choices":["Wait until you have more proof","Report your reasonable suspicion of neglect to the state agency and inform your director according to policy","Ask the parent if they are neglecting the child","Give the child extra food and say nothing"],"answer":1,"explain":["Not quite. Mandated reporters do not need proof; waiting can leave a child at risk.","Correct. A pattern of unmet basic needs gives reasonable suspicion, which must be reported.","Not quite. Questioning the family is investigating, which is not your role and could put the child at risk.","Not quite. Meeting the immediate need is kind, but it does not replace your duty to report."]},{"type":"scenario","section":"Mandated Reporting of Abuse and Neglect","prompt":"While playing, a child tells you that her uncle touches her in ways that make her feel scared. What is the BEST immediate response?","choices":["Ask her many detailed questions so you can be sure","Tell her she must be confused","Promise you will never tell anyone","Stay calm, listen, tell her she did the right thing by telling you, and then write down her exact words and report"],"answer":3,"explain":["Not quite. Detailed or leading questions are investigation and can interfere with the official process.","Not quite. Children who disclose need to be believed and supported.","Not quite. You must report, so do not make a promise you cannot keep.","Correct. Calm listening, reassurance, factual notes and a prompt report are the professional steps."]},{"type":"scenario","section":"Mandated Reporting of Abuse and Neglect","prompt":"Your director tells you not to report a suspicion of abuse because the family pays on time and might leave the program. What is the BEST action?","choices":["Make the report yourself to the state agency, because the legal duty to report is yours","Do what the director says since she is your supervisor","Wait to see if another teacher reports it","Ask the family whether you should report"],"answer":0,"explain":["Correct. Each mandated reporter is personally responsible for making sure a report is made.","Not quite. A supervisor cannot cancel your legal duty to report.","Not quite. Assuming someone else will report can leave a child unprotected.","Not quite. Families are never asked for permission to report suspected abuse."]},{"type":"scenario","section":"Professional Growth and Reflective Practice","prompt":"During a classroom observation, your mentor notes that you talk mostly to the children who speak the most. What is the BEST response?","choices":["Explain that quiet children prefer to be left alone","Thank your mentor, reflect on the pattern and plan ways to connect with every child each day","Ask for a different mentor","Agree, but decide that it is not important"],"answer":1,"explain":["Not quite. All children need warm, frequent interaction, including quiet children.","Correct. Accepting feedback and reflecting on it leads to better practice.","Not quite. Avoiding honest feedback limits your growth.","Not quite. Every child benefits from conversations with teachers."]},{"type":"scenario","section":"Professional Growth and Reflective Practice","prompt":"You have several dual language learners in your class for the first time and feel unsure how to support them. What is the BEST professional step?","choices":["Wait for the children to learn English on their own","Ask families to stop speaking their home language","Seek training, resources and advice from colleagues on supporting dual language learners","Ask the director to move the children to another classroom"],"answer":2,"explain":["Not quite. Children need active support from teachers to learn both languages.","Not quite. The home language is a strength and supports learning English.","Correct. Professionals seek new knowledge to meet the needs of the children they serve.","Not quite. Professionals grow their skills rather than passing children on."]},{"type":"scenario","section":"Advocacy and Professional Organizations","prompt":"Your state is considering cutting funding for preschool programs. You want to help. What is the BEST first step?","choices":["Learn the facts, then join a professional organization's advocacy effort or contact your lawmakers with clear examples","Post angry comments about lawmakers on social media","Share stories about specific children and families with their names","Do nothing because one teacher cannot make a difference"],"answer":0,"explain":["Correct. Informed, respectful advocacy, especially with others, is most effective.","Not quite. Angry posts are unprofessional and rarely persuade anyone.","Not quite. Advocacy must still protect confidentiality.","Not quite. Many voices together influence decisions about children."]},{"type":"scenario","section":"Self-Care and Respectful Relationships at Work","prompt":"You notice you have been snapping at children and feel exhausted most days. What is the BEST step?","choices":["Keep going and hope it passes","Quit without notice","Take it out on your co-teacher instead of the children","Recognize the signs of stress, use your breaks, look after your health and talk with your director about support"],"answer":3,"explain":["Not quite. Ignoring burnout often makes it worse and affects children.","Not quite. Leaving without notice hurts children and coworkers; there are better ways to get support.","Not quite. Shifting stress onto colleagues harms the team.","Correct. Self-care and asking for support help you stay healthy and patient."]},{"type":"scenario","section":"Self-Care and Respectful Relationships at Work","prompt":"After a frustrating day, a coworker posts on her personal social media about a \"nightmare child\" in her class, without a name. What is the BEST response?","choices":["Like the post to show support","Comment with your own story about a difficult child","Talk privately with her about how the post could hurt children and families and break program policy","Share the post with the child's family"],"answer":2,"explain":["Not quite. Supporting the post encourages unprofessional behavior.","Not quite. Adding to it spreads the problem.","Correct. A private, respectful conversation addresses the issue professionally.","Not quite. This would hurt the family and escalate the conflict."]},{"type":"scenario","section":"Appearance, Dependability and Your CDA Journey","prompt":"You often check text messages on your phone while supervising children outdoors. What is the MOST professional change?","choices":["Keep checking but only when children seem fine","Put your phone away during work time and use it only on breaks or for emergencies as policy allows","Ask the children to tell you if anyone gets hurt","Stand closer to the fence so you can see children while texting"],"answer":1,"explain":["Not quite. Situations change quickly; distracted supervision is unsafe.","Correct. Being fully present keeps children safe and shows professionalism.","Not quite. Children cannot be responsible for supervision.","Not quite. You still are not giving children your full attention."]},{"type":"mc","section":"The NAEYC Code of Ethical Conduct","prompt":"According to the NAEYC Code of Ethical Conduct, what is the most important principle?","choices":["Above all, we shall not harm children","Always follow every family request","Keep the classroom quiet and orderly","Prepare children for kindergarten tests"],"answer":0,"explain":["Correct. The Code places not harming children above all other responsibilities.","Not quite. Families are respected, but not when a request could harm a child.","Not quite. Order is not the Code's central principle.","Not quite. Test preparation is not part of the Code's core principles."]},{"type":"mc","section":"The NAEYC Code of Ethical Conduct","prompt":"What is an ethical dilemma?","choices":["A rule from the state licensing agency","A situation with one clearly right answer","A disagreement about lunch menus","A situation in which two professional responsibilities conflict and each choice has some justification"],"answer":3,"explain":["Not quite. Licensing rules are regulations, not dilemmas.","Not quite. A situation with one clear right answer is an ethical responsibility.","Not quite. A simple disagreement is not necessarily an ethical dilemma.","Correct. Dilemmas involve competing responsibilities that require careful thought."]},{"type":"mc","section":"Mandated Reporting of Abuse and Neglect","prompt":"What does a mandated reporter need in order to report suspected child abuse?","choices":["Proof, such as photos or a confession","A reasonable suspicion based on what they observed or were told","Permission from the child's parents","Approval from at least two coworkers"],"answer":1,"explain":["Not quite. Proof is not required; investigators determine what happened.","Correct. Reasonable suspicion is enough to report.","Not quite. You never need family permission to report.","Not quite. Each reporter has an individual duty and does not need others' approval."]},{"type":"mc","section":"Protecting Confidentiality","prompt":"With whom may a teacher share confidential information about a child's health condition?","choices":["Any parent who asks","Friends outside of work who might have advice","Staff who need it to care for the child, as program policy allows","The whole class during circle time"],"answer":2,"explain":["Not quite. Other families do not have a right to this information.","Not quite. Sharing outside work breaks confidentiality.","Correct. Information is shared only with those who need to know to care for the child.","Not quite. Announcing health information to the class breaks the child's privacy."]},{"type":"mc","section":"Professional Growth and Reflective Practice","prompt":"Which is the BEST example of reflective practice?","choices":["Repeating the same lesson plans every year","Waiting for a supervisor to point out problems","Attending a workshop only because it is required","Thinking about why an activity did not work and planning a change for next time"],"answer":3,"explain":["Not quite. Reusing plans without thought is not reflection.","Not quite. Reflection is something you do yourself, regularly.","Not quite. Attending training is useful, but reflection means thinking about and applying what you learn.","Correct. Reflection means examining your practice and improving it."]},{"type":"mc","section":"Advocacy and Professional Organizations","prompt":"What does advocacy mean in early childhood education?","choices":["Speaking up and taking action for children, families and the profession","Choosing the classroom theme for the month","Writing incident reports","Keeping records of attendance"],"answer":0,"explain":["Correct. Advocacy supports the needs of children, families and early educators.","Not quite. Choosing themes is curriculum planning.","Not quite. Incident reports are record keeping.","Not quite. Attendance is record keeping, not advocacy."]}]},{"id":"m07","num":7,"title":"Observing and Recording Children's Behavior","areas":[5,8,12],"tagline":"How to watch children carefully, record what you see without judgment, and use those notes to plan, individualize and partner with families.","objectives":["Explain why regular observation is the foundation of planning and individualizing in a preschool classroom","Write objective notes that describe what a child says and does without labels or judgments","Choose an observation method that fits the question you want to answer","Distinguish developmental screening, ongoing assessment and diagnosis, and describe the teacher's role in referral","Use observation records to plan next steps for individual children and the group","Protect the confidentiality of records and share observations respectfully with families"],"sections":[{"heading":"Why Teachers Observe","paragraphs":["Observation means watching and listening to children on purpose, then writing down what you notice. It is one of the most important skills a preschool teacher has. Children cannot fill out a test about what they know. They show us through their play, their talk, their drawings and the way they solve problems. Careful observation lets you see each child as an individual instead of guessing based on age alone.","Teachers observe for several reasons. Observations help you plan activities that match what children are ready to learn. They help you individualize, which means adjusting materials, support and goals for one child. They give you real stories to share with families, so conversations are based on facts instead of general impressions. Observations also help you notice early when a child might need a closer look, such as a developmental screening.","Observation is not a separate task you do once a year. It is woven into every day. A teacher who observes well knows which child is ready to try scissors, which child needs help joining play, and which child has started to write the first letter of their name. That knowledge guides almost every decision in the classroom."],"example":"Ms. Rivera notices that Kofi has spent three mornings building ramps for cars in the block area. She writes a short note and adds tubes and balls to the block shelf the next day to extend his interest in how things roll."},{"heading":"Objective and Subjective Recording","paragraphs":["An objective note describes only what you actually see and hear: actions, words, facial expressions, how long something lasted. A subjective note adds your opinion or interpretation, such as calling a child lazy, shy, bossy, angry or smart. Subjective words are labels. They tell the reader more about the observer than about the child, and they can follow a child unfairly for years.","Compare two notes. Subjective: Maya was mean and selfish at the sand table. Objective: At the sand table, Maya held three shovels against her chest. When Eli reached for one, she turned her back and said, These are mine. Eli walked away. The objective note gives a clear picture that anyone can understand, and it leaves room for many possible explanations.","Interpretation still has a place. After you record the facts, you can write a separate line for your thoughts, such as possible reasons or questions to explore. Keep the two parts apart. Use direct quotes when you can, note the date, time and setting, and write as soon as possible so details are not lost."],"example":"Instead of writing that Jayden had a bad day, Mr. Park writes: 9:40, art table. Jayden pushed the paint cup off the table, said No painting, and walked to the cozy corner. He sat there for four minutes holding a stuffed bear."},{"heading":"Observation Methods and Tools","paragraphs":["Different questions call for different tools. An anecdotal record is a brief, factual note about one meaningful event, written after it happens. A running record is a detailed, continuous account of everything a child does and says for a set period, such as ten minutes. Running records take more time but capture rich detail about how a child plays and thinks.","A checklist lists specific skills or behaviors, and the teacher marks whether each one is seen, such as can hop on one foot. A rating scale goes a step further and shows how often or how well, such as rarely, sometimes or usually. A frequency or event count tallies how many times a behavior happens, which is useful when you want to know whether hitting or calling out is increasing or decreasing.","Time sampling means checking at set intervals, such as every five minutes, and recording what a child or the group is doing at that moment. Work samples are things children make, like drawings, writing attempts or photos of block structures, dated and saved to show growth. Photos and video capture moments you cannot write fast enough, but use them only with family permission and according to your program's policy.","A portfolio is an organized collection of observations, work samples and photos for one child over time. Portfolios show progress clearly and are a wonderful tool for family conferences. Most programs combine several methods so the picture of each child is balanced and complete."],"example":"To find out how often Lena joins group play, her teacher uses time sampling during choice time, glancing every five minutes and marking alone, beside others, or with others on a simple form."},{"heading":"Observing During Daily Routines","paragraphs":["The best observations happen during ordinary moments: arrival, free play, meals, outdoor time, cleanup and transitions. Children show their real skills when they are relaxed and busy with things they choose. A child who will not count objects when asked might count every cracker at snack without being prompted.","Observe without disrupting play. Stay close enough to see and hear, but do not interrupt a child who is deeply engaged just to test a skill. Keep sticky notes, index cards, a clipboard or a tablet in your pocket or on a shelf so you can jot quick notes. Short abbreviations and a simple system for each day help you capture details while still supervising the group.","Plan who and what you will observe. Many teachers choose a few focus children each day so every child is observed regularly over a week or two. Co-teachers can take turns, with one leading the activity while the other records. Safety and supervision always come first, so observing never means turning your attention away from the whole group for long."],"example":"During lunch, Ms. Grant notes on an index card that Sofia poured her own milk without spilling and said to a friend, Pass the apples, please. Later she files the card in Sofia's portfolio."},{"heading":"Screening, Assessment and Diagnosis","paragraphs":["These three words are often confused. Developmental screening is a quick, standardized check that shows whether a child's development appears to be on track or whether a closer look is needed. Many programs screen all children shortly after enrollment using a validated tool, often with input from families. A screening result is not a label and does not say what is wrong.","Ongoing assessment is the regular process of gathering information over time to understand what a child knows and can do and to guide teaching. Authentic assessment is assessment based on real activities in the child's natural setting, such as play and routines, rather than pencil-and-paper tests. It is the most appropriate kind of assessment for young children.","Diagnosis is done only by qualified specialists, such as doctors, psychologists or speech-language pathologists, after an in-depth evaluation. Teachers screen, observe and refer. They do not diagnose. A teacher should never tell a family that their child has autism, ADHD or a learning disability, even if the teacher has seen similar behavior before.","When observations or screening suggest a concern, the referral process begins with the family. Share specific, objective observations in a private meeting, listen to what the family sees at home, and explain the next step, such as an evaluation through the local school district or early intervention program. Families must give written consent before a child is evaluated, and they remain the key decision makers."],"example":"After several weeks of notes showing that Marco uses very few words and is hard for adults to understand, his teacher meets privately with his parents, shares examples, and gives them information about requesting a free evaluation through the school district."},{"heading":"From Observation to Planning","paragraphs":["Observation is only useful if it leads to action. A simple cycle guides good teaching: observe, record, reflect, plan, teach, then observe again. When you review your notes, look for patterns. What is this child interested in? What can they do on their own? What can they do with a little help? What is the next small step?","Use what you learn to individualize. If a child is just starting to cut with scissors, offer strips of stiff paper that can be snipped in one cut. If a child loves dinosaurs, add dinosaur books and counting cards to draw them into early literacy and math. Observations of the whole group also help you change the room arrangement, the schedule or the materials.","Many programs connect observations to their curriculum and to early learning standards. Writing a short goal and a planned strategy next to your observation shows clearly how assessment shapes teaching. Over time, these records also show families and supervisors how much each child has grown."],"example":"Observing that several children are pretending to run a store in the housekeeping area, Mr. Okafor adds a cash register, play money and paper for writing receipts to build on their interest."},{"heading":"Confidentiality, Bias and Sharing with Families","paragraphs":["Observation records are confidential. Keep them in a secure place and share them only with the child's family and staff who need the information to serve the child. Do not discuss a child's records with other parents, post them where visitors can see, or talk about a child in public places. Families have the right to see their own child's records. Outside agencies need written family permission.","Every observer has bias, which means beliefs or expectations that can color what we notice. We may expect more from older children, judge boys and girls differently, or misread a child whose culture or home language is different from ours. To reduce bias, record facts, observe each child in many settings and at different times, compare notes with a co-teacher, and ask yourself whether you would describe the same behavior the same way for another child.","Family conferences are a key time to share observations. Begin with the child's strengths and specific stories. Show work samples and photos. Invite families to share what they see at home, since they know their child best. Talk together about goals and plan next steps as partners. Use plain language and offer an interpreter when needed."],"example":"At a conference, Ms. Lee opens Amara's portfolio to a dated drawing from September and another from February, then asks Amara's grandmother what drawings Amara makes at home."}],"terms":[{"term":"Observation","def":"Watching and listening to children on purpose and recording what they say and do in order to understand and support them."},{"term":"Objective recording","def":"Writing only facts that can be seen or heard, such as actions, words and time, without opinions or labels."},{"term":"Subjective recording","def":"Writing that includes the observer's opinions, feelings or interpretations, such as calling a child shy or bossy."},{"term":"Anecdotal record","def":"A short, factual written account of one specific event or behavior, written soon after it happens."},{"term":"Running record","def":"A detailed, continuous written account of everything a child does and says during a set period of time."},{"term":"Checklist","def":"A list of specific skills or behaviors that an observer marks as seen or not yet seen."},{"term":"Rating scale","def":"A tool that records how often or how well a child shows a skill or behavior, using levels such as rarely, sometimes and usually."},{"term":"Frequency count","def":"A tally of how many times a specific behavior happens during a set period. Also called an event count."},{"term":"Time sampling","def":"Observing at set intervals, such as every five minutes, and recording what a child or group is doing at that moment."},{"term":"Work sample","def":"Something a child has made, such as a drawing or writing attempt, dated and saved to show learning and growth."},{"term":"Portfolio","def":"An organized collection of observations, work samples and photos that shows one child's development over time."},{"term":"Developmental screening","def":"A brief, standardized check that shows whether a child's development appears on track or needs a closer look by a specialist."},{"term":"Authentic assessment","def":"Assessment based on observing children during real, everyday activities in their natural setting rather than formal tests."},{"term":"Referral","def":"Connecting a child and family, with the family's consent, to a specialist or agency for further evaluation or services."},{"term":"Confidentiality","def":"Keeping information about children and families private and sharing it only with people who have a right and need to know."},{"term":"Bias","def":"Beliefs or expectations, often unnoticed, that can affect what an observer sees and how they describe it."}],"questions":[{"type":"scenario","section":"Objective and Subjective Recording","prompt":"A co-teacher writes this note: Tyler was aggressive and out of control at circle time. What is the BEST way to rewrite it?","choices":["Tyler had a bad attitude during circle time again today.","During circle time, Tyler stood up twice, pushed Ana's shoulder and said, Move! He sat down when the teacher sat beside him.","Tyler seems to have behavior problems that should be checked by a doctor.","Tyler was very angry at circle time because he is jealous of Ana."],"answer":1,"explain":["Not quite. Bad attitude is still a label and gives no facts about what happened.","Correct. This note describes actions, words and what helped, without labels or guesses about feelings.","Not quite. This jumps to a judgment and hints at a diagnosis, which teachers do not make.","Not quite. Angry and jealous are interpretations, not things the observer actually saw or heard."]},{"type":"scenario","section":"Observation Methods and Tools","prompt":"A teacher wants to know whether a child's hitting is happening more or less often since the team started a new plan. Which method is BEST?","choices":["A portfolio of the child's artwork","A running record once a month","A developmental screening tool","A frequency count of hitting during the same part of each day"],"answer":3,"explain":["Not quite. Artwork shows creative and fine motor growth but does not measure how often hitting happens.","Not quite. A monthly running record is detailed but too infrequent to track change in one behavior.","Not quite. Screening checks overall development. It does not track a single behavior over time.","Correct. Tallying the behavior at the same time each day shows clearly whether it is increasing or decreasing."]},{"type":"scenario","section":"Observing During Daily Routines","prompt":"You want to learn whether four-year-old Priya can count objects. She is busy building a tall tower in the block area. What is the BEST approach?","choices":["Watch and listen as she builds, and note whether she counts blocks or uses number words on her own","Stop her play and ask her to count ten blocks for you","Send a counting worksheet home for her family to complete","Wait until the end of the year and test her at a table"],"answer":0,"explain":["Correct. Observing during self-chosen play shows real skills without interrupting a child who is engaged.","Not quite. Interrupting deep play to test a skill disrupts learning and may not show what she really knows.","Not quite. A worksheet does not show how she counts in real situations and shifts the teacher's job to the family.","Not quite. Waiting months loses chances to plan for her now, and a table test is less authentic than play."]},{"type":"scenario","section":"Screening, Assessment and Diagnosis","prompt":"A parent asks, Do you think my son has autism? He does not play with other kids much. What is the BEST response?","choices":["Yes, he shows many of the signs I have read about.","No, he is just shy and will grow out of it.","I cannot diagnose, but I can share what I have observed, hear what you see at home, and help you connect with someone who can evaluate him if you would like.","You should not worry about labels at this age."],"answer":2,"explain":["Not quite. Teachers do not diagnose. Only qualified specialists can do that after an evaluation.","Not quite. This dismisses the parent's concern and is also a guess, not an informed answer.","Correct. This respects the teacher's role, partners with the family and offers a path to a qualified evaluation.","Not quite. This brushes off a real concern instead of supporting the family to get answers."]},{"type":"scenario","section":"Confidentiality, Bias and Sharing with Families","prompt":"At pickup, a parent asks you how another child in the class is doing, saying the two families are close friends. What is the BEST response?","choices":["Share a few positive things, since the families are friends.","Show the parent the other child's portfolio so they can see for themselves.","Tell the parent the other child has been struggling, since they may be able to help.","Kindly explain that you keep information about each child private, and suggest they talk with the other family directly."],"answer":3,"explain":["Not quite. Even positive details about another child are confidential and belong to that family.","Not quite. Records may only be shared with the child's own family and staff who need them.","Not quite. Sharing concerns about another child breaks confidentiality and could harm trust.","Correct. This protects confidentiality while staying friendly and respectful."]},{"type":"scenario","section":"From Observation to Planning","prompt":"Your notes show that Diego, age 4, loves trucks but rarely visits the writing center. What is the BEST next step?","choices":["Require Diego to spend ten minutes at the writing center each day","Add truck pictures, clipboards for drawing road maps and truck books near the writing center","Remove the trucks until he chooses to write","Note that Diego is not interested in writing and move on"],"answer":1,"explain":["Not quite. Forcing time at a center can make writing feel like a chore and lower his interest.","Correct. Building on his interest invites him into early writing in a meaningful, playful way.","Not quite. Taking away a favorite toy is punitive and does not build a love of writing.","Not quite. Observation should lead to planning, not just a conclusion about the child."]},{"type":"scenario","section":"Screening, Assessment and Diagnosis","prompt":"After several weeks of observations, you are concerned that a child rarely speaks in sentences and is hard to understand. What should you do FIRST?","choices":["Ask the family to meet privately, share your specific observations and listen to what they notice at home","Call the school district and request an evaluation for the child","Tell the child's family that the child has a speech disorder","Wait another year to see whether the child catches up"],"answer":0,"explain":["Correct. Referral starts with the family, who must be informed partners and give consent before any evaluation.","Not quite. An evaluation cannot happen without the family's knowledge and written consent.","Not quite. Teachers do not diagnose. Only qualified specialists can identify a speech disorder.","Not quite. Waiting can delay helpful services. Early action matters for language development."]},{"type":"scenario","section":"Observing During Daily Routines","prompt":"You and your co-teacher want to observe each child regularly, but you feel you never have time. What is the BEST plan?","choices":["Observe only the children who have behavior challenges","Do all observations during nap time from memory","Choose a few focus children each day and keep sticky notes handy during routines and play","Leave the group alone briefly each day to write long notes in the office"],"answer":2,"explain":["Not quite. Every child deserves regular observation, not only those with challenges.","Not quite. Notes written later from memory lose accuracy and detail.","Correct. Rotating focus children and jotting quick notes during the day makes observation steady and manageable.","Not quite. Supervision always comes first. Leaving the group is unsafe."]},{"type":"scenario","section":"Confidentiality, Bias and Sharing with Families","prompt":"You are preparing for a conference with the family of a child who has made slow progress with self-help skills. What is the BEST way to begin?","choices":["Start with a list of skills the child cannot do yet","Share the child's strengths and a specific positive story, then invite the family to share what they see at home","Compare the child's progress with other children in the class","Give the family a written report and end the meeting quickly"],"answer":1,"explain":["Not quite. Opening with what the child cannot do can make families feel defensive and judged.","Correct. Starting with strengths and inviting family input builds trust and a true partnership.","Not quite. Comparing children breaks confidentiality and does not help with setting goals.","Not quite. Conferences are a two-way conversation, not just handing over information."]},{"type":"scenario","section":"Confidentiality, Bias and Sharing with Families","prompt":"A co-teacher says, Girls are naturally better at sitting still, so I mostly watch the boys for behavior problems. What is the BEST response?","choices":["Agree, since this saves observation time","Suggest observing only the girls to balance it out","Ignore it, because everyone has opinions","Suggest you both observe all children in many settings and check whether you describe the same behavior the same way for every child"],"answer":3,"explain":["Not quite. This reflects bias and means some children are watched unfairly while others are overlooked.","Not quite. Switching to only girls is still unbalanced and does not address the bias.","Not quite. Bias in observation affects how children are treated, so it should be addressed respectfully.","Correct. Observing all children in varied settings and checking your descriptions helps reduce bias."]},{"type":"scenario","section":"Observation Methods and Tools","prompt":"A teacher wants to take short videos of children building with blocks to share at family conferences. What should the teacher do FIRST?","choices":["Make sure families have given permission and follow the program's media policy","Post the videos on a personal social media page so families can see them","Record the videos and decide later whether permission is needed","Ask the children whether they want to be filmed and skip asking the families"],"answer":0,"explain":["Correct. Photos and video of children require family permission and must follow program policy.","Not quite. Posting on personal social media breaks confidentiality and program policy.","Not quite. Permission must come before recording, not after.","Not quite. Asking children is respectful, but families must still give permission."]},{"type":"scenario","section":"Why Teachers Observe","prompt":"A new assistant asks why the lead teacher spends time writing notes during play instead of only playing with children. What is the BEST explanation?","choices":["Notes are mainly required so the director can check on teachers","Notes help prove which children are behind their classmates","Notes help us plan activities that fit each child, track growth and share real stories with families","Notes are only needed when a child is misbehaving"],"answer":2,"explain":["Not quite. Observation serves children first, not just program paperwork.","Not quite. The purpose is to understand and support each child, not to rank them.","Correct. Observation guides planning and individualizing and gives families specific information.","Not quite. Teachers observe all areas of development, not only challenging behavior."]},{"type":"scenario","section":"From Observation to Planning","prompt":"Your observations show that many children wander during choice time and few use the science table. What is the BEST next step?","choices":["Assign each child to a center and set a timer","Remove the science table","Shorten choice time to five minutes","Reflect on the notes and refresh the science table with new hands-on materials that connect to the children's current interests"],"answer":3,"explain":["Not quite. Assigning centers removes choice, which is important for engagement and independence.","Not quite. Removing the table gives up on science learning instead of solving the problem.","Not quite. Less play time does not address why children are not engaged.","Correct. Group observations should guide changes to materials and the environment."]},{"type":"scenario","section":"Objective and Subjective Recording","prompt":"You see a child sitting alone by the window for several minutes during free play. Which note is MOST appropriate?","choices":["Noor was lonely and sad today.","Noor is antisocial and does not like her classmates.","10:15, free play. Noor sat by the window for six minutes watching birds. She said, Two birds! when a teacher sat near her.","Noor seemed bored because the activities were too easy."],"answer":2,"explain":["Not quite. Lonely and sad are guesses about feelings the observer cannot know for sure.","Not quite. Antisocial is a harmful label and is not based on observed facts.","Correct. This note records time, setting, actions and words, leaving room for many interpretations.","Not quite. This explains the behavior without evidence. Interpretations should be kept separate from facts."]},{"type":"mc","section":"Observation Methods and Tools","prompt":"Which observation method gives a detailed, continuous account of everything a child does and says for a set period of time?","choices":["Checklist","Time sampling","Frequency count","Running record"],"answer":3,"explain":["Not quite. A checklist only marks whether listed skills are seen.","Not quite. Time sampling records what is happening at set moments, not continuously.","Not quite. A frequency count tallies one behavior rather than recording everything.","Correct. A running record captures all actions and words in sequence during the observation period."]},{"type":"mc","section":"Screening, Assessment and Diagnosis","prompt":"Which statement BEST describes a developmental screening?","choices":["A full evaluation that identifies a specific disability","A brief check that shows whether a child's development appears on track or needs a closer look","A report card that ranks children against their classmates","A test that teachers use to decide which children may enroll"],"answer":1,"explain":["Not quite. That describes a diagnostic evaluation done by specialists.","Correct. Screening is quick and shows only whether further evaluation may be helpful.","Not quite. Screening does not rank children.","Not quite. Screening is used to support children, not to decide enrollment."]},{"type":"mc","section":"Screening, Assessment and Diagnosis","prompt":"Assessment that takes place during children's everyday play and routines in their natural setting is called:","choices":["Standardized testing","Diagnostic evaluation","Authentic assessment","Norm-referenced ranking"],"answer":2,"explain":["Not quite. Standardized tests use fixed tasks and conditions, often outside everyday play.","Not quite. A diagnostic evaluation is an in-depth process done by specialists.","Correct. Authentic assessment uses real activities in familiar settings and is best for young children.","Not quite. Ranking children against others is not the focus of early childhood assessment."]},{"type":"mc","section":"Observation Methods and Tools","prompt":"An organized collection of a child's work samples, photos and observation notes collected over time is called a:","choices":["Portfolio","Rating scale","Screening tool","Lesson plan"],"answer":0,"explain":["Correct. A portfolio shows one child's growth over time and is useful for family conferences.","Not quite. A rating scale records how often or how well a behavior occurs.","Not quite. A screening tool is a brief standardized check, not a collection of work.","Not quite. A lesson plan describes planned activities, not a record of a child's growth."]},{"type":"mc","section":"Confidentiality, Bias and Sharing with Families","prompt":"Who may see a child's observation records without additional written family permission?","choices":["Any parent in the classroom who asks","Visitors touring the program","The child's own family and staff who need the information to serve the child","Anyone in the community who volunteers at the program"],"answer":2,"explain":["Not quite. Other parents have no right to another child's records.","Not quite. Visitors must never see confidential records.","Correct. Records are shared only with the family and staff with a need to know. Others need written permission.","Not quite. Volunteers do not automatically have access to confidential records."]},{"type":"mc","section":"Objective and Subjective Recording","prompt":"Which of the following is an objective observation?","choices":["Liam is a natural leader.","Liam said, Let's build a castle, and three children joined him at the blocks.","Liam was very happy today.","Liam is smarter than most four-year-olds."],"answer":1,"explain":["Not quite. Natural leader is an interpretation, not a description of behavior.","Correct. It records exact words and observable actions.","Not quite. Very happy is the observer's guess about feelings.","Not quite. This is a judgment and a comparison, not an observation."]}]},{"id":"m08","num":8,"title":"Understanding Principles of Child Development and Learning","areas":[4,5,6,8,9],"tagline":"The big ideas behind how young children grow and learn, from developmentally appropriate practice and milestones to play, key theorists, the brain, inclusion and resilience.","objectives":["Describe the three core considerations of developmentally appropriate practice","Explain how the domains of development connect and identify typical milestones for children ages 3 to 6 while respecting individual variation","Recognize stages and types of play and explain why play is the main way young children learn","Summarize in plain terms the main ideas of Piaget, Vygotsky, Erikson, Maslow, Montessori, Gardner and Bronfenbrenner","Explain the roles of IDEA, IEPs and IFSPs in supporting children with disabilities","Describe how teachers support dual language learners and build resilience through caring relationships"],"sections":[{"heading":"Developmentally Appropriate Practice","paragraphs":["Developmentally appropriate practice, often called DAP, is an approach to teaching young children that is based on what we know about how children grow and learn. It is promoted by NAEYC, the National Association for the Education of Young Children. DAP is not a single curriculum. It is a way of making thoughtful decisions every day about the environment, activities, schedule and interactions.","DAP asks teachers to consider three kinds of knowledge. First, what is generally true of children at a certain age, so expectations are realistic. Second, what is true of each individual child, including their interests, strengths, needs and pace. Third, what fits each child's social and cultural context, including their family, language and community. All three matter. A plan that fits the age but ignores a child's culture or individual needs is not truly appropriate.","In a DAP classroom, children learn mostly through hands-on play and exploration, with teachers who guide and extend that play. Goals are challenging but achievable. Children make many choices, and teachers balance child-led play with short, engaging teacher-led moments. Worksheets, long periods of sitting and drills are not a good fit for preschoolers."],"example":"Knowing most four-year-olds enjoy pretend play, Ms. Ahmed sets up a pretend clinic. She adds a picture schedule for a child who needs extra structure and labels supplies in English and Spanish to reflect the families in her group."},{"heading":"Domains of Development","paragraphs":["Child development is often divided into domains, or areas. The physical domain includes gross motor skills, which use large muscles for running, climbing and jumping, and fine motor skills, which use small muscles in the hands for drawing, cutting and buttoning. The cognitive domain includes thinking, memory, problem solving and early math and science. The language domain includes listening, speaking and early reading and writing. The social-emotional domain includes understanding feelings, self-control and getting along with others.","These domains are connected. Growth in one area supports growth in others. A child who can use words to ask for a turn has fewer conflicts, which helps social development. A child building a block tower uses fine motor control, plans and solves problems, talks with friends and manages frustration when it falls. Teachers plan activities that support the whole child, not one skill at a time.","Development generally follows a predictable order, such as scribbling before drawing shapes, but the timing varies from child to child. Development also tends to move from simple to complex and from large movements to small, precise ones."],"example":"During a cooking activity, children stir batter with both hands (gross and fine motor), count scoops of flour (cognitive), name the ingredients (language) and wait for their turn (social-emotional)."},{"heading":"Milestones from Three to Six","paragraphs":["Milestones are skills that most children develop within a general age range. They are helpful guides, not deadlines. Every child develops at their own pace, and a child may be ahead in one area and still developing in another. Dual language learners, children with disabilities and children with different experiences may show skills in different ways or at different times.","Around age 3, many children run, climb and pedal a tricycle, use crayons with a fist or developing grip, copy a circle, speak in short sentences, follow two-step directions, play pretend and begin playing next to and with others. Around age 4, many children hop on one foot, catch a bounced ball, draw a person with a few body parts, use scissors, tell simple stories, ask many why questions, count several objects and enjoy cooperative play with simple shared plans.","Around age 5, many children skip, balance on one foot for longer, print some letters including their name, count ten or more objects, use longer and more complex sentences, understand simple rules and take turns more easily. Around age 6, many children ride a bike with or without training wheels, tie shoes with practice, read some simple words, add and subtract with objects, play games with rules and form closer friendships.","If a child seems to be missing many milestones for their age, or loses skills they once had, share objective observations with the family and discuss whether a developmental screening or referral would help."],"example":"Two children in Mr. Lee's group are both four. One cuts along a line easily but rarely talks in group time. The other tells long stories but is still learning to hold scissors. Both are developing typically."},{"heading":"Play as Learning","paragraphs":["Play is the main way young children learn. Through play, children practice new skills, test ideas, use language, solve problems, manage feelings and learn to cooperate. Play is not a break from learning. It is the work of childhood. Teachers support play by providing time, space and open-ended materials and by joining in to extend children's thinking.","Social play develops in stages. In solitary play, a child plays alone. In parallel play, children play side by side with similar materials but do not interact much. In associative play, children share materials and talk but do not have a common goal. In cooperative play, children work together toward a shared goal or story, such as building one city or acting out a family scene with roles. Older preschoolers move between all these types, and all of them are normal.","Play can also be described by what children do. Dramatic play, or pretend play, involves taking on roles and acting out stories. It builds language, empathy and imagination. Constructive play involves building or making something, such as a block tower or a clay animal. Physical play, games with rules and sensory play with sand and water are other common types."],"example":"At the sand table, three-year-olds Ari and Bea each fill their own buckets side by side without talking. That is parallel play. Across the room, four children plan a pretend restaurant and assign roles of cook, server and customers. That is cooperative dramatic play."},{"heading":"Key Theorists in Plain Terms","paragraphs":["Jean Piaget believed children build knowledge through active exploration. Most preschoolers are in his preoperational stage, roughly ages 2 to 7. They use symbols and pretend play but think in ways that are tied to how things look. They are often egocentric, which means they have trouble seeing things from another person's point of view, and they may believe a tall thin glass holds more juice than a short wide one with the same amount.","Lev Vygotsky stressed that children learn through social interaction. His zone of proximal development, or ZPD, is the gap between what a child can do alone and what they can do with help. Scaffolding is the temporary support an adult or more skilled peer gives, then gradually removes. Vygotsky also described private speech, when children talk to themselves out loud to guide their actions. This is a healthy thinking tool, not a problem.","Erik Erikson described stages of social-emotional development. Preschoolers are in the stage of initiative versus guilt. They want to plan, try new things and take the lead. When adults encourage their efforts, children build initiative. When they are often criticized or stopped, they may feel guilt. Abraham Maslow taught that basic needs such as food, rest, safety and belonging must be met before children can focus on learning.","Maria Montessori designed child-sized, orderly environments with hands-on materials and encouraged independence and self-directed learning. Howard Gardner proposed multiple intelligences, the idea that people are smart in different ways, such as with words, numbers, music, movement or people. Urie Bronfenbrenner showed that children develop within layers of influence, from family and classroom out to community, culture and society, and that these layers affect each other."],"example":"When Tomas struggles with a puzzle, his teacher turns one piece and asks, Does this edge look like it fits? Tomas finishes the rest on his own. She has scaffolded within his zone of proximal development."},{"heading":"Nature, Nurture and the Growing Brain","paragraphs":["Nature means the traits children inherit from their biological parents, such as some aspects of temperament, appearance and health. Nurture means everything in the environment, such as relationships, nutrition, experiences, culture and language. Development is shaped by both working together. A child may be born with a cautious temperament, for example, but warm and patient adults can help that child feel safe to try new things.","The brain grows very quickly in the early years. Every experience helps build connections between brain cells. Connections that are used often get stronger, and those that are rarely used are pruned away. Responsive, back-and-forth interactions, sometimes called serve and return, are especially important. When a child babbles, points or asks a question and an adult responds warmly, the child's brain builds strong foundations for language, thinking and self-control.","Caring, consistent relationships are the base of healthy development. Children who feel safe and connected are more ready to explore and learn. Teachers support brain development by talking with children, reading together, offering rich play, keeping routines predictable and responding with patience when children are upset."],"example":"When Lila holds up a leaf and says, Look!, Ms. Brown kneels and says, You found a leaf with yellow and red. Where did you find it? Lila points and tells her more. This b
