<title>CDA Preschool Exam Prep</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a study notebook. Left rail of modules ordered by age span, reading column ~68ch, quiz cards inline. */
:root {
  --paper: #f7f9f8; --card: #ffffff; --ink: #1d2b2a; --muted: #5b6b69; --rule: #d8e2df;
  --accent: #23735a; --accent-soft: #e2f1eb; --marigold: #c98a12; --marigold-soft: #fbf0d9;
  --good: #23735a; --good-soft: #e2f1eb; --bad: #b4412f; --bad-soft: #fbe7e3;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101716; --card: #17201f; --ink: #e4ecea; --muted: #9aaba8; --rule: #2a3735;
  --accent: #5cc39c; --accent-soft: #173229; --marigold: #e7b24a; --marigold-soft: #33280f;
  --good: #5cc39c; --good-soft: #173229; --bad: #ef8a78; --bad-soft: #3a1d18; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #101716; --card: #17201f; --ink: #e4ecea; --muted: #9aaba8; --rule: #2a3735;
  --accent: #5cc39c; --accent-soft: #173229; --marigold: #e7b24a; --marigold-soft: #33280f;
  --good: #5cc39c; --good-soft: #173229; --bad: #ef8a78; --bad-soft: #3a1d18; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 12px; }
.brand { font: 20px/1.2 var(--display); color: var(--ink); text-decoration: none; margin-right: auto; }
.brand small { display: block; font: 12px var(--body); color: var(--muted); letter-spacing: .04em; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 15px; }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(30px, 5vw, 44px); margin: 28px 0 8px; }
h2 { font-size: 26px; margin: 36px 0 10px; }
h3 { font-size: 20px; margin: 24px 0 8px; }
.lead { color: var(--muted); max-width: 62ch; font-size: 18px; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.btn { font: 700 15px var(--body); border: 1px solid var(--accent); background: var(--accent); color: var(--paper); padding: 9px 16px; border-radius: 10px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }



/* Functional Areas map */
.goals { display: grid; gap: 10px; margin: 12px 0; }
.goal { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 8px 16px; align-items: center; padding: 10px 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
.gname { font-size: 15px; line-height: 1.35; }
.gnum { display: block; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--marigold); }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.area { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); text-decoration: none; font-weight: 700; font-size: 14px; }
.area .anum { display: grid; place-items: center; min-width: 22px; height: 22px; border-radius: 999px; background: var(--card); font: 500 12px var(--mono); }
.area.done { background: var(--accent); color: var(--paper); }
.area.done .anum { color: var(--accent); }
@media (max-width: 640px) { .goal { grid-template-columns: 1fr; } }

/* Module list */
.mods { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.mod { display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; text-decoration: none; color: var(--ink); height: 100%; }
.mod:hover { border-color: var(--accent); }
.mod .n { font: 26px/1 var(--display); color: var(--accent); grid-row: span 3; }
.mod .t { font-weight: 700; line-height: 1.3; }
.mod .age { font: 500 12px var(--mono); color: var(--muted); }
.mod .st { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.chip.read { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.score { background: var(--marigold-soft); color: var(--marigold); border-color: transparent; }

/* Module page */
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); font-size: 15px; }
.toc ol { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 2px; }
.toc a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; }
.toc a:hover { background: var(--accent-soft); color: var(--accent); }
.reading { max-width: 70ch; min-width: 0; }
.objectives { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 20px; }
.objectives ul { margin: 6px 0 0; padding-left: 20px; }
.example { border-left: 4px solid var(--marigold); background: var(--marigold-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 12px 0; }
.example b { color: var(--marigold); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; display: block; }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.term { perspective: 800px; min-height: 120px; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.term .in { position: relative; display: block; width: 100%; height: 100%; min-height: 120px; transition: transform .45s; transform-style: preserve-3d; }
.term.flip .in { transform: rotateY(180deg); }
.term .f, .term .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--rule); background: var(--card); overflow: auto; }
.term .f { display: grid; place-items: center; text-align: center; font: 18px var(--display); }
.term .b { transform: rotateY(180deg); font-size: 14px; background: var(--accent-soft); }
@media (prefers-reduced-motion: reduce) { .term .in { transition: none; } }

/* Quiz */
.quiz { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px 20px; margin: 16px 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 500 13px var(--mono); color: var(--muted); }
.bar { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.prompt { font-size: 19px; font-weight: 700; margin: 4px 0 12px; }
.qtype { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--marigold); }
.choices { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .k { font: 500 14px/28px var(--mono); text-align: center; border-radius: 8px; background: var(--card); border: 1px solid var(--rule); }
.choice:disabled { cursor: default; }
.choice.right { background: var(--good-soft); border-color: var(--good); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); }
.choice .why { grid-column: 2; font-size: 14px; color: var(--muted); margin-top: 4px; }
.choice.right .why, .choice.wrong .why { color: var(--ink); }
.verdict { font-weight: 700; margin: 12px 0 0; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.result { text-align: center; padding: 10px 0; }
.big { font: 56px/1 var(--display); color: var(--accent); }
.breakdown { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
.breakdown th, .breakdown td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.breakdown td.num { font-variant-numeric: tabular-nums; font-family: var(--mono); text-align: right; white-space: nowrap; }
.table-scroll { overflow-x: auto; }
.timer { font: 500 14px var(--mono); color: var(--marigold); }

/* Exam setup */
.setup { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 18px 20px; display: grid; gap: 14px; max-width: 760px; }
.setup fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.setup legend { font-weight: 700; margin-bottom: 4px; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 6px; font-size: 15px; }
.pick label, .seg label { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 14px; }

/* Progress chart */
.chart { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 12px; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 600px; height: auto; }
.chart text { fill: var(--muted); font: 11px var(--mono); }
.chart .band { fill: var(--accent-soft); }
.chart .grid { stroke: var(--rule); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.chart .pt { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
.chart .none { fill: var(--rule); }
.note { font-size: 14px; color: var(--muted); }
footer { margin-top: 48px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }

@media (max-width: 820px) {
  header.top { position: static; }
  .layout { grid-template-columns: 1fr; }
  .toc { position: static; }
  body { font-size: 16px; }
}
</style>

<script>
const COURSE = [{"id":"m01","num":1,"title":"Planning a Safe and Healthy Learning Environment","areas":[1,2,3],"tagline":"How preschool teachers keep children safe, protect their health and arrange rooms, schedules and outdoor spaces that invite learning.","objectives":["Describe how to supervise preschool children by sight and sound, including counting children at every transition.","Identify indoor and outdoor hazards and explain how daily safety checks and emergency plans prevent injuries.","Apply universal health practices such as handwashing, standard precautions, cleaning, sanitizing and disinfecting.","Explain safe procedures for illness, medication, allergies and nutrition, including choking prevention.","Plan a room arrangement with learning centers, clear traffic flow and accessible, open-ended materials.","Design a daily schedule that balances active and quiet, indoor and outdoor, and child-initiated and teacher-directed time."],"sections":[{"heading":"Supervision and Everyday Safety","paragraphs":["Active supervision is the most important safety tool a teacher has. It means watching and listening to children at all times, so that every child is within your sight and sound. Teachers position themselves where they can see the whole room or yard, scan often and move toward children who may need help. Supervision is not passive. A teacher who is chatting, using a phone or doing paperwork with their back to the group is not supervising well.","Counting children is part of supervision. Do a name-to-face count, which means you match each child you see to a name on the attendance list. Count when children arrive and leave, and at every transition: going outdoors, coming back in, moving to the bathroom, loading a bus or leaving a field trip site. Most lost-child incidents happen during transitions, when adults assume someone else is watching.","Outdoor play needs extra attention because children spread out and move quickly. Adults spread out too, staying near higher-risk areas such as climbers, swings and the gate. Teachers talk with each other about who is watching which zone. Ratios and group sizes vary by place, so follow your state licensing rules and your program's policy."],"example":"Before the class walks inside from the playground, Ms. Rivera counts the children against her clipboard list, then counts again once everyone is seated on the rug."},{"heading":"Safety Checks and Injury Prevention","paragraphs":["Many injuries can be prevented with a quick, regular safety check. Before children arrive, teachers walk through the classroom and the outdoor area looking for hazards. Indoors, check for uncovered outlets, cords children could pull, broken toys, small objects that could cause choking, unsecured shelves and cleaning products within reach. Chemicals and medicines must be stored locked and out of children's reach, in their original labeled containers.","Outdoors, look for broken glass, trash, animal waste, standing water, sharp edges, loose bolts, tripping hazards and gaps where a child's head could get trapped. Equipment that children climb should have a soft, shock-absorbing surface beneath it and around it. Good choices are loose-fill materials such as wood chips, sand or rubber mulch kept at the proper depth, or poured rubber surfacing. Grass, dirt and concrete do not protect children from falls.","When you find a hazard, act right away. Remove it if you safely can, or block off the area so children cannot use it. Report the problem to your director so it is repaired, and write it down according to program policy. Teaching children simple safety rules, such as going down the slide feet first, also helps, but rules never replace adult supervision."],"example":"During his morning check, Mr. Okafor finds a cracked step on the climber. He ropes off the climber, puts up a sign, and tells the director before children go outside."},{"heading":"Emergency Preparedness, Transportation and Field Trips","paragraphs":["Every program needs written plans for emergencies such as fire, severe weather, lockdown and evacuation. An evacuation plan shows the exit routes, where the group will meet and who will bring the attendance list, emergency contact information and the first aid kit. Practice drills regularly so children know what to do and are less frightened. Plans must include each child with a disability or special health need, naming the adult who will help that child and the route they will use.","Keep emergency contact information current for every child, including who is allowed to pick the child up. Keep a stocked first aid kit in the classroom and take one outdoors and on trips. Staff should have current training in pediatric first aid and CPR, which is CPR adapted for infants and children. In a serious injury, stay calm, give first aid, call emergency services if needed, contact the family and complete an incident report.","Transportation and field trips need careful planning. Children must ride in age-appropriate car seats or safety restraints that follow your state rules. On trips, bring the first aid kit, emergency contacts, any needed medicines such as an epinephrine auto-injector, and get written permission from families. Count children often, especially when getting on and off a vehicle."],"example":"During a fire drill, Ms. Chen carries the attendance clipboard and the emergency bag while her co-teacher pushes Aaliyah's wheelchair along the planned accessible route to the meeting spot."},{"heading":"Hygiene and Preventing the Spread of Illness","paragraphs":["Handwashing is the simplest and best way to stop germs from spreading. Adults and children should wash hands on arrival, before and after eating or handling food, after using the toilet or diapering, after wiping noses or touching body fluids, after outdoor play, after touching animals and whenever hands look dirty. The steps are: wet hands with running water, add soap, scrub all surfaces for at least 20 seconds, rinse, dry with a single-use towel and turn off the faucet with the towel.","Standard precautions are steps you take with every person, every time, because you cannot tell who carries germs. Treat all blood and body fluids as possibly infectious. Wear disposable gloves when touching blood or fluids, clean and disinfect the area, put waste in a lined container and wash your hands after removing gloves. Diapering and toileting follow a posted, step-by-step routine in a separate area away from food.","Know the difference between three cleaning words. Cleaning removes dirt and some germs with soap or detergent and water. Sanitizing reduces germs to a safe level and is used on food surfaces and toys that children put in their mouths. Disinfecting kills nearly all germs on hard surfaces such as diaper tables and toilets. Always clean before you sanitize or disinfect, and use products as the label directs."],"example":"After the class plants seeds outside, Mr. Diaz sings a short handwashing song at the sink so the children scrub long enough before snack."},{"heading":"Illness, Medication and Allergies","paragraphs":["Programs use a daily health check, sometimes called a health screening, when children arrive. Teachers look for signs such as fever, rash, unusual tiredness, coughing or eye discharge and talk briefly with the family. If a child becomes ill during the day, follow your program's exclusion policy, which lists symptoms that mean a child must go home. Separate the child in a comfortable spot where an adult can still supervise, contact the family and write down what you observed.","Medication is given only with written permission from the parent, and often also instructions from a health care provider, as your program and state require. Medicine must be in its original container labeled with the child's name, the dose and the directions. Store it locked and out of reach, give the right dose at the right time and record each dose on a medication log. Never give a child medicine from your own supply.","Allergies can be life threatening. Each child with a known allergy should have an allergy action plan, a written plan from the child's health care provider that lists what to avoid, the warning signs and exactly what to do, such as giving epinephrine and calling emergency services. Share the plan with every adult who cares for the child, including substitutes and cooks, and keep the child's emergency medicine close by at all times."],"example":"When Jaylen's mother drops off his inhaler, Ms. Park asks her to complete the medication permission form and attach his asthma plan before she puts the inhaler in the locked box."},{"heading":"Nutrition, Rest and Healthy Habits","paragraphs":["Healthy meals and snacks give children energy to play and learn. Offer fruits, vegetables, whole grains, protein foods and milk or water, and limit sugary drinks and sweets. Family-style dining means children sit together with adults, pass bowls and serve themselves with child-sized utensils. It builds fine motor skills, language, independence and table manners. Adults eat with children, talk with them and let them decide how much to eat from what is offered.","Young children choke easily. Cut round foods such as grapes and hot dogs into small, lengthwise pieces, and avoid serving foods like whole nuts, popcorn, hard candy and large spoonfuls of nut butter to young preschoolers. Children should sit down while eating. Follow every child's food allergy plan and check labels. Welcome foods from children's cultures and family traditions, and talk about them with curiosity and respect.","Rest time helps children recharge. Provide a calm, dim space and a cot or mat for each child, and let children who do not fall asleep look at books or play quietly after resting. Support oral health by teaching toothbrushing or rinsing as your program allows and offering water. Plan for physical activity indoors and outdoors every day, because active play builds strong bodies and healthy habits."],"example":"At lunch, four-year-old Sofia passes the bowl of rice to her friend and serves herself a scoop of black beans while Ms. Lopez talks with the table about where beans grow."},{"heading":"Arranging the Learning Environment","paragraphs":["A well-arranged room helps children learn, make choices and get along. Most preschool rooms are organized into learning centers, also called interest areas, such as blocks, dramatic play, art, library, science, math and manipulatives, music and sand and water. Each center has clear boundaries made with low shelves or rugs, and materials are stored on labeled shelves at children's height so they can find and return items on their own.","Think about traffic flow, which is how children move through the room. Avoid long open paths that invite running. Place quiet areas, such as the library, away from active, noisy areas, such as blocks and dramatic play. Put messy centers like art and sensory play near the sink and on easy-to-clean floors. Create a cozy space where a child can be alone for a while.","Choose open-ended materials, meaning materials children can use in many ways with no single right answer, such as blocks, clay, loose parts, scarves and art supplies. Rotate materials based on children's interests so the room stays fresh, without changing everything at once. Make sure every child can take part, including children who use wheelchairs or walkers, by leaving wide paths and adapting tools. Display children's own artwork at their eye level, and include pictures and books that reflect children's families and languages."],"example":"After noticing children racing from the art table through the block area, Ms. Grant turns a shelf to make the block area a closed corner and moves the library next to it."},{"heading":"Daily Schedule, Transitions and Outdoor Learning","paragraphs":["A predictable daily schedule helps children feel secure because they know what comes next. A good preschool schedule balances active and quiet times, indoor and outdoor times, and child-initiated and teacher-directed activities. Child-initiated means children choose what to do, as in center time. Teacher-directed means the teacher leads, as in a short story time. Long blocks of free choice play and short, engaging group times suit preschoolers best. Post a picture schedule at children's eye level.","Transitions are the times between activities, such as cleaning up or lining up to go outside. They can be stressful and are when many behavior problems and safety lapses happen. Keep transitions few and short, give a warning a few minutes ahead, and use songs, games or picture cues. Let children move in small groups instead of making everyone wait in line, and count children every time the group moves.","The outdoor environment is a learning environment too. Plan areas for running, climbing, riding, digging, gardening, building and quiet rest in the shade. Bring materials outside, such as art supplies, books, loose parts and science tools. Children should go outside every day when weather allows, with clothing and sun protection that keep them safe. Follow your state licensing rules about weather and temperature."],"example":"Five minutes before cleanup, Mr. Haddad walks to each center and says, \"Five more minutes, then we clean up and go outside,\" and later plays the cleanup song."}],"terms":[{"term":"Active supervision","def":"Watching and listening to all children at all times, positioning yourself to see the whole group and stepping in quickly when needed."},{"term":"Name-to-face count","def":"Counting children by matching each child you see to a name on the attendance list, done at arrival, departure and every transition."},{"term":"Safety check","def":"A regular walk-through of indoor and outdoor spaces to find and remove hazards before children use them."},{"term":"Protective surfacing","def":"Shock-absorbing material, such as wood chips, sand, rubber mulch or poured rubber, placed under and around climbing equipment to cushion falls."},{"term":"Evacuation plan","def":"A written plan showing exit routes, a meeting place and staff duties for leaving the building safely in an emergency."},{"term":"Emergency contact information","def":"Up-to-date phone numbers and names of people to call about a child, including adults allowed to pick the child up."},{"term":"Standard precautions","def":"Infection control steps used with every person, every time, such as wearing gloves around blood or body fluids and washing hands afterward."},{"term":"Sanitizing","def":"Reducing germs on a surface to a safe level, used on food surfaces and toys children put in their mouths."},{"term":"Disinfecting","def":"Killing nearly all germs on hard surfaces, such as diaper-changing tables and toilets, using a product as its label directs."},{"term":"Exclusion policy","def":"A program's written list of illness signs and symptoms that mean a child must stay home or be picked up."},{"term":"Allergy action plan","def":"A written plan from a child's health care provider listing what the child must avoid, warning signs of a reaction and the exact steps to take."},{"term":"Family-style dining","def":"A mealtime style where children and adults eat together and children pass bowls and serve themselves."},{"term":"Learning centers","def":"Defined areas of the classroom, such as blocks, art or library, each stocked with materials for a type of play and learning. Also called interest areas."},{"term":"Open-ended materials","def":"Materials children can use in many different ways with no single right answer, such as blocks, clay and loose parts."},{"term":"Traffic flow","def":"The paths children use to move around a room, arranged to prevent running and keep play areas from being disrupted."},{"term":"Transition","def":"The time when children move from one activity or place to another, such as cleanup or going outside."}],"questions":[{"type":"scenario","section":"Supervision and Everyday Safety","prompt":"You and your co-teacher are on the playground with the class. Your co-teacher must take a child inside to the bathroom. What is the BEST next step?","choices":["Keep talking with a parent at the fence, since the children are playing well","Move to a spot where you can see and hear all the children, gather them into a smaller area and count them","Ask a responsible five-year-old to watch the children on the climber","Sit on the bench near the gate so no one can leave"],"answer":1,"explain":["Not quite. A conversation pulls your attention away from children, and you are now the only adult supervising.","Correct. With one adult, you must keep every child in sight and sound, so bringing the group closer and counting keeps everyone safe.","Not quite. Children can never be responsible for supervising other children.","Not quite. Guarding the gate does not let you see and hear children in the rest of the yard."]},{"type":"scenario","section":"Supervision and Everyday Safety","prompt":"Outdoor time is over and the class is lining up to go back inside. What is the BEST practice at this transition?","choices":["Assume all children are in line because no one is still on the equipment","Send the line inside ahead of you while you gather the outdoor toys","Count children against the attendance list before leaving the yard and again once inside","Rely on the count you took when children arrived in the morning"],"answer":2,"explain":["Not quite. A child could be hiding, in the bathroom or behind a structure. Never assume.","Not quite. Children must not move without an adult supervising them.","Correct. Name-to-face counts at each transition catch a missing child right away.","Not quite. Children come and go during the day, so counts must happen at every transition."]},{"type":"scenario","section":"Safety Checks and Injury Prevention","prompt":"During your morning outdoor check, you find broken glass in the sandbox. Children will come outside in 20 minutes. What is the BEST response?","choices":["Block off the sandbox, remove the glass safely if you can and report it to the director","Let children play in the sandbox but remind them to watch out for glass","Plan to clean it up at the end of the day when children have gone home","Tell children the sandbox is closed without telling anyone else"],"answer":0,"explain":["Correct. Hazards are removed or blocked off immediately, and reporting makes sure the area is fully checked and cleaned.","Not quite. Preschoolers cannot be expected to avoid hidden hazards. The adult must remove the danger.","Not quite. Waiting leaves a serious hazard where children may be hurt.","Not quite. Other staff and the director need to know so the hazard is handled and documented."]},{"type":"mc","section":"Safety Checks and Injury Prevention","prompt":"Which surface is MOST appropriate under and around a climbing structure?","choices":["Packed dirt","Concrete","Grass","Loose-fill material such as wood chips or sand kept at the proper depth"],"answer":3,"explain":["Not quite. Packed dirt is hard and does not absorb the force of a fall.","Not quite. Concrete is the most dangerous surface under equipment.","Not quite. Grass wears down and becomes hard. It does not cushion falls well.","Correct. Shock-absorbing loose fill or poured rubber protects children who fall."]},{"type":"scenario","section":"Emergency Preparedness, Transportation and Field Trips","prompt":"Your program is reviewing its evacuation plan. A new child, Mateo, uses a wheelchair. What is the BEST step?","choices":["Leave Mateo out of drills so they do not upset him","Wait and figure out how to help him if a real emergency happens","Add to the written plan which adult will help Mateo and which route to use, then practice it in drills","Ask Mateo's family to keep him home on drill days"],"answer":2,"explain":["Not quite. Every child needs to practice, and leaving Mateo out means the plan is never tested for him.","Not quite. In an emergency there is no time to plan. Decisions must be made ahead.","Correct. Emergency plans must include each child with a disability, with a named adult and an accessible route, practiced regularly.","Not quite. Mateo has the right to be included, and keeping him home avoids rather than solves the problem."]},{"type":"mc","section":"Emergency Preparedness, Transportation and Field Trips","prompt":"Which items should travel with the group on every field trip?","choices":["Only the children's snacks and water bottles","A first aid kit, emergency contact information for each child and any needed medicines","Each child's full portfolio of work samples","Last month's attendance records"],"answer":1,"explain":["Not quite. Snacks are helpful, but they do not prepare you for an injury or emergency.","Correct. You must be able to give first aid, reach families and give emergency medicines, such as an epinephrine auto-injector, away from the center.","Not quite. Portfolios are not needed for safety and could be lost.","Not quite. You need today's attendance list, not old records."]},{"type":"scenario","section":"Emergency Preparedness, Transportation and Field Trips","prompt":"Kiara falls from the climber. She is crying and holding her arm, which looks bent. What is the BEST response?","choices":["Have Kiara walk to the office so the director can look at her arm","Give her an ice pack and let her return to play once she stops crying","Tell her family about the fall when they arrive at pickup","Keep Kiara still and calm, give first aid, call emergency services as needed, contact her family and complete an incident report"],"answer":3,"explain":["Not quite. Moving a child with a possible broken bone can make the injury worse.","Not quite. A bent arm may be a serious injury that needs medical care, not just ice.","Not quite. Families must be told right away about a serious injury.","Correct. Trained staff give first aid, get medical help, notify the family promptly and document what happened."]},{"type":"mc","section":"Hygiene and Preventing the Spread of Illness","prompt":"Which sequence shows correct handwashing?","choices":["Wet hands, add soap, scrub all surfaces for at least 20 seconds, rinse, dry with a single-use towel and turn off the faucet with the towel","Add soap to dry hands, rinse quickly and dry on a shared cloth towel","Rinse hands with water only and shake them dry","Wet hands, add soap, rinse right away and turn off the faucet with clean hands"],"answer":0,"explain":["Correct. Scrubbing long enough, drying with a single-use towel and using it on the faucet keeps hands clean.","Not quite. A quick rinse does not remove germs, and shared cloth towels spread them.","Not quite. Soap and scrubbing are needed to remove germs.","Not quite. Hands need at least 20 seconds of scrubbing, and touching the faucet can recontaminate them."]},{"type":"scenario","section":"Hygiene and Preventing the Spread of Illness","prompt":"You have just helped a child wipe his runny nose. You are about to set out snack for the table. What is the BEST next step?","choices":["Wipe your hands on a paper towel and start serving","Throw away the tissue, wash your hands with soap and water, help the child wash his hands, then serve snack","Put on gloves over your unwashed hands and serve","Ask the child to pass out the snack instead of you"],"answer":1,"explain":["Not quite. Wiping does not remove germs from nose secretions.","Correct. Handwashing is needed after wiping noses and before handling food, for both you and the child.","Not quite. Gloves do not replace handwashing, and putting them on with dirty hands spreads germs.","Not quite. The child also touched nose secretions and needs to wash before handling food."]},{"type":"mc","section":"Hygiene and Preventing the Spread of Illness","prompt":"Which statement BEST describes sanitizing?","choices":["Removing dirt and some germs with soap and water","Killing nearly all germs on surfaces such as diaper-changing tables","Reducing germs to a safe level, often on food surfaces and mouthed toys","Storing cleaning products in a locked cabinet"],"answer":2,"explain":["Not quite. That describes cleaning, which comes first.","Not quite. That describes disinfecting.","Correct. Sanitizing lowers germs to a safe level and is used on eating surfaces and toys children put in their mouths.","Not quite. Locking up chemicals is important, but it is safe storage, not sanitizing."]},{"type":"scenario","section":"Illness, Medication and Allergies","prompt":"After lunch, Omar feels hot, has a fever and lies down on the rug with his eyes half closed. What is the BEST response?","choices":["Move Omar to a quiet, comfortable spot where an adult can see him, call his family as the illness policy directs and write down what you observed","Give Omar a children's fever reducer from your own bag","Let him stay in the group since it is almost nap time","Tell his family about the fever when they pick him up"],"answer":0,"explain":["Correct. Separating an ill child under supervision, following the exclusion policy and documenting symptoms protects Omar and the other children.","Not quite. Medicine is never given without written parent permission, and never from a staff member's own supply.","Not quite. A child with a fever may be contagious and needs care and contact with the family.","Not quite. Families should be told promptly so they can pick up and care for their sick child."]},{"type":"scenario","section":"Illness, Medication and Allergies","prompt":"At drop-off, a parent hands you a bottle of antibiotic and says, \"Please give her a spoonful at lunch.\" Your program requires a permission form. What is the BEST response?","choices":["Give the medicine at lunch because the parent asked in person","Refuse the medicine and tell the parent it is not your job","Put the bottle in the child's cubby so the child can remember it","Kindly explain the policy and help the parent complete the written permission form, checking that the medicine is in its original labeled container"],"answer":3,"explain":["Not quite. A spoken request is not written permission and does not give the exact dose and directions.","Not quite. This is not respectful or helpful. There is a safe way to give the medicine.","Not quite. Medicine must be locked and out of children's reach.","Correct. Written permission, the original labeled container and locked storage keep medication safe while partnering with the family."]},{"type":"scenario","section":"Illness, Medication and Allergies","prompt":"A new child, Lena, has a severe peanut allergy. What is the BEST way to prepare?","choices":["File her allergy information in her enrollment folder in the office","Meet with her family, get an allergy action plan from her health care provider and share it with every adult who cares for her","Tell Lena to remember not to eat peanuts at snack","Send a note to all families naming Lena and describing her medical condition"],"answer":1,"explain":["Not quite. Staff need the plan where they can use it, not only in a file.","Correct. The family and provider know Lena best, and every caregiver, including substitutes and cooks, must know the plan and where her epinephrine is.","Not quite. Adults are responsible for preventing exposure. A preschooler cannot manage this alone.","Not quite. Sharing a child's medical details with other families breaks confidentiality. Programs can ask families to avoid an allergen without naming the child."]},{"type":"scenario","section":"Nutrition, Rest and Healthy Habits","prompt":"At a family-style lunch, three-year-old Theo pours his own milk and spills it across the table. What is the BEST response?","choices":["Pour milk for all the children from now on to avoid spills","Tell Theo he is too little to pour by himself","Calmly hand Theo a sponge, help him wipe up and encourage him to try again with a small pitcher","Move Theo to a separate table so the others can keep eating"],"answer":2,"explain":["Not quite. This takes away a valuable chance to build skills and independence.","Not quite. This discourages Theo and does not match what three-year-olds can learn to do.","Correct. Spills are part of learning. Calm support and a child-sized pitcher help Theo build fine motor skills and confidence.","Not quite. Separating Theo feels like a punishment for a normal mistake."]},{"type":"mc","section":"Nutrition, Rest and Healthy Habits","prompt":"Which food is a choking hazard for young preschoolers unless it is changed before serving?","choices":["Whole grapes","Applesauce","Yogurt","Shredded cheese"],"answer":0,"explain":["Correct. Round foods like grapes can block a child's airway. Cut them lengthwise into small pieces.","Not quite. Applesauce is smooth and soft.","Not quite. Yogurt is soft and easy to swallow.","Not quite. Shredded cheese is in small, soft pieces."]},{"type":"scenario","section":"Nutrition, Rest and Healthy Habits","prompt":"Priya opens her lunch, which holds a traditional dish from her family. Another child says, \"Ew, that looks weird.\" What is the BEST response?","choices":["Suggest that Priya's family send a sandwich tomorrow","Ignore the comment and keep eating","Tell the other child to be quiet and eat his own lunch","Say warmly that families eat many different foods, ask Priya to tell about her dish and invite the children to share their favorite family foods"],"answer":3,"explain":["Not quite. This tells Priya her family's food is not welcome.","Not quite. Ignoring the comment misses a chance to build respect and leaves Priya unsupported.","Not quite. This stops the comment but does not teach respect or support Priya.","Correct. Responding with curiosity and respect honors Priya's culture and helps all children value differences."]},{"type":"scenario","section":"Nutrition, Rest and Healthy Habits","prompt":"Every day at rest time, four-year-old Marcus lies quietly on his cot but does not fall asleep. What is the BEST approach?","choices":["Insist that he keep his eyes closed for the whole rest period","Let him get up and play with blocks in the middle of the room","After a reasonable rest, offer him books or quiet activities on his cot","Take away some of his outdoor time until he learns to sleep"],"answer":2,"explain":["Not quite. Children cannot be forced to sleep, and this can make rest time stressful.","Not quite. Noisy play would disturb children who are sleeping.","Correct. Not every child needs to sleep. Quiet activities respect Marcus's needs while keeping the room calm.","Not quite. Punishing a child for not sleeping is not appropriate, and outdoor play supports health."]},{"type":"scenario","section":"Arranging the Learning Environment","prompt":"Children keep running from the art area through the block area, knocking down buildings and causing arguments. What is the BEST solution?","choices":["Put the blocks away until the children learn to be careful","Rearrange the room, using shelves to give the block area clear boundaries and moving it out of the main path","Remind the children many times each day not to run","Close the block area during center time"],"answer":1,"explain":["Not quite. Removing blocks takes away an important learning center and does not fix the cause.","Correct. The room arrangement is causing the problem. Changing traffic flow prevents running and protects block play.","Not quite. Reminders alone rarely work when the room invites running.","Not quite. This limits children's choices without solving the traffic problem."]},{"type":"mc","section":"Arranging the Learning Environment","prompt":"Which is the BEST example of open-ended materials?","choices":["Blocks, fabric scraps and pinecones","A worksheet with one correct answer for each item","A coloring page of a cartoon character","A toy that plays the same song when a button is pushed"],"answer":0,"explain":["Correct. Loose parts and blocks can be used in many ways, which builds creativity and problem solving.","Not quite. A worksheet has one right answer and limits thinking.","Not quite. A coloring page sets the outcome for the child.","Not quite. The toy does one thing and the child only pushes a button."]},{"type":"scenario","section":"Daily Schedule, Transitions and Outdoor Learning","prompt":"A new assistant plans a long whole-group lesson where three- and four-year-olds sit on the rug for most of the morning. Children are wiggling and wandering away. What is the BEST suggestion?","choices":["Add a reward chart for children who sit still the whole time","Move the lesson to right before lunch when children are tired","Ask the children who wander to sit next to the assistant","Keep group times short and engaging, and balance them with long periods of child-chosen play in centers and outdoors"],"answer":3,"explain":["Not quite. Rewards do not fix an expectation that does not fit preschoolers' development.","Not quite. Tired, hungry children will find long group times even harder.","Not quite. This treats normal behavior as a problem without changing the schedule.","Correct. Preschoolers learn best through active, hands-on play, with short group times that fit their attention spans."]}]},{"id":"m02","num":2,"title":"Advancing Children's Physical and Intellectual Development","areas":[4,5,6,7],"tagline":"How preschool teachers support bodies, thinking, language and creativity through play, routines and responsive conversation.","objectives":["Describe typical gross motor and fine motor development from ages 3 to 6 and plan indoor and outdoor movement for all abilities.","Use play, inquiry and everyday routines to build early math and science thinking.","Apply scaffolding, open-ended questions and executive function supports in daily teaching.","Support oral language, phonological awareness, print awareness and emergent writing, including for dual language learners.","Plan creative experiences that value process over product in art, music, movement, dramatic play and blocks."],"sections":[{"heading":"Gross and Fine Motor Development","paragraphs":["This module covers CDA Competency Goal II, To advance physical and intellectual competence. It includes four Functional Areas: Physical, Cognitive, Communication and Creative. Physical development comes first because a child's body is the tool for exploring everything else. Gross motor skills use the large muscles of the arms, legs and trunk, such as running, jumping, climbing and throwing. Fine motor skills use the small muscles of the hands and fingers, such as grasping a crayon, snipping with scissors or buttoning a coat.","Between ages 3 and 6, children grow quickly in both areas. A typical 3-year-old runs, climbs stairs with alternating feet and pedals a tricycle. By 4, many children hop on one foot, catch a large ball with both hands and use scissors to snip. By 5 and 6, children skip, gallop, balance on a low beam, draw a person with several body parts and begin to print some letters. Each child follows their own timeline, so watch for steady progress rather than exact ages.","Hand strength develops before control. Children need many chances to squeeze, pinch, tear, pour and poke before they can hold a pencil comfortably. Playdough, tongs, eye droppers, clothespins, lacing cards, puzzles and table blocks all build these muscles. Pushing children to write on lines before their hands are ready leads to frustration. Instead, offer a wide range of tools and let children practice through play."],"example":"During center time, Ms. Rosa sets out playdough with rolling pins, plastic knives and garlic presses. Three-year-old Lin squeezes dough through the press again and again, strengthening the same hand muscles she will later use to hold a marker."},{"heading":"Movement, Sensory Play and Self-Help Skills","paragraphs":["Preschoolers need active movement every day, both outdoors and indoors. Outdoor time offers space to run, climb, ride and dig. On rainy days, bring movement inside with music and movement songs, obstacle courses made of cushions and tape lines, and stretching or yoga poses. Active play is planned teaching, not just a break. Teachers move with children, name the skills they see and offer new challenges, such as walking backward on a line or tossing a beanbag into a farther basket.","Every child should be able to take part. For a child with a physical disability, adapt the activity rather than leaving the child out: widen paths, lower targets, use larger or lighter balls, or let a child roll instead of run. Work with the family and the child's IEP team, including physical or occupational therapists, to learn helpful strategies. An IEP is an Individualized Education Program, the plan for a child age 3 or older who receives special education services.","Sensory play uses touch, sight, sound, smell and taste to explore materials such as sand, water, playdough, rice, shaving cream or leaves. It calms many children, builds fine motor skills and invites talk about textures and changes. Watch for children who avoid or seek strong sensations and offer choices, like gloves or a quieter table.","Self-help skills are the everyday tasks children learn to do for themselves: washing hands, using the toilet, dressing, serving food and cleaning up. Give children time, child-sized tools and simple step-by-step cues. Doing tasks for them is faster, but letting them practice builds both skill and confidence."],"example":"Before going outside, Mr. James starts the transition five minutes early so every child can try putting on their own coat using the coat flip. He helps with stuck zippers but lets children do the rest."},{"heading":"Learning Through Play and Inquiry","paragraphs":["Cognitive development is the growth of thinking, reasoning, memory and problem solving. Young children learn best through play, where they choose, test ideas and repeat what interests them. Play is not the opposite of learning. When a child fills and empties containers at the water table, they are exploring volume. When children build a store, they practice counting, sorting and planning. The teacher's job is to set up rich materials, observe and join in to extend children's thinking.","Inquiry means learning by asking questions and finding out. Science for preschoolers is a set of habits more than a set of facts. Children observe closely, predict what will happen, test their ideas and talk about what they found. A teacher might ask, 'Which things will sink and which will float?' then let children try, sort the results and compare them to their guesses. Wrong predictions are welcome because they lead to new questions.","Follow children's curiosity. A puddle, a spider web or a melting icicle can become a short investigation. Offer tools like magnifying glasses, measuring cups, clipboards and cameras. Record children's ideas on a chart in their own words so they can see their thinking and revisit it later."],"example":"After a rainstorm, children crowd around a worm on the sidewalk. Ms. Ana kneels down and asks, 'What do you notice about how it moves?' She brings magnifiers and later writes the children's guesses about where worms live on a chart."},{"heading":"Early Math Every Day","paragraphs":["Early math is much more than reciting numbers. Counting with meaning requires one-to-one correspondence, which means matching exactly one number word to each object. Children also learn cardinality, the idea that the last number counted tells how many are in the set. Practice happens naturally when children count napkins for the table, children present at circle time or steps to the playground. Model touching or moving each object as you count aloud.","Patterns are repeating sequences, such as red, blue, red, blue or clap, stomp, clap, stomp. Recognizing and extending patterns is an early form of algebra. Sorting and classifying means grouping objects by a shared feature like color, size or shape, and then explaining the rule. Invite children to sort the same buttons in more than one way and to guess each other's sorting rules.","Children also explore shapes and space: naming circles, squares, triangles and rectangles, noticing shapes in the room and using position words like over, under, next to and behind. Measurement starts with comparing: longer and shorter, heavier and lighter, more and less. Children measure with blocks, footsteps or string before rulers. Keep math hands-on and connected to real tasks rather than relying on worksheets or flashcards."],"example":"At snack, Deshawn counts cups for his table. He says 'one, two, three, four' while placing one cup at each chair, then announces, 'Four friends, four cups.'"},{"heading":"Scaffolding, Questions and Executive Function","paragraphs":["Scaffolding is temporary support a teacher gives so a child can do something they cannot yet do alone. Like a scaffold on a building, it is removed as the child gains skill. Scaffolds include hints, modeling, breaking a task into steps, or asking a guiding question. The zone of proximal development, an idea from Lev Vygotsky, is the range between what a child can do alone and what they can do with help. Teaching works best inside that zone: not too easy, not too hard.","Open-ended questions have many possible answers and invite children to explain, predict or imagine. 'What do you think will happen if...?' and 'How did you figure that out?' stretch thinking more than closed questions like 'What color is this?' which have one right answer. After asking, wait several seconds so children have time to think before answering.","Executive function is a set of brain skills that help children manage themselves: working memory (holding information in mind), flexible thinking (shifting between ideas or rules) and inhibitory control (stopping an impulse). These skills grow a great deal during the preschool years. Teachers support them with predictable routines, visual schedules, turn-taking tools like sand timers or sign-up lists, and games such as Freeze Dance, Simon Says and Red Light, Green Light that practice stopping and starting."],"example":"Mateo is stuck on a floor puzzle. Instead of placing the piece, Ms. Kim says, 'Let's look for the pieces with a straight edge first,' and then steps back as he sorts them."},{"heading":"Oral Language and Read-Alouds","paragraphs":["Oral language, the ability to understand and use spoken words, is the foundation for later reading and writing. Children build vocabulary by hearing rich words used in meaningful conversations. Serve and return describes the back-and-forth of a good conversation: a child says or does something, and the adult responds with interest, then waits for the child's turn. When a child makes an error, recast it by repeating the idea correctly in your reply instead of correcting them directly.","Read aloud every day, in small groups as well as whole groups. Dialogic reading turns story time into a conversation. The adult asks children to name things, recall events, predict, and connect the story to their own lives, then adds to their answers. Choose books that reflect many cultures, family structures and abilities so all children see themselves and others.","Dual language learners are children learning two or more languages at once. A strong home language supports learning English, so encourage families to keep speaking, reading and singing in the language they know best. In class, learn key words in each child's home language, use pictures and gestures, and pair children with peers. A quiet period while a child listens before speaking English is normal.","Some children communicate through sign language, picture cards or speech devices, called augmentative and alternative communication. Learn the child's system, use it throughout the day and work with the family and specialists so every child has a voice."],"example":"Aiyana says, 'I goed to the park with my auntie!' Mr. Lee answers, 'You went to the park with your auntie! What did you play there?' and waits for her reply."},{"heading":"Early Literacy: Sounds, Print and Writing","paragraphs":["Phonological awareness is the ability to hear and play with the sounds of spoken language, without looking at print. It develops from larger to smaller units: noticing rhymes, clapping syllables in words, and later hearing beginning sounds, such as 'ball' and 'bear' both starting with the same sound. Songs, rhyming books, chants and silly name games build this skill naturally and are among the strongest predictors of later reading.","Print awareness is understanding how print works: that print carries meaning, that we read from top to bottom and left to right in English, and that books have a front, back and title. A print-rich environment includes labels with words and pictures, children's names, charts, menus, signs in dramatic play and books in every center, in children's home languages as well as English. Alphabet knowledge, recognizing letters and their sounds, grows best through meaningful letters like those in children's own names.","Emergent writing develops in stages. Children start with scribbles, then make lines and letter-like shapes, then strings of real letters, and later invented spelling, where they write the sounds they hear, such as 'LV' for love. Each stage is real progress. Offer paper, markers and clipboards in many centers, invite children to read their writing to you, and write their words when they ask."],"example":"Priya brings a paper covered with wavy lines and a few letters. 'It says I love Grandma,' she explains. Her teacher asks her to read it aloud, then offers to write the words underneath."},{"heading":"Creative Expression Through Art, Music, Drama and Blocks","paragraphs":["Creativity is the ability to have original ideas and express them in your own way. Process art focuses on exploring materials and the experience of making, so every child's work looks different. Product art asks children to copy a model so everyone makes the same thing. Process art builds creativity, fine motor skills, language and confidence. Avoid coloring sheets, cut-out patterns and teacher-made models, which send the message that there is one right way to make art.","Open-ended materials can be used in many ways: paint, clay, collage scraps, loose parts like bottle caps and fabric, recycled boxes and natural items. Ask children to tell you about their work rather than guessing what it is. Comment on effort and choices: 'You used so many swirly lines.' Display children's work with their own words.","Music and movement invite children to sing, play simple instruments, explore rhythm and move freely to different kinds of music, including music from children's home cultures. Dramatic play lets children act out roles, solve problems with peers and use new vocabulary. Rotate props such as a doctor's office, grocery store or bakery that connect to children's lives.","Block play is creative, mathematical and social at once. Children build, test balance, compare sizes and plan together. Provide plenty of unit blocks, add people, animals and signs, and take photos so children can revisit their structures."],"example":"Instead of handing out a pre-cut flower pattern, Ms. Grace sets out tissue paper, glue, real petals and paint. Each child's spring picture looks completely different, and she writes down what each child says about their work."}],"terms":[{"term":"Gross motor skills","def":"Movements that use the large muscles of the arms, legs and trunk, such as running, jumping, climbing and throwing."},{"term":"Fine motor skills","def":"Movements that use the small muscles of the hands and fingers, such as grasping, cutting, buttoning and drawing."},{"term":"Self-help skills","def":"Everyday tasks children learn to do for themselves, such as handwashing, toileting, dressing, serving food and cleaning up."},{"term":"Sensory play","def":"Play that uses the senses to explore materials such as sand, water, playdough or natural objects."},{"term":"One-to-one correspondence","def":"Matching exactly one number word to each object while counting."},{"term":"Classification","def":"Sorting objects into groups by a shared feature, such as color, size or shape, and explaining the rule."},{"term":"Scaffolding","def":"Temporary support, such as a hint, model or guiding question, that helps a child do something they cannot yet do alone. It is reduced as the child gains skill."},{"term":"Zone of proximal development","def":"The range between what a child can do alone and what they can do with help from an adult or more skilled peer."},{"term":"Executive function","def":"Brain skills that help children manage themselves, including working memory, flexible thinking and inhibitory control."},{"term":"Open-ended question","def":"A question with many possible answers that invites a child to explain, predict or imagine."},{"term":"Serve and return","def":"The back-and-forth exchange of a responsive conversation, where an adult notices and responds to a child's words or actions and then waits for the child's turn."},{"term":"Dialogic reading","def":"A way of reading aloud in which the adult asks questions and invites children to talk about the story, then builds on their answers."},{"term":"Phonological awareness","def":"The ability to hear and play with the sounds of spoken language, such as rhymes, syllables and beginning sounds."},{"term":"Print awareness","def":"Understanding how print works, including that it carries meaning and is read in a certain direction."},{"term":"Invented spelling","def":"A stage of emergent writing in which children write the sounds they hear in words, such as LV for love."},{"term":"Process art","def":"Art focused on exploring materials and the experience of making, so each child's work is unique."}],"questions":[{"type":"scenario","section":"Gross and Fine Motor Development","prompt":"Four-year-old Malik stays away from the climbing structure and says, 'It's too high.' Most of his classmates climb it every day. What is the BEST way to support him?","choices":["Tell him that all his friends can do it, so he should try too.","Offer a lower climbing step or ramp nearby, stay close and encourage each small attempt.","Excuse him from outdoor time until he feels ready.","Lift him to the top so he can see it is safe."],"answer":1,"explain":["Not quite. Comparing him to peers can increase fear and shame rather than build confidence.","Correct. A smaller challenge with a supportive adult nearby lets him build skill and confidence at his own pace.","Not quite. Removing outdoor time takes away the movement practice he needs.","Not quite. Placing him at the top skips the skill building and may frighten him more."]},{"type":"scenario","section":"Gross and Fine Motor Development","prompt":"Several 3-year-olds in your class struggle to use scissors and quickly give up. What is the BEST plan?","choices":["Cut out shapes for them each day so their projects look finished.","Remove scissors from the classroom until kindergarten.","Have them cut along lines on a worksheet until they can do it perfectly.","Offer playdough, tongs, paper tearing and squeezing games to build hand strength, along with easy-grip scissors and thin paper strips to snip."],"answer":3,"explain":["Not quite. Doing the task for children removes their chance to practice.","Not quite. Children need gradual practice with real tools, with supervision.","Not quite. Precise line cutting is too advanced for many 3-year-olds and leads to frustration.","Correct. Hand strength comes before control, and simple snipping tasks match where 3-year-olds are developmentally."]},{"type":"scenario","section":"Movement, Sensory Play and Self-Help Skills","prompt":"Sofia, who has cerebral palsy, uses a walker. Your class is planning a relay game outdoors. What is the BEST approach?","choices":["Adapt the game so everyone can take part, such as wider paths and passing a beanbag, and ask her family and therapist for ideas.","Make Sofia the permanent scorekeeper so she feels included.","Skip relay games for the whole year.","Let Sofia watch from the bench where she is safe."],"answer":0,"explain":["Correct. Adapting the activity and partnering with the family and IEP team lets Sofia participate fully in movement.","Not quite. A side role every time keeps her from active play with peers.","Not quite. Removing the activity for everyone is unnecessary when it can be adapted.","Not quite. Watching from the side excludes her from the movement experience."]},{"type":"scenario","section":"Movement, Sensory Play and Self-Help Skills","prompt":"Three-year-old Omar insists on putting on his own coat, but it takes him a long time and the class waits at the door. What is the BEST response?","choices":["Put the coat on for him each day to save time.","Tell him to hurry because everyone is waiting.","Teach him a simple coat-flip method and start the transition a few minutes earlier so he has time to practice.","Let him go outside without his coat."],"answer":2,"explain":["Not quite. Doing it for him is faster but takes away a chance to build independence.","Not quite. Pressure can create stress and does not teach the skill.","Correct. A simple strategy plus enough time supports self-help skills and confidence.","Not quite. Going outside without proper clothing may not be safe for the weather."]},{"type":"scenario","section":"Learning Through Play and Inquiry","prompt":"After a rainstorm, a group of children crowd around a worm on the playground and start asking questions. What is the BEST next step?","choices":["Tell them to leave the worm alone and return to the planned activity.","Give a short talk explaining worm body parts.","Ask what they notice, offer magnifying glasses and record their predictions about where the worm will go.","Move the worm away so it does not distract the group."],"answer":2,"explain":["Not quite. This misses a valuable chance to follow children's curiosity.","Not quite. A lecture gives facts but skips observing, predicting and testing.","Correct. Open questions and simple tools turn curiosity into a real inquiry experience.","Not quite. Removing the worm ends the learning moment."]},{"type":"scenario","section":"Early Math Every Day","prompt":"Ethan counts a pile of blocks out loud, 'one, two, three, four, five, six,' but touches some blocks twice and skips others. What is the BEST next step?","choices":["Count together while modeling how to touch and move each block to a new pile as you say each number.","Tell him he counted wrong and should start over.","Give him a counting worksheet to practice.","Move on to teaching him simple addition."],"answer":0,"explain":["Correct. Moving each object as you count models one-to-one correspondence in a hands-on way.","Not quite. Simply saying it is wrong does not show him how to count accurately.","Not quite. Worksheets are less effective than hands-on counting with real objects.","Not quite. Addition is too advanced before accurate counting is in place."]},{"type":"scenario","section":"Early Math Every Day","prompt":"Your lead teacher asks you to plan ways to build children's understanding of patterns. Which plan is BEST?","choices":["Show pattern flashcards at circle time each day.","Wait until kindergarten, since patterns are too hard for preschoolers.","Give each child a pattern coloring sheet to complete.","Point out patterns in the room, clap and stomp rhythms, and invite children to make and extend patterns with beads, blocks and their bodies."],"answer":3,"explain":["Not quite. Flashcards are passive and less meaningful than hands-on play.","Not quite. Preschoolers can recognize, copy and extend simple patterns.","Not quite. Coloring sheets limit thinking and creativity.","Correct. Hands-on, playful and whole-body pattern activities build understanding in many ways."]},{"type":"scenario","section":"Scaffolding, Questions and Executive Function","prompt":"Mateo is working on a floor puzzle and getting frustrated because he cannot find where pieces go. What is the BEST response?","choices":["Finish the puzzle for him so he does not get upset.","Offer a hint, such as 'Let's look for pieces with a straight edge,' and then step back as he tries.","Tell him to choose an easier activity.","Ignore his frustration so he learns to handle it alone."],"answer":1,"explain":["Not quite. Finishing it removes the chance to learn and problem solve.","Correct. A small hint is scaffolding: just enough support for him to succeed on his own.","Not quite. Steering him away misses a chance to stretch his skills with support.","Not quite. Ignoring him leaves him without the support he needs to keep trying."]},{"type":"scenario","section":"Scaffolding, Questions and Executive Function","prompt":"Ava has built a tall block tower that keeps falling over. You want to extend her thinking. Which question is BEST?","choices":["'What could you try to make your tower stand taller without falling?'","'Is that a tower?'","'What color is that block?'","'Can you count to five?'"],"answer":0,"explain":["Correct. This open-ended question invites her to problem solve and test ideas.","Not quite. A yes-or-no question does not encourage deeper thinking.","Not quite. Naming a color has one right answer and does not connect to her problem.","Not quite. This question is unrelated to what she is working on."]},{"type":"scenario","section":"Creative Expression Through Art, Music, Drama and Blocks","prompt":"Your director suggests that every child make the same paper-plate turkey from a teacher model to send home. What is the BEST response?","choices":["Make the turkeys and fix any that do not look like the model.","Cut out all the pieces ahead of time so children only glue them on.","Suggest offering open-ended collage materials so each child creates their own piece, and share photos and children's words about their process with families.","Skip art that week to avoid the conflict."],"answer":2,"explain":["Not quite. Fixing children's work tells them their ideas are not good enough.","Not quite. Pre-cut pieces turn art into following directions rather than creating.","Correct. Process art builds creativity, and sharing children's words helps families see the learning.","Not quite. Avoiding art removes an important learning experience."]},{"type":"scenario","section":"Oral Language and Read-Alouds","prompt":"Four-year-old Aiyana says, 'I goed to the park with my auntie!' What is the BEST response?","choices":["'No, say went, not goed.'","'You went to the park with your auntie! What did you play there?'","Smile and say nothing so she is not embarrassed.","Have her repeat the correct sentence three times."],"answer":1,"explain":["Not quite. Direct correction can discourage children from talking.","Correct. Recasting models the correct form and keeps the conversation going with serve and return.","Not quite. Silence misses a chance to model language and extend the conversation.","Not quite. Drilling makes talking feel like a test rather than a conversation."]},{"type":"scenario","section":"Oral Language and Read-Alouds","prompt":"Carlos's mother speaks Spanish at home. She asks if she should stop speaking Spanish so Carlos learns English faster. What is the BEST response?","choices":["Agree that the family should speak only English at home.","Tell her that language at home is not the school's concern.","Suggest the family speak mostly English and only a little Spanish.","Encourage her to keep using Spanish at home, explain that a strong home language helps children learn English, and ask her to share key Spanish words to use in class."],"answer":3,"explain":["Not quite. Dropping the home language can weaken language growth and family connection.","Not quite. This dismisses a family's real question and misses a partnership opportunity.","Not quite. Families should use the language they know best to give children rich language.","Correct. Supporting the home language helps both languages grow and respects the family."]},{"type":"scenario","section":"Oral Language and Read-Alouds","prompt":"Jada, a child with autism, does not use spoken words and communicates with picture cards. What is the BEST way to support her in your classroom?","choices":["Take the cards away so she is encouraged to talk.","Leave the cards for her speech therapist to use during therapy only.","Use the cards only at snack time.","Learn her picture system, use it throughout the day and work with her family and team to add pictures for class routines."],"answer":3,"explain":["Not quite. Removing her communication tool takes away her voice and causes frustration.","Not quite. She needs her communication system all day, not only in therapy.","Not quite. Limiting the cards to one routine restricts her communication.","Correct. Consistent use of augmentative communication, in partnership with the family and team, supports her full participation."]},{"type":"scenario","section":"Early Literacy: Sounds, Print and Writing","prompt":"Priya shows you a paper with wavy lines and a few letter-like shapes. 'It says I love Grandma,' she tells you. What is the BEST response?","choices":["Invite her to read it to you, celebrate her writing and offer to write her words underneath if she wants.","Explain that this is not real writing yet.","Have her trace the correct letters for each word.","Correct the letters so they are formed properly."],"answer":0,"explain":["Correct. Valuing emergent writing and modeling conventional print supports her growth as a writer.","Not quite. Scribbles and letter-like shapes are a real stage of writing development.","Not quite. Tracing replaces her own message with copying.","Not quite. Correcting her work can discourage her from writing."]},{"type":"mc","section":"Early Math Every Day","prompt":"What does one-to-one correspondence mean?","choices":["Recognizing the written numerals 1 through 10.","Saying the number words in the correct order.","Matching exactly one number word to each object counted.","Knowing that the last number counted tells how many."],"answer":2,"explain":["Not quite. That is numeral recognition.","Not quite. That is rote counting.","Correct. One-to-one correspondence means one number word for each object.","Not quite. That is cardinality."]},{"type":"mc","section":"Early Literacy: Sounds, Print and Writing","prompt":"Which activity builds phonological awareness?","choices":["Tracing letters on a worksheet.","Clapping the syllables in children's names.","Looking at the pictures in a wordless book.","Copying words from the board."],"answer":1,"explain":["Not quite. Tracing letters is a fine motor and print activity, not a sound activity.","Correct. Clapping syllables helps children hear the sound parts of spoken words.","Not quite. Picture books build vocabulary and story skills, not sound awareness.","Not quite. Copying focuses on print, not on hearing sounds."]},{"type":"mc","section":"Creative Expression Through Art, Music, Drama and Blocks","prompt":"Which statement BEST describes process art?","choices":["Children explore materials freely, and the focus is on the experience, so every piece looks different.","All children make the same craft by copying a teacher model.","The teacher finishes children's art so it looks good on display.","Children color in pre-printed pictures."],"answer":0,"explain":["Correct. Process art values exploration and children's own ideas.","Not quite. Copying a model is product art.","Not quite. Adult finishing removes children's ownership.","Not quite. Coloring sheets limit creativity."]},{"type":"mc","section":"Scaffolding, Questions and Executive Function","prompt":"The zone of proximal development refers to:","choices":["Tasks a child has already mastered.","Tasks that are too hard for a child even with help.","The age range when a milestone usually appears.","The range between what a child can do alone and what they can do with support."],"answer":3,"explain":["Not quite. Mastered tasks are below the zone.","Not quite. Tasks too hard even with help are beyond the zone.","Not quite. That describes milestone norms, not this idea.","Correct. Teaching in this zone, with scaffolding, helps children grow."]},{"type":"mc","section":"Scaffolding, Questions and Executive Function","prompt":"Which set of skills makes up executive function?","choices":["Reading, writing and spelling.","Working memory, flexible thinking and inhibitory control.","Running, jumping and climbing.","Rhyming, syllables and beginning sounds."],"answer":1,"explain":["Not quite. These are literacy skills.","Correct. Executive function includes holding information in mind, shifting thinking and stopping impulses.","Not quite. These are gross motor skills.","Not quite. These are phonological awareness skills."]},{"type":"mc","section":"Gross and Fine Motor Development","prompt":"Which Functional Areas belong to CDA Competency Goal II, To advance physical and intellectual competence?","choices":["Safe, Healthy and Learning Environment.","Self, Social and Guidance.","Physical, Cognitive, Communication and Creative.","Families, Program Management and Professionalism."],"answer":2,"explain":["Not quite. These belong to Goal I, a safe, healthy learning environment.","Not quite. These belong to Goal III, social and emotional development and guidance.","Correct. Goal II includes Physical, Cognitive, Communication and Creative.","Not quite. These belong to Goals IV, V and VI."]}]},{"id":"m03","num":3,"title":"Supporting Children's Social and Emotional Development","areas":[8,9,10],"tagline":"How to help preschoolers feel secure and capable, get along with others, and learn self-control through positive guidance.","objectives":["Describe how secure relationships with caregivers build a child's self-concept, self-esteem and independence.","Explain how to name and validate children's feelings and match care to each child's temperament.","Support friendship skills, sharing, cooperative play, empathy and simple conflict resolution.","Use inclusive, anti-bias practices so every child and family feels they belong.","Apply positive guidance strategies that prevent challenging behavior and teach new skills instead of punishing.","Plan a respectful, team-based response to persistent challenging behavior with families and specialists."],"sections":[{"heading":"Secure Relationships and a Healthy Sense of Self","paragraphs":["Children learn who they are through their relationships. When a caregiver responds warmly and reliably, a child forms a secure attachment, a trusting bond that tells the child, I am safe and I matter. From that safe base, preschoolers feel brave enough to explore, try new things and recover from setbacks. A primary caregiver system, where one teacher has special responsibility for a small group of children, helps these bonds grow.","Self-concept is what children believe about themselves: I am a fast runner, I have curly hair, I can pour my own milk. Self-esteem is how children feel about those beliefs. Teachers build healthy self-esteem by noticing real effort, giving children meaningful jobs and showing interest in their ideas. Empty praise does not build self-esteem; genuine success and being truly seen do.","Independence and self-help skills, such as putting on a coat, serving food family style, washing hands and cleaning up, give children a strong sense of competence. Allow extra time, break tasks into small steps and resist the urge to do things for children that they can do themselves. A child who says I did it! after zipping a jacket gains confidence that carries into other areas of learning."],"example":"At lunch, Ms. Rivera places small pitchers on the table so children can pour their own water. When Jamal spills, she hands him a towel and says, Spills happen. You know how to clean it up."},{"heading":"Temperament, Feelings and Emotional Literac
