s consistent parenting, which in turn affects children's cognitive and emotional development. Extended-family support, common in many cultural groups, can buffer some of these effects."],"example":"A Chinese-American father who closely monitors his daughter's homework and limits her free time is also affectionate and deeply involved, and his daughter views his strictness as a sign that he cares."},{"heading":"Family Lifestyles","paragraphs":["Families in many industrialized nations have become smaller. Fewer children usually means more parental attention and resources for each child. Most children still grow up with at least one sibling, and sibling relationships combine rivalry with companionship, emotional support and opportunities to learn social skills. Rivalry tends to be greater when parents treat siblings differently in ways children see as unfair.","Only children are often stereotyped as spoiled and selfish, but research does not support this view. On average, only children are similar to children with siblings in adjustment and tend to do well in self-esteem and achievement, probably because of closer relationships with parents.","Adopted children and adolescents have somewhat more learning and emotional difficulties than nonadopted peers, partly because of prenatal or early adversity, but most adjust well, especially when adopted early into warm homes. Children of gay and lesbian parents are as well adjusted as other children and do not differ in gender identity or sexual orientation in any meaningful way. Never-married single-parent families, often headed by mothers, frequently face economic hardship, and children's outcomes depend heavily on available support and the involvement of other caring adults."],"example":"Eight-year-old Sam, an only child, is confident and gets along well with classmates, contradicting a relative's warning that he would be spoiled and unable to share."},{"heading":"Divorce and Blended Families","paragraphs":["Divorce is a major transition that often brings conflict, reduced income, moves and changes in daily routines. In the period just after divorce, many children show anxiety, anger, or school and behavior problems, and parenting often becomes less consistent. Most children adjust over time, but a minority show lasting difficulties. Outcomes depend more on the quality of family functioning than on divorce itself.","Several factors shape children's adjustment. Children with difficult temperaments and those exposed to ongoing intense parental conflict fare worse. Boys in mother-custody homes have historically shown more behavior problems, while effects on girls may appear as internalizing problems. Positive, authoritative parenting from the custodial parent, regular contact with the noncustodial parent, and cooperative coparenting all protect children. Divorce mediation and parenting education programs aim to reduce conflict.","When parents remarry, children enter a blended, or reconstituted, family that brings new step-relationships and often step-siblings. Adjustment can be hard. Stepparents usually do best by building a warm relationship gradually before taking on a disciplinary role. Older children and adolescents, especially girls with new stepfathers, may have more difficulty adapting."],"example":"After her parents divorce, ten-year-old Ana does better than expected because both parents avoid arguing in front of her, keep consistent rules and support her relationship with the other parent."},{"heading":"Maternal Employment, Child Care and Self-Care","paragraphs":["Most mothers of young children in industrialized nations now work outside the home. Maternal employment itself is not harmful. Children of employed mothers, especially daughters, tend to have higher self-esteem and less stereotyped beliefs about gender, and fathers in dual-earner families often take a larger share of child care. Effects depend on job satisfaction, workplace flexibility, support from a partner, and the quality of child care. Very long hours or high work stress can reduce sensitive parenting.","Quality of child care matters greatly. High-quality care offers small group sizes, favorable caregiver-child ratios, trained and stable caregivers, and stimulating activities. It supports cognitive, language and social development, especially for low-SES children. Poor-quality care, particularly when combined with long hours, is linked to more behavior problems and weaker skills.","Self-care children, sometimes called latchkey children, regularly look after themselves after school without adult supervision. Outcomes vary with maturity and context. Children who are old enough, have authoritative parents who monitor them by phone, and spend time in safe settings generally do fine. Younger children and those left in unsafe neighborhoods without monitoring are more likely to show low self-esteem, poor achievement and antisocial behavior. Quality after-school programs are a helpful alternative."],"example":"Twelve-year-old Kai gets home alone at 3:30, calls his mother to check in, finishes homework and follows family rules about guests, and he handles the arrangement well."},{"heading":"Child Maltreatment","paragraphs":["Child maltreatment takes several forms. Physical abuse involves assaults that cause injury or pain. Sexual abuse includes any sexual contact or exploitation of a child. Neglect is the failure to meet a child's basic needs for food, clothing, medical care, education or supervision, and it is the most frequently reported form. Emotional abuse involves acts that harm a child's emotional development, such as ridicule, humiliation, threats and terrorizing.","No single cause explains maltreatment. An ecological view highlights interacting factors at several levels. Parents who maltreat may have been abused themselves, may hold unrealistic expectations of children or may struggle with stress, mental illness or substance abuse. Children who are premature, ill or temperamentally difficult are at higher risk. Family stress such as poverty, unemployment and social isolation increases risk, as do cultural approval of physical punishment and violence.","Maltreatment has serious consequences, including insecure attachment, poor emotion regulation, learning problems, depression, aggression and later substance abuse, and it can alter children's stress responses and brain development. Prevention works at many levels: home-visiting programs that support new parents, parent education, social support networks, and public policies that reduce poverty and discourage physical punishment."],"example":"A home-visiting nurse helps a stressed, isolated young mother learn what to expect from a crying newborn and connects her with a parent support group, lowering the family's risk of abuse."}],"terms":[{"term":"Family systems theory","def":"A view of the family as a network of interdependent relationships in which each member affects every other."},{"term":"Bidirectional influence","def":"The idea that parents and children affect each other, so children's characteristics shape parenting as well as the reverse."},{"term":"Third-party (indirect) influence","def":"An effect of one family relationship on another, such as marital quality affecting parenting."},{"term":"Authoritative style","def":"A child-rearing style high in acceptance and involvement, with firm reasonable control and gradual autonomy granting; linked to the best child outcomes."},{"term":"Authoritarian style","def":"A child-rearing style low in acceptance and high in coercive control, with little autonomy granting."},{"term":"Permissive style","def":"A child-rearing style that is warm and accepting but makes few demands and exercises little control."},{"term":"Uninvolved style","def":"A child-rearing style low in acceptance, involvement and control; at its extreme it is neglect."},{"term":"Psychological control","def":"Parental behavior that intrudes on children's thoughts and feelings, such as guilt induction, love withdrawal and belittling."},{"term":"Socioeconomic status (SES)","def":"A measure of a family's social position based on education, income and occupational prestige."},{"term":"Blended family","def":"A family formed when a parent remarries or repartners, bringing stepparents and often step-siblings; also called a reconstituted family."},{"term":"Coparenting","def":"The way two parents cooperate and support each other in raising their children, whether or not they live together."},{"term":"Self-care children","def":"Children who regularly care for themselves without adult supervision, usually after school; sometimes called latchkey children."},{"term":"Neglect","def":"Failure to meet a child's basic needs for food, clothing, medical care, education or supervision; the most commonly reported form of maltreatment."},{"term":"Emotional abuse","def":"Acts that damage a child's emotional or social development, such as ridicule, humiliation and threats."}],"questions":[{"type":"mc","section":"The Family as a Social System","prompt":"A tense marriage leads both parents to discipline their child more harshly. This is an example of","choices":["a direct influence","autonomy granting","a third-party (indirect) influence","psychological control"],"answer":2,"explain":["Not quite. A direct influence would be a parent's behavior toward the child without passing through another relationship.","Not quite. Autonomy granting is about allowing independence, not how one relationship affects another.","Correct. The marital relationship affects the child indirectly, by changing how parents treat the child.","Not quite. Psychological control refers to intrusive tactics like guilt induction, not the spillover of marital stress."]},{"type":"mc","section":"Child-Rearing Styles","prompt":"Which child-rearing style combines high acceptance, firm reasonable control and gradual autonomy granting?","choices":["Authoritative","Authoritarian","Permissive","Uninvolved"],"answer":0,"explain":["Correct. The authoritative style balances warmth, reasonable limits and growing independence.","Not quite. Authoritarian parents are high in control but low in acceptance and autonomy granting.","Not quite. Permissive parents are warm but exercise little control.","Not quite. Uninvolved parents are low in acceptance and in control."]},{"type":"mc","section":"Child-Rearing Styles","prompt":"Which parental tactic is an example of psychological control?","choices":["Setting a firm bedtime","Explaining the reasons behind a rule","Checking that homework is done","Making a child feel guilty and withdrawing affection after a mistake"],"answer":3,"explain":["Not quite. A bedtime is behavioral control, which limits behavior rather than intruding on thoughts and feelings.","Not quite. Explaining rules is part of authoritative parenting.","Not quite. Monitoring homework is behavioral control.","Correct. Guilt induction and love withdrawal intrude on a child's emotions and are forms of psychological control."]},{"type":"mc","section":"Cultural and Socioeconomic Variations","prompt":"Compared with lower-SES parents, higher-SES parents on average tend to","choices":["stress obedience and use more commands","talk more with children and emphasize curiosity and self-direction","use more physical punishment","be less involved in schooling"],"answer":1,"explain":["Not quite. An emphasis on obedience is more common among lower-SES parents.","Correct. Higher-SES parents tend to use more verbal exchange, explanation and praise and value self-direction.","Not quite. Physical punishment is more common in lower-SES families.","Not quite. Higher-SES parents tend to be at least as involved in schooling, not less."]},{"type":"mc","section":"Family Lifestyles","prompt":"What does research show about children raised by gay and lesbian parents?","choices":["They show more emotional problems than other children","They are more likely to have an atypical gender identity","They have lower school achievement","They are as well adjusted as children of heterosexual parents"],"answer":3,"explain":["Not quite. Studies find no greater emotional problems.","Not quite. Research finds no meaningful differences in gender identity.","Not quite. Achievement is similar to that of other children.","Correct. Children of gay and lesbian parents are as well adjusted as other children."]},{"type":"mc","section":"Divorce and Blended Families","prompt":"Which factor most strongly protects children's adjustment after divorce?","choices":["Moving to a new neighborhood quickly","Ongoing intense conflict between parents","Authoritative parenting and cooperative coparenting","Having a difficult temperament"],"answer":2,"explain":["Not quite. Moves add disruption and usually make adjustment harder.","Not quite. Ongoing conflict is one of the strongest risks for poor adjustment.","Correct. Warm, consistent parenting and cooperation between parents protect children.","Not quite. Difficult temperament makes children more vulnerable, not less."]},{"type":"mc","section":"Child Maltreatment","prompt":"Which form of child maltreatment is the most frequently reported?","choices":["Neglect","Sexual abuse","Emotional abuse","Physical abuse"],"answer":0,"explain":["Correct. Failure to meet basic needs is the most commonly reported form.","Not quite. Sexual abuse is serious but less frequently reported than neglect.","Not quite. Emotional abuse is common but often hard to document and is reported less than neglect.","Not quite. Physical abuse is reported less often than neglect."]},{"type":"tf","section":"Family Lifestyles","prompt":"Research generally shows that only children are spoiled, selfish and less well adjusted than children with siblings.","choices":["True","False"],"answer":1,"explain":["Not quite. This is a stereotype that research does not support.","Correct. Only children are similar to other children in adjustment and often do well in self-esteem and achievement."]},{"type":"tf","section":"Maternal Employment, Child Care and Self-Care","prompt":"Daughters of employed mothers tend to hold less stereotyped beliefs about gender roles.","choices":["True","False"],"answer":0,"explain":["Correct. Seeing their mothers work outside the home is linked to less stereotyped gender beliefs and higher self-esteem in daughters.","Not quite. Research links maternal employment with less, not more, stereotyped beliefs in daughters."]},{"type":"scenario","section":"Child-Rearing Styles","prompt":"Jordan's parents are affectionate and let him decide his own bedtime, meals and screen time. They rarely set rules or follow through. Which outcomes are most likely for Jordan, based on research on this style?","choices":["High self-control and strong achievement","Impulsivity, disobedience and low self-control","Anxiety and withdrawal caused by harsh punishment","Excellent social maturity because of high autonomy"],"answer":1,"explain":["Not quite. High self-control and achievement are linked to authoritative, not permissive, parenting.","Correct. Permissive parenting is associated with impulsive, disobedient children low in self-control.","Not quite. Anxiety from harsh punishment fits the authoritarian style, and Jordan's parents are warm.","Not quite. Autonomy without appropriate limits does not produce social maturity."]},{"type":"scenario","section":"Maternal Employment, Child Care and Self-Care","prompt":"A parent must choose between two child-care centers for a toddler. Which feature should matter most for the child's development?","choices":["The center's distance from a shopping area","A large group of children so the toddler has many playmates","Brand-new toys and decorations","Small groups, a good caregiver-child ratio and trained, stable caregivers"],"answer":3,"explain":["Not quite. Convenience may matter to the family but does not indicate care quality.","Not quite. Large groups are a sign of lower quality for toddlers.","Not quite. New materials help a little but matter less than caregivers and ratios.","Correct. Group size, ratios and trained, stable caregivers are core markers of high-quality care."]},{"type":"scenario","section":"Child Maltreatment","prompt":"A community wants to lower child abuse among first-time parents facing poverty and isolation. Which approach best fits research on prevention?","choices":["Removing all children from low-income homes","Waiting until abuse is reported before acting","Home-visiting programs that offer parenting support and links to community resources","Encouraging parents to rely on physical punishment for discipline"],"answer":2,"explain":["Not quite. Poverty is a risk factor, not proof of abuse, and removal is not a prevention strategy.","Not quite. Prevention aims to act before maltreatment occurs.","Correct. Home visiting and social support reduce stress and isolation and improve parenting skills.","Not quite. Acceptance of physical punishment is itself a risk factor for abuse."]}]},{"id":"m15","num":15,"title":"Peers, Media, and Schooling","tagline":"How children's peer relations, friendships and groups develop, how media affect thinking and behavior, and how features of schools shape learning.","objectives":["Describe the development of peer sociability, including Parten's play categories and rough-and-tumble play","Explain how children's conceptions of friendship change and how friendships influence development","Classify sociometric categories of peer acceptance and evaluate interventions for rejected children","Distinguish cliques and crowds and explain how peer conformity changes in adolescence","Assess the effects of television and digital media on cognition and behavior and ways to regulate media use","Analyze how class size, educational philosophy, teacher-student interaction, grouping practices, inclusion and school transitions affect learning"],"sections":[{"heading":"Development of Peer Sociability","paragraphs":["Peer sociability begins in infancy, when babies look at, touch and smile at one another. In the second year, toddlers begin to imitate each other and engage in simple coordinated games such as running and chasing. During the preschool years, interaction becomes more frequent and more complex as language and understanding of others grow.","Mildred Parten observed preschoolers and described a sequence of play types. In nonsocial activity, children are unoccupied, watch others as onlookers, or play alone in solitary play. In parallel play, a child plays near others with similar materials but does not try to influence them. In associative play, children engage in separate activities but share toys and comment on each other's behavior. In cooperative play, children orient toward a common goal, such as acting out a make-believe theme. Later research showed these forms coexist rather than forming strict stages; the type of nonsocial play matters more than its amount.","Rough-and-tumble play is friendly chasing and play-fighting, distinguished from real aggression by smiles, laughter and the fact that children keep playing together. It is more common in boys and peaks in middle childhood. It may help children develop physical skills and learn to control their strength and read social signals."],"example":"Two four-year-olds sit side by side, each building a separate tower with blocks, without talking or sharing; this is parallel play."},{"heading":"Friendship","paragraphs":["Friendship is a close, mutual relationship involving companionship, sharing, understanding of thoughts and feelings, and caring for one another. Children's conceptions of friendship change with age. Preschoolers see a friend as someone they like and play with often, so friendships can form and end quickly. In middle childhood, friendship becomes a relationship based on mutual trust and help, and broken trust, such as betraying a secret, becomes a serious violation.","In adolescence, intimacy and loyalty become central. Teenagers want friends who share inner thoughts and feelings and stand up for them. Intimacy in friendship is typically greater among girls, who talk more about personal matters, while boys' friendships more often center on shared activities, though many boys also form close friendships.","Friends tend to be similar in age, sex, ethnicity, SES, interests and values. Good friendships provide support, help children cope with stress and foster social skills and school adjustment. However, the quality and characteristics of friends matter: friendships marked by conflict, or with friends who engage in antisocial behavior, can increase problem behavior. A related risk is corumination, extensive mutual discussion of problems, which can deepen anxiety and depression, especially in girls."],"example":"Asked what makes a good friend, a five-year-old says 'someone who plays with me,' while a fourteen-year-old says 'someone I can tell anything who will not spread it around.'"},{"heading":"Peer Acceptance","paragraphs":["Peer acceptance refers to likability, the extent to which a child is viewed by agemates as a worthy social partner. Researchers measure it with sociometric techniques, asking children whom they like or dislike. Results yield four main categories. Popular children get many positive votes. Rejected children get many negative votes. Controversial children receive many positive and many negative votes. Neglected children are seldom mentioned either way. About one-third of children fit none of these categories and are called average.","Each category has subtypes. Most popular children are popular-prosocial, combining academic and social competence. Some are popular-antisocial, often tough, athletic boys who are admired but also aggressive. Rejected children include rejected-aggressive children, who show high conflict, hostility and poor self-control, and rejected-withdrawn children, who are passive, socially awkward and often victimized. Controversial children mix disruptive behavior with positive social acts. Neglected children are usually well adjusted despite their low visibility, and many are not unhappy.","Peer rejection in childhood predicts later problems, including poor school performance, dropping out, antisocial behavior and loneliness. Interventions include coaching, modeling and reinforcing positive social skills, academic tutoring, and training rejected-aggressive children to interpret others' intentions more accurately and control anger. Changing the attitudes of peers and improving parenting at home can also help."],"example":"On a class survey, many children name Rosa as someone they like and many also name her as someone they dislike, placing her in the controversial category."},{"heading":"Peer Groups and Peer Pressure","paragraphs":["By the end of middle childhood, children form peer groups, collectives that generate their own values and standards for behavior and a social structure of leaders and followers. In adolescence, two main types of group appear. Cliques are small groups of about five to eight members who are close friends and usually similar in background and interests. Crowds are larger, looser groups based on reputation and stereotype, such as the brains, jocks, populars or loners, which give teenagers an identity within the larger school.","In early adolescence, cliques are often same-sex. By mid-adolescence, mixed-sex cliques form and support the move toward dating. Crowd membership is influenced by family factors; for example, adolescents with authoritative parents are more often members of crowds that value both academics and social life. Crowds become less important by late adolescence as teenagers develop their own values.","Conformity to peer pressure rises in early adolescence and declines later. However, peer pressure is not always negative. Peers often push one another toward positive goals, such as doing well in school or joining activities, as well as toward risky behaviors. Teenagers are most likely to conform on dress, music and social activities, while parents tend to have more influence on long-term goals and values. Authoritative parenting helps adolescents resist harmful peer pressure."],"example":"Fourteen-year-old Dev spends most lunch breaks with five close friends from the robotics team (his clique), and other students describe them all as part of the 'brains' (a crowd)."},{"heading":"Media: Television and Digital Media","paragraphs":["Children in industrialized nations spend many hours a day with screen media. Content matters more than time alone. Heavy exposure to media violence is linked to increased aggressive thoughts and behavior, greater acceptance of violence and reduced sensitivity to others' suffering. Experimental and longitudinal studies suggest these effects are causal, though they combine with other risk factors. Commercials also influence young children, who often cannot tell persuasive intent from entertainment.","Media can also teach. Educational programs designed with clear, slow-paced content and opportunities to respond, such as Sesame Street, support early literacy, math and prosocial behavior. Infants and young toddlers, however, learn much less from screens than from live interaction, a pattern called the video deficit effect. Heavy viewing of entertainment content can displace reading, play and conversation.","Digital media bring new opportunities and risks. Computers and well-designed apps can foster learning, and some action video games improve spatial and attention skills, while violent games are associated with aggression. Social media allow teenagers to stay connected with friends, but heavy or problematic use is linked to sleep loss, cyberbullying and comparisons that can lower self-esteem. Regulation includes content ratings, parental controls, guidelines that limit screen time for young children, and, most importantly, parents who co-view, discuss content and set clear rules."],"example":"A father watches a cartoon with his five-year-old and pauses to ask, 'Do you think hitting was a good way to solve that problem?' turning viewing into a learning opportunity."},{"heading":"Schools: Class Size, Philosophies and Teachers","paragraphs":["Schools are a major context for development. Class size matters most in the early grades. Small classes in kindergarten through third grade allow more individual attention and fewer behavior problems and are linked to lasting achievement gains, especially for low-SES and minority children.","Educational philosophies differ. In traditional classrooms, the teacher is the main source of knowledge and children are relatively passive, listening and completing assignments. In constructivist classrooms, inspired by Piaget, children are active agents who construct their own knowledge through rich materials, discovery and discussion, with progress judged against each child's previous development. Social-constructivist classrooms, based on Vygotsky, emphasize children and teachers working together, with teachers providing guidance tailored to each child's zone of proximal development. Reciprocal teaching and cooperative learning are examples.","Teacher-student interaction strongly affects learning. Teachers who are caring, supportive and encourage higher-level thinking promote motivation and achievement. Teachers' expectations matter too. An educational self-fulfilling prophecy occurs when children adopt teachers' positive or negative views and begin to live up to them. These effects are strongest for low-achieving children and in classrooms where teachers publicly emphasize competition and comparisons."],"example":"A teacher who expects little from a quiet student calls on her rarely and gives brief feedback; over the year, the student participates less and her grades decline, illustrating a self-fulfilling prophecy."},{"heading":"Grouping, Inclusion, Transitions and Achievement","paragraphs":["Many schools use ability grouping, placing students of similar achievement together. Students in low-ability groups often receive slower-paced, less stimulating instruction and more drill, and their self-esteem and achievement may fall further behind. Heterogeneous and multigrade classrooms, combined with cooperative learning, can reduce these problems. In secondary school, tracking into academic and vocational paths can limit opportunities when placements are rigid.","Students with disabilities are often educated in regular classrooms. Inclusive classrooms place them with typical learners for part or all of the school day, with support. Many such students, especially those with learning disabilities, benefit academically and socially, but success depends on adequate support and teacher training. Peer acceptance can be a challenge, so teachers who promote cooperative activities help these students feel included.","School transitions, such as moving from elementary to middle or junior high school, often bring a drop in grades and self-esteem, especially when the new school is large and impersonal. Researchers explain this with the idea of a poor fit between adolescents' needs for autonomy and close relationships and the environment of many secondary schools. Smaller units and supportive teachers ease transitions. Cross-national comparisons show that students in some countries, such as several East Asian nations and Finland, outperform those in others. Contributing factors include cultural valuing of effort over fixed ability, strong parental involvement, high-quality teacher preparation and more equal resources across schools."],"example":"Twelve-year-old Lena loved her small elementary school but feels lost in her large new middle school with different teachers every period, and her grades slip in the first semester."}],"terms":[{"term":"Parallel play","def":"Play in which a child plays near other children with similar materials but does not try to influence them."},{"term":"Associative play","def":"Play in which children engage in separate activities but share toys and comment on each other's behavior."},{"term":"Cooperative play","def":"Play in which children orient toward a common goal, such as acting out a shared make-believe theme."},{"term":"Rough-and-tumble play","def":"Friendly chasing and play-fighting, marked by smiles and laughter, that is distinct from real aggression."},{"term":"Sociometric techniques","def":"Self-report measures in which children name or rate peers they like or dislike, used to assess peer acceptance."},{"term":"Rejected children","def":"Children who receive many negative votes on sociometric measures; subtypes include rejected-aggressive and rejected-withdrawn."},{"term":"Controversial children","def":"Children who receive many positive and many negative sociometric votes."},{"term":"Neglected children","def":"Children who are seldom mentioned, positively or negatively, on sociometric measures; they are usually well adjusted."},{"term":"Clique","def":"A small group of about five to eight close friends who are usually similar in background and interests."},{"term":"Crowd","def":"A large, loosely organized adolescent group based on reputation and stereotype rather than close friendship."},{"term":"Video deficit effect","def":"The finding that infants and toddlers learn less from screen media than from live interaction."},{"term":"Constructivist classroom","def":"A classroom in which children are encouraged to build their own knowledge through active exploration and discussion."},{"term":"Educational self-fulfilling prophecy","def":"A process in which children adopt teachers' positive or negative expectations and begin to live up to them."},{"term":"Inclusive classroom","def":"A classroom in which students with disabilities learn alongside typical students for part or all of the day, with support."}],"questions":[{"type":"mc","section":"Development of Peer Sociability","prompt":"Two preschoolers each draw their own pictures at the same table, but they share crayons and comment on each other's drawings. According to Parten, this is","choices":["parallel play","associative play","cooperative play","onlooker behavior"],"answer":1,"explain":["Not quite. In parallel play children do not share materials or try to influence one another.","Correct. Separate activities with sharing and comments define associative play.","Not quite. Cooperative play requires a common goal, and each child is drawing a separate picture.","Not quite. Onlookers watch others without joining in."]},{"type":"mc","section":"Friendship","prompt":"Which feature becomes central to friendship in adolescence?","choices":["Playing together often","Living close by","Having the same toys","Intimacy and loyalty"],"answer":3,"explain":["Not quite. Frequent play is the main basis of friendship in early childhood.","Not quite. Proximity can help friendships form but is not the defining feature in adolescence.","Not quite. Shared toys are a concrete basis typical of young children.","Correct. Teenagers stress sharing inner thoughts and feelings and standing up for one another."]},{"type":"mc","section":"Peer Acceptance","prompt":"A child who receives many positive and many negative sociometric votes is classified as","choices":["controversial","neglected","popular-antisocial","average"],"answer":0,"explain":["Correct. Controversial children get a large number of both positive and negative votes.","Not quite. Neglected children are rarely mentioned at all.","Not quite. Popular-antisocial is a subtype of popular children, who mainly receive positive votes.","Not quite. Average children receive moderate numbers of votes and fit no extreme category."]},{"type":"mc","section":"Peer Groups and Peer Pressure","prompt":"How do crowds differ from cliques?","choices":["Crowds are smaller and more intimate","Crowds disappear in early adolescence","Crowds are larger and based on reputation and stereotype","Crowds consist only of same-sex members"],"answer":2,"explain":["Not ","Belief that ability is fixed at birth","Cultural valuing of effort and high-quality teacher preparation"],"answer":3,"explain":["Not quite. Vacation length is not a main explanation offered for these differences.","Not quite. Class size is not the factor usually cited for these countries' success.","Not quite. These cultures tend to emphasize effort over fixed ability.","Correct. An emphasis on effort, strong teacher preparation, parental involvement and equal resources are commonly cited."]},{"type":"tf","section":"Peer Acceptance","prompt":"Neglected children are usually poorly adjusted and at greater risk for later problems than rejected children.","choices":["True","False"],"answer":1,"explain":["Not quite. Rejected children, not neglected children, are at highest risk for later problems.","Correct. Neglected children are usually well adjusted despite their low visibility among peers."]},{"type":"tf","section":"Peer Groups and Peer Pressure","prompt":"Peer pressure in adolescence can push teenagers toward positive behaviors such as doing well in school, not only toward risky ones.","choices":["True","False"],"answer":0,"explain":["Correct. Peers often encourage positive goals as well as risky behaviors.","Not quite. Research shows peer pressure can be positive as well as negative."]},{"type":"scenario","section":"Peer Acceptance","prompt":"Marcus, age 8, often grabs toys, starts fights and assumes classmates bump into him on purpose. Many peers say they dislike him. Which intervention best fits research on helping children like Marcus?","choices":["Placing him in a separate class with other aggressive children","Ignoring the problem, because children outgrow rejection","Training in social skills, reading others' intentions accurately and controlling anger","Giving him more unstructured free time on the playground"],"answer":2,"explain":["Not quite. Grouping aggressive children together can reinforce aggressive behavior.","Not quite. Peer rejection tends to persist and predicts later difficulties.","Correct. Marcus appears rejected-aggressive; coaching social skills and correcting hostile interpretations of others' behavior targets his problems.","Not quite. Unstructured time without support gives him more chances for conflict."]},{"type":"scenario","section":"Schools: Class Size, Philosophies and Teachers","prompt":"A teacher pairs each struggling reader with a classmate, guides each pair with hints matched to what they can almost do on their own, and has them discuss texts together. This approach best reflects","choices":["a traditional classroom","a social-constructivist classroom","ability grouping","a Piagetian discovery classroom with no adult guidance"],"answer":1,"explain":["Not quite. Traditional classrooms rely on the teacher lecturing to passive students.","Correct. Collaboration and guidance within each child's zone of proximal development reflect Vygotsky's social-constructivist approach.","Not quite. Pairing struggling readers with classmates is not the same as sorting students by ability level.","Not quite. The teacher actively guides learning, which is central to the Vygotskian, not the purely Piagetian, approach."]},{"type":"scenario","section":"Grouping, Inclusion, Transitions and Achievement","prompt":"A district notices that seventh graders' grades and self-esteem drop after they move from small neighborhood elementary schools into one large middle school. Which change would most likely help?","choices":["Adding more standardized tests in seventh grade","Increasing the number of different teachers each student sees","Placing all students in strict ability tracks","Creating smaller teams of students who share a core group of supportive teachers"],"answer":3,"explain":["Not quite. More testing does not address the impersonal school environment.","Not quite. More teachers per student makes the environment even less personal.","Not quite. Rigid tracking can lower achievement for students in low tracks."," /* ---------- saved progress (this browser only) ---------- */
const KEY = "cd-course-v1";
let P = { read: {}, best: {}, missed: {}, exams: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) P = Object.assign(P, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const byId = Object.fromEntries(COURSE.map((m) => [m.id, m]));
const allQ = COURSE.flatMap((m) => m.questions.map((q, i) => ({ ...q, mod: m.id, qid: m.id + "-" + i })));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function prepared(q) { // shuffle choices (not True/False) and keep the answer and explanations aligned
  const order = q.type === "tf" ? [0, 1] : shuffle([0, 1, 2, 3]);
  return { ...q, choices: order.map((i) => q.choices[i]), explain: order.map((i) => q.explain[i]), answer: order.indexOf(q.answer) };
}
const TYPE = { mc: "Multiple choice", tf: "True or false", scenario: "Apply it" };
const LET = "ABCD";

/* ---------- quiz engine (used by module checks and the exam) ---------- */
function runQuiz(host, questions, opts) {
  const qs = questions.map(prepared);
  let i = 0, score = 0, answers = [], timerId = null, left = 0;
  function tick() {
    left--; const t = $(".timer", host); if (t) t.textContent = fmt(left);
    if (left <= 0) { clearInterval(timerId); finish(true); }
  }
  function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  if (opts.seconds) { left = opts.seconds; timerId = setInterval(tick, 1000); }
  function show() {
    const q = qs[i];
    host.innerHTML = `<div class="quiz" aria-live="polite">
      <div class="qhead"><span>Question ${i + 1} of ${qs.length}${opts.showModule ? " · Module " + byId[q.mod].num : ""}</span>
      <span>${opts.seconds ? `<span class="timer">${fmt(left)}</span> · ` : ""}Score ${score}</span></div>
      <div class="bar"><i style="width:${(i / qs.length) * 100}%"></i></div>
      <div class="qtype">${TYPE[q.type]}</div>
      <p class="prompt">${esc(q.prompt)}</p>
      <div class="choices">${q.choices.map((c, j) => `<button class="choice" data-j="${j}"><span class="k">${q.type === "tf" ? c[0] : LET[j]}</span><span>${esc(c)}</span></button>`).join("")}</div>
      <div class="after"></div></div>`;
    host.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => pick(+b.dataset.j)));
  }
  function pick(j) {
    const q = qs[i], ok = j === q.answer;
    if (ok) score++;
    answers.push({ q, j, ok });
    host.querySelectorAll(".choice").forEach((b, k) => {
      b.disabled = true;
      if (k === q.answer) b.classList.add("right");
      if (k === j && !ok) b.classList.add("wrong");
      if (k === q.answer || k === j) b.insertAdjacentHTML("beforeend", `<span class="why">${esc(q.explain[k])}</span>`);
    });
    const last = i === qs.length - 1;
    $(".after", host).innerHTML = `<p class="verdict ${ok ? "ok" : "no"}">${ok ? "Right." : "Not this time."}</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="next">${last ? "See results" : "Next question"}</button></div>`;
    $("#next", host).addEventListener("click", () => { if (last) finish(false); else { i++; show(); } });
    $("#next", host).focus();
  }
  function finish(timedOut) {
    clearInterval(timerId);
    for (const a of answers) { if (a.ok) delete P.missed[a.q.qid]; else P.missed[a.q.qid] = true; }
    save();
    opts.done(host, { score, total: qs.length, answered: answers.length, answers, timedOut });
  }
  show();
}

function resultHTML(r, title) {
  const pct = Math.round((r.score / r.total) * 100);
  const missed = r.answers.filter((a) => !a.ok);
  return `<div class="quiz result"><div class="eyebrow">${esc(title)}</div><div class="big">${pct}%</div>
    <p>${r.score} of ${r.total} correct${r.timedOut ? ` · time ran out after ${r.answered} questions` : ""}.</p></div>
    ${missed.length ? `<h3>Review your mistakes</h3>${missed.map((a) => `<div class="quiz"><div class="qtype">Module ${byId[a.q.mod].num} · ${esc(a.q.section)}</div>
      <p class="prompt">${esc(a.q.prompt)}</p><p class="verdict no">Your answer: ${esc(a.q.choices[a.j])}</p>
      <p class="note">${esc(a.q.explain[a.j])}</p><p class="verdict ok">Correct answer: ${esc(a.q.choices[a.q.answer])}</p>
      <p class="note">${esc(a.q.explain[a.q.answer])}</p></div>`).join("")}` : ""}`;
}

function setTab(t) { document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === t ? "page" : "false")); }

function rulerSVG() {
  const W = 760, x0 = 170, x1 = 740, min = -1, max = 18, sx = (v) => x0 + ((v - min) / (max - min)) * (x1 - x0);
  const rows = COURSE.map((m, r) => { const [a, b] = AGES[m.id] || [0, 18]; const y = 30 + r * 18;
    return `<text class="lbl" x="${x0 - 8}" y="${y + 10}" text-anchor="end">${m.num}. ${esc(SHORT[m.id] || m.title)}</text>
      <rect class="span ${P.best[m.id] != null ? "done" : ""}" x="${sx(a)}" y="${y}" width="${Math.max(6, sx(b) - sx(a))}" height="12" rx="6"/>`; }).join("");
  const ticks = [0, 2, 6, 12, 18].map((v) => `<line class="tick" x1="${sx(v)}" y1="22" x2="${sx(v)}" y2="${30 + COURSE.length * 18}"/>
    <text x="${sx(v)}" y="16" text-anchor="middle">${v === 0 ? "birth" : v + " yr"}</text>`).join("") + `<text x="${x0 - 2}" y="16" text-anchor="end">prenatal</text>`;
  return `<svg viewBox="0 0 ${W} ${40 + COURSE.length * 18}" role="img" aria-label="The age span each module covers, from prenatal to 18 years; filled bars are modules you have tested yourself on">${ticks}${rows}</svg>`;
}

  const f = $("#setup");

  const begin = (pool, secsPer) => { f.hidden = true; runQuiz($("#examhost"), pool, { showModule: true, seconds: secsPer ? secsPer * pool.length : 0, done: (host, r) => {

    begin(pool.slice(0, len), +f.timer.value);
  });
  $("#missed").addEventListener("click", () => begin(shuffle(allQ.filter((q) => P.missed[q.qid])), 0));
}

function progressView() {
  setTab("progress");
  const W = 760, H = 300, x0 = 46, x1 = 740, y0 = 250, y1 = 20, n = COURSE.length;
  const sx = (k) => x0 + (k / (n - 1)) * (x1 - x0), sy = (v) => y0 - (v / 100) * (y0 - y1);
  const pts = COURSE.map((m, k) => [k, P.best[m.id]]).filter(([, v]) => v != null);
  const grid = [0, 25, 50, 75, 100].map((v) => `<line class="grid" x1="${x0}" y1="${sy(v)}" x2="${x1}" y2="${sy(v)}"/><text x="${x0 - 8}" y="${sy(v) + 4}" text-anchor="end">${v}%</text>`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Best check score for each module, drawn like a growth chart; the shaded band marks 70 to 100 percent">
    <rect class="band" x="${x0}" y="${sy(100)}" width="${x1 - x0}" height="${sy(70) - sy(100)}"/>${grid}
    <text x="${x1}" y="${sy(70) - 6}" text-anchor="end">exam-ready zone (70%+)</text>
    ${pts.length > 1 ? `<polyline class="line" points="${pts.map(([k, v]) => sx(k) + "," + sy(v)).join(" ")}"/>` : ""}
    ${COURSE.map((m, k) => P.best[m.id] != null ? `<circle class="pt" cx="${sx(k)}" cy="${sy(P.best[m.id])}" r="5"><title>Module ${m.num}: ${P.best[m.id]}%</title></circle>` : `<circle class="none" cx="${sx(k)}" cy="${y0}" r="3"/>`).join("")}
    ${COURSE.map((m, k) => `<text x="${sx(k)}" y="${y0 + 20}" text-anchor="middle">${m.num}</text>`).join("")}
    <text x="${(x0 + x1) / 2}" y="${H - 6}" text-anchor="middle">module</text></svg>`;
  const weak = COURSE.filter((m) => P.best[m.id] != null && P.best[m.id] < 70);
  $("#app").innerHTML = `<h1>Your progress</h1>
    <p class="lead">Your best score on each module check, drawn like a growth chart. Aim to get every module into the shaded band.</p>
    <div class="chart">${svg}</div>
    ${pts.length ? "" : '<p class="note">No checks taken yet. Open a module and press "Start the check" at the end of the lesson.</p>'}
    ${weak.length ? `<h2>Worth another look</h2><ul>${weak.map((m) => `<li><a href="#${m.id}">${m.num}. ${esc(m.title)}</a> · best ${P.best[m.id]}%</li>`).join("")}</ul>` : ""}
    <h2>Recent practice exams</h2>
    ${P.exams.length ? `<div class="table-scroll"><table class="breakdown"><tr><th>Date</th><th class="num">Correct</th><th class="num">Score</th></tr>${P.exams.slice().reverse().map((e) => `<tr><td>${new Date(e.at).toLocaleString()}</td><td class="num">${e.score}/${e.total}</td><td class="num">${Math.round((e.score / e.total) * 100)}%</td></tr>`).join("")}</table></div>` : '<p class="note">None yet.</p>'}
    <h2>Start over</h2><p class="note">Clears your read lessons, scores and missed questions in this browser.</p>
    <div class="row"><button class="btn ghost" id="reset">Reset my progress</button><span id="confirm"></span></div>`;
  $("#reset").addEventListener("click", () => {
    $("#confirm").innerHTML = '<button class="btn" id="yes">Yes, reset</button>';
    $("#yes").addEventListener("click", () => { P = { read: {}, best: {}, missed: {}, exams: [] }; save(); progressView(); });
  });
}

function route() {
  const h = location.hash.slice(1);
  if (h === "exam") examView(); else if (h === "progress") progressView(); else if (byId[h]) moduleView(h); else home();
  if (!byId[h]) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
