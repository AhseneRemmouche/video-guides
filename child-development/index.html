lf-Conscious Emotions and Emotional Self-Regulation","prompt":"Why do self-conscious emotions such as pride and embarrassment appear later than basic emotions?","choices":["They require the child to be aware of the self as separate from others","They depend on the child first learning to read","They are learned only after formal schooling begins","They are reflexes that mature only at age five"],"answer":0,"explain":["Correct. Self-conscious emotions involve the sense of self, so they emerge after self-awareness develops in the second year.","Not quite. Toddlers show these emotions well before they can read.","Not quite. Self-conscious emotions appear in toddlerhood, long before school begins.","Not quite. They are not reflexes, and they emerge around 18 to 24 months, not age five."]},{"type":"mc","section":"Understanding and Responding to Others' Emotions","prompt":"Which statement best distinguishes empathy from sympathy?","choices":["Empathy always leads to helping, while sympathy never does","Sympathy is feeling exactly what the other person feels, while empathy is concern without shared feeling","Empathy is feeling with another person, while sympathy is concern or sorrow for another's plight","They are identical terms used by different researchers"],"answer":2,"explain":["Not quite. Empathy can lead to personal distress and withdrawal rather than helping.","Not quite. This reverses the definitions.","Correct. Empathy involves sharing the feeling, while sympathy involves concern or sorrow for the other person.","Not quite. The two concepts are related but distinct."]},{"type":"mc","section":"Temperament","prompt":"In Thomas and Chess's system, a child who is inactive, shows mild reactions and adjusts slowly to new experiences is classified as:","choices":["Easy","Difficult","Uninhibited","Slow-to-warm-up"],"answer":3,"explain":["Not quite. Easy children adapt quickly and are generally cheerful.","Not quite. Difficult children react negatively and intensely, not mildly.","Not quite. Uninhibited is Kagan's term for children who approach novelty eagerly.","Correct. The slow-to-warm-up child is inactive, mild and slow to adjust to change."]},{"type":"mc","section":"Stability of Temperament and Goodness of Fit","prompt":"According to the goodness-of-fit model, which parenting response best supports a difficult child?","choices":["Harsh punishment to stop negative reactions quickly","Patient, consistent and firm limits that respect the child's temperament","Avoiding all limits so the child is never upset","Treating the child exactly as one would an easy child"],"answer":1,"explain":["Not quite. Harsh, angry responses create a poor fit and tend to worsen difficulties.","Correct. A good fit recognizes the child's temperament while encouraging more adaptive behavior through patience and consistency.","Not quite. Removing all limits does not encourage more adaptive functioning.","Not quite. Goodness of fit means adapting to the child's particular temperament, not ignoring it."]},{"type":"mc","section":"Attachment: Theory and Measurement","prompt":"In which of Bowlby's phases do infants first show separation anxiety and use the caregiver as a secure base?","choices":["Preattachment","Attachment-in-the-making","Clear-cut attachment","Formation of a reciprocal relationship"],"answer":2,"explain":["Not quite. In preattachment, infants do not yet mind being left with an unfamiliar adult.","Not quite. In this phase infants respond differently to familiar people but do not yet protest separation.","Correct. From about six to eight months, infants show separation anxiety and use the caregiver as a secure base.","Not quite. This later phase is marked by language and negotiation, after separation anxiety has already appeared."]},{"type":"mc","section":"Attachment Patterns, Influences and Later Development","prompt":"Which factor is most consistently linked to secure attachment?","choices":["The amount of time spent feeding the infant","Whether the infant is the first-born child","Never using any form of child care outside the home","Sensitive caregiving that responds promptly, consistently and appropriately"],"answer":3,"explain":["Not quite. Harlow's research and later work show that attachment is not based mainly on feeding.","Not quite. Birth order is not presented as a key predictor of attachment security.","Not quite. High-quality child care does not harm attachment.","Correct. Sensitive caregiving is a central predictor of attachment security."]},{"type":"tf","section":"Stability of Temperament and Goodness of Fit","prompt":"Temperament is highly stable, so a shy infant will almost always remain shy throughout life.","choices":["True","False"],"answer":1,"explain":["Not quite. Temperament shows only low to moderate stability, and many inhibited children become less shy.","Correct. Temperament is only moderately stable and is shaped by experience, so many shy infants change."]},{"type":"tf","section":"Attachment Patterns, Influences and Later Development","prompt":"Infants can form attachments to several people, including fathers, siblings and professional caregivers.","choices":["True","False"],"answer":0,"explain":["Correct. Infants commonly develop multiple attachments to different familiar people.","Not quite. Attachment is not limited to the mother; multiple attachments are typical."]},{"type":"scenario","section":"Understanding and Responding to Others' Emotions","prompt":"A one-year-old sees a robot toy beep and roll toward her. She stops, looks at her father's face, sees him looking alarmed, and crawls away from the toy. What is she doing?","choices":["Social referencing","Stranger anxiety","Emotional display rules","Emotion-centered coping"],"answer":0,"explain":["Correct. She seeks emotional information from a trusted adult to decide how to react to an uncertain situation.","Not quite. Stranger anxiety is fear of unfamiliar people, not reading a parent's reaction to a toy.","Not quite. Display rules concern when to express emotions, which a one-year-old has not yet learned.","Not quite. Emotion-centered coping is a later strategy for changing one's feelings in situations that cannot be changed."]},{"type":"scenario","section":"Attachment Patterns, Influences and Later Development","prompt":"In the Strange Situation, a baby boy plays without checking on his mother, shows no distress when she leaves, and turns away from her when she returns. Which attachment pattern does this suggest?","choices":["Secure","Resistant","Avoidant","Disorganized-disoriented"],"answer":2,"explain":["Not quite. Secure infants seek contact at reunion and are quickly comforted.","Not quite. Resistant infants are very distressed at separation and mix clinging with anger at reunion.","Correct. Unresponsiveness to the parent and avoidance at reunion mark the avoidant pattern.","Not quite. Disorganized infants show confused, contradictory behavior rather than consistent avoidance."]},{"type":"scenario","section":"Self-Conscious Emotions and Emotional Self-Regulation","prompt":"An eight-year-old learns that his family cannot afford a school trip. Unable to change the situation, he tells himself that the trip would have been boring anyway and focuses on plans with friends. Which strategy is he using?","choices":["Problem-centered coping","Social referencing","Stranger anxiety","Emotion-centered coping"],"answer":3,"explain":["Not quite. Problem-centered coping involves changing the situation itself, which he cannot do here.","Not quite. He is not seeking emotional cues from a trusted adult.","Not quite. Stranger anxiety is an infant's fear of unfamiliar people.","Correct. He changes how he feels about a situation he cannot control, which is emotion-centered coping."]}]},{"id":"m11","num":11,"title":"Self and Social Understanding","tagline":"How children come to know themselves, evaluate their worth and abilities, build an identity, and understand other people's minds, traits and conflicts.","objectives":["Describe how self-awareness emerges in infancy and how researchers test it","Explain how self-concept and self-esteem change from early childhood through adolescence and what influences them","Contrast mastery-oriented attributions with learned helplessness and identify their sources","Apply Erikson's theory and Marcia's identity statuses to adolescent identity development","Explain the development of person perception, understanding of intentions, theory of mind, and stereotyping","Outline the steps of social problem solving and how they improve with age"],"sections":[{"heading":"Emergence of Self-Awareness","paragraphs":["Self-awareness is the recognition that the self is a separate being with its own body and actions. William James distinguished two aspects of the self. The I-self is the self as knower and actor, aware that it causes events and is distinct from others. The me-self is the self as an object of knowledge, the set of qualities a person believes make them unique. In infancy, the I-self develops first.","Young infants gain a sense of self through action. When they kick and see a mobile move, or smile and see a caregiver smile back, they learn that their own actions produce effects. Responsive caregiving helps infants notice the link between what they do and what happens, which supports an early sense of agency.","Researchers test explicit self-recognition with the rouge test. A caregiver secretly places a dot of red color on the infant's nose, then puts the child in front of a mirror. Babies who touch or rub their own nose, rather than the image in the mirror, show that they recognize the reflection as themselves. Most children pass between about 18 and 24 months. Self-recognition is linked to the appearance of self-conscious emotions, early empathy and the use of personal pronouns such as me and mine."],"example":"A twenty-month-old looks in the mirror after lunch, sees yogurt on her chin, and wipes her own face while giggling."},{"heading":"Self-Concept and Self-Esteem","paragraphs":["Soon after self-recognition, toddlers form a categorical self, classifying themselves by age, sex and physical features, such as big boy, girl or strong. Self-concept is the set of attributes, abilities, attitudes and values a person believes define who they are. Preschoolers describe themselves with concrete, observable features such as their possessions, activities and appearance. In middle childhood, children emphasize competencies and personality traits and begin to compare themselves with peers. Adolescents add abstract qualities, values and beliefs, and they unify contradictory traits into a more organized picture.","Self-esteem is the evaluative side of the self-concept, the judgments we make about our own worth and the feelings tied to those judgments. Preschoolers' self-esteem is usually very high and not well differentiated. By about age seven, children have separate self-esteems for academic competence, social competence, physical or athletic competence, and physical appearance. These combine into an overall sense of self-worth, organized in a hierarchy.","Self-esteem tends to drop somewhat in the early school years as children receive more feedback and compare themselves with others, then rises for most young people from late childhood through adolescence. Influences include culture and, above all, child-rearing. Authoritative parenting, which combines warmth with reasonable expectations, predicts favorable self-esteem. Indulgent praise that is not tied to real accomplishment does not build lasting self-esteem."],"example":"Asked to describe himself, a four-year-old says he has a blue bike and can run fast, while his twelve-year-old sister says she is kind but sometimes moody and cares about fairness."},{"heading":"Achievement-Related Attributions","paragraphs":["Attributions are our common, everyday explanations for the causes of behavior. Achievement-related attributions explain successes and failures. Children with a mastery orientation credit their successes to ability, which they believe can be improved through effort, and attribute failures to factors that can be changed or controlled, such as too little effort or a very hard task. They hold an incremental view of ability and persist in the face of difficulty.","In contrast, children who develop learned helplessness attribute successes to external factors such as luck and failures to low ability, which they see as fixed and unchangeable. This reflects an entity view of ability. Because they believe that trying harder will not help, they give up quickly when tasks become challenging, and their performance and self-esteem decline over time.","Adult feedback shapes these patterns. Parents and teachers who praise effort and strategies, and who frame mistakes as chances to learn, foster mastery orientation. Messages that praise fixed traits, such as calling a child smart, or that suggest a child lacks ability, encourage helplessness. Attribution retraining is an intervention that teaches children to view failure as due to insufficient effort or ineffective strategies and to keep trying."],"example":"After a low test score, one student decides she needs a better study plan, while her classmate concludes that he is just bad at math and stops doing the homework."},{"heading":"Identity in Adolescence","paragraphs":["Erik Erikson viewed constructing an identity as the major personality achievement of adolescence. Identity means defining who you are, what you value and the directions you choose to pursue in life. Erikson called this stage identity versus role confusion. He described the process as an identity crisis, a temporary period of exploration before settling on values and goals. Young people who fail to resolve it may appear shallow and directionless, showing role confusion.","James Marcia extended Erikson's ideas by describing four identity statuses based on two criteria: exploration, meaning active searching among alternatives, and commitment, meaning making a firm choice. Identity achievement is commitment after exploration. Identity moratorium is exploration without commitment yet. Identity foreclosure is commitment without exploration, usually by accepting ready-made values from parents. Identity diffusion is an apathetic state with neither exploration nor commitment.","Achievement and moratorium are generally considered healthy routes, linked to higher self-esteem and more mature reasoning. Foreclosed young people tend to be more rigid, and long-term diffusion is linked to poorer adjustment. Families that offer both warmth and freedom to explore, schools with rich opportunities, and exposure to diverse ideas all support identity development. Many young people continue to work on identity into early adulthood."],"example":"A high school senior plans to become a lawyer because his parents and grandparents were lawyers, and he has never considered any other path; this fits identity foreclosure."},{"heading":"Thinking About Other People","paragraphs":["Person perception refers to how we size up the attributes of people with whom we are familiar. Preschoolers describe others mostly in terms of concrete activities and behaviors, such as she plays soccer. Around age seven or eight, children begin to use personality traits, such as he is shy. Adolescents create more integrated descriptions that combine traits, values and how a person behaves in different situations.","Understanding intentions is another early step. Even infants seem to grasp that people act on goals, and preschoolers can distinguish deliberate actions from accidents. This understanding develops alongside theory of mind, a coherent set of ideas about mental activities such as desires, beliefs, thinking and imagining. Toddlers first develop a desire theory of mind, realizing that people act on their wants. Next comes a belief-desire theory, in which children grasp that beliefs also guide behavior, even when those beliefs are wrong.","The false-belief task tests this insight. In a common version, a child watches a character hide an object and leave, after which someone moves it. The child is asked where the character will look. Most four-year-olds correctly say the character will look in the original place, while most three-year-olds say the new place. Language, executive function, pretend play and conversations about mental states all support theory of mind, while children with autism often show delays in it."],"example":"A four-year-old watches her brother put cookies in a jar and leave, sees her mother move them to a cupboard, and predicts that her brother will look in the jar when he comes back."},{"heading":"Stereotyping and Prejudice","paragraphs":["As children classify people, they also form attitudes toward social groups. By the preschool years, many children associate positive qualities with their own group and fewer with other groups, showing in-group favoritism. When children hold negative attitudes toward members of other groups, the result is prejudice. Children often absorb these attitudes from subtle messages in their surroundings, not only from direct teaching.","Prejudice tends to be stronger in children who believe that personality traits are fixed, who have overly high self-esteem, and who live in social settings that stress group differences. As children gain the cognitive ability to see that people within a group vary and that individuals belong to many groups at once, explicit prejudice often declines. However, implicit, automatic biases may remain.","Interventions can reduce prejudice. Long-term intergroup contact in which children from different groups work together toward common goals, with equal status and adult support, is especially effective. Teaching children that traits can change and encouraging them to notice individual qualities rather than group labels also help."],"example":"In a classroom, children from different neighborhoods are assigned to mixed teams to build a model city together; over the term, they choose friends across groups more often."},{"heading":"Understanding Conflict: Social Problem Solving","paragraphs":["Conflicts among children are common and give them chances to practice social skills. Social problem solving means resolving social conflicts in ways that are both acceptable to others and beneficial to the self. Nicki Crick and Kenneth Dodge proposed an information-processing model of this process. It includes noticing and interpreting social cues, formulating a social goal, generating possible strategies, evaluating them, and finally enacting a response.","Each step improves with age. Older children notice more cues, interpret others' intentions more accurately, and think of a wider range of strategies. Children who interpret ambiguous actions as hostile, a pattern called hostile attributional bias, are more likely to respond aggressively and to be rejected by peers.","Because social problem solving affects peer relationships, interventions teach these skills directly. Programs coach children to stop and think, read cues carefully, consider several solutions and imagine likely outcomes before acting. Role-playing and practice with feedback help children carry these skills into real conflicts."],"example":"When a classmate bumps his desk and spills his pencils, one boy assumes it was an accident and asks for help picking them up, while another assumes it was on purpose and shoves back."}],"terms":[{"term":"I-self","def":"The self as knower and actor, aware that it is separate from others and controls its own thoughts and actions."},{"term":"Me-self","def":"The self as an object of knowledge and evaluation, made up of the qualities that make a person unique."},{"term":"Rouge test","def":"A test of self-recognition in which a mark is secretly placed on a child's face before the child looks in a mirror."},{"term":"Categorical self","def":"Early classification of the self according to social categories such as age, sex and physical characteristics."},{"term":"Self-concept","def":"The set of attributes, abilities, attitudes and values a person believes define who they are."},{"term":"Self-esteem","def":"The judgments people make about their own worth and the feelings associated with those judgments."},{"term":"Mastery-oriented attributions","def":"Explanations that credit success to ability that can be improved and failure to factors that can be changed, such as effort."},{"term":"Learned helplessness","def":"Attributions that credit success to luck and failure to low, fixed ability, leading people to give up when facing challenges."},{"term":"Identity","def":"A well-organized conception of the self made up of values, beliefs and goals to which a person is solidly committed."},{"term":"Identity achievement","def":"Marcia's status describing commitment to values and goals after a period of exploration."},{"term":"Identity foreclosure","def":"Marcia's status describing commitment to values and goals without exploration, often by adopting those of authority figures."},{"term":"Theory of mind","def":"A coherent understanding of people as mental beings who have desires, beliefs, intentions and emotions that guide behavior."},{"term":"False-belief task","def":"A task that tests whether a child understands that a person can hold a belief that differs from reality and will act on it."},{"term":"Social problem solving","def":"Generating and applying strategies that resolve social conflicts in ways that are acceptable to others and beneficial to the self."}],"questions":[{"type":"mc","section":"Emergence of Self-Awareness","prompt":"In the rouge test, which behavior shows that a toddler recognizes the mirror image as the self?","choices":["Smiling at the reflection","Reaching behind the mirror to find the other child","Touching the mark on their own nose","Touching the mark on the mirror image"],"answer":2,"explain":["Not quite. Even young infants smile at mirror images without recognizing themselves.","Not quite. Searching behind the mirror suggests the child thinks the image is someone else.","Correct. Touching their own nose shows the child knows the reflection is their own face.","Not quite. Touching the image suggests the child treats the reflection as a separate object."]},{"type":"mc","section":"Self-Concept and Self-Esteem","prompt":"How do self-descriptions typically change from the preschool years to adolescence?","choices":["From abstract values to concrete possessions","From concrete, observable features to traits and then abstract values and beliefs","They remain focused on physical appearance throughout","From personality traits to physical features"],"answer":1,"explain":["Not quite. This reverses the direction of change.","Correct. Preschoolers mention concrete features, school-age children use traits, and adolescents add abstract values and beliefs.","Not quite. Self-descriptions broaden well beyond appearance with age.","Not quite. Traits come after concrete features, not before."]},{"type":"mc","section":"Self-Concept and Self-Esteem","prompt":"Which parenting style is most consistently linked to favorable self-esteem in children?","choices":["Authoritative","Authoritarian","Indulgent with constant praise","Uninvolved"],"answer":0,"explain":["Correct. Warmth combined with reasonable expectations predicts healthy self-esteem.","Not quite. Controlling, harsh parenting tends to undermine self-esteem.","Not quite. Praise not tied to real accomplishment does not build lasting self-esteem.","Not quite. Low warmth and low involvement are linked to poorer outcomes."]},{"type":"mc","section":"Achievement-Related Attributions","prompt":"A child with learned helplessness is most likely to explain a failure by saying:","choices":["I did not study enough this time","The test covered material we had not reviewed","I need to try a different strategy","I am just not smart enough to do this"],"answer":3,"explain":["Not quite. Blaming low effort is a mastery-oriented attribution, since effort can change.","Not quite. Pointing to a changeable situation is not typical of learned helplessness.","Not quite. Focusing on strategy reflects a mastery orientation.","Correct. Attributing failure to low, fixed ability is the hallmark of learned helplessness."]},{"type":"mc","section":"Identity in Adolescence","prompt":"Which of Marcia's identity statuses describes a young person who is actively exploring options but has not yet made a commitment?","choices":["Identity achievement","Identity foreclosure","Identity moratorium","Identity diffusion"],"answer":2,"explain":["Not quite. Identity achievement involves commitment after exploration.","Not quite. Foreclosure involves commitment without exploration.","Correct. Moratorium is exploration without commitment yet.","Not quite. Diffusion involves neither exploration nor commitment."]},{"type":"mc","section":"Thinking About Other People","prompt":"Passing the false-belief task shows that a child understands that:","choices":["People's behavior is guided by their beliefs, even when those beliefs are wrong","Objects continue to exist when they are out of sight","Other people have desires that differ from one's own","Liquids keep the same amount when poured into a new container"],"answer":0,"explain":["Correct. The task tests understanding that people act on beliefs that may not match reality.","Not quite. That is object permanence, which develops in infancy.","Not quite. Understanding differing desires comes earlier, in the desire theory of mind.","Not quite. That is conservation, a Piagetian concept unrelated to theory of mind."]},{"type":"mc","section":"Stereotyping and Prejudice","prompt":"Which approach is described as especially effective in reducing prejudice among children?","choices":["Telling children that group differences are fixed and natural","Long-term cooperative contact between groups working toward shared goals","Keeping children from different groups apart to avoid conflict","Raising children's self-esteem as high as possible"],"answer":1,"explain":["Not quite. Believing traits are fixed is linked to stronger prejudice.","Correct. Sustained, equal-status cooperation toward common goals reduces prejudice.","Not quite. Separation removes opportunities for positive contact.","Not quite. Overly high self-esteem is associated with more prejudice, not less."]},{"type":"tf","section":"Self-Concept and Self-Esteem","prompt":"Preschoolers' self-esteem tends to be unrealistically high and not yet divided into separate areas of competence.","choices":["True","False"],"answer":0,"explain":["Correct. Young children typically rate themselves very highly and do not yet distinguish separate domains.","Not quite. Preschool self-esteem is usually high and undifferentiated; separate domains emerge around age seven."]},{"type":"tf","section":"Thinking About Other People","prompt":"Most three-year-olds pass the false-belief task easily.","choices":["True","False"],"answer":1,"explain":["Not quite. Most three-year-olds predict that the character will look where the object really is.","Correct. Most children pass the false-belief task around age four, not three."]},{"type":"scenario","section":"Achievement-Related Attributions","prompt":"A teacher wants to help a student who gives up quickly after mistakes. Which feedback best supports a mastery orientation?","choices":["You are so smart, you should find this easy","Maybe this subject just is not for you","You kept working on that and tried a new strategy, and it paid off","Do not worry, you were just unlucky this time"],"answer":2,"explain":["Not quite. Praising fixed traits can encourage an entity view and helplessness when tasks get hard.","Not quite. Suggesting a lack of ability promotes learned helplessness.","Correct. Praising effort and strategy teaches that ability can grow, which fosters mastery orientation.","Not quite. Attributing outcomes to luck does not give the child a sense of control."]},{"type":"scenario","section":"Identity in Adolescence","prompt":"A seventeen-year-old says she has no idea what she wants to do, has not thought about it, and does not really care. Which identity status does she show?","choices":["Identity achievement","Identity moratorium","Identity foreclosure","Identity diffusion"],"answer":3,"explain":["Not quite. Achievement requires both exploration and commitment.","Not quite. Moratorium involves active exploration, which she is not doing.","Not quite. Foreclosure involves a firm commitment, which she lacks.","Correct. Lack of both exploration and commitment, with apathy, marks identity diffusion."]},{"type":"scenario","section":"Understanding Conflict: Social Problem Solving","prompt":"During recess, a ball accidentally hits a boy, and he immediately assumes it was thrown at him on purpose and starts a fight. Which concept best explains his reaction?","choices":["Hostile attributional bias","Identity foreclosure","Mastery orientation","Categorical self"],"answer":0,"explain":["Correct. Interpreting an ambiguous action as hostile is a hostile attributional bias, which leads to aggressive responses.","Not quite. Identity foreclosure concerns adolescent commitments, not interpreting social cues.","Not quite. Mastery orientation concerns explanations for achievement outcomes.","Not quite. The categorical self is a toddler's classification of the self by social categories."]}]},{"id":"m12","num":12,"title":"Moral Development","tagline":"How children come to know right from wrong, from early emotions and social learning to stages of moral reasoning, self-control and the development of aggression.","objectives":["Compare biological, psychoanalytic and social learning views of moral development","Describe Piaget's heteronomous and autonomous morality and Kohlberg's levels and stages of moral reasoning","Evaluate Kohlberg's theory, including Gilligan's ethic of care and the distinction among moral, social-conventional and personal domains","Explain how moral reasoning relates to moral behavior","Describe the development of self-control and delay of gratification","Identify types of aggression, family and media influences on aggression, and effective interventions"],"sections":[{"heading":"Morality as Rooted in Nature and Feelings","paragraphs":["Morality involves the ability to tell right from wrong, to act on that distinction, and to feel pride after doing right and guilt after doing wrong. Some biological and evolutionary theorists propose that humans have a built-in capacity for morality. They point to signs that even infants prefer helpful characters over hindering ones, and to brain areas involved in empathy and moral emotions. Most researchers agree that such tendencies need rich social experience and teaching to become a mature moral sense.","Sigmund Freud's psychoanalytic theory explained morality through the superego, the conscience. In his view, children form a superego around ages three to six by identifying with the same-sex parent and taking in parental standards to avoid anxiety and punishment. Guilt then motivates children to obey their conscience.","Research supports the importance of guilt but not Freud's account of how it develops. Harsh punishment and fear do not produce a strong conscience. Instead, warmth and reasoning help. Contemporary psychoanalytic thinkers emphasize that a secure, affectionate parent-child bond makes children eager to follow parental standards, and that guilt, focused on repairing harm, is a healthy moral emotion."],"example":"A five-year-old who accidentally breaks her friend's toy feels bad, says sorry, and offers one of her own toys to make up for it, showing guilt that motivates repair."},{"heading":"Morality as Learned: Social Learning","paragraphs":["Social learning theory treats moral behavior as acquired like any other behavior, through reinforcement and especially through modeling, or observational learning. Children are more likely to imitate a model who is warm and responsive, competent and powerful, and whose words match their actions. Models are especially influential in early childhood, when children are still forming internal standards.","Punishment is a common but limited way to promote moral behavior. Harsh punishment produces only short-term compliance. It models aggression, teaches children to avoid the punishing adult, and can trigger anxiety and resentment. Frequent physical punishment is linked to later aggression and other problems. Milder alternatives such as time out and withdrawal of privileges work better, especially when parents are consistent, have a warm relationship with the child, and explain the reasons.","Induction is a form of discipline in which the adult helps the child notice the effects of the misbehavior on others, for example by saying that hitting hurts and makes a friend sad. Induction encourages empathy and sympathy, gives children reasons they can later apply on their own, and is linked to stronger conscience development. Positive discipline that praises good behavior and sets clear expectations works better than relying on punishment."],"example":"When her son grabs a toy from his little sister, a mother kneels down and says, Look, she is crying now because she was playing with that; how can you help her feel better?"},{"heading":"Piaget's Theory of Moral Development","paragraphs":["Jean Piaget studied moral understanding by watching children play marble games and by asking them about stories involving wrongdoing. He described two broad stages. In heteronomous morality, roughly ages five to ten, children view rules as handed down by authorities and as fixed and unchangeable. They judge wrongness by the consequences of an act rather than by the person's intentions. They also believe in immanent justice, the idea that wrongdoing will inevitably be punished.","In autonomous morality, from about age ten onward, children see rules as flexible, socially agreed-upon principles that can be changed if people agree. They judge actions mainly by intentions. They also favor reciprocity, treating others as they would want to be treated, and punishments that fit the offense. Piaget believed that peer interaction, in which children negotiate and cooperate as equals, along with cognitive growth, drives this shift.","Later research shows that Piaget underestimated young children. When stories make intentions clear, even preschoolers take intentions into account and distinguish deliberate lies from honest mistakes. Still, his ideas laid the groundwork for Kohlberg's more detailed theory."],"example":"Asked who is naughtier, a boy who broke ten cups while helping set the table or a boy who broke one cup while sneaking cookies, a six-year-old picks the first boy because more cups broke."},{"heading":"Kohlberg's Stages of Moral Reasoning","paragraphs":["Lawrence Kohlberg extended Piaget's work by presenting children, adolescents and adults with moral dilemmas, stories that pit one moral value against another. In the best-known dilemma, a man must decide whether to steal an overpriced drug to save his dying wife. Kohlberg cared less about whether people chose to steal or not and more about the reasoning behind their answers.","Kohlberg described three levels, each with two stages. At the preconventional level, morality is controlled by external rewards and punishments. Stage 1 is punishment and obedience orientation, and Stage 2 is the instrumental purpose orientation, focused on self-interest and fair exchange. At the conventional level, people conform to social rules to maintain relationships and order. Stage 3 is the good boy-good girl orientation, seeking approval, and Stage 4 is the social-order-maintaining orientation, stressing laws and duty.","At the postconventional, or principled, level, people define morality in terms of abstract principles that apply to all situations. Stage 5 is the social contract orientation, which views laws as flexible tools that can be changed for the common good. Stage 6 is the universal ethical principle orientation, guided by self-chosen principles such as respect for human dignity. Kohlberg believed the stages form an invariant sequence, with each stage building on the one before."],"example":"Asked about the drug dilemma, a teenager says the man should not steal because laws keep society working and everyone must follow them, even in hard situations; this reflects Stage 4 reasoning."},{"heading":"Evaluating Kohlberg: Care and Domains","paragraphs":["Research supports Kohlberg's sequence: people move through the stages in order, and moral reasoning is related to cognitive growth and perspective taking. Few people, however, reach the postconventional level, and Stage 6 is so rare that its status is debated. Critics also note that Kohlberg's dilemmas are hypothetical and that real-life reasoning is less stage-consistent, and that cultures valuing interdependence may express mature reasoning in ways his scoring missed.","Carol Gilligan argued that Kohlberg's theory, originally based on interviews with males, underrates a feminine morality built on an ethic of care, which emphasizes relationships, responsibility and concern for others' needs, rather than abstract justice. Reviews of research find that males and females reason at similar stages and that both use care and justice concerns, though females may emphasize care somewhat more. Gilligan's work broadened the study of morality to include caring.","Other researchers note that children distinguish different domains of social rules. Moral imperatives protect people's rights and welfare, such as not hitting or stealing. Social conventions are customs determined by consensus, such as table manners or forms of address. Matters of personal choice, such as choosing friends or hairstyle, do not violate rights and are up to the individual. Even preschoolers judge moral violations as more serious than violations of convention."],"example":"A four-year-old says it would be fine to eat with your fingers if the teacher allowed it, but that hitting another child would still be wrong even if the teacher said it was allowed."},{"heading":"Moral Reasoning, Behavior and Self-Control","paragraphs":["Moral reasoning is only moderately related to moral behavior. More advanced reasoners are somewhat more likely to help, be honest and resist cheating, but many other factors matter. These include empathy and guilt, temperament, the situation and moral identity, the degree to which morality is central to a person's sense of self. Young people with a strong moral identity are more likely to act on their beliefs.","Self-control is the ability to inhibit urges to act in ways that violate moral standards. It begins to emerge in the second year, when toddlers show compliance, voluntarily obeying requests and commands. Self-control depends on self-awareness, memory of rules and growing effortful control. Toddlers who are more advanced in these abilities and whose parents are sensitive and supportive tend to show more self-control.","Walter Mischel studied delay of gratification, waiting for an appropriate time and place to engage in a tempting act. In classic studies, preschoolers could eat one treat now or wait for a larger reward later. Children waited longer when they used strategies such as distracting themselves, covering the treat or thinking about it in abstract rather than tempting ways. Ability to delay gratification improves with age and is linked to later competence, though trust in adults and family circumstances also affect how long children wait."],"example":"Told she can have two stickers if she waits for the teacher to return, a preschooler turns her chair away from the sticker sheet and sings a song to herself until the teacher comes back."},{"heading":"Development of Aggression","paragraphs":["Aggression appears in the second half of the first year as infants gain the ability to pursue goals and sometimes grab or push to get what they want. Researchers distinguish proactive, or instrumental, aggression, used to obtain an object, privilege or space, from reactive, or hostile, aggression, an angry, defensive response to provocation intended to hurt another person. Aggression also takes different forms: physical aggression harms through bodily injury, verbal aggression through threats, name-calling or teasing, and relational aggression by damaging peer relationships through exclusion, gossip or rumors.","Physical aggression typically declines from early childhood on, while verbal and relational forms increase as language and social understanding grow. Boys tend to show more physical aggression, while girls are more likely to use relational aggression. A small number of children show high, stable aggression that predicts later conduct problems.","Family processes play a strong role. In coercive family cycles, described by Gerald Patterson, harsh discipline and child defiance escalate, and parents sometimes give in, reinforcing aggressive behavior. Exposure to violent media also increases aggressive thoughts and behavior, especially in children who are already aggressive. Effective interventions include parent training that teaches consistent, positive discipline, and social-cognitive programs that coach children in emotion regulation, empathy and nonaggressive problem solving."],"example":"Upset that she was not invited to a party, a ten-year-old tells classmates not to sit with the host at lunch and spreads a rumor about her, an example of relational aggression."}],"terms":[{"term":"Superego","def":"In Freud's theory, the conscience, formed by taking in parental standards and enforced through guilt."},{"term":"Induction","def":"Discipline in which an adult helps a child notice the effects of misbehavior on others."},{"term":"Modeling","def":"Learning behavior by observing and imitating others, a key mechanism in social learning theory."},{"term":"Heteronomous morality","def":"Piaget's first stage, in which rules are seen as fixed and handed down by authorities and wrongness is judged by consequences."},{"term":"Autonomous morality","def":"Piaget's later stage, in which rules are seen as flexible agreements and actions are judged by intentions."},{"term":"Immanent justice","def":"The belief that wrongdoing will inevitably be punished."},{"term":"Moral dilemma","def":"A story or situation in which two moral values conflict, used by Kohlberg to study moral reasoning."},{"term":"Preconventional level","def":"Kohlberg's first level, in which morality is controlled by external rewards, punishments and self-interest."},{"term":"Conventional level","def":"Kohlberg's middle level, in which people conform to social rules to win approval and maintain social order."},{"term":"Postconventional level","def":"Kohlberg's highest level, in which morality is defined by abstract principles that apply to all situations."},{"term":"Ethic of care","def":"Gilligan's view of morality based on relationships, responsibility and concern for the needs of others."},{"term":"Social conventions","def":"Customs determined by social agreement, such as table manners, which differ from moral rules that protect rights and welfare."},{"term":"Delay of gratification","def":"Waiting for an appropriate time and place to engage in a tempting act or to receive a desired reward."},{"term":"Relational aggression","def":"Aggression that harms others by damaging their peer relationships, such as through exclusion, gossip or rumors."}],"questions":[{"type":"mc","section":"Morality as Learned: Social Learning","prompt":"Which is a well-documented drawback of harsh punishment?","choices":["It produces strong, lasting internal moral standards","It models aggressive behavior for the child","It always increases warmth between parent and child","It teaches the child to notice how others feel"],"answer":1,"explain":["Not quite. Harsh punishment produces only short-term compliance, not lasting internal standards.","Correct. Harsh punishment provides a model of aggression that children may imitate.","Not quite. It tends to make children avoid the punishing adult rather than feel closer.","Not quite. Helping children notice others' feelings is the goal of induction, not harsh punishment."]},{"type":"mc","section":"Piaget's Theory of Moral Development","prompt":"A child in Piaget's heteronomous stage would most likely:","choices":["Judge an act mainly by the person's intentions","See game rules as flexible agreements that players can change","Judge an act mainly by the amount of damage it caused","Favor punishments that fit the offense through reciprocity"],"answer":2,"explain":["Not quite. Focusing on intentions is typical of autonomous morality.","Not quite. Seeing rules as changeable agreements marks autonomous morality.","Correct. Heteronomous children judge wrongness by consequences, such as how much damage occurred.","Not quite. Reciprocity and fitting punishments are features of autonomous morality."]},{"type":"mc","section":"Kohlberg's Stages of Moral Reasoning","prompt":"In Kohlberg's research, what mattered most when scoring a person's response to a moral dilemma?","choices":["Whether the person said the character should obey the law","How quickly the person answered","Whether the person agreed with the majority","The reasoning the person used to justify the answer"],"answer":3,"explain":["Not quite. Kohlberg focused on reasoning, not on which choice was made.","Not quite. Speed of response was not part of his stage scoring.","Not quite. Agreement with others did not determine the stage.","Correct. Kohlberg classified stages by the reasoning behind the answer, not the answer itself."]},{"type":"mc","section":"Kohlberg's Stages of Moral Reasoning","prompt":"Which level of Kohlberg's theory is defined by abstract principles that apply to all situations?","choices":["Postconventional","Conventional","Preconventional","Heteronomous"],"answer":0,"explain":["Correct. At the postconventional level, morality rests on abstract, universal principles.","Not quite. The conventional level focuses on conforming to social rules and order.","Not quite. The preconventional level is controlled by rewards, punishments and self-interest.","Not quite. Heteronomous morality is Piaget's term, not one of Kohlberg's levels."]},{"type":"mc","section":"Evaluating Kohlberg: Care and Domains","prompt":"What was Carol Gilligan's main criticism of Kohlberg's theory?","choices":["It placed too much weight on caring relationships","It underrated an ethic of care focused on relationships and responsibility","It ignored the role of punishment in moral learning","It claimed that stages could be skipped"],"answer":1,"explain":["Not quite. Gilligan argued the opposite: that care was undervalued.","Correct. Gilligan argued that Kohlberg's justice-based scoring underrated a morality of care.","Not quite. This was not Gilligan's focus.","Not quite. Kohlberg proposed an invariant sequence; skipping stages was not Gilligan's point."]},{"type":"mc","section":"Moral Reasoning, Behavior and Self-Control","prompt":"Which strategy helped preschoolers wait longer in delay-of-gratification studies?","choices":["Staring closely at the treat","Thinking about how delicious the treat tastes","Distracting themselves or covering the treat","Holding the treat in their hands"],"answer":2,"explain":["Not quite. Focusing attention on the reward makes waiting harder.","Not quite. Thinking about tempting qualities shortens the delay.","Correct. Distraction and covering the treat reduce temptation and help children wait.","Not quite. Keeping the reward close at hand increases temptation."]},{"type":"mc","section":"Development of Aggression","prompt":"In Patterson's account of coercive family cycles, aggressive behavior is maintained mainly because:","choices":["Parents use induction consistently","Children watch educational television","Parents give in after escalating conflict, reinforcing the child's aggression","Children are given too many chances to cooperate with peers"],"answer":2,"explain":["Not quite. Induction supports conscience development and is not part of coercive cycles.","Not quite. Educational television is not part of this family process.","Correct. When parents give in after angry exchanges, the child's aggression is reinforced and the cycle continues.","Not quite. Cooperative peer experiences are not described as a cause of coercive cycles."]},{"type":"tf","section":"Evaluating Kohlberg: Care and Domains","prompt":"Even preschoolers judge moral violations, such as hitting, as more serious than violations of social conventions, such as table manners.","choices":["True","False"],"answer":0,"explain":["Correct. Young children already distinguish moral rules from social conventions and treat moral violations as more serious.","Not quite. Research shows preschoolers do make this distinction."]},{"type":"tf","section":"Moral Reasoning, Behavior and Self-Control","prompt":"Moral reasoning strongly and fully determines moral behavior, so knowing someone's Kohlberg stage predicts exactly how they will act.","choices":["True","False"],"answer":1,"explain":["Not quite. The link between reasoning and behavior is only moderate.","Correct. Reasoning is only moderately related to behavior; emotions, temperament, situations and moral identity also matter."]},{"type":"scenario","section":"Kohlberg's Stages of Moral Reasoning","prompt":"Asked whether the man should steal the drug, a ten-year-old says he should, because if he does not his family will think he is a bad husband. Which stage does this reasoning reflect?","choices":["Stage 1: punishment and obedience","Stage 5: social contract","Stage 4: social-order-maintaining","Stage 3: good boy-good girl"],"answer":3,"explain":["Not quite. Stage 1 focuses on avoiding punishment, not on winning others' approval.","Not quite. Stage 5 reasoning appeals to flexible laws and the common good.","Not quite. Stage 4 stresses laws and duty to society, not family approval.","Correct. Concern with being seen as a good person by others reflects Stage 3."]},{"type":"scenario","section":"Morality as Learned: Social Learning","prompt":"A father sees his daughter push a classmate. He says, When you push, Sam gets hurt and feels scared; he might not want to play with you. Which discipline technique is he using?","choices":["Time out","Induction","Withdrawal of privileges","Physical punishment"],"answer":1,"explain":["Not quite. Time out removes the child from the situation; the father is explaining effects instead.","Correct. Pointing out the effects of the behavior on another person is induction.","Not quite. He has not taken away any privilege.","Not quite. He uses words and reasoning, not physical punishment."]},{"type":"scenario","section":"Development of Aggression","prompt":"A four-year-old shoves another child off a swing so that he can use it himself. He is not angry; he just wants a turn. Which type of aggression is this?","choices":["Reactive aggression","Relational aggression","Verbal aggression","Proactive aggression"],"answer":3,"explain":["Not quite. Reactive aggression is an angry response to provocation.","Not quite. Relational aggression damages peer relationships through exclusion or rumors.","Not quite. Shoving is physical, not verbal.","Correct. Aggression used to obtain an object or space, without hostile intent, is proactive or instrumental aggression."]}]},{"id":"m13","num":13,"title":"Development of Sex Differences and Gender Roles","tagline":"How children learn gender stereotypes, come to see themselves as boys or girls, and how biology and environment shape the real (and often small) differences between the sexes.","objectives":["Describe how gender stereotyping develops from the preschool years through adolescence","Evaluate biological influences on gender typing, including prenatal hormones and evolutionary explanations","Explain how parents, teachers, peers and media encourage gender-typed behavior","Compare cognitive-developmental theory, gender schema theory and the concept of androgyny as accounts of gender identity","Summarize research on sex differences in mental abilities and personality while recognizing the large overlap between groups","Identify practical ways adults can reduce gender stereotyping in children"],"sections":[{"heading":"Gender Stereotypes and Gender Roles","paragraphs":["Gender stereotypes are widely held beliefs about the characteristics thought to be typical of males and females. Gender roles are the behaviors a culture expects of each sex, such as who cares for infants or who repairs the car. Gender typing is the broader process by which children come to associate objects, activities, roles and traits with one sex or the other in line with cultural expectations.","Across many cultures, stereotypes follow two clusters. Instrumental traits, such as being assertive, competitive and independent, are linked with men. Expressive traits, such as being warm, caring and sensitive to others, are linked with women. These clusters have softened in some societies as women entered the workforce in large numbers, but they remain surprisingly stable, and they shape how adults treat children from birth.","Researchers separate several parts of gender development. Gender stereotyping is what a child believes about the sexes. Gender-role adoption is what the child actually does, such as which toys and playmates the child chooses. Gender identity is the child's own sense of being masculine or feminine. These parts are related but do not always line up neatly in the same child."],"example":"A four-year-old who announces that only boys can be doctors is showing gender stereotyping, while the same child choosing to play with dolls rather than trucks reflects gender-role adoption."},{"heading":"Development of Gender Stereotyping","paragraphs":["Gender-typed preferences appear remarkably early. By the second year, many toddlers look longer at and play more with toys stereotyped for their own sex, and by about age 2 to 3 they begin to label their own and others' sex. During the preschool years children rapidly learn which toys, clothing, tools, household jobs and occupations go with each sex, starting with concrete items and later moving to personality traits and achievement areas.","Preschoolers' stereotypes are often rigid. Many young children treat gender stereotypes as moral rules rather than social conventions, so a boy wearing nail polish may seem simply wrong to them. This rigidity reflects their limited cognitive skills: they cannot yet easily hold in mind that a person can be male and still like activities linked with females.","During middle childhood, children's knowledge of stereotypes keeps expanding, but their thinking becomes more flexible. As they gain the ability to classify along several dimensions at once, they come to see that a person's sex does not decide all of his or her interests and skills. In adolescence, flexibility may temporarily decrease for some young people as pressure to conform to gender roles rises, a pattern called gender intensification."],"example":"A six-year-old insists that a classmate's father cannot be a nurse, but by age nine the same child agrees that men can be nurses even though most nurses the child knows are women."},{"heading":"Biological Influences on Gender Typing","paragraphs":["Evolutionary theorists argue that some gender-typed tendencies are adaptive. Because males and females faced somewhat different reproductive challenges across human history, natural selection may have favored greater competitiveness and physical risk-taking in males and greater investment in caregiving in females. Critics respond that these explanations are hard to test and that culture strongly shapes how any such tendencies are expressed.","Cross-cultural research shows that most societies encourage instrumental traits in boys and expressive traits in girls, but there is wide variation. In cultures where boys regularly care for younger siblings, boys tend to be more nurturing, which suggests that roles and experiences, not biology alone, matter.","Prenatal hormones offer clearer evidence of biological influence. Androgens, the male sex hormones, influence brain development before birth. Girls with congenital adrenal hyperplasia (CAH), a genetic condition that exposes the fetus to unusually high levels of androgens, tend to prefer vehicles and building toys and more active play, and often choose boys as playmates, even when parents encourage typical girls' activities. Such findings suggest that early hormones contribute to play preferences, though environment still shapes how these preferences develop."],"example":"A girl with CAH may gravitate toward toy trucks and rough outdoor games despite receiving mostly dolls and tea sets as gifts."},{"heading":"Environmental Influences: Parents, Teachers, Peers and Media","paragraphs":["Parents begin gender typing in infancy, through the clothing, room decor and toys they choose. With preschoolers, many parents encourage boys toward independence and active play and encourage girls toward dependence and closeness. Parents also talk differently: they often use more emotion words with daughters and more explanation and instruction with sons. Fathers, on average, insist more strongly than mothers on gender-typed behavior, especially for sons.","Teachers can reinforce gender roles too. Preschool teachers may praise girls for compliance and give boys more attention, both positive and negative. In classrooms, teachers sometimes call on boys more in math and science and use gender as a way to sort children, such as lining up by boys and girls, which makes gender categories more salient.","Peers are powerful agents. By age 3, children prefer same-sex playmates, a pattern called gender segregation that strengthens through middle childhood. Within these groups, children reward gender-typed play and criticize cross-gender play, especially in boys. Boys' groups often emphasize dominance and rough play, while girls' groups emphasize cooperation and talk. Media such as television, films, games and advertising also present stereotyped portrayals, and heavy viewers tend to hold more stereotyped beliefs."],"example":"When a five-year-old boy picks up a doll at preschool, a group of boys laughs at him, and he quickly puts it down and returns to the block corner."},{"heading":"Gender Identity: Theories and Androgyny","paragraphs":["Gender identity is a person's perception of himself or herself as relatively masculine or feminine in characteristics. Researchers have measured it using self-ratings of instrumental and expressive traits. People who score high on both are described as androgynous, meaning they combine masculine and feminine traits. Androgyny is linked to good adjustment, but research suggests the masculine, instrumental traits account for much of the benefit for self-esteem, likely because Western society values them highly.","Kohlberg's cognitive-developmental theory proposes that children must first understand gender constancy before they adopt gender-typed behavior. Gender constancy develops in three steps: gender labeling (correctly naming one's own and others' sex), gender stability (understanding that sex stays the same over time) and gender consistency (understanding that sex does not change with clothing, hairstyle or activities). Full constancy is usually reached between ages 3 and 7. However, children show gender-typed preferences long before they achieve constancy, which challenges the theory's claim about cause and effect.","Gender schema theory is an information-processing approach that combines social learning and cognitive ideas. Children build gender schemas, organized mental categories about what each sex is like, and use them to interpret their world. Once a child labels an activity as for boys or for girls, the child approaches or avoids it accordingly, notices schema-consistent information, and may distort or forget information that does not fit. Children differ in how strongly they apply gender schemas to themselves."],"example":"A girl who believes that dolls are for girls and that she is a girl explores a new doll eagerly but ignores an unfamiliar toy labeled as a boys' toy, without trying it at all."},{"heading":"Sex Differences in Abilities and Personality","paragraphs":["Research comparing males and females finds some average differences, but they are usually small, and the distributions of the two sexes overlap a great deal. This means knowing a child's sex tells you little about that individual child's abilities. Many supposed differences, such as in general intelligence, do not exist at all.","Girls tend to show an early advantage in verbal skills, including reading and writing achievement, and boys are more often diagnosed with reading difficulties. Boys tend to do better on some spatial tasks, especially mental rotation, the ability to imagine an object turning in space. In mathematics, average differences are small and have shrunk over time in many countries, though boys are somewhat overrepresented among the highest scorers on some tests. Expectations, encouragement and course-taking influence these patterns.","In personality, girls on average are more emotionally sensitive and expressive, and adolescent girls report more depression than boys. Boys show more physical aggression from early childhood, a difference found across many cultures and linked partly to biology and partly to adults' greater tolerance of boys' aggression. Girls are not less aggressive overall: they often use relational aggression, harming others by damaging friendships or reputations."],"example":"In a class of ten-year-olds, the best mental-rotation score belongs to a girl and the best spelling score belongs to a boy, showing how much the two groups overlap."},{"heading":"Reducing Gender Stereotyping","paragraphs":["Because stereotyped beliefs can limit children's interests and career choices, many researchers and educators favor efforts to reduce them. Adults can begin early by offering children a wide range of toys and activities, avoiding gender-based praise, and pointing out exceptions to stereotypes, such as female engineers and male caregivers.","Adults can also model nonstereotyped behavior, such as fathers cooking and mothers repairing things, and avoid using gender to divide children in everyday routines. Talking with children about stereotypes, and explaining that interests and abilities are not decided by sex, helps older children reason more flexibly. Encouraging mixed-sex activities with shared goals can reduce gender segregation and help boys and girls learn from each other's play styles."],"example":"A teacher who says 'Let's line up by birthday month' instead of 'boys here, girls there' quietly reduces the attention children pay to gender categories."}],"terms":[{"term":"Gender stereotypes","def":"Widely held beliefs about the characteristics considered typical of males and females."},{"term":"Gender roles","def":"The behaviors and activities a culture regards as appropriate for each sex."},{"term":"Gender typing","def":"The process by which children come to associate objects, activities, roles and traits with one sex in line with cultural stereotypes."},{"term":"Instrumental traits","def":"Traits stereotyped as masculine that reflect competence, assertiveness and independence."},{"term":"Expressive traits","def":"Traits stereotyped as feminine that reflect warmth, caring and sensitivity to others."},{"term":"Congenital adrenal hyperplasia (CAH)","def":"A genetic condition in which the adrenal glands produce unusually high levels of androgens before birth, often linked to more male-typical play in girls."},{"term":"Gender segregation","def":"Children's tendency to prefer and play with same-sex peers, which appears in the preschool years and strengthens in middle childhood."},{"term":"Gender identity","def":"A person's perception of himself or herself as relatively masculine or feminine in characteristics."},{"term":"Androgyny","def":"A gender identity in which a person scores high on both masculine (instrumental) and feminine (expressive) traits."},{"term":"Gender constancy","def":"The understanding that one's sex is a permanent biological fact that does not change with clothing, hairstyle or activities; it develops through labeling, stability and consistency."},{"term":"Gender schema theory","def":"An information-processing view that children organize gender-related experiences into mental categories that guide what they notice, approach and remember."},{"term":"Gender intensification","def":"An increase in gender-stereotyped attitudes and behavior in early adolescence, often linked to pressure to conform."},{"term":"Mental rotation","def":"The ability to imagine an object turning in space, a spatial skill on which males tend to score somewhat higher on average."},{"term":"Relational aggression","def":"Harming others by damaging their peer relationships, for example through exclusion or spreading rumors."}],"questions":[{"type":"mc","section":"Gender Stereotypes and Gender Roles","prompt":"Which set of traits is stereotypically associated with females across many cultures?","choices":["Expressive traits such as warmth and sensitivity","Instrumental traits such as assertiveness and independence","Spatial traits such as mental rotation skill","Dominance traits such as competitiveness"],"answer":0,"explain":["Correct. Expressive traits, such as being warm and caring, form the cluster stereotypically linked with women.","Not quite. Instrumental traits are the cluster stereotypically linked with men.","Not quite. Mental rotation is an ability, not a stereotyped personality cluster, and it is linked with males on average.","Not quite. Competitiveness and dominance are part of the instrumental cluster associated with men."]},{"type":"mc","section":"Development of Gender Stereotyping","prompt":"Why are preschoolers' gender stereotypes often so rigid?","choices":["Preschoolers have no exposure to people who break stereotypes","Their limited cognitive skills make it hard to see that a person's sex need not determine interests","Their gender constancy is already complete, so they apply it strictly","Parents explicitly teach them that stereotypes are moral rules"],"answer":1,"explain":["Not quite. Most preschoolers do see exceptions, but they tend to treat them as wrong rather than revising their beliefs.","Correct. Young children struggle to classify along more than one dimension, so they treat stereotypes as firm rules.","Not quite. Full gender constancy is often not reached until about age 7, and rigidity is not explained by completed constancy.","Not quite. Children often treat stereotypes as moral rules on their own, not mainly because parents teach that view."]},{"type":"mc","section":"Biological Influences on Gender Typing","prompt":"Research on girls with congenital adrenal hyperplasia (CAH) is used mainly to show that","choices":["parents treat girls with CAH more like boys","evolutionary theories of gender are untestable","prenatal androgen exposure contributes to gender-typed play preferences","gender identity is fixed at birth and unaffected by experience"],"answer":2,"explain":["Not quite. Girls with CAH often prefer male-typical play even when parents encourage typical girls' activities.","Not quite. CAH research concerns hormones, not the testability of evolutionary theories.","Correct. Girls exposed to high prenatal androgens tend to prefer vehicles, building toys and active play, suggesting a hormonal contribution.","Not quite. The findings point to a biological contribution, but environment still shapes how preferences develop."]},{"type":"mc","section":"Environmental Influences: Parents, Teachers, Peers and Media","prompt":"Which statement about parents' role in gender typing is most accurate?","choices":["Mothers insist more strongly than fathers on gender-typed behavior","Parents treat sons and daughters identically until school entry","Parents mainly influence gender typing through media choices","Fathers tend to be more insistent than mothers about gender-typed behavior, especially in sons"],"answer":3,"explain":["Not quite. On average, fathers are the more insistent parent.","Not quite. Gender-typed treatment begins in infancy, with clothing, toys and room decor.","Not quite. Parents influence gender typing directly through encouragement, toys and the way they talk to children.","Correct. Fathers, on average, place more pressure on children, especially boys, to behave in gender-typed ways."]},{"type":"mc","section":"Gender Identity: Theories and Androgyny","prompt":"What is the correct order of the steps in Kohlberg's account of gender constancy?","choices":["Gender stability, gender labeling, gender consistency","Gender labeling, gender stability, gender consistency","Gender consistency, gender labeling, gender stability","Gender labeling, gender consistency, gender stability"],"answer":1,"explain":["Not quite. Children must be able to label sex before understanding that it is stable.","Correct. Children first label sex, then understand it stays the same over time, then understand it does not change with appearance.","Not quite. Consistency across superficial changes is the last and most advanced step.","Not quite. Stability over time comes before consistency across changes in appearance."]},{"type":"mc","section":"Gender Identity: Theories and Androgyny","prompt":"Which finding is the main challenge to Kohlberg's cognitive-developmental theory of gender?","choices":["Children show gender-typed preferences before they achieve gender constancy","Androgynous people tend to be well adjusted","Boys show more physical aggression than girls","Gender segregation appears around age 3"],"answer":0,"explain":["Correct. The theory says constancy causes gender-typed behavior, yet toddlers show gender-typed preferences years earlier.","Not quite. This finding concerns androgyny and adjustment, not the timing claim at the heart of Kohlberg's theory.","Not quite. Sex differences in aggression do not test the theory's cause-and-effect claim.","Not quite. Segregation is a peer phenomenon and is not the main critique of the theory."]},{"type":"mc","section":"Sex Differences in Abilities and Personality","prompt":"Which conclusion best summarizes research on sex differences in mental abilities?","choices":["Boys are more intelligent overall than girls","Girls outperform boys on every academic measure","Average differences are usually small and the two distributions overlap greatly","Sex differences in math have grown larger over recent decades"],"answer":2,"explain":["Not quite. There is no sex difference in general intelligence.","Not quite. Girls tend to lead in verbal skills, but boys do somewhat better on some spatial tasks.","Correct. Most differences are small averages, so a child's sex says little about that individual's abilities.","Not quite. In many countries the average gap in math has shrunk over time."]},{"type":"tf","section":"Sex Differences in Abilities and Personality","prompt":"Research suggests girls are less aggressive than boys in every form, including harming others' friendships and reputations.","choices":["True","False"],"answer":1,"explain":["Not quite. Boys show more physical aggression, but girls often use relational aggression, harming others through their relationships.","Correct. Girls frequently use relational aggression, so they are not less aggressive in every form."]},{"type":"tf","section":"Development of Gender Stereotyping","prompt":"Children's thinking about gender stereotypes generally becomes more flexible during middle childhood, even as their knowledge of stereotypes keeps growing.","choices":["True","False"],"answer":0,"explain":["Correct. School-age children know more stereotypes but increasingly accept that people can depart from them.","Not quite. Flexibility increases in middle childhood, although it may dip again for some adolescents."]},{"type":"scenario","section":"Gender Identity: Theories and Androgyny","prompt":"Shown an unfamiliar gadget, six-year-old Leo is told, 'This is a toy for girls.' He loses interest immediately. Later he cannot remember what the gadget looked like. Which theory best explains his behavior?","choices":["Evolutionary theory","Gender schema theory","The CAH hormone account","Androgyny"],"answer":1,"explain":["Not quite. Evolutionary theory addresses adaptive tendencies, not how labels guide attention and memory.","Correct. Leo uses a gender schema: the 'for girls' label leads him to avoid the toy and attend poorly to it, so he remembers little.","Not quite. Prenatal hormone research cannot explain why a verbal label instantly changed his interest and memory.","Not quite. Androgyny describes a combination of masculine and feminine traits, not this processing of information."]},{"type":"scenario","section":"Gender Identity: Theories and Androgyny","prompt":"Four-year-old Maya knows she is a girl and that she will grow up to be a woman. But when shown a picture of a girl given short hair and a boy's outfit, she says the child is now a boy. Which step of gender constancy has Maya NOT yet reached?","choices":["Gender labeling","Gender stability","Gender intensification","Gender consistency"],"answer":3,"explain":["Not quite. Maya can correctly label her own sex, so she has reached labeling.","Not quite. Maya knows she will become a woman, which shows stability over time.","Not quite. Gender intensification is an adolescent pattern, not a step of constancy.","Correct. Maya does not yet understand that sex stays the same despite changes in hair or clothing."]},{"type":"scenario","section":"Reducing Gender Stereotyping","prompt":"A kindergarten teacher wants to reduce gender stereotyping in the class. Which practice is most likely to help?","choices":["Dividing the class into boys' and girls' teams for most activities","Praising girls mainly for neatness and boys mainly for strength","Organizing mixed-sex projects with shared goals and pointing out counter-stereotypical role models","Avoiding any discussion of gender so children never think about it"],"answer":2,"explain":["Not quite. Sorting by gender makes gender categories more salient and can increase stereotyping.","Not quite. Gender-based praise reinforces stereotypes.","Correct. Shared mixed-sex activities reduce segregation, and counter-stereotypical examples broaden children's ideas.","Not quite. Discussing stereotypes and exceptions helps children reason more flexibly; silence leaves existing stereotypes unchallenged."]}]},{"id":"m14","num":14,"title":"The Family","tagline":"How the family works as a system, how parenting styles shape children, and how family structure, work, child care and maltreatment affect development.","objectives":["Explain the family as a social system with direct and indirect influences, set within a wider ecological context","Distinguish Baumrind's four child-rearing styles and describe the outcomes associated with each","Describe how culture and socioeconomic status shape parenting","Evaluate research on diverse family lifestyles, including siblings, only children, adoption, gay and lesbian families and never-married parents","Analyze how divorce, blended families, maternal employment, child care and self-care affect children","Identify the forms, causes, consequences and prevention of child maltreatment"],"sections":[{"heading":"The Family as a Social System","paragraphs":["Family systems theory views the family as a complex network of interdependent relationships. Each member affects every other member, and the system keeps changing as children grow and as parents age. Influence runs in both directions: parents shape children, but children's temperaments and behavior also shape how parents respond, a pattern called bidirectional influence.","Some influences are direct, as when a parent praises a child for sharing. Others are indirect, flowing through a third party. For example, a warm, supportive marriage tends to help parents be patient and consistent, which benefits children, while marital conflict can spill over into harsh parenting. These third-party effects can support or undermine development.","Following Bronfenbrenner's ecological systems theory, the family is also embedded in larger settings. Neighborhoods, extended family, workplaces, schools and community services all affect how families function. Families with strong social ties to friends, relatives and community organizations tend to cope better with stress, and those links benefit children's well-being."],"example":"When a father loses his job, the stress may make him more irritable with his partner, and the resulting tension at home makes both parents less patient with their children."},{"heading":"Child-Rearing Styles","paragraphs":["Diana Baumrind identified child-rearing styles by observing parents along key dimensions: acceptance and involvement, control, and autonomy granting. Later researchers organized these into four styles. The authoritative style combines high acceptance and involvement, firm but reasonable control, and gradual, appropriate autonomy granting. Authoritative parents explain rules and listen to children's views. This style is consistently linked to the best outcomes: competence, self-control, good school performance, high self-esteem and social maturity.","The authoritarian style is low in acceptance and high in coercive control, with little autonomy granting. These parents value obedience and may use force and punishment, often without explanation. Their children tend to be anxious, withdrawn or, especially boys, angry and defiant. The permissive style is warm and accepting but makes few demands and exercises little control, and its children are often impulsive, disobedient and low in self-control and achievement.","The uninvolved style combines low acceptance and involvement with little control and indifference to autonomy. At its extreme it becomes neglect, a form of maltreatment, and it is associated with the poorest outcomes across many domains. Researchers also distinguish behavioral control, which sets limits on behavior, from psychological control, which intrudes on children's thoughts and feelings through tactics such as guilt induction, withdrawing love and belittling. Psychological control is linked to anxiety, depression and behavior problems."],"example":"When her son misses curfew, an authoritative mother calmly explains why the rule matters, listens to his reasons and sets a fair consequence, rather than yelling or ignoring it."},{"heading":"Cultural and Socioeconomic Variations","paragraphs":["The authoritative style is broadly beneficial across cultures, but the meaning of parenting practices varies. In many Chinese, other Asian and some Caribbean and Hispanic communities, parents may use high control that looks authoritarian, yet they combine it with warmth and see it as a sign of care and involvement. In such contexts, firm control is less harmful than when it occurs with coldness.","Socioeconomic status (SES), which reflects education, income and occupational prestige, is also linked to parenting. Higher-SES parents tend to talk more with children, emphasize curiosity and self-direction, and use more explanation and praise. Lower-SES parents more often stress obedience and use commands and physical punishment. These differences partly reflect job demands and the values parents expect children to need as adults.","Poverty adds chronic stress, crowded and unstable housing, and fewer resources. These pressures can disrupt family functioning and lead to harsher, les
