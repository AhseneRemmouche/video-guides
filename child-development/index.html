ronment.","Correct. Strongly canalized behaviors develop similarly across a wide range of environments."]},{"type":"tf","section":"Teratogens and Maternal Factors","prompt":"Exposure to a teratogen during the embryonic period is more likely to cause serious structural defects than exposure late in the fetal period.","choices":["True","False"],"answer":0,"explain":["Correct. The embryonic period is when body structures form, so it is the most sensitive time for serious structural damage.","Not quite. The statement is accurate; later exposure more often affects growth and organ function than basic structure."]},{"type":"tf","section":"Heredity, Environment, and Behavior","prompt":"A heritability estimate tells us how much of a particular individual's intelligence is due to genes.","choices":["True","False"],"answer":1,"explain":["Not quite. Heritability estimates describe differences within a population, not the makeup of one person's trait.","Correct. Heritability applies only to the population studied and cannot be applied to a single individual."]},{"type":"scenario","section":"Patterns of Genetic Inheritance","prompt":"Two parents who are both carriers of the recessive allele for phenylketonuria (PKU) ask a counselor about the chance that their next child will have the disorder. What should the counselor say?","choices":["There is no chance, because neither parent has PKU","About a 1 in 4 chance with each pregnancy","About a 1 in 2 chance, but only for sons","The child will certainly have PKU"],"answer":1,"explain":["Not quite. Carriers do not show the trait but can each pass on the recessive allele.","Correct. When both parents are carriers, each child has about a 1 in 4 chance of inheriting two recessive alleles.","Not quite. PKU is autosomal, not X-linked, so the risk is the same for sons and daughters.","Not quite. Each child could receive a dominant allele from at least one parent and not have the disorder."]},{"type":"scenario","section":"Teratogens and Maternal Factors","prompt":"A woman planning a pregnancy asks her doctor what she can do before conception to lower the risk of neural tube defects. What is the best advice?","choices":["Take folic acid around the time of conception","Avoid all physical exercise","Begin a very low-calorie diet","Have an amniocentesis before conceiving"],"answer":0,"explain":["Correct. Folic acid taken around conception reduces the risk of neural tube defects.","Not quite. Moderate exercise is generally healthy and is not linked to neural tube defects.","Not quite. Restricting calories can harm prenatal development; good nutrition is recommended.","Not quite. Amniocentesis is a prenatal diagnostic test done during pregnancy; it does not prevent defects."]},{"type":"scenario","section":"Heredity, Environment, and Behavior","prompt":"A sociable 15-year-old chooses to join the debate club and the drama group, settings where outgoing behavior is rewarded. Which concept does this illustrate?","choices":["Passive gene-environment correlation","Genomic imprinting","Active gene-environment correlation (niche-picking)","Canalization"],"answer":2,"explain":["Not quite. Passive correlation involves environments provided by parents, not chosen by the child.","Not quite. Genomic imprinting concerns which parent's allele is activated, not environment choice.","Correct. Older children actively seek out environments that fit their genetic tendencies.","Not quite. Canalization describes heredity limiting outcomes, not choosing environments."]}]},{"id":"m04","num":4,"title":"Infancy: Early Learning, Motor Skills, and Perceptual Capacities","tagline":"How newborns arrive equipped with reflexes, states and senses, and how they quickly learn, move and perceive their world in the first two years.","objectives":["Describe major newborn reflexes, states of arousal and methods of neonatal assessment","Explain how infants learn through classical conditioning, operant conditioning, habituation and imitation","Summarize the sequence and principles of motor development and the dynamic systems view","Describe infants' capacities in touch, taste, smell, hearing and vision, including depth and face perception","Explain intermodal perception and Eleanor Gibson's differentiation theory","Evaluate evidence on the effects of early deprivation and early enrichment"],"sections":[{"heading":"The Newborn's Reflexes and Assessment","paragraphs":["A reflex is an inborn, automatic response to a particular kind of stimulation. Newborns show many of them. The rooting reflex turns the head toward a touch on the cheek, and the sucking reflex is triggered by an object in the mouth; both help with feeding. The palmar grasp makes the baby close a hand around a finger. The Moro, or embracing, reflex appears when the baby hears a loud sound or feels a sudden loss of support: the arms fling outward and then come together.","Other reflexes include the stepping reflex, in which a baby held upright with feet touching a surface makes walking movements, the tonic neck reflex, a fencing-like posture when the head is turned to one side, and the Babinski reflex, in which the toes fan out when the sole is stroked. Some reflexes have survival value, some help build relationships with caregivers, and some form the basis for later voluntary skills. Most disappear during the first six months as the cerebral cortex matures, so doctors check them to judge the health of the nervous system.","Two tools are widely used to assess newborns. The Apgar Scale rates appearance (color), pulse, grimace (reflex irritability), activity (muscle tone) and respiration at one and five minutes after birth, each on a 0 to 2 scale. A total of 7 or more indicates good physical condition. The Neonatal Behavioral Assessment Scale (NBAS), developed by T. Berry Brazelton, takes a broader look at reflexes, muscle tone, state changes and responsiveness to people and objects."],"example":"When a nurse strokes a newborn's cheek and the baby turns toward the touch with an open mouth, she is observing the rooting reflex, a sign that feeding responses are working."},{"heading":"States of Arousal: Sleep, Crying, and SIDS","paragraphs":["States of arousal are different degrees of sleep and wakefulness. Researchers usually describe regular (non-REM) sleep, irregular (REM) sleep, drowsiness, quiet alertness, and waking activity with crying. Newborns sleep most of the day, often 16 to 18 hours, in short cycles. About half of a newborn's sleep is REM sleep, a much larger share than in older children and adults. One explanation, called autostimulation theory, is that REM sleep supplies stimulation that the young brain needs to develop.","Crying is the newborn's first way of communicating needs such as hunger, pain or overstimulation. Parents gradually learn to tell different cries apart. Effective soothing methods include lifting the baby to the shoulder and rocking or walking, swaddling, offering a pacifier, gentle rhythmic sounds, and skin-to-skin contact (often called kangaroo care). Responding promptly and warmly in the early months does not spoil babies; it tends to be linked with less crying later.","Sudden infant death syndrome (SIDS) is the unexpected death, usually during the night, of an infant under one year that remains unexplained after investigation. It is most common between about two and four months of age. Risk factors include sleeping on the stomach, soft bedding, overheating, and exposure to cigarette smoke. Public health campaigns urging parents to place babies on their backs to sleep, on a firm surface without loose bedding, have greatly reduced SIDS rates."],"example":"A father notices that his two-week-old calms fastest when he holds her upright against his shoulder and walks slowly around the room, combining physical contact, upright posture and gentle motion."},{"heading":"Early Learning Capacities","paragraphs":["Learning means changes in behavior as a result of experience. In classical conditioning, a neutral stimulus is paired with a stimulus that already produces a reflexive response. After repeated pairings, the neutral stimulus alone produces a similar response. For example, if stroking a baby's forehead is regularly followed by a sweet taste, the baby may begin sucking as soon as the forehead is stroked. Classical conditioning helps infants learn which events go together in daily routines.","In operant conditioning, infants act on the environment, and the consequences change how often the behavior occurs. A reinforcer increases a response; a punishment decreases it. Researchers have shown that babies will suck faster to hear their mother's voice or see interesting pictures, and that young infants will kick to make a mobile move. Operant methods also reveal infant memory, because babies who are reminded of the setting can remember the kicking response for days or weeks.","Habituation is a gradual decline in attention to a stimulus that is presented repeatedly. When a new stimulus appears and attention returns, this is called recovery. The habituation-recovery pattern lets researchers ask what infants can tell apart: if a baby recovers to a new face or sound, the baby must perceive it as different. Imitation, copying another person's behavior, is a further form of learning. Andrew Meltzoff and colleagues reported that newborns can imitate facial expressions such as tongue protrusion, though some researchers argue this early response is more limited than first claimed. Imitation clearly becomes stronger over the first year."],"example":"A 3-month-old whose ankle is tied to a mobile with a ribbon soon learns to kick vigorously to make it move, a classic demonstration of operant conditioning."},{"heading":"Motor Development","paragraphs":["Gross motor skills involve large movements such as crawling, standing and walking. Fine motor skills involve smaller movements such as reaching and grasping. Motor milestones follow a fairly predictable order: lifting the head, rolling over, sitting, crawling, standing with support and walking. Large individual differences exist in timing, and a baby can be months ahead or behind the average while still developing normally.","Two broad trends describe the order of motor development. The cephalocaudal trend means control proceeds from head to tail: babies control the head and neck before the trunk and legs. The proximodistal trend means control proceeds from the center of the body outward: the arms are controlled before the hands and fingers. These same trends also describe physical growth before and after birth.","According to dynamic systems theory, associated with Esther Thelen, motor skills are not simply programmed by genes. Each new skill is a joint product of the developing nervous system, the body's movement capacities, the goals the child has in mind, and environmental supports. Babies combine existing abilities into new, more complex systems through practice. Cultural practices matter too: in some cultures, caregivers exercise babies' legs and encourage early sitting, and these infants often walk earlier.","Reaching is an important fine motor skill. Newborns show poorly coordinated prereaching, swiping toward objects in front of them. By about three to four months, infants make successful, voluntary reaches. The grasp then changes from the clumsy ulnar grasp, in which the fingers press against the palm, to the precise pincer grasp, using thumb and index finger, near the end of the first year."],"example":"A 10-month-old picks up single pieces of cereal from a high-chair tray using her thumb and forefinger, showing the pincer grasp."},{"heading":"Touch, Taste, Smell, and Hearing","paragraphs":["Touch is well developed at birth and supports both exploration and emotional bonding. Newborns are sensitive to pain, which is why medical guidelines now call for pain relief during procedures such as circumcision. A small amount of sugar solution, gentle holding and skin-to-skin contact all reduce signs of distress in newborns undergoing minor procedures.","Newborns can distinguish basic tastes. They relax their faces in response to sweet tastes and purse their lips or grimace at sour and bitter ones. Preferences can be shaped by experience, including flavors that pass into amniotic fluid and breast milk. Smell is also keen. Babies turn away from unpleasant odors, and breastfed newborns can recognize the smell of their own mother's milk and body.","Newborns can hear a wide range of sounds and prefer complex sounds, such as voices, over pure tones. They recognize their mother's voice and show a preference for the sound patterns of their native language, reflecting experience before birth. Young infants can tell apart nearly all speech sounds used in human languages. Over the second half of the first year, their sensitivity narrows toward the sounds of the language they hear, a process called perceptual narrowing. Infants also use statistical learning, noticing which syllables often occur together, to pick out words from the flow of speech."],"example":"A 6-month-old raised in an English-speaking home notices the difference between two Hindi consonants, but by 12 months the same baby no longer reacts to that contrast."},{"heading":"Vision: Depth, Pattern, and Face Perception","paragraphs":["Vision is the least mature sense at birth. Newborns focus poorly, see distant objects as blurry and have limited color discrimination. Visual acuity, or fineness of discrimination, improves rapidly over the first year as the eye and visual areas of the brain mature. By a few months of age, babies see color fairly well and scan more of their surroundings.","Depth perception is the ability to judge the distance of objects from one another and from ourselves. In the classic visual cliff study, Eleanor Gibson and Richard Walk placed crawling babies on a glass-covered platform with a shallow side and an apparent drop-off. Most crawlers refused to cross the deep side, showing they could perceive depth. Later research found that sensitivity to motion cues appears first, then binocular cues, then pictorial cues such as shading and overlapping objects. Crawling experience itself strengthens depth perception and wariness of heights.","Pattern perception improves with contrast sensitivity, the ability to detect differences in light between adjacent regions. Young infants prefer patterns with large, high-contrast elements; with age they prefer more complex patterns and begin to see whole forms rather than separate parts. Newborns prefer to look at simple face-like arrangements, and within days they prefer their mother's face to a stranger's. During the first year, face perception, like speech perception, narrows toward the kinds of faces infants see most often."],"example":"On the visual cliff, a 9-month-old crawls happily across the shallow side toward his mother but stops and fusses at the edge of the deep side, even when she calls him."},{"heading":"Intermodal Perception, Differentiation Theory, and Early Experience","paragraphs":["Intermodal perception means combining information from more than one sense into a unified experience. Infants are especially sensitive to amodal sensory properties, which are features that can be detected in more than one sense, such as rate, rhythm, duration and intensity. For instance, the sight and sound of a bouncing ball share the same timing. Early intermodal perception helps babies make sense of a busy world and supports learning about objects, faces and language.","Eleanor Gibson's differentiation theory states that infants actively search for invariant features of the environment, those that remain stable while other aspects change. Over time, perception becomes more finely differentiated, or detailed. Gibson also stressed affordances, the action possibilities a situation offers to a person with particular motor skills. A slope affords walking to an experienced walker but suggests danger to a beginner, so perception and action develop together.","Studies of children adopted from severely deprived orphanages show the importance of early experience. Children adopted in early infancy generally catch up well, while those who spent longer in deprived settings are more likely to show lasting difficulties in cognition, attention and emotional regulation. At the same time, more is not always better. Overstimulating babies or pressuring them with early academic training can lead to withdrawal and stress. Development is best supported by everyday warm, responsive interaction and opportunities to explore."],"example":"A baby watching two puppets hop on a screen looks longer at the puppet whose landings match the timing of a drumbeat, showing intermodal perception of rhythm."}],"terms":[{"term":"Reflex","def":"An inborn, automatic response to a particular form of stimulation, such as rooting or grasping."},{"term":"Apgar Scale","def":"A rating used at one and five minutes after birth to assess a newborn's color, heart rate, reflex irritability, muscle tone and breathing."},{"term":"States of arousal","def":"Different degrees of sleep and wakefulness, from regular sleep to waking activity and crying."},{"term":"Sudden infant death syndrome (SIDS)","def":"The unexpected death of an infant under one year, usually during sleep, that remains unexplained after investigation."},{"term":"Classical conditioning","def":"Learning in which a neutral stimulus is paired with a stimulus that produces a reflexive response until the neutral stimulus alone produces a similar response."},{"term":"Operant conditioning","def":"Learning in which the consequences of a behavior, reinforcement or punishment, change how often it occurs."},{"term":"Habituation","def":"A gradual reduction in responding to a stimulus that is presented repeatedly. A return of responding to a new stimulus is called recovery."},{"term":"Cephalocaudal trend","def":"The head-to-tail sequence of growth and motor control."},{"term":"Proximodistal trend","def":"The center-outward sequence of growth and motor control, from the trunk toward the hands and fingers."},{"term":"Dynamic systems theory of motor development","def":"The view that new motor skills arise from the combination of the nervous system, body capacities, the child's goals and environmental supports."},{"term":"Perceptual narrowing","def":"The tendency for perceptual sensitivity to become tuned to the stimuli an infant commonly experiences, such as native-language sounds and familiar types of faces."},{"term":"Visual cliff","def":"An apparatus with a shallow side and an apparent drop-off, used to study depth perception in crawling infants."},{"term":"Intermodal perception","def":"Perception that combines information from more than one sensory system, often based on amodal properties such as rhythm and rate."},{"term":"Differentiation theory","def":"Eleanor Gibson's view that infants search for invariant features of the environment and that perception becomes more detailed with experience."}],"questions":[{"type":"mc","section":"The Newborn's Reflexes and Assessment","prompt":"Which newborn reflex involves flinging the arms outward and then bringing them together in response to a loud sound or sudden loss of support?","choices":["Rooting reflex","Babinski reflex","Moro reflex","Tonic neck reflex"],"answer":2,"explain":["Not quite. The rooting reflex is turning toward a touch on the cheek.","Not quite. The Babinski reflex is the fanning of the toes when the sole is stroked.","Correct. The Moro, or embracing, reflex is this arm-flinging response to a startling event.","Not quite. The tonic neck reflex is a fencing-like posture when the head is turned to one side."]},{"type":"mc","section":"The Newborn's Reflexes and Assessment","prompt":"What does an Apgar score of 8 at five minutes after birth suggest?","choices":["The newborn is in good physical condition","The newborn needs emergency resuscitation","The newborn has a strong social personality","The newborn will reach motor milestones early"],"answer":0,"explain":["Correct. A total Apgar score of 7 or more indicates good physical condition.","Not quite. Low scores, not a score of 8, signal the need for urgent help.","Not quite. The Apgar measures physical signs, not personality or social style.","Not quite. The Apgar assesses immediate condition and does not predict the timing of motor milestones."]},{"type":"mc","section":"States of Arousal: Sleep, Crying, and SIDS","prompt":"According to autostimulation theory, why do newborns spend so much time in REM sleep?","choices":["REM sleep helps them digest milk more efficiently","REM sleep provides stimulation the developing brain needs","REM sleep prevents them from crying during the night","REM sleep is when newborns form long-term memories of faces"],"answer":1,"explain":["Not quite. Autostimulation theory is about brain stimulation, not digestion.","Correct. The theory proposes that REM sleep supplies internal stimulation that supports brain development.","Not quite. The theory does not link REM sleep to reducing crying.","Not quite. The theory focuses on general brain stimulation rather than memory for faces."]},{"type":"mc","section":"Early Learning Capacities","prompt":"A researcher shows an infant the same picture until the infant looks away, then shows a new picture and the infant looks longer again. What has the researcher observed?","choices":["Classical conditioning","Operant conditioning","Imitation","Habituation and recovery"],"answer":3,"explain":["Not quite. Classical conditioning involves pairing a neutral stimulus with one that already produces a reflex.","Not quite. Operant conditioning involves consequences that change how often a behavior occurs.","Not quite. Imitation involves copying another person's behavior.","Correct. Declining attention to the repeated picture is habituation, and renewed attention to the new one is recovery."]},{"type":"mc","section":"Motor Development","prompt":"A baby controls her arms well before she can use her fingers precisely. Which trend does this illustrate?","choices":["Cephalocaudal trend","Proximodistal trend","Perceptual narrowing","Habituation"],"answer":1,"explain":["Not quite. The cephalocaudal trend is head-to-tail, such as head control before leg control.","Correct. The proximodistal trend runs from the center of the body outward, so arms come before fingers.","Not quite. Perceptual narrowing concerns tuning of perception, not motor control.","Not quite. Habituation is a decline in attention to a repeated stimulus, not a pattern of motor control."]},{"type":"mc","section":"Vision: Depth, Pattern, and Face Perception","prompt":"What did the visual cliff studies by Gibson and Walk mainly show?","choices":["Newborns prefer their mother's face to a stranger's","Infants cannot see color until one year of age","Crawling infants can perceive depth and avoid an apparent drop-off","Infants reach for objects accurately from birth"],"answer":2,"explain":["Not quite. Face preference was studied with other methods, not the visual cliff.","Not quite. Infants see color fairly well within the first few months.","Correct. Most crawlers refused to cross the deep side, showing depth perception.","Not quite. Newborns show only poorly coordinated prereaching."]},{"type":"mc","section":"Intermodal Perception, Differentiation Theory, and Early Experience","prompt":"In Eleanor Gibson's theory, what is an affordance?","choices":["The action possibilities a situation offers to a person with certain abilities","A feature that can be detected by only one sense","A reflex that disappears in the first six months","The cost to parents of providing enrichment"],"answer":0,"explain":["Correct. Affordances are what the environment allows a person to do, given that person's skills.","Not quite. Affordances concern possibilities for action, not features limited to a single sense.","Not quite. Affordances are not reflexes.","Not quite. The term has nothing to do with financial cost."]},{"type":"tf","section":"Touch, Taste, Smell, and Hearing","prompt":"Young infants can distinguish speech sounds from many languages, but this sensitivity narrows toward their native language during the second half of the first year.","choices":["True","False"],"answer":0,"explain":["Correct. This is perceptual narrowing in speech perception.","Not quite. Infants do start out sensitive to many speech contrasts and then become tuned to their native language."]},{"type":"tf","section":"Motor Development","prompt":"Dynamic systems theory holds that motor skills unfold according to a fixed genetic timetable that experience cannot influence.","choices":["True","False"],"answer":1,"explain":["Not quite. Dynamic systems theory rejects a purely genetic timetable.","Correct. The theory says skills arise from the nervous system, body, goals and environmental supports working together, so experience matters."]},{"type":"scenario","section":"States of Arousal: Sleep, Crying, and SIDS","prompt":"New parents ask their pediatrician how to reduce the risk of SIDS. Which advice best fits current evidence?","choices":["Put the baby to sleep on the stomach so they do not choke","Use thick blankets and pillows to keep the baby warm","Place the baby on the back on a firm surface without loose bedding, in a smoke-free home","Keep the room very warm and bundle the baby heavily"],"answer":2,"explain":["Not quite. Stomach sleeping is a known risk factor for SIDS.","Not quite. Soft bedding and pillows increase risk.","Correct. Back sleeping on a firm surface, without loose bedding and away from smoke, lowers SIDS risk.","Not quite. Overheating is a risk factor."]},{"type":"scenario","section":"Early Learning Capacities","prompt":"A mother always strokes her baby's forehead just before breastfeeding. After a few weeks, the baby starts sucking as soon as his forehead is stroked. What kind of learning is this?","choices":["Operant conditioning","Habituation","Imitation","Classical conditioning"],"answer":3,"explain":["Not quite. Operant conditioning would require the baby's own behavior to be followed by a consequence.","Not quite. Habituation is a decrease in response, not a new response.","Not quite. The baby is not copying anyone's behavior.","Correct. A neutral stimulus (stroking) paired with feeding now triggers sucking by itself."]},{"type":"scenario","section":"Intermodal Perception, Differentiation Theory, and Early Experience","prompt":"A couple adopts a 3-month-old from an orphanage with very little adult interaction. Based on research on early deprivation, what outcome is most likely?","choices":["The child will almost certainly have severe lasting deficits","The child has a good chance of catching up, because adoption occurred early","The child will develop faster than children raised at home","Early experience has no measurable effect on development"],"answer":1,"explain":["Not quite. Severe lasting deficits are more likely when deprivation continues for longer periods.","Correct. Children adopted in early infancy generally catch up well.","Not quite. There is no evidence that deprivation speeds development.","Not quite. Orphanage research shows early experience does matter, especially when deprivation is prolonged."]}]},{"id":"m05","num":5,"title":"Physical Growth","tagline":"How the body and brain grow from infancy through adolescence, what helps or harms that growth, and how puberty reshapes young people physically and psychologically.","objectives":["Describe general patterns of body growth, including growth curves, changing body proportions and asynchronies","Explain key processes of brain development, including synaptic pruning, myelination, lateralization and plasticity","Identify how heredity, nutrition, infectious disease and emotional well-being influence physical growth","Describe the hormonal changes and sequence of sexual maturation at puberty and the secular trend","Evaluate the psychological impact of pubertal timing for boys and girls","Summarize major adolescent health concerns, including eating disorders, sexual health and substance use"],"sections":[{"heading":"Patterns of Body Growth","paragraphs":["Physical growth is not steady. A distance curve plots a child's average height or weight at each age and shows how far the child has come. A velocity curve plots the amount of growth gained each year and shows the rate of change. Together they reveal that growth is very fast in infancy, slows to a gradual pace in early and middle childhood, speeds up sharply during the adolescent growth spurt, and then stops.","Body proportions also change. At birth the head is about one quarter of total body length, while in adults it is about one eighth. Following the cephalocaudal trend, the head grows first, then the trunk and legs. At puberty, the direction reverses: the hands, legs and feet grow first, then the torso. This is why many young teenagers seem all arms and legs for a while.","Different body systems grow on their own timetables, a pattern called asynchronous growth. The brain and head grow very rapidly early in life and approach adult size well before the rest of the body. The genital system grows slowly in childhood and then rapidly at puberty. General body size follows the curve of height and weight. These asynchronies show that growth is a coordinated but uneven process.","The skeleton begins as soft cartilage that gradually hardens into bone. Near the ends of the long bones are growth centers called epiphyses, which thin and eventually close when growth in length ends. An X-ray of the hand and wrist shows how far they have progressed and gives an estimate of skeletal age, the best single measure of physical maturity. Children of the same chronological age can differ by a year or more in skeletal age. Girls are ahead of boys in skeletal maturity from before birth onward, which helps explain why they reach puberty and finish growing earlier."],"example":"A 13-year-old complains that his feet suddenly seem huge and his trousers are too short every few months, while his chest and shoulders have barely changed, a typical pattern of the adolescent growth spurt."},{"heading":"Brain Development","paragraphs":["The brain contains billions of neurons, or nerve cells, that send messages to one another across tiny gaps called synapses. During infancy and early childhood, neurons form synapses at a remarkable rate, producing far more connections than the child will eventually need. Neurons that are stimulated by experience keep their connections, while seldom-used connections are lost. This process, synaptic pruning, makes the brain more efficient and is often summarized as use it or lose it.","About half of the brain's volume is made of glial cells, which are responsible for myelination, the coating of nerve fibers with an insulating fatty sheath called myelin. Myelin speeds up message transfer. Myelination is rapid in the first two years and continues into adolescence and early adulthood. The cerebral cortex, the outer layer of the brain responsible for thinking, matures gradually; the prefrontal cortex, which supports planning, impulse control and reasoning, is among the last regions to mature.","The cortex has two hemispheres that specialize in different functions, a process called lateralization. For most people, the left hemisphere is mainly responsible for language and verbal abilities, and the right hemisphere handles spatial abilities and many aspects of emotion. Lateralization is present to some degree at birth and strengthens with age and experience. In adolescence, brain systems linked to emotion and reward respond strongly, while the prefrontal systems that regulate them are still maturing, which helps explain some risk-taking."],"example":"A toddler who hears a lot of talk at home builds and keeps many connections in language areas of the brain, while connections that are rarely used are gradually pruned away."},{"heading":"Brain Plasticity and Sensitive Periods","paragraphs":["Brain plasticity is the capacity of brain areas to take over new functions, especially if other areas are damaged. The young brain is highly plastic because many areas are not yet committed to specific functions. Children who suffer brain injury in infancy or early childhood often recover more fully than adults with similar injuries, although some lasting difficulties can remain. Plasticity declines with age but never disappears entirely.","A sensitive period is a time when the brain is especially responsive to certain experiences. Researchers distinguish experience-expectant growth, which depends on ordinary experiences that nearly all children receive, such as patterned light, sounds and caregiver interaction, from experience-dependent growth, which reflects learning that varies across individuals and cultures, such as reading or playing an instrument. Experience-expectant growth is most vulnerable to deprivation early in life.","Vision provides a clear example. Infants born with cataracts that block patterned light develop better vision when the cataracts are removed early. If surgery is delayed for a long time, some visual abilities never fully develop. Similar findings from children adopted out of severely deprived institutions show that the longer early deprivation lasts, the more likely lasting problems become."],"example":"A baby has a cataract removed in the first months of life and later develops nearly normal vision, while another child whose surgery was delayed for years has permanent difficulties with certain visual skills."},{"heading":"Influences on Growth: Heredity and Nutrition","paragraphs":["Heredity strongly affects body size and rate of growth. Identical twins are much more alike in height and weight than fraternal twins. Genes influence growth partly by controlling the body's production of hormones. When children's diets and health are good, height and maturation are largely set by heredity. When illness or poor nutrition slows growth, children often show catch-up growth, a return to their genetically expected path once conditions improve.","Nutrition is especially important in infancy, when growth is fastest. Breast milk is ideally suited to babies. It provides a good balance of fat and protein, contains antibodies that protect against infection, is easy to digest, and supports healthy development of the jaw and teeth. Breastfeeding is particularly valuable in poverty-stricken regions where safe water for formula may not be available. Formula can still provide adequate nutrition when breastfeeding is not possible.","Malnutrition can cause serious disease. Marasmus is a wasted condition caused by a diet low in all essential nutrients, usually appearing in the first year when a mother is too malnourished to produce enough milk. Kwashiorkor results from a diet very low in protein and usually appears after weaning, between about one and three years. Its signs include a swollen belly, swollen feet, hair loss and skin rashes. Children who survive severe malnutrition often show lasting delays in growth and learning."],"example":"A 2-year-old in a region of food shortage who eats mainly starchy foods after weaning develops a swollen abdomen and thinning hair, signs of kwashiorkor."},{"heading":"Obesity, Infectious Disease, and Emotional Well-Being","paragraphs":["Childhood obesity is usually defined as a body mass index (BMI) at or above the 95th percentile for children of the same age and sex. Heredity plays a role, but environment matters greatly. Contributing factors include high-calorie, low-nutrient foods, sugary drinks, family eating habits, insufficient sleep, heavy screen time and low physical activity. Obese children are at risk for health problems such as high blood pressure and type 2 diabetes, as well as teasing and low self-esteem. Effective treatment usually involves the whole family changing eating and activity habits.","In developing countries, infectious diseases and malnutrition interact in a vicious cycle: poor nutrition weakens the immune system, and illness reduces appetite and nutrient absorption. Diarrhea is a leading cause of growth stunting and death among young children in poor regions. Oral rehydration therapy, a simple solution of water, salt and sugar, and immunization against common childhood diseases save many lives.","Emotional well-being also affects growth. Nonorganic failure to thrive describes infants who show slowed growth with no physical cause, often linked to disturbed parent-infant interaction. Psychosocial dwarfism is a growth disorder seen in some children exposed to severe emotional deprivation; their bodies produce less growth hormone, so they are very short. When these children are moved to warm, supportive environments early enough, growth often improves quickly."],"example":"A 6-year-old placed in foster care after years of neglect grows several centimeters in the first year, even though his diet was already adequate, suggesting that emotional deprivation had suppressed his growth."},{"heading":"Puberty and Its Psychological Impact","paragraphs":["Puberty is the set of biological changes that leads to an adult-sized body and sexual maturity. It is triggered by hormones released under the control of the pituitary gland. Growth hormone and thyroxine increase, and the sex hormones rise: estrogens, more prominent in girls, and androgens such as testosterone, more prominent in boys, though both sexes produce both. Primary sexual characteristics involve the reproductive organs, while secondary sexual characteristics are visible signs such as breast development, pubic hair and voice changes.","Girls usually begin puberty about two years earlier than boys. In girls, breast budding and the growth spurt usually come first, and menarche, the first menstruation, occurs relatively late in the sequence. In boys, the testes and scrotum enlarge first, the growth spurt comes later, and spermarche, the first ejaculation, occurs around the early teens. Across industrialized countries, the age of menarche fell over the past century because of better nutrition and health, a pattern called the secular trend.","Prepared young people usually react to puberty more positively. Moodiness is linked both to hormones and to changes in daily life and relationships, and conflict and distance with parents often rise for a time. Pubertal timing matters. Early-maturing boys tend to be viewed as confident and athletic but are also at greater risk of early risky behavior. Late-maturing boys often feel anxious and less popular. Early-maturing girls are at higher risk of depression, poor body image and involvement with older peers, while late-maturing girls tend to fare better. Being out of step with peers and differences from cultural body ideals help explain these effects."],"example":"An 11-year-old girl who has developed much earlier than her classmates feels self-conscious, starts spending time with older teenagers and reports feeling unhappy with her body."},{"heading":"Adolescent Health Concerns","paragraphs":["The rapid body changes of puberty make many teenagers, especially girls, sensitive about weight and appearance. Anorexia nervosa is an eating disorder in which young people starve themselves because of an intense fear of gaining weight and a distorted body image; it can cause serious medical harm. Bulimia nervosa involves repeated binge eating followed by compensating behaviors such as vomiting, purging or excessive exercise. Binge-eating disorder involves binges without compensation. Contributing factors include heredity, perfectionism, family relationships and cultural ideals of thinness. Family-based therapy is among the most effective treatments for anorexia.","Sexual interest rises with the hormonal changes of puberty, and attitudes and behavior are shaped by family, peers, culture and the media. Many adolescents who become sexually active do not use contraception consistently, which raises the risk of sexually transmitted infections and unplanned pregnancy. Comprehensive sex education that gives accurate information about abstinence, contraception and healthy relationships, along with open communication with parents, is linked to more responsible decisions.","Experimenting with alcohol, tobacco, vaping or other drugs is fairly common in adolescence, but a minority move on to regular use and abuse. Early first use, family problems, peer substance use and poor self-regulation increase risk. Abuse during the teenage years can interfere with the maturing brain and with school and relationships. Effective prevention programs build skills for resisting peer pressure, strengthen family communication and offer young people healthy, engaging alternatives."],"example":"A high-school counselor notices that a student who is very thin keeps saying she feels fat, skips lunch and exercises for hours each day, warning signs of anorexia nervosa that call for referral to professional help."}],"terms":[{"term":"Distance curve","def":"A growth curve that plots average height or weight at each age, showing a child's overall progress."},{"term":"Velocity curve","def":"A growth curve that plots the amount of growth per year, showing the rate of change."},{"term":"Skeletal age","def":"An estimate of physical maturity based on how far the bones, especially the epiphyses, have developed."},{"term":"Synaptic pruning","def":"The loss of seldom-used synapses, which makes the brain's remaining connections more efficient."},{"term":"Myelination","def":"The coating of nerve fibers with myelin, a fatty sheath that speeds message transfer."},{"term":"Lateralization","def":"Specialization of functions in the two hemispheres of the cerebral cortex."},{"term":"Brain plasticity","def":"The capacity of brain areas to take over new functions, which is greatest early in life."},{"term":"Experience-expectant brain growth","def":"Brain development that depends on ordinary experiences nearly all children have, such as seeing patterned light and hearing speech."},{"term":"Marasmus","def":"A wasted condition caused by a diet low in all essential nutrients, usually in the first year."},{"term":"Kwashiorkor","def":"A disease caused by a diet very low in protein, usually after weaning, marked by a swollen belly and hair loss."},{"term":"Psychosocial dwarfism","def":"A growth disorder linked to severe emotional deprivation, in which growth hormone is reduced and the child is very short."},{"term":"Menarche","def":"A girl's first menstruation."},{"term":"Secular trend","def":"A change in physical development, such as earlier puberty, from one generation to the next."},{"term":"Anorexia nervosa","def":"An eating disorder in which a young person starves themselves because of an intense fear of gaining weight and a distorted body image."}],"questions":[{"type":"mc","section":"Patterns of Body Growth","prompt":"Which type of growth curve would best show that children grow fastest in infancy and again during the adolescent growth spurt?","choices":["A distance curve","A velocity curve","A skeletal age chart","A lateralization graph"],"answer":1,"explain":["Not quite. A distance curve shows total height or weight reached at each age, not the rate.","Correct. A velocity curve plots growth per year, so periods of fast growth stand out as peaks.","Not quite. Skeletal age describes bone maturity, not yearly rate of growth.","Not quite. Lateralization refers to brain hemisphere specialization, not body growth."]},{"type":"mc","section":"Patterns of Body Growth","prompt":"What is the best single measure of a child's physical maturity?","choices":["Chronological age","Body weight","Head circumference","Skeletal age"],"answer":3,"explain":["Not quite. Children of the same chronological age can differ a lot in maturity.","Not quite. Weight varies with diet and body type and is not a reliable maturity measure.","Not quite. Head size reaches near adult size early and says little about later maturity.","Correct. Skeletal age, based on bone development, is the best single measure of physical maturity."]},{"type":"mc","section":"Brain Development","prompt":"What is the main effect of myelination?","choices":["It speeds the transfer of messages along nerve fibers","It removes unused synapses","It produces new neurons throughout life","It assigns language to the left hemisphere"],"answer":0,"explain":["Correct. Myelin insulates nerve fibers and speeds message transfer.","Not quite. Removing unused synapses is synaptic pruning.","Not quite. Myelination coats existing fibers; it does not create neurons.","Not quite. Assigning functions to hemispheres is lateralization."]},{"type":"mc","section":"Brain Plasticity and Sensitive Periods","prompt":"Why do young children often recover better than adults after brain injury?","choices":["Children's brains have fewer neurons to damage","Young brains are more plastic because many areas are not yet committed to specific functions","Children's brains are fully myelinated at birth","Brain injuries in children never affect thinking"],"answer":1,"explain":["Not quite. Recovery depends on flexibility, not on having fewer neurons.","Correct. Greater plasticity lets other areas take over lost functions.","Not quite. Myelination continues into adolescence and early adulthood.","Not quite. Early injuries can still leave lasting difficulties."]},{"type":"mc","section":"Influences on Growth: Heredity and Nutrition","prompt":"Which statement correctly contrasts marasmus and kwashiorkor?","choices":["Marasmus results from too much protein; kwashiorkor results from too little fat","Both are caused only by infections, not by diet","Marasmus reflects a diet low in all nutrients, while kwashiorkor reflects a diet very low in protein","Kwashiorkor typically appears at birth, while marasmus appears in adolescence"],"answer":2,"explain":["Not quite. Neither disease is caused by too much protein.","Not quite. Both are forms of malnutrition caused by inadequate diet.","Correct. Marasmus comes from overall nutrient deficiency, and kwashiorkor from protein deficiency.","Not quite. Marasmus usually appears in the first year and kwashiorkor after weaning, around one to three years."]},{"type":"mc","section":"Puberty and Its Psychological Impact","prompt":"What does the secular trend in pubertal timing refer to?","choices":["Girls reaching puberty before boys","Earlier puberty across generations in industrialized nations, linked to better nutrition and health","Puberty being triggered by the pituitary gland","Religious influences on how families discuss puberty"],"answer":1,"explain":["Not quite. That is a sex difference in timing, not the secular trend.","Correct. The secular trend is a generational change, such as the earlier age of menarche.","Not quite. That describes the hormonal trigger, not a generational trend.","Not quite. Secular here means across time, not nonreligious or religious."]},{"type":"mc","section":"Puberty and Its Psychological Impact","prompt":"Which group tends to experience the most difficulties related to pubertal timing?","choices":["Late-maturing girls","Early-maturing boys who are on time with peers","Early-maturing girls","Girls who mature at the same time as their friends"],"answer":2,"explain":["Not quite. Late-maturing girls generally fare relatively well.","Not quite. Early-maturing boys are often viewed positively, though they face some risks.","Correct. Early-maturing girls are at higher risk of depression, poor body image and involvement with older peers.","Not quite. Being in step with peers is usually protective."]},{"type":"tf","section":"Adolescent Health Concerns","prompt":"Anorexia nervosa is mainly caused by a lack of access to food.","choices":["True","False"],"answer":1,"explain":["Not quite. Young people with anorexia have access to food but starve themselves out of fear of gaining weight.","Correct. Anorexia involves self-starvation driven by an intense fear of weight gain and a distorted body image, with contributions from heredity, personality, family and culture."]},{"type":"tf","section":"Obesity, Infectious Disease, and Emotional Well-Being","prompt":"Severe emotional deprivation can slow a child's physical growth even when the child's diet is adequate.","choices":["True","False"],"answer":0,"explain":["Correct. Psychosocial dwarfism shows that emotional deprivation can reduce growth hormone and slow growth.","Not quite. Emotional well-being does affect growth, as nonorganic failure to thrive and psychosocial dwarfism show."]},{"type":"scenario","section":"Influences on Growth: Heredity and Nutrition","prompt":"A health worker in a region without reliable clean water is advising a new mother on feeding. Which advice is best supported by research?","choices":["Breastfeed, because breast milk is easy to digest, contains antibodies and avoids unsafe water","Use formula mixed with local water, because it is always more nutritious","Introduce solid foods from the first week to speed growth","Feed only water and sugar for the first month"],"answer":0,"explain":["Correct. Breast milk is nutritionally ideal, protects against infection and avoids the risks of unsafe water.","Not quite. Formula is not more nutritious, and mixing it with unsafe water raises infection risk.","Not quite. Very early solid foods are not recommended and do not speed healthy growth.","Not quite. Water and sugar alone cannot meet a newborn's nutritional needs."]},{"type":"scenario","section":"Obesity, Infectious Disease, and Emotional Well-Being","prompt":"Parents of an 8-year-old whose BMI is above the 95th percentile ask how to help. Which approach is most likely to work?","choices":["Put the child alone on a strict diet while the rest of the family eats as usual","Ignore the issue, because children always outgrow excess weight","Involve the whole family in healthier eating, more activity, less screen time and enough sleep","Use food as a reward for good behavior"],"answer":2,"explain":["Not quite. Singling out the child without family change is less effective and can harm self-esteem.","Not quite. Obesity often persists and carries health risks.","Correct. Family-based changes in eating, activity, screen time and sleep are the most effective approach.","Not quite. Using food as a reward encourages unhealthy eating habits."]},{"type":"scenario","section":"Brain Plasticity and Sensitive Periods","prompt":"An infant is diagnosed with cataracts in both eyes. Based on research on sensitive periods, what should the doctor advise?","choices":["Wait until school age, because the visual system is not yet working","Remove the cataracts early, because the visual system needs patterned light during a sensitive period","Timing does not matter, because the brain is equally plastic at all ages","Avoid surgery, because vision develops without visual input"],"answer":1,"explain":["Not quite. Long delays risk permanent visual problems.","Correct. Early removal allows experience-expectant visual development during the sensitive period.","Not quite. Plasticity declines with age, so timing matters.","Not quite. Normal vision depends on patterned visual input."]}]},{"id":"m06","num":6,"title":"Cognitive Development: Piagetian, Core Knowledge, and Vygotskian Perspectives","tagline":"How children's thinking changes from infancy to adolescence according to Piaget's stages, the core knowledge view and Vygotsky's sociocultural theory, and what these ideas mean for teaching.","objectives":["Explain Piaget's key concepts of schemes, assimilation, accommodation, equilibration and organization","Describe the main achievements and limitations of each of Piaget's four stages","Evaluate Piaget's theory in light of follow-up research","Summarize the core knowledge perspective and the evidence used to support it","Explain Vygotsky's concepts of private speech, the zone of proximal development, scaffolding and guided participation","Apply Piagetian and Vygotskian ideas to classroom practice"],"sections":[{"heading":"Piaget's Basic Ideas","paragraphs":["Jean Piaget saw children as active learners who construct knowledge by exploring and acting on their world. His cognitive-developmental theory proposes that children move through four broad stages: sensorimotor, preoperational, concrete operational and formal operational. Each stage is a qualitatively different way of thinking, and all children pass through the stages in the same order, though at somewhat different rates.","The basic units of knowledge in Piaget's theory are schemes, organized ways of making sense of experience. A baby's scheme for grasping or a preschooler's mental category for dogs are examples. Schemes change through adaptation, which has two parts. In assimilation, children use existing schemes to interpret new experiences. In accommodation, they create new schemes or adjust old ones when current schemes do not fit.","Piaget believed children shift back and forth between equilibrium, when schemes fit the world comfortably, and disequilibrium, when new information does not fit. This back-and-forth, called equilibration, drives cognitive change. Schemes also change through organization, an internal process of linking schemes into a strongly connected cognitive system. For example, an infant eventually coordinates looking, reaching and grasping into a single action pattern."],"example":"A toddler who knows the word bird calls a butterfly a bird (assimilation). After a parent explains the difference, she forms a new category for insects that fly (accommodation)."},{"heading":"The Sensorimotor Stage","paragraphs":["During the sensorimotor stage, from birth to about two years, infants think with their eyes, ears, hands and mouths. Piaget divided the stage into six substages. Newborns begin with reflexive schemes. Next come circular reactions, in which infants try to repeat a chance event caused by their own actions. Primary circular reactions center on the infant's own body, such as thumb sucking; secondary circular reactions involve the surrounding world, such as shaking a rattle to hear the sound.","Around eight to twelve months, infants coordinate schemes into intentional, goal-directed behavior, such as pushing aside an obstacle to reach a toy. They also begin to show object permanence, the understanding that objects continue to exist when out of sight. However, they make the A-not-B search error: if a toy is hidden repeatedly in place A and then moved to place B while they watch, they still search in A.","Between twelve and eighteen months, toddlers experiment with tertiary circular reactions, varying their actions to see different results. In the final substage, from about eighteen months to two years, children gain mental representation, internal images of objects and events. This allows them to solve problems in their heads, to search correctly for objects moved while out of sight, to show deferred imitation, copying behavior seen earlier, and to engage in make-believe play."],"example":"A 1-year-old drops a spoon from her high chair, then drops it gently, then flings it, watching how it falls each time, an example of tertiary circular reactions."},{"heading":"The Preoperational Stage","paragraphs":["The preoperational stage lasts from about two to seven years. Its main gain is an explosion of representational, or symbolic, activity, seen in language, drawing and make-believe play. Make-believe becomes more detached from real-life conditions, less self-centered and more complex, and it supports language, memory, reasoning, imagination and social skills such as cooperation and perspective taking.","Piaget described preoperational thought mostly in terms of what children cannot yet do. He thought young children are egocentric, unable to distinguish the symbolic viewpoints of others from their own. In his three-mountains task, preschoolers asked how a mountain scene looked to a doll on the other side often picked their own view. Egocentrism also leads to animistic thinking, the belief that inanimate objects have lifelike qualities such as feelings.","The best-known limitation is the failure of conservation, the understanding that certain physical characteristics stay the same even when their appearance changes. When water is poured from a short, wide glass into a tall, thin one, preschoolers usually say the amount has changed. Piaget explained this by centration, focusing on one feature such as height while ignoring others; by attention to the final state rather than the transformation; and by irreversibility, the inability to mentally reverse the steps of a problem. Preschoolers also struggle with hierarchical classification, such as judging whether there are more flowers or more roses in a set."],"example":"A 4-year-old insists that her sister got more juice because her glass is taller, even though both watched the same amount poured from identical cartons."},{"heading":"The Concrete and Formal Operational Stages","paragraphs":["In the concrete operational stage, from about seven to eleven years, thought becomes more logical, flexible and organized. Children pass conservation tasks because they can decenter, attending to several features at once, and show reversibility, mentally undoing a change. They master hierarchical classification, which is why collecting and sorting become popular hobbies. They can also perform seriation, ordering items along a dimension such as length, and transitive inference, seriating mentally.","Concrete operational thinking works best with real, tangible information. Children master logical ideas gradually, one type of task at a time. For example, they usually understand conservation of number before conservation of liquid, and conservation of weight later still. Piaget called this gradual mastery horizontal decalage. It shows that concrete operational children do not apply logic to all problems at once.","In the formal operational stage, beginning around eleven years, young people can reason abstractly. Hypothetico-deductive reasoning means starting with a general theory, deducing specific hypotheses and testing them systematically. In Piaget's pendulum problem, formal thinkers vary one factor at a time, such as string length or weight, to find what affects the speed of swing. Propositional thought is the ability to evaluate the logic of verbal statements without referring to real-world circumstances. Not everyone reaches formal operations in every domain; schooling and experience with a subject matter a great deal."],"example":"Asked whether a claim like all fish can fly, and a salmon is a fish, so a salmon can fly is logically valid, a 15-year-old says yes, the logic is valid even though the premise is false, showing propositional thought."},{"heading":"Evaluating Piaget's Theory","paragraphs":["Piaget's ideas inspired an enormous amount of research and changed how we view children, as active and curious thinkers. However, follow-up studies show that he underestimated the abilities of infants and young children. Using the violation-of-expectation method, which measures whether infants look longer at impossible events, researchers such as Renee Baillargeon found signs of object permanence in the first months of life, well before Piaget's timetable.","When tasks are simplified and made familiar, preschoolers show less egocentrism and more logical thinking than Piaget claimed. They can adjust their speech to younger listeners, recognize that others see things differently and sometimes pass simplified conservation and classification tasks. Training can also improve performance, which suggests that thinking is not tied rigidly to stage.","Many researchers now believe that development is more gradual and uneven than Piaget's discrete stages suggest. Culture and schooling influence performance; for instance, children in societies with little formal schooling may reach formal operational reasoning less often on Piagetian tasks while showing sophisticated reasoning in familiar activities. Some theorists, called neo-Piagetians, keep the idea of stages but explain progress in terms of growing processing capacity, while others prefer domain-specific accounts."],"example":"A 4-year-old who fails the three-mountains task correctly turns a picture book around so her friend sitting opposite can see the pictures, showing more perspective taking than Piaget expected."},{"heading":"The Core Knowledge Perspective","paragraphs":["The core knowledge perspective proposes that infants begin life with innate, special-purpose knowledge systems, called core domains of thought. Each domain allows rapid learning about information that has been important for human survival. Commonly proposed domains include physical knowledge about objects, numerical knowledge about small quantities, linguistic knowledge, and psychological knowledge about the minds of other people.","Evidence comes mainly from looking-time studies. For example, in research by Karen Wynn, five-month-olds watched a toy placed behind a screen, followed by a second toy. When the screen dropped to reveal only one toy, they looked longer than when two toys appeared, suggesting they expected one plus one to equal two. Such findings are taken as signs of early numerical and physical understanding.","Critics question whether longer looking really shows understanding, since it might reflect simple sensitivity to novelty or perceptual features. They also argue that the theory says little about how core knowledge develops into more complex thinking. Unlike Piaget, who saw development as a general process that cuts across domains, core knowledge theorists see development as domain-specific, with each area following its own course built on an innate foundation."],"example":"Six-month-olds look longer when a ball appears to roll through a solid wall than when it stops at the wall, which core knowledge theorists interpret as early knowledge that solid objects cannot pass through one another."},{"heading":"Vygotsky's Sociocultural Theory and Educational Implications","paragraphs":["Lev Vygotsky emphasized that cognitive development is a socially mediated process that depends on support from adults and more expert peers as children tackle new challenges. Language plays a central role. Young children often talk to themselves while working on tasks. Piaget called this egocentric speech, but Vygotsky called it private speech and argued that it helps children guide and plan their own behavior. Private speech increases when tasks are difficult and is gradually internalized as silent inner speech.","The zone of proximal development is the range of tasks a child cannot yet handle alone but can do with the help of a more skilled partner. Scaffolding describes how a skilled partner adjusts the support offered to fit the child's current level, giving more help when the child struggles and less as competence grows. Barbara Rogoff's term guided participation is broader, referring to shared endeavors between experts and less expert participants in everyday cultural activities.","Both theories have shaped education. Piagetian classrooms promote discovery learning with rich materials, sensitivity to children's readiness, and acceptance of individual differences in pace. Vygotskian classrooms promote assisted discovery, with teachers guiding learning within each child's zone, and peer collaboration in which children of varying abilities work together. Reciprocal teaching, cooperative learning groups and make-believe play, which Vygotsky saw as a zone of proximal development in itself, are examples of Vygotskian ideas in practice."],"example":"As her son works on a puzzle, a mother first points out the edge pieces, then only hints at where a piece might fit, and finally just watches as he finishes, scaffolding his performance."}],"terms":[{"term":"Scheme","def":"In Piaget's theory, an organized way of making sense of experience that changes with age."},{"term":"Assimilation","def":"Using existing schemes to interpret new experiences."},{"term":"Accommodation","def":"Creating new schemes or adjusting old ones when existing schemes do not fit new information."},{"term":"Equilibration","def":"Movement back and forth between cognitive equilibrium and disequilibrium that drives changes in schemes."},{"term":"Object permanence","def":"The understanding that objects continue to exist when they are out of sight."},{"term":"A-not-B search error","def":"The tendency of 8- to 12-month-olds to search for a toy in a familiar hiding place even after seeing it moved to a new place."},{"term":"Egocentrism","def":"Failure to distinguish others' symbolic viewpoints from one's own."},{"term":"Conservation","def":"The understanding that certain physical characteristics of objects stay the same even when their outward appearance changes."},{"term":"Centration","def":"Focusing on one aspect of a situation while neglecting other important features."},{"term":"Hypothetico-deductive reasoning","def":"A formal operational strategy of starting with a general theory, deducing specific hypotheses and testing them systematically."},{"term":"Core knowledge perspective","def":"The view that infants are born with innate knowledge systems, or core domains, that support rapid early learning."},{"term":"Private speech","def":"Self-directed speech that children use to plan and guide their own behavior."},{"term":"Zone of proximal development","def":"In Vygotsky's theory, the range of tasks a child cannot do alone but can accomplish with help from a more skilled partner."},{"term":"Scaffolding","def":"Adjusting the support offered during a teaching session to fit the child's current level of performance."}],"questions":[{"type":"mc","section":"Piaget's Basic Ideas","prompt":"A toddler sees a horse for the first time and calls it a doggie, using a scheme he already has. Which process is this?","choices":["Assimilation","Accommodation","Organization","Seriation"],"answer":0,"explain":["Correct. He is interpreting a new experience with an existing scheme.","Not quite. Accommodation would mean creating or adjusting a scheme, such as forming a new category for horses.","Not quite. Organization is linking schemes together into a connected system.","Not quite. Seriation is ordering items along a dimension, a concrete operational skill."]},{"type":"mc","section":"The Sensorimotor Stage","prompt":"A 10-month-old watches a toy being hidden under cloth A several times and finds it. Then the toy is hidden under cloth B while she watches, but she searches under A. What is this called?","choices":["Centration","Deferred imitation","The A-not-B search error","Animistic thinking"],"answer":2,"explain":["Not quite. Centration is a preoperational tendency to focus on one feature of a problem.","Not quite. Deferred imitation is copying behavior seen earlier.","Correct. Searching in the old location after seeing the move is the A-not-B search error.","Not quite. Animistic thinking is attributing lifelike qualities to objects."]},{"type":"mc","section":"The Preoperational Stage","prompt":"According to Piaget, which feature of preoperational thought makes children unable to mentally pour water back into the original glass?","choices":["Decentration","Propositional thought","Horizontal decalage","Irreversibility"],"answer":3,"explain":["Not quite. Decentration is a concrete operational ability that helps children conserve.","Not quite. Propositional thought is a formal operational ability.","Not quite. Horizontal decalage describes gradual mastery of concrete operational tasks.","Correct. Irreversibility is the inability to mentally reverse the steps of a problem."]},{"type":"mc","section":"The Concrete and Formal Operational Stages","prompt":"A child understands conservation of number at age 6 but does not understand conservation of weight until about age 10. What did Piaget call this pattern?","choices":["Equilibration","Horizontal decalage","Guided participation","Egocentrism"],"answer":1,"explain":["Not quite. Equilibration is the back-and-forth between equilibrium and disequilibrium that drives change.","Correct. Horizontal decalage is the gradual, step-by-step mastery of logical concepts within a stage.","Not quite. Guided participation is a sociocultural concept from Rogoff.","Not quite. Egocentrism is failing to take others' viewpoints into account."]},{"type":"mc","section":"Evaluating Piaget's Theory","prompt":"What has follow-up research using the violation-of-expectation method suggested about Piaget's account of infancy?","choices":["Piaget overestimated infants' understanding of objects","Infants do not understand objects until age three","Piaget underestimated infants, who show signs of object permanence earlier than he thought","Object permanence cannot be measured in infants"],"answer":2,"explain":["Not quite. The research suggests the opposite.","Not quite. The evidence points to much earlier understanding.","Correct. Looking-time studies suggest awareness of hidden objects in the first months of life.","Not quite. Researchers have measured it using looking time and search tasks."]},{"type":"mc","section":"The Core Knowledge Perspective","prompt":"How does the core knowledge perspective differ from Piaget's view of development?","choices":["It sees development as domain-specific and built on innate knowledge systems","It holds that infants are born with no knowledge at all","It claims that culture is the sole source of cognitive development","It argues that all thinking develops through one general process across domains"],"answer":0,"explain":["Correct. Core knowledge theorists propose innate, domain-specific systems rather than a general process.","Not quite. Core knowledge theory says infants begin with innate knowledge.","Not quite. That is closer to an extreme sociocultural view, not core knowledge theory.","Not quite. A general process across domains describes Piaget's view, not core knowledge theory."]},{"type":"mc","section":"Vygotsky's Sociocultural Theory and Educational Implications","prompt":"According to Vygotsky, what is the main function of private speech?","choices":["It shows that young children cannot take others' perspectives","It is a sign of delayed language development","It replaces the need for adult help","It helps children plan and guide their own behavior"],"answer":3,"explain":["Not quite. That is Piaget's interpretation of egocentric speech, not Vygotsky's.","Not quite. Private speech is a normal and useful part of development.","Not quite. Vygotsky saw adult and peer support as central; private speech grows out of that support.","Correct. Vygotsky saw private speech as a tool for self-guidance that later becomes inner speech."]},{"type":"tf","section":"The Sensorimotor Stage","prompt":"In Piaget's final sensorimotor substage, children gain mental representation, which makes deferred imitation and make-believe play possible.","choices":["True","False"],"answer":0,"explain":["Correct. Mental representation, appearing around 18 months to 2 years, allows deferred imitation and make-believe.","Not quite. Piaget did place the appearance of mental representation, and with it deferred imitation and make-believe, in the final sensorimotor substage."]},{"type":"tf","section":"Vygotsky's Sociocultural Theory and Educational Implications","prompt":"Private speech is most common when children are working on very easy tasks.","choices":["True","False"],"answer":1,"explain":["Not quite. Children use more private speech, not less, when tasks are difficult.","Correct. Private speech increases when tasks are challenging, because children use it to guide their efforts."]},{"type":"scenario","section":"The Concrete and Formal Operational Stages","prompt":"A science teacher asks students to find out what makes a pendulum swing faster. One student changes the string length while keeping the weight and push the same, then tests weight while keeping the other factors constant. Which ability does this show?","choices":["Seriation","Hypothetico-deductive reasoning","Secondary circular reactions","Centration"],"answer":1,"explain":["Not quite. Seriation is ordering items along a dimension, not testing hypotheses.","Correct. Systematically testing one variable at a time is formal operational hypothetico-deductive reasoning.","Not quite. Secondary circular reactions are infant behaviors that repeat interesting effects.","Not quite. Centration is focusing on one feature and ignoring others; this student considers each factor in turn."]},{"type":"scenario","section":"Vygotsky's Sociocultural Theory and Educational Implications","prompt":"A child cannot solve a word problem alone but solves it when the teacher breaks it into steps and asks guiding questions. In Vygotsky's terms, this problem lies within the child's","choices":["sensorimotor stage","core knowledge domain","state of equilibrium","zone of proximal development"],"answer":3,"explain":["Not quite. The sensorimotor stage is Piaget's stage of infancy.","Not quite. Core domains are innate knowledge systems proposed by core knowledge theorists.","Not quite. Equilibrium is a Piagetian concept about schemes fitting experience.","Correct. Tasks a child can do with help but not alone fall within the zone of proximal development."]},{"type":"scenario","section":"The Preoperational Stage","prompt":"Two equal rows of seven coins are lined up. A researcher spreads out one row, and a 4-year-old says that row now has more coins. Which explanation fits Piaget's view?","choices":["The child is using hypothetico-deductive reasoning","The child has mastered hierarchical classification","The child is centering on the length of the row and ignoring the number of coins","The child shows the A-not-B search error"],"answer":2,"explain":["Not quite. Hypothetico-deductive reasoning is a formal operational ability.","Not quite. Classification is a different task, and preschoolers usually struggle with it.","Correct. Centration on length leads to a failure of number conservation.","Not quite. The A-not-B error is an infant search error."]}]},{"id":"m07","num":7,"title":"Cognitive Development: An Information-Processing Perspective","tagline":"How children take in, hold, transform and retrieve information, and how attention, memory strategies, knowledge and awareness of their own thinking improve with age.","objectives":["Describe the store model of the mind, including the sensory register, working memory, long-term memory and the central executive.","Explain how selective, adaptable and planful attention develop and how ADHD affects attention and self-control.","Compare the memory strategies of rehearsal, organization and elaboration and explain why they emerge at different ages.","Distinguish recognition, recall and reconstruction, and explain how knowledge, scripts and suggestive questioning shape what children remember.","Explain metacognition, cognitive self-regulation and Siegler's overlapping-waves model of strategy change.","Apply information-processing ideas to children's learning of reading and mathematics."],"sections":[{"heading":"The Information-Processing Approach","paragraphs":["The information-processing approach views the mind as a system that takes in information, transforms it, stores it and retrieves it, somewhat like a computer. Researchers try to describe each step precisely, often with flowcharts. Rather than proposing broad stages like Piaget, most information-processing theorists see development as gradual, continuous improvement in specific skills such as attention, memory and strategy use.","The best-known framework is the store model. Information first enters the sensory register, where sights and sounds are held very briefly in a rich but fleeting form. Whatever we attend to moves into working, or short-term, memory, the conscious workspace where we actively think about a limited amount of information. Information that is processed well can be transferred to long-term memory, our large and relatively permanent knowledge base.","The central executive is the part of working memory that directs the flow of information. It decides what to attend to, coordinates incoming information with what is already known, selects strategies and inhibits irrelevant thoughts. Working-memory capacity and processing speed increase with age, partly because the brain matures and partly because practice makes skills more automatic, which frees up space for new tasks.","Connectionist, or neural network, models offer a different view. They simulate learning with networks of simple processing units linked by connections whose strengths change with experience. Such models can mimic patterns seen in children, such as sudden-seeming improvements that actually result from many small adjustments, suggesting that complex skills can emerge from simple learning mechanisms."],"example":"When a 9-year-old copies a phone number, the digits pass through the sensory register, are held in working memory while she repeats them, and may never reach long-term memory if she stops paying attention."},{"heading":"Attention","paragraphs":["Attention is fundamental because it determines what information is processed at all. With age, children become better at selective attention, focusing on relevant information while ignoring distractions. This improvement depends heavily on inhibition, the ability to hold back unwanted thoughts and responses, which grows steadily from early childhood into adolescence as the prefrontal cortex matures.","Attention also becomes more adaptable. Older children flexibly adjust their focus to the demands of a task, for example shifting attention to the parts of a lesson they have not yet mastered. Attention becomes more planful as well. Older children are better at thinking out a sequence of steps in advance, searching systematically and allocating attention so that a goal is reached efficiently. Adults can support planning by involving children in everyday planning activities.","Attention-deficit hyperactivity disorder (ADHD) is a condition marked by inattention, impulsivity and, often, excessive motor activity that interfere with school and social life. It is more often diagnosed in boys. Heredity plays a substantial role, and children with ADHD tend to show deficits in executive function, especially inhibition and working memory. Environmental factors such as prenatal exposure to toxins and family stress can also contribute.","Treatment for ADHD usually combines approaches. Stimulant medication can reduce symptoms for many children, but it does not teach skills. Behavioral interventions that model and reinforce appropriate behavior, along with parent training and classroom support, are important additions. Because ADHD often persists into adulthood, long-term support for organization and self-control is valuable."],"example":"Asked to find all the red toys in a messy room, a 4-year-old wanders and is distracted by a ball, while a 9-year-old scans one shelf at a time and finishes quickly."},{"heading":"Memory Strategies","paragraphs":["Memory strategies are deliberate mental activities that increase the chances of holding information in working memory and transferring it to long-term memory. The simplest is rehearsal, repeating information to oneself. Young school-age children rehearse in a narrow way, repeating one item at a time, while older children combine earlier items with each new one, which is far more effective.","Organization means grouping related items together, such as remembering a shopping list by category. Young children may group items by sound or by how they go together in everyday life, whereas older children increasingly group by taxonomic category, such as animals
