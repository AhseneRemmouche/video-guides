 or furniture. Organization improves when children know a lot about the material and when adults teach and encourage it.","Elaboration involves creating a relationship, or shared meaning, between two or more pieces of information that are not in the same category, often by forming a mental image or sentence. Elaboration appears later than rehearsal and organization, usually in adolescence, because it requires holding and manipulating several items in working memory at once.","Children often go through a period of utilization deficiency, in which they use a new strategy consistently but gain little from it, because carrying out the strategy takes up so much working memory. With practice the strategy becomes more automatic and begins to pay off. Schooling, which regularly asks children to memorize material, strongly encourages strategy use."],"example":"To remember the words fish and bicycle, a teenager imagines a fish riding a bicycle. That vivid link is elaboration."},{"heading":"Retrieval, Knowledge and Scripts","paragraphs":["Retrieval is getting information back out of long-term memory. Recognition, noticing that a stimulus is identical or similar to one seen before, is the easiest form and appears even in young infants. Recall, generating a mental image of something that is not present, is much harder. Recall improves steadily with age as children gain knowledge, strategies and better language skills.","Remembering is not simply copying the past. In reconstruction, people actively select and interpret information and then, when recalling it, rebuild the memory, often adding details that fit their expectations. Even preschoolers reconstruct stories, and school-age children increasingly draw inferences that go beyond what they actually heard. Fuzzy-trace theory adds that we store both exact verbatim traces and vaguer gist versions, and that reliance on gist increases with age.","Knowledge strongly affects memory. When children know a lot about a subject, new information is easier to organize, interpret and retrieve. For example, child chess experts can recall chessboard positions better than adults who are chess novices, even though the adults outperform them on other memory tasks. Part of the age gain in memory is therefore a gain in knowledge.","Children also form scripts, general representations of what happens and when in familiar events, such as going to a restaurant or a birthday party. Scripts help children predict and organize everyday experience and are an early form of long-term memory organization. However, routine details can blur together, so children may struggle to remember what happened on one particular occasion."],"example":"Asked about his last trip to the dentist, a 5-year-old says, You sit in the big chair, they look at your teeth, and you get a sticker. He is describing a script, not a specific visit."},{"heading":"Autobiographical Memory and Eyewitness Testimony","paragraphs":["Autobiographical memory refers to representations of personally meaningful, one-time events. Most adults cannot recall events from before about age 3, a phenomenon called infantile amnesia. Explanations include immaturity of brain regions involved in memory, especially the prefrontal cortex, and the absence of a clear self-concept. A sense of self gives children a framework for organizing events as things that happened to me.","Language and conversation also matter. When parents talk with children about past events in an elaborative style, asking open questions and adding rich detail, children develop longer and more coherent autobiographical memories. Parents who use a repetitive style, asking the same narrow questions, tend to have children whose recollections are thinner. Cultural differences in this talk help explain differences in the content of early memories.","Children are increasingly asked to serve as eyewitnesses in legal cases. Compared with older children and adults, preschoolers are more suggestible, meaning they are more likely to accept misleading information from adults' questions. Leading questions, repeated interviews, stereotyping a person in advance and rewarding particular answers can all lead young children to report events that never happened.","Even so, when interviewed properly, young children can give accurate testimony. Recommended practices include using neutral, open-ended questions, avoiding pressure and rewards, interviewing as soon as possible after the event and having trained interviewers. Older children and adolescents are less suggestible but can still be misled by skilled questioning, so careful interviewing matters at every age."],"example":"An interviewer asks a 4-year-old, He touched you, didn't he? Because the question implies the answer, it is a leading question that can distort the child's report."},{"heading":"Metacognition, Self-Regulation and Strategy Change","paragraphs":["Metacognition is awareness and understanding of mental activities, or thinking about thinking. Preschoolers begin to build a theory of mind, a coherent understanding of people as mental beings with desires, beliefs and intentions. Around age 4, children pass false-belief tasks, recognizing that others can hold beliefs that differ from reality. School-age children add a richer understanding of how mental processes such as attention and memory work.","Knowing about strategies is not enough; children must also use that knowledge. Cognitive self-regulation is the process of continuously monitoring progress toward a goal, checking outcomes and redirecting unsuccessful efforts. It develops slowly throughout childhood and adolescence. Parents and teachers foster it by pointing out the important features of tasks, suggesting strategies and explaining why they work. Self-regulation predicts academic success.","Robert Siegler's overlapping-waves model describes how children choose strategies. At any age, children have several strategies available, and they experiment with them, like waves overlapping on a beach. With experience, strategies that produce fast, accurate solutions become more frequent, while less effective ones fade, though they may not disappear completely. Development is therefore a matter of gradually shifting the mix of strategies, not abruptly replacing one with another."],"example":"A 7-year-old solving 3 + 8 sometimes counts all the fingers, sometimes counts on from 8 and sometimes simply retrieves the answer. Over months, counting on and retrieval become more common."},{"heading":"Applications to Reading and Mathematics","paragraphs":["Reading draws on many information-processing skills at once: perceiving letters, linking them to sounds, retrieving word meanings, holding sentences in working memory and integrating ideas. Phonological awareness, the ability to reflect on and manipulate the sound structure of spoken language, strongly predicts early reading success. When basic skills like decoding become automatic, working memory is freed for comprehension.","Debate has contrasted the whole-language approach, which immerses children in meaningful text, with the phonics approach, which teaches the rules for translating letters into sounds. Research supports a balanced combination: children benefit from systematic phonics instruction, especially at the start, while also reading engaging, meaningful material. Children who struggle with reading often have weaknesses in phonological processing.","Mathematics also builds on early foundations. Infants and toddlers are sensitive to small quantities, and preschoolers learn counting principles. In school, children move from counting strategies to retrieving basic facts from memory. Effective math teaching combines practice to make basic facts automatic with a strong emphasis on conceptual understanding, so that children know why procedures work rather than only memorizing steps."],"example":"A first grader who can quickly hear that cat and hat rhyme, and that cat without the c sound is at, is showing phonological awareness."}],"terms":[{"term":"Sensory register","def":"The first part of the information-processing system, where sights and sounds are held very briefly before they fade or are attended to."},{"term":"Working (short-term) memory","def":"The conscious, limited-capacity part of the mind where we actively work with a small amount of information."},{"term":"Long-term memory","def":"The large, relatively permanent store of knowledge in the information-processing system."},{"term":"Central executive","def":"The part of working memory that directs attention, coordinates information and selects and monitors strategies."},{"term":"Inhibition","def":"The ability to control internal and external distracting stimuli and hold back unwanted responses."},{"term":"Attention-deficit hyperactivity disorder (ADHD)","def":"A condition involving inattention, impulsivity and often excessive motor activity, linked to deficits in executive function."},{"term":"Rehearsal","def":"A memory strategy that involves repeating information to oneself."},{"term":"Organization","def":"A memory strategy that involves grouping related items together, for example by category."},{"term":"Elaboration","def":"A memory strategy that creates a relationship or shared meaning between items that are not in the same category."},{"term":"Reconstruction","def":"Actively selecting, interpreting and rebuilding information when remembering, often adding details that fit expectations."},{"term":"Script","def":"A general representation of what happens and when in a familiar, recurring event."},{"term":"Infantile amnesia","def":"The inability of most people to recall events that happened before about age 3."},{"term":"Metacognition","def":"Awareness and understanding of one's own mental activities; thinking about thinking."},{"term":"Overlapping-waves model","def":"Siegler's view that children try out several strategies at once and gradually favor those that are fastest and most accurate."}],"questions":[{"type":"mc","section":"The Information-Processing Approach","prompt":"In the store model, which component is described as the conscious workspace where a limited amount of information is actively manipulated?","choices":["Sensory register","Long-term memory","Working memory","Script"],"answer":2,"explain":["Not quite. The sensory register holds information very briefly before it is attended to; we do not actively work on it there.","Not quite. Long-term memory is the large, permanent knowledge store, not the limited conscious workspace.","Correct. Working, or short-term, memory is where we consciously and actively work with a small amount of information.","Not quite. A script is a representation of a familiar event stored in memory, not a component of the store model."]},{"type":"mc","section":"The Information-Processing Approach","prompt":"Which statement best describes how most information-processing theorists view cognitive development?","choices":["As gradual, continuous improvement in specific skills","As a series of four broad, qualitatively different stages","As fixed at birth and unaffected by practice","As driven mainly by social conflict between peers"],"answer":0,"explain":["Correct. Most information-processing researchers see development as steady, continuous improvement in skills such as attention, memory and strategy use.","Not quite. Broad qualitative stages are characteristic of Piaget's theory, not the information-processing approach.","Not quite. Capacity and speed increase with brain maturation and practice, so development is not fixed at birth.","Not quite. Peer conflict is not the central mechanism in information-processing accounts."]},{"type":"mc","section":"Attention","prompt":"Improvements in selective attention during childhood depend most heavily on which ability?","choices":["Recognition memory","Inhibition","Elaboration","Script formation"],"answer":1,"explain":["Not quite. Recognition is a form of retrieval that is present even in infancy; it does not explain improved focus.","Correct. Inhibition, holding back distracting thoughts and responses, is central to focusing on relevant information.","Not quite. Elaboration is a memory strategy for linking items, not the basis of selective attention.","Not quite. Scripts organize memory for familiar events; they are not the basis of selective attention."]},{"type":"mc","section":"Memory Strategies","prompt":"Why does elaboration usually appear later than rehearsal and organization?","choices":["It depends only on vocabulary size","It is taught only in high school","It requires holding and manipulating several items in working memory at once","It is a form of recognition memory that matures in adolescence"],"answer":2,"explain":["Not quite. Vocabulary helps, but the main limit is the working-memory demand of linking items.","Not quite. The strategy's late appearance reflects cognitive demands, not simply when it is taught.","Correct. Creating a meaningful link between unrelated items requires keeping and transforming several items in working memory, which becomes easier in adolescence.","Not quite. Elaboration is a strategy for storing information, not a type of retrieval such as recognition."]},{"type":"mc","section":"Retrieval, Knowledge and Scripts","prompt":"Child chess experts recall chessboard positions better than adult chess novices. This finding mainly shows that","choices":["children have larger working-memory capacity than adults","recognition is easier than recall","scripts interfere with memory for specific events","knowledge about a domain improves memory for information in that domain"],"answer":3,"explain":["Not quite. Adults outperform these children on other memory tasks, so capacity is not the explanation.","Not quite. The finding concerns expertise, not a comparison of recognition and recall.","Not quite. The finding is about expertise in chess, not about scripts for everyday events.","Correct. Extensive knowledge makes new information in that domain easier to organize and retrieve."]},{"type":"mc","section":"Autobiographical Memory and Eyewitness Testimony","prompt":"Which parental conversation style is linked to children developing richer, more coherent autobiographical memories?","choices":["A repetitive style that asks the same narrow questions","An elaborative style that asks open questions and adds detail","Avoiding discussion of past events","Correcting every error the child makes"],"answer":1,"explain":["Not quite. Children of parents with a repetitive style tend to have thinner recollections.","Correct. Elaborative talk about the past helps children build longer, more detailed and coherent autobiographical memories.","Not quite. Talking about past events supports, rather than hinders, autobiographical memory.","Not quite. Constant correction is not the style associated with richer memories; open, detailed conversation is."]},{"type":"mc","section":"Metacognition, Self-Regulation and Strategy Change","prompt":"According to Siegler's overlapping-waves model, how do children's strategies change with age?","choices":["Each new strategy abruptly replaces the previous one","Children use only one strategy at a time until a new stage begins","Strategies are acquired solely through direct instruction","Several strategies coexist, and effective ones gradually become more frequent"],"answer":3,"explain":["Not quite. The model specifically rejects abrupt replacement; strategies overlap.","Not quite. Children have several strategies available at the same time.","Not quite. Experimentation and experience, not only instruction, drive the changes.","Correct. Children try out multiple strategies, and fast, accurate ones become more common while weaker ones fade."]},{"type":"tf","section":"Memory Strategies","prompt":"During a utilization deficiency, children use a new memory strategy consistently but gain little benefit from it.","choices":["True","False"],"answer":0,"explain":["Correct. Carrying out a new strategy uses so much working memory that it does not yet improve recall.","Not quite. This is exactly what utilization deficiency means; the benefit comes later as the strategy becomes automatic."]},{"type":"tf","section":"Autobiographical Memory and Eyewitness Testimony","prompt":"Because preschoolers are suggestible, they can never give accurate eyewitness testimony.","choices":["True","False"],"answer":1,"explain":["Not quite. Preschoolers are more suggestible, but with neutral, open-ended interviewing they can report events accurately.","Correct. Proper interviewing techniques allow even young children to give accurate testimony."]},{"type":"scenario","section":"Memory Strategies","prompt":"Asked to memorize a list containing apple, dog, chair, banana, cat and table, 10-year-old Mia rewrites it as fruits, animals and furniture before studying. Which strategy is Mia using?","choices":["Rehearsal","Elaboration","Reconstruction","Organization"],"answer":3,"explain":["Not quite. Rehearsal means repeating items, not regrouping them.","Not quite. Elaboration links items from different categories through a shared meaning or image.","Not quite. Reconstruction describes how memories are rebuilt during recall, not a study strategy.","Correct. Grouping items by taxonomic category is the strategy of organization."]},{"type":"scenario","section":"Retrieval, Knowledge and Scripts","prompt":"After hearing a story in which a girl pounds a nail into a board, a child later insists the story said she used a hammer, although the tool was never named. What memory process does this illustrate?","choices":["Reconstruction","Recognition","Rehearsal","Infantile amnesia"],"answer":0,"explain":["Correct. The child interpreted the story and rebuilt it with an inferred detail, which is reconstruction.","Not quite. Recognition is noticing that something was seen before, not adding inferred details.","Not quite. Rehearsal is repeating information, which does not explain the added detail.","Not quite. Infantile amnesia concerns the loss of memories from before about age 3."]},{"type":"scenario","section":"Applications to Reading and Mathematics","prompt":"A kindergarten teacher has children clap the syllables in their names and find words that start with the same sound. Which skill, a strong predictor of early reading, is she building?","choices":["Selective attention","Metacognition","Phonological awareness","Elaboration"],"answer":2,"explain":["Not quite. Attention is involved, but the activity targets awareness of sound structure.","Not quite. Metacognition is thinking about thinking, not reflecting on the sounds of words.","Correct. Reflecting on and manipulating the sounds of spoken words is phonological awareness.","Not quite. Elaboration is a memory strategy, not a sound-awareness skill."]}]},{"id":"m08","num":8,"title":"Intelligence","tagline":"What intelligence is, how it is measured, what IQ scores predict, why groups differ, and how early intervention, creativity and giftedness fit into the picture.","objectives":["Compare factor-analytic views of intelligence, including Spearman's g, Thurstone's primary mental abilities and Carroll's three-stratum model.","Explain Sternberg's triarchic theory, Gardner's multiple intelligences and the idea of emotional intelligence.","Describe major intelligence tests, how IQ scores are computed from the normal distribution, and why infant tests predict later IQ poorly.","Summarize what IQ predicts and evaluate evidence on heredity and environment, including heritability, adoption studies and the Flynn effect.","Evaluate concerns about test bias, stereotype threat and dynamic assessment, and describe the effects of early intervention such as Head Start.","Define creativity and giftedness and explain how they can be nurtured."],"sections":[{"heading":"Defining Intelligence: Factor-Analytic Views","paragraphs":["Early intelligence tests were built to predict school success, and researchers soon asked whether intelligence is one ability or many. To answer, they used factor analysis, a statistical technique that identifies clusters of test items or subtests that correlate with one another. Each cluster, or factor, is thought to reflect an underlying ability.","Charles Spearman noticed that people who do well on one mental test tend to do well on others. He proposed a general factor, called g, that underlies all mental abilities, along with specific factors unique to particular tasks. Louis Thurstone disagreed, arguing that intelligence consists of several relatively separate primary mental abilities, such as verbal meaning, perceptual speed, reasoning, number, rote memory, word fluency and spatial visualization.","Modern theorists combine these ideas in hierarchical models. John Carroll's three-stratum theory places g at the top, a set of broad abilities in the middle, and many narrow, specific abilities at the bottom. A related distinction separates crystallized intelligence, which depends on accumulated knowledge and culturally valued skills, from fluid intelligence, which depends on basic information-processing skills such as detecting relationships in new problems."],"example":"A student who scores high on vocabulary, arithmetic and puzzle subtests alike shows the pattern that led Spearman to propose g."},{"heading":"Broader Theories: Sternberg, Gardner and Emotional Intelligence","paragraphs":["Robert Sternberg's triarchic theory of successful intelligence describes three interacting broad abilities. Analytical intelligence involves the information-processing skills used to analyze and evaluate problems, the kind most tests measure. Creative intelligence is the capacity to solve novel problems and generate new ideas. Practical intelligence involves applying knowledge to everyday situations and adapting to, shaping or selecting environments. Sternberg argues that intelligence tests capture only a narrow slice of these abilities.","Howard Gardner's theory of multiple intelligences proposes at least eight independent intelligences: linguistic, logico-mathematical, musical, spatial, bodily-kinesthetic, naturalist, interpersonal and intrapersonal. Gardner based these on evidence such as distinct brain regions, unique developmental courses and people with exceptional talent in one area. Critics note that some of these abilities are correlated and that they may be better described as talents, but the theory has inspired teachers to support varied strengths.","Emotional intelligence refers to the ability to perceive, understand, express and regulate emotions in oneself and others. Measures of emotional intelligence are modestly related to IQ and predict social competence, self-esteem and good relationships. Many schools now use social-emotional learning programs to build these skills, although researchers continue to debate how best to measure them."],"example":"A teenager who struggles with algebra but can calm a frightened younger sibling and read the mood of a room shows strengths that Gardner would call interpersonal intelligence."},{"heading":"Measuring Intelligence","paragraphs":["Intelligence tests used today usually provide an overall score along with scores for separate abilities. The Stanford-Binet Intelligence Scales, descended from Alfred Binet's original test, can be given to individuals from early childhood to adulthood and assess both general intelligence and factors such as fluid reasoning, knowledge, quantitative reasoning, visual-spatial processing and working memory, through both verbal and nonverbal items.","The Wechsler Intelligence Scale for Children (WISC) is widely used for school-age children and adolescents, with a companion test for preschoolers. It yields a full-scale IQ and index scores for abilities such as verbal comprehension, visual-spatial reasoning, fluid reasoning, working memory and processing speed. Wechsler tests were among the first designed to reduce cultural bias by including nonverbal tasks and by standardizing on representative samples.","Infant tests, such as the Bayley Scales of Infant and Toddler Development, measure mostly perceptual and motor responses along with early language and social behavior. Because these items differ so much from the verbal and reasoning tasks of later tests, infant scores predict later IQ poorly, except for babies with very low scores. They are mainly used to screen for developmental problems. Measures of speed of habituation and recovery to new stimuli predict later IQ somewhat better."],"example":"A pediatric psychologist uses a Bayley assessment to check whether a 12-month-old born very early is on track, not to predict the child's future IQ."},{"heading":"IQ Scores and What They Predict","paragraphs":["Intelligence tests are standardized, meaning they are given to a large, representative sample whose performance serves as the standard for interpreting individual scores. Scores in the population form a normal distribution, a bell-shaped curve in which most people score near the middle and fewer score at the extremes. The intelligence quotient, or IQ, compares an individual's performance with that of same-age peers.","IQ tests are set so that the mean is 100 and the standard deviation is 15. About two-thirds of people score between 85 and 115, and about 95 percent score between 70 and 130. A score therefore tells us how far above or below average a child performed compared with others of the same age, not how much a child knows in absolute terms.","IQ becomes fairly stable after early childhood, although individual children can show large changes, especially those living in poverty. IQ is a good predictor of school achievement and years of education, and it is moderately related to later occupational attainment and job performance. However, other factors such as motivation, family background, personality and practical skills also contribute substantially to life success."],"example":"A child with an IQ of 115 scored one standard deviation above the mean, higher than roughly 84 percent of same-age children."},{"heading":"Group Differences: Heredity and Environment","paragraphs":["In many countries, average IQ scores differ between ethnic and socioeconomic groups, and the causes have been hotly debated. Heritability estimates, obtained mainly from twin studies, indicate the proportion of variation in a trait within a population that is linked to genetic differences. For IQ, estimates are moderate. However, heritability applies to a specific population and does not explain differences between groups or show that a trait cannot be changed.","Adoption studies show that environment matters a great deal. Children adopted early from impoverished backgrounds into advantaged homes typically score well above the average for their birth families, although their scores still correlate with those of their biological parents. Both genes and environment therefore contribute to individual differences, and a stimulating home can raise a child's IQ well above what family background alone would predict.","The Flynn effect, the large rise in average IQ scores across generations in many nations, provides powerful evidence for environmental influence. The gains are too rapid to be genetic and are linked to improvements in education, nutrition, health and the complexity of daily life. Because the gains are greatest in fluid abilities, they suggest that modern environments exercise abstract reasoning."],"example":"Adopted children raised in a stimulating, well-resourced home score higher on IQ tests than their biological siblings raised in poverty, even though they share many genes."},{"heading":"Test Bias, Stereotype Threat and Dynamic Assessment","paragraphs":["Some experts argue that IQ tests are biased because they sample knowledge and communication styles that are more familiar to children from the dominant culture. For example, a child from a culture that values cooperative problem solving or story-like answers may be unfamiliar with the question-and-answer format of testing. Others reply that IQ predicts school achievement about equally well across groups, so the tests are not biased in that statistical sense.","Stereotype threat is the fear of being judged on the basis of a negative stereotype, which can trigger anxiety that interferes with performance. When members of a stereotyped group are told a test measures ability, their scores can drop; when the same test is described as unrelated to ability, the gap often narrows. Stereotype threat may also lead students to disengage from school over time.","Dynamic assessment is an alternative approach based on Vygotsky's zone of proximal development. Instead of measuring what a child already knows, the examiner introduces purposeful teaching during testing to see how well the child learns with support. This reveals a child's potential and suggests teaching strategies, and it can reduce the disadvantage faced by children unfamiliar with standard test formats."],"example":"During a puzzle task, a tester gives a child a hint and then notes how quickly the child applies it to new puzzles. This is dynamic assessment."},{"heading":"Early Intervention, Creativity and Giftedness","paragraphs":["Early intervention programs aim to offset the effects of poverty on development. Head Start, a U.S. program begun in the 1960s, provides preschool education, health services and family support. Children in high-quality programs often show immediate gains in IQ and achievement that fade over the school years, but long-term benefits such as less grade retention and special-education placement, higher graduation rates and better adult outcomes are often found, especially for intensive programs that involve parents.","Giftedness refers to exceptional intellectual strengths. Gifted children may have very high IQ scores, but definitions have broadened to include creativity and talent. Creativity is the ability to produce work that is original yet appropriate. Tests of creativity often measure divergent thinking, generating multiple and unusual possibilities, in contrast to convergent thinking, arriving at a single correct answer, which IQ tests emphasize.","Talent, outstanding performance in a specific field, depends on more than ability. Gifted and talented children typically benefit from parents and teachers who nurture their interests, provide challenging opportunities and encourage long hours of practice. Schools may offer enrichment, acceleration or programs built around multiple intelligences. Highly creative adult accomplishment also requires persistence and expertise built over years."],"example":"Asked to list all the uses of a paper clip, one child names three while another lists twenty, including unusual ones like a tiny fishing hook. The second child shows strong divergent thinking."}],"terms":[{"term":"Factor analysis","def":"A statistical procedure that identifies clusters of correlated test items or subtests, each thought to reflect an underlying ability."},{"term":"General intelligence (g)","def":"Spearman's common factor that underlies performance on all mental tests."},{"term":"Primary mental abilities","def":"Thurstone's set of separate intellectual abilities, such as verbal meaning, number and spatial visualization."},{"term":"Crystallized intelligence","def":"Skills that depend on accumulated knowledge and experience, such as vocabulary and general information."},{"term":"Fluid intelligence","def":"Basic information-processing skills used to detect relationships and solve new problems."},{"term":"Triarchic theory of successful intelligence","def":"Sternberg's theory that intelligence involves interacting analytical, creative and practical abilities."},{"term":"Theory of multiple intelligences","def":"Gardner's proposal that there are at least eight independent intelligences, each with its own processing operations."},{"term":"Emotional intelligence","def":"The ability to perceive, understand, express and regulate emotions in oneself and others."},{"term":"Intelligence quotient (IQ)","def":"A score that compares an individual's test performance with that of same-age peers, with a mean of 100 and standard deviation of 15."},{"term":"Heritability estimate","def":"A statistic indicating how much of the variation in a trait within a specific population is linked to genetic differences."},{"term":"Flynn effect","def":"The steady rise in average IQ scores across generations, attributed to environmental improvements."},{"term":"Stereotype threat","def":"Anxiety about being judged by a negative stereotype, which can impair test performance."},{"term":"Dynamic assessment","def":"A testing approach in which the examiner provides teaching during the test to measure how well the child learns with support."},{"term":"Divergent thinking","def":"Generating multiple and unusual possibilities when faced with a task or problem; a key part of creativity."}],"questions":[{"type":"mc","section":"Defining Intelligence: Factor-Analytic Views","prompt":"Spearman proposed the concept of g because he observed that","choices":["intelligence scores rise across generations","people who do well on one mental test tend to do well on others","infant test scores strongly predict adult IQ","intelligence consists of eight independent abilities"],"answer":1,"explain":["Not quite. Rising scores across generations describe the Flynn effect, not the basis for g.","Correct. The positive correlations among diverse mental tests led Spearman to propose a general factor.","Not quite. Infant tests actually predict later IQ poorly, and this was not Spearman's observation.","Not quite. Eight independent intelligences is Gardner's view, which contrasts with a single g."]},{"type":"mc","section":"Defining Intelligence: Factor-Analytic Views","prompt":"Which type of intelligence depends mainly on accumulated knowledge and culturally valued skills?","choices":["Fluid intelligence","Practical intelligence","Crystallized intelligence","Intrapersonal intelligence"],"answer":2,"explain":["Not quite. Fluid intelligence relies on basic processing skills for solving new problems, not accumulated knowledge.","Not quite. Practical intelligence, from Sternberg's theory, concerns applying knowledge to everyday situations.","Correct. Crystallized intelligence reflects knowledge and skills gained through experience and schooling.","Not quite. Intrapersonal intelligence, in Gardner's theory, involves understanding oneself."]},{"type":"mc","section":"Broader Theories: Sternberg, Gardner and Emotional Intelligence","prompt":"Which set lists the three broad abilities in Sternberg's triarchic theory?","choices":["Analytical, creative and practical","Verbal, spatial and numerical","Fluid, crystallized and general","Linguistic, musical and naturalist"],"answer":0,"explain":["Correct. Sternberg's theory describes analytical, creative and practical intelligence.","Not quite. These resemble some of Thurstone's primary mental abilities, not Sternberg's theory.","Not quite. These terms come from factor-analytic and hierarchical models.","Not quite. These are three of Gardner's multiple intelligences."]},{"type":"mc","section":"Measuring Intelligence","prompt":"Why do infant intelligence tests predict later IQ poorly for most babies?","choices":["Infants are tested only by untrained examiners","Infant tests are not standardized","IQ is completely determined by experiences after age 5","Infant tests mainly assess perceptual and motor skills that differ from later reasoning and verbal tasks"],"answer":3,"explain":["Not quite. Infant tests are given by trained professionals; examiner skill is not the main issue.","Not quite. Infant tests such as the Bayley are standardized.","Not quite. Both heredity and early experience matter; IQ is not wholly set by later experience.","Correct. The items on infant tests differ greatly from the abilities measured in later childhood, so the scores are only weakly related."]},{"type":"mc","section":"IQ Scores and What They Predict","prompt":"On a test with a mean of 100 and a standard deviation of 15, about two-thirds of children score between","choices":["70 and 130","85 and 115","90 and 110","100 and 130"],"answer":1,"explain":["Not quite. The range from 70 to 130 covers about 95 percent of scores, two standard deviations on either side.","Correct. One standard deviation above and below the mean, 85 to 115, includes about two-thirds of scores.","Not quite. This range is narrower than one standard deviation on either side of the mean.","Not quite. This range only covers scores above the mean, so it cannot include two-thirds of children."]},{"type":"mc","section":"Group Differences: Heredity and Environment","prompt":"Why is the Flynn effect considered strong evidence for environmental influences on IQ?","choices":["It shows that IQ is not heritable at all","It shows that IQ tests are culturally biased","The gains occurred too quickly across generations to be explained by genetic change","It appears only in children adopted into advantaged homes"],"answer":2,"explain":["Not quite. IQ is moderately heritable; the Flynn effect shows environment also matters, not that genes do not.","Not quite. The Flynn effect concerns score gains over time, not test bias.","Correct. Genetic change cannot happen that fast, so the rising scores point to improvements in education, health and daily life.","Not quite. The Flynn effect is a population-wide trend, not limited to adoptees."]},{"type":"mc","section":"Early Intervention, Creativity and Giftedness","prompt":"What long-term pattern is commonly found for children who attend high-quality early intervention programs such as Head Start?","choices":["IQ gains may fade, but benefits such as less grade retention and higher graduation rates often last","Large IQ gains persist unchanged into adulthood","No benefits of any kind are found","Children show lower achievement than peers who did not attend"],"answer":0,"explain":["Correct. Early IQ and achievement gains often fade, yet lasting benefits in school progress and adult life are frequently found.","Not quite. Initial IQ gains usually diminish over the school years.","Not quite. Many studies report lasting benefits, especially for intensive programs that involve parents.","Not quite. Attendees do not fall behind; they often show better school outcomes."]},{"type":"tf","section":"Group Differences: Heredity and Environment","prompt":"A high heritability estimate for IQ within a population means that differences in average IQ between groups must be genetic.","choices":["True","False"],"answer":1,"explain":["Not quite. Heritability describes variation within a specific population and cannot explain differences between groups.","Correct. Heritability does not tell us the cause of between-group differences or whether a trait can be changed."]},{"type":"tf","section":"Broader Theories: Sternberg, Gardner and Emotional Intelligence","prompt":"Gardner's theory proposes that intelligence consists of several relatively independent abilities, such as musical, spatial and interpersonal intelligence.","choices":["True","False"],"answer":0,"explain":["Correct. Gardner proposed at least eight relatively independent intelligences.","Not quite. This accurately describes Gardner's theory of multiple intelligences."]},{"type":"scenario","section":"Test Bias, Stereotype Threat and Dynamic Assessment","prompt":"Before a math test, a researcher tells one group of girls that the test shows gender differences in ability and tells another group that it does not. The first group scores lower. Which concept best explains this result?","choices":["Dynamic assessment","The Flynn effect","Heritability","Stereotype threat"],"answer":3,"explain":["Not quite. Dynamic assessment involves teaching during a test, which did not happen here.","Not quite. The Flynn effect describes generational score gains, not situational drops.","Not quite. Heritability concerns genetic contributions, which cannot explain a difference created by instructions.","Correct. Being reminded of a negative stereotype created anxiety that interfered with performance."]},{"type":"scenario","section":"Test Bias, Stereotype Threat and Dynamic Assessment","prompt":"A school psychologist working with a recent immigrant child gives hints during problem solving and records how quickly the child uses them on new problems. Which approach is she using?","choices":["A standardized Wechsler administration","Dynamic assessment","Factor analysis","Divergent-thinking testing"],"answer":1,"explain":["Not quite. Standardized administration does not allow the examiner to teach during testing.","Correct. Teaching during testing to see how well the child learns with support is dynamic assessment.","Not quite. Factor analysis is a statistical method, not a way of testing an individual child.","Not quite. Divergent-thinking tests measure the generation of many ideas, not responsiveness to hints."]},{"type":"scenario","section":"Early Intervention, Creativity and Giftedness","prompt":"A teacher asks students to think of as many ways as possible to use an empty cardboard box. Which ability is this task mainly designed to assess?","choices":["Convergent thinking","Crystallized intelligence","Divergent thinking","Processing speed"],"answer":2,"explain":["Not quite. Convergent thinking means arriving at one correct answer, which this task does not require.","Not quite. The task does not depend mainly on accumulated knowledge.","Correct. Generating many, unusual possibilities is divergent thinking, a core part of creativity.","Not quite. Speed may play a minor role, but the task targets the number and originality of ideas."]}]},{"id":"m09","num":9,"title":"Language Development","tagline":"How children master the sounds, meanings, grammar and social uses of language, from early cooing to fluent conversation, and what theories explain this remarkable achievement.","objectives":["Identify the four components of language: phonology, semantics, grammar and pragmatics.","Compare behaviorist, nativist and interactionist theories of language development and the biological bases of language.","Describe prelinguistic development, including cooing, babbling, joint attention and child-directed speech.","Explain how children learn word meanings, including fast mapping, underextension, overextension and word-learning biases.","Trace grammatical development from telegraphic speech to complex sentences, including overregularization and mean length of utterance.","Explain the development of pragmatics, metalinguistic awareness and the effects of bilingualism."],"sections":[{"heading":"Components of Language and Theories of Development","paragraphs":["Language has four components. Phonology concerns the rules governing the structure and sequence of speech sounds. Semantics involves vocabulary, the way underlying concepts are expressed in words and word combinations. Grammar includes syntax, the rules by which words are arranged into sentences, and morphology, the use of grammatical markers such as endings for plural and past tense. Pragmatics refers to the rules for using language appropriately in social contexts.","The behaviorist view, associated with B. F. Skinner, held that language is learned through operant conditioning and imitation. Parents reinforce sounds that resemble words, and children copy what they hear. Reinforcement and imitation do contribute, but they cannot explain how children produce novel sentences they have never heard or why they make systematic errors that adults never model.","Noam Chomsky's nativist theory proposed that humans are born with a language acquisition device (LAD), an innate system containing a universal grammar, a set of rules common to all languages. This explains why children everywhere master complex grammar so quickly. Critics point out that grammar develops gradually and depends on input, which is hard to reconcile with a fully innate system.","Interactionist theories emphasize interactions between inner capacities and environmental influences. Some stress general cognitive abilities, such as statistical learning, while others stress the social context, arguing that children's drive to communicate with responsive adults fuels language learning. Most researchers today take an interactionist view, seeing language as the product of a biologically prepared brain working on rich, socially meaningful input."],"example":"A child who says I goed to the park produces a sentence no adult models, which is hard for a pure imitation account to explain."},{"heading":"Biological Bases and the Sensitive Period","paragraphs":["For most people, language is housed largely in the left hemisphere of the cerebral cortex. Two regions have been especially studied. Broca's area, in the left frontal lobe, supports grammatical processing and language production. Wernicke's area, in the left temporal lobe, plays a role in comprehending word meaning. Damage to these areas produces different types of aphasia, although modern brain imaging shows that language relies on wide networks connecting many regions.","Language areas are not fully specialized at birth. When young children suffer damage to the left hemisphere, other areas often take over language functions, showing considerable plasticity. Lateralization for language strengthens with age and experience. Language input itself helps the left hemisphere become specialized, so the brain and language experience shape each other. Recovery after injury is usually more complete in early childhood than in adulthood.","Researchers have proposed a sensitive period for language, a time when it is acquired most easily. Evidence comes from deaf adults who learned sign language at different ages, and from immigrants learning a second language. Those who begin in childhood typically reach higher levels of grammatical mastery and a native-like accent than those who start later. The decline is gradual rather than a sharp cutoff."],"example":"An adult who moved to a new country at age 25 may become fluent but keep a noticeable accent, while a younger sibling who arrived at age 5 speaks like a native."},{"heading":"Prelinguistic Development","paragraphs":["Long before their first words, infants are preparing to talk. Newborns are sensitive to a wide range of speech sounds, but by the end of the first year they become specialized in the sounds of their native language. Infants also detect patterns in the speech stream, using statistical learning to discover where words begin and end.","Around 2 months, babies begin cooing, making pleasant vowel-like sounds. Around 6 months, babbling appears: the repetition of consonant-vowel combinations such as bababa. Babbling gradually takes on the sounds and rhythms of the language the infant hears. Deaf babies exposed to sign language babble with their hands in similar ways, which suggests that babbling reflects a general readiness for language.","Joint attention, in which caregiver and child attend to the same object or event while the caregiver labels it, strongly supports early vocabulary. Infants also take turns in games like peekaboo, which teaches the give-and-take of conversation. By the end of the first year, infants use preverbal gestures, such as pointing and showing, to communicate.","Adults often speak to infants in child-directed speech, a style with short sentences, high-pitched and exaggerated expression, clear pronunciation, distinct pauses and repetition. Infants prefer listening to it, and it helps them pick out words and follow the conversation. Parents adjust it as children grow, using longer and more complex sentences as their child's language advances."],"example":"A father points at a dog while his 10-month-old looks too and says, Look, a doggy! See the doggy? This combines joint attention with child-directed speech."},{"heading":"Semantic Development: Learning Words","paragraphs":["First words usually appear around the first birthday and refer to important people, objects that move, familiar actions and outcomes of familiar actions. Vocabulary grows slowly at first and then often speeds up sharply in the second year, a change sometimes called a vocabulary spurt. Comprehension develops ahead of production, so children understand many more words than they say.","Children connect new words with their underlying concepts after only a brief encounter, a process called fast mapping. Early word use contains characteristic errors. In underextension, a child applies a word too narrowly, using kitty only for the family cat. In overextension, a child applies a word too broadly, calling all four-legged animals doggie. Overextensions often reflect a limited vocabulary rather than confused concepts.","Children rely on word-learning strategies. The mutual exclusivity bias is the assumption that words refer to entirely separate categories, so a new word is assumed to label an unfamiliar object rather than a familiar one. The shape bias leads children to extend object names to other things with the same shape. In syntactic bootstrapping, children use the grammatical structure of sentences to figure out word meanings. Children also use social cues, such as an adult's eye gaze, to identify what a speaker is referring to."],"example":"Shown a ball and a strange kitchen gadget and asked to hand over the blicket, a 2-year-old picks the gadget. This reflects the mutual exclusivity bias."},{"heading":"Grammatical Development","paragraphs":["Between about 18 months and 2 years, children combine two words, such as more cookie or Daddy go. This is often called telegraphic speech because, like a telegram, it focuses on high-content words and leaves out smaller, less important words and grammatical endings. Children's early combinations often follow simple formulas built around particular words.","As grammar develops, children add grammatical morphemes, small markers that change meaning, such as -ing, plural -s and past-tense -ed. These are mastered in a fairly regular order across children. Researchers often track progress with the mean length of utterance (MLU), the average number of morphemes per sentence, which is a better guide to grammatical maturity than age alone.","Once children grasp a grammatical rule, they sometimes apply it to words that are exceptions, an error called overregularization. A child who once said went correctly may begin saying goed or mouses. These errors show that children are actively constructing rules rather than simply imitating. Over the preschool and school years, children master questions, negatives, passive sentences and complex constructions that combine clauses."],"example":"A 3-year-old says, The mouses runned away. Both mouses and runned are overregularizations of regular plural and past-tense rules."},{"heading":"Pragmatics, Referential Communication and Metalinguistic Awareness","paragraphs":["Pragmatic skills allow children to engage in effective and appropriate conversation. Even 2-year-olds take turns and respond relevantly to partners. Preschoolers learn to adjust their speech to the listener, for example using simpler language with a younger child. They also learn speech registers, adapting language to social expectations, such as speaking politely to a teacher or using a different style when playing a role.","Referential communication is the ability to produce clear verbal messages and to recognize when messages one receives are unclear. Young children's messages are often too vague when a listener cannot see what they see. These skills improve substantially in middle childhood as children better take others' perspectives and monitor their own understanding.","Metalinguistic awareness is the ability to think about language as a system. It appears in early childhood, when preschoolers recognize that words are separate from their referents, and grows during the school years as children reflect on word meanings, grammar and sounds. It supports reading and writing and helps children appreciate jokes and riddles based on double meanings."],"example":"A 9-year-old laughs at the riddle, Why did the cookie go to the doctor? Because it felt crummy. Getting the joke requires metalinguistic awareness of double meanings."},{"heading":"Bilingualism","paragraphs":["Many children grow up bilingual, learning two languages either at the same time in early childhood or one after the other. Children who learn two languages from birth acquire each according to a similar timetable and reach early milestones on schedule, although vocabulary in each language may be smaller than that of monolingual peers when counted separately. Combining the two languages, total vocabulary is similar.","Bilingual children often engage in code switching, mixing elements of both languages within a sentence or conversation. This is not a sign of confusion. It usually follows the grammatical rules of both languages and is used purposefully, for example when one language has a better word for an idea. Children also switch to match the language of the person they are talking with.","Bilingualism has cognitive benefits. Bilingual children often show advantages in some aspects of executive function, such as attention control and flexible switching, as well as in metalinguistic awareness and phonological awareness, which support early reading. Educational programs that support the home language while children learn the majority language tend to produce better outcomes than programs that require children to abandon their first language."],"example":"A child who speaks Spanish at home and English at school says, I want the red one, el rojo, to her bilingual grandmother. This is code switching, not confusion."}],"terms":[{"term":"Phonology","def":"The component of language concerned with the rules governing the structure and sequence of speech sounds."},{"term":"Semantics","def":"The component of language concerned with vocabulary and the way concepts are expressed in words."},{"term":"Grammar","def":"The component of language made up of syntax, the rules for arranging words into sentences, and morphology, the use of grammatical markers."},{"term":"Pragmatics","def":"The rules for using language effectively and appropriately in social contexts."},{"term":"Language acquisition device (LAD)","def":"In Chomsky's theory, an innate system containing a universal grammar that allows children to acquire language rapidly."},{"term":"Broca's area","def":"A region of the left frontal lobe that supports grammatical processing and language production."},{"term":"Wernicke's area","def":"A region of the left temporal lobe that plays a role in comprehending word meaning."},{"term":"Babbling","def":"Repetition of consonant-vowel combinations, beginning around 6 months of age."},{"term":"Joint attention","def":"A state in which the child and caregiver attend to the same object or event, often while the caregiver labels it."},{"term":"Child-directed speech","def":"A form of language adults use with young children, with short sentences, high-pitched exaggerated expression, clear pronunciation and repetition."},{"term":"Fast mapping","def":"Connecting a new word with an underlying concept after only a brief encounter."},{"term":"Overextension","def":"Applying a word to a wider collection of objects and events than is appropriate."},{"term":"Overregularization","def":"Applying a grammatical rule to words that are exceptions, as in saying goed or mouses."},{"term":"Metalinguistic awareness","def":"The ability to think about language as a system."}],"questions":[{"type":"mc","section":"Components of Language and Theories of Development","prompt":"Which component of language concerns the rules for using language appropriately in social situations?","choices":["Phonology","Semantics","Pragmatics","Morphology"],"answer":2,"explain":["Not quite. Phonology concerns the sound structure of language.","Not quite. Semantics concerns vocabulary and word meanings.","Correct. Pragmatics refers to the social rules for using language effectively and appropriately.","Not quite. Morphology, part of grammar, concerns grammatical markers such as plural and past-tense endings."]},{"type":"mc","section":"Components of Language and Theories of Development","prompt":"Chomsky's nativist theory explains children's rapid mastery of grammar by proposing","choices":["an innate language acquisition device containing a universal grammar","reinforcement of word-like sounds by parents","imitation of adult sentences","child-directed speech as the sole cause of language learning"],"answer":0,"explain":["Correct. Chomsky argued that children are born with a language acquisition device that includes a universal grammar.","Not quite. Reinforcement is central to the behaviorist view, not to Chomsky's theory.","Not quite. Imitation is part of the behaviorist account, which Chomsky criticized.","Not quite. Child-directed speech is emphasized in interactionist accounts, and no theory treats it as the sole cause."]},{"type":"mc","section":"Biological Bases and the Sensitive Period","prompt":"Which brain region, located in the left frontal lobe, supports grammatical processing and language production?","choices":["Wernicke's area","The cerebellum","The occipital lobe","Broca's area"],"answer":3,"explain":["Not quite. Wernicke's area, in the temporal lobe, is involved mainly in comprehending word meaning.","Not quite. The cerebellum supports balance and motor control, not the key language functions described.","Not quite. The occipital lobe is primarily involved in vision.","Correct. Broca's area in the left frontal lobe supports grammar and speech production."]},{"type":"mc","section":"Prelinguistic Development","prompt":"What is the main sign that babbling reflects a general readiness for language rather than just practicing mouth movements?","choices":["Babbling stops completely at 6 months","Deaf infants exposed to sign language babble with their hands","Babbling contains full grammatical sentences","Only children with older siblings babble"],"answer":1,"explain":["Not quite. Babbling typically begins around 6 months rather than stopping then.","Correct. Manual babbling in deaf infants exposed to sign shows that babbling reflects a broader language capacity.","Not quite. Babbling consists of repeated syllables, not grammatical sentences.","Not quite. Babbling is universal and does not depend on having siblings."]},{"type":"mc","section":"Semantic Development: Learning Words","prompt":"A toddler uses the word kitty only for the family cat and not for other cats. This is an example of","choices":["overextension","overregularization","underextension","fast mapping"],"answer":2,"explain":["Not quite. Overextension means applying a word too broadly, the opposite of this example.","Not quite. Overregularization involves grammatical rules, such as saying goed.","Correct. Applying a word too narrowly, to only one instance, is underextension.","Not quite. Fast mapping is the quick linking of a new word to a concept, not a narrow use."]},{"type":"mc","section":"Grammatical Development","prompt":"Why do researchers often use mean length of utterance (MLU) to track grammatical development?","choices":["It measures how many words a child understands","It counts the number of languages a child speaks","It measures how clearly a child pronounces sounds","It reflects the average number of morphemes per sentence, a good guide to grammatical maturity"],"answer":3,"explain":["Not quite. MLU measures production of sentences, not comprehension of words.","Not quite. MLU has nothing to do with the number of languages spoken.","Not quite. Pronunciation is a matter of phonology, which MLU does not measure.","Correct. MLU averages morphemes per utterance and predicts grammatical development better than age alone."]},{"type":"mc","section":"Bilingualism","prompt":"Which statement about code switching in bilingual children is accurate?","choices":["It is usually purposeful and follows the grammatical rules of both languages","It shows that the child is confused about which language is which","It indicates a language delay that requires treatment","It occurs only in children who learned their second language after age 10"],"answer":0,"explain":["Correct. Code switching is typically purposeful and grammatically structured, not a sign of confusion.","Not quite. Research indicates code switching does not reflect confusion between languages.","Not quite. Code switching is a normal feature of bilingual speech, not a delay.","Not quite. Code switching occurs in children who learn both languages early as well."]},{"type":"tf","section":"Grammatical Development","prompt":"Overregularization errors such as saying goed show that children are actively applying grammatical rules rather than simply imitating adults.","choices":["True","False"],"answer":0,"explain":["Correct. Adults do not say goed, so the error shows the child is applying the regular past-tense rule.","Not quite. Because adults rarely model these errors, they show rule use rather than imitation."]},{"type":"tf","section":"Biological Bases and the Sensitive Period","prompt":"Evidence for a sensitive period shows a sharp cutoff after which a second language cannot be learned at all.","choices":["True","False"],"answer":1,"explain":["Not quite. Later learners can still become fluent; the decline in ease of mastery is gradual.","Correct. Language learning becomes gradually harder with age, but there is no sharp cutoff."]},{"type":"scenario","section":"Semantic Development: Learning Words","prompt":"A mother shows her 2-year-old a spoon and an unfamiliar whisk and asks, Can you give me the whisk? The child hands over the whisk. Which word-learning strategy best explains the child's choice?","choices":["Shape bias","Mutual exclusivity bias","Overextension","Syntactic bootstrapping"],"answer":1,"explain":["Not quite. The shape bias concerns extending a name to other objects with the same shape, not choosing between a known and an unknown object.","Correct. Assuming the new word refers to the object without a known name reflects the mutual exclusivity bias.","Not quite. Overextension is applying a known word too broadly, which is not what happened.","Not quite. Syntactic bootstrapping uses sentence structure to infer meaning, while this choice relies on the known name of the spoon."]},{"type":"scenario","section":"Prelinguistic Development","prompt":"At the zoo, a grandmother notices her 11-month-old staring at a giraffe, looks at it too and says, That's a giraffe! What a tall giraffe! Which experience is she providing that especially supports early vocabulary?","choices":["Referential communication training","Overregularization practice","Joint attention with labeling","Telegraphic speech"],"answer":2,"explain":["Not quite. Referential communication involves producing clear messages, a skill of older children.","Not quite. Overregularization is a grammatical error, not something adults provide.","Correct. Following the infant's focus and labeling the object is joint attention, which strongly supports vocabulary growth.","Not quite. Telegraphic speech describes the child's early two-word sentences, not the adult's labeling."]},{"type":"scenario","section":"Pragmatics, Referential Communication and Metalinguistic Awareness","prompt":"Four-year-old Leo, talking on the phone, tells his aunt, I got this one for my birthday, without describing the toy. Which skill is still developing?","choices":["Referential communication","Babbling","Fast mapping","Phonological development"],"answer":0,"explain":["Correct. Leo's message is unclear for a listener who cannot see the toy, showing immature referential communication.","Not quite. Babbling is a prelinguistic milestone that Leo passed long ago.","Not quite. Fast mapping concerns learning new words, which is not the problem here.","Not quite. Leo's speech sounds are not the issue; his message lacks needed information."]}]},{"id":"m10","num":10,"title":"Emotional Development","tagline":"How emotions emerge and become regulated, how temperament shapes individual differences, and how infants form attachments to caregivers.","objectives":["Describe the functions of emotions and the developmental course of basic and self-conscious emotions","Explain how emotional self-regulation develops and how children come to understand and respond to others' emotions","Compare major models of temperament and explain stability, inhibition and goodness of fit","Outline Bowlby's ethological theory and the phases of attachment","Distinguish the Ainsworth attachment patterns measured by the Strange Situation and identify factors that influence attachment security","Evaluate how early attachment relates to multiple caregivers, child care and later development"],"sections":[{"heading":"Functions and Development of Emotions","paragraphs":["An emotion is a rapid appraisal of the personal significance of a situation that prepares a person for action. Emotions are not just feelings. They organize thinking and behavior, guide social interaction, and affect health. A happy infant invites caregivers to stay close, while a distressed cry calls for help. Functionalist theorists argue that each emotion serves a purpose: it helps the person reach a goal, such as staying safe, getting help or keeping a valued relationship.","Basic emotions, such as happiness, interest, surprise, fear, anger, sadness and disgust, are found across cultures and appear early in life. Newborns show general states of attraction and withdrawal. Over the first months these become clearer, organized signals. The social smile, a smile evoked by the human face, appears at about six to ten weeks. Laughter follows around three to four months, usually in response to very active stimulation such as being tickled.","Anger and fear become more frequent and intense in the second half of the first year. Anger helps infants act against obstacles, which fits their new ability to pursue goals on purpose. The most familiar expression of fear is stranger anxiety, a wary or distressed reaction to unfamiliar adults. It depends on the setting, the stranger's behavior and the child's temperament. Infants are less fearful when the parent is near and the stranger approaches slowly and warmly."],"example":"A nine-month-old who smiled at everyone a few months ago now turns away and clings to her father when a new neighbor reaches for her, yet warms up after the neighbor sits down and offers a toy."},{"heading":"Self-Conscious Emotions and Emotional Self-Regulation","paragraphs":["Self-conscious emotions, such as guilt, shame, embarrassment, envy and pride, involve injury to or enhancement of the sense of self. They appear in the second half of the second year, after toddlers become aware of themselves as separate people. At first, toddlers need adults to tell them when to feel proud or ashamed. Later, children apply internal standards on their own. Guilt, which focuses on a specific action and motivates repair, is generally linked to healthier adjustment than shame, which targets the whole self.","Emotional self-regulation refers to the strategies people use to adjust their emotional state to a comfortable level so they can reach their goals. Young infants depend heavily on caregivers, who soothe them, feed them and shift their attention. Gradually infants learn to turn away from overwhelming stimulation or suck on their fingers to calm down. Brain development, especially in the prefrontal cortex, supports these growing skills.","By the preschool years, language allows children to talk about feelings and use strategies such as covering their eyes or telling themselves that everything will be fine. In middle childhood they distinguish problem-centered coping, where they change the situation, from emotion-centered coping, where they change their feelings when the situation cannot be changed. Children also learn emotional display rules, the cultural rules about when and how emotions should be expressed."],"example":"A four-year-old who gets a disappointing birthday present thanks her aunt politely, showing she has learned a display rule, then tells her mother privately that she wanted something else."},{"heading":"Understanding and Responding to Others' Emotions","paragraphs":["Early on, infants match the feeling tone of a caregiver in face-to-face play. By the end of the first year they can read the meaning of others' emotional expressions. Social referencing is the process of actively seeking emotional information from a trusted person in an uncertain situation. A toddler facing a new toy or an unfamiliar adult often looks at the parent and then approaches or avoids depending on whether the parent looks happy or fearful.","In early childhood, children begin to explain the causes of emotions, at first focusing on external events and later on inner states such as desires and beliefs. They also learn that people can feel more than one emotion at once, an understanding that grows during middle childhood. Conversations with parents about feelings strongly predict how well children understand emotions.","Empathy is feeling with another person and responding emotionally in a similar way. It differs from sympathy, which is feelings of concern or sorrow for another's plight. Empathy can motivate prosocial behavior, actions that benefit others. However, children who become overwhelmed by personal distress may turn away instead of helping. Warm parents who model sensitive responses and encourage children to notice others' feelings tend to raise more empathic and sympathetic children."],"example":"A toddler crawling across a visual cliff stops at the drop, looks back at his mother, sees her smiling encouragingly, and keeps going."},{"heading":"Temperament","paragraphs":["Temperament refers to stable individual differences in reactivity and self-regulation. Reactivity is the speed and intensity of emotional arousal, attention and motor activity. Self-regulation is the ability to control that reactivity. In the New York Longitudinal Study, Alexander Thomas and Stella Chess identified three types. The easy child quickly sets up regular routines, is generally cheerful and adapts easily. The difficult child has irregular routines, is slow to accept new experiences and reacts negatively and intensely. The slow-to-warm-up child is inactive, mild and adjusts slowly to change. Many children do not fit any category.","Mary Rothbart proposed a model that combines overlapping traits into a smaller set of dimensions. These include activity level, attention span and persistence, fearful distress, irritable distress, positive affect, and effortful control. Effortful control is the capacity to voluntarily suppress a dominant response in order to plan and carry out a more adaptive one. It is a central aspect of self-regulation and predicts later academic and social competence.","Temperament is measured through parent interviews and questionnaires, teacher and caregiver ratings, laboratory observations, and physiological measures such as heart rate and stress hormones. Each method has strengths and limits. Parents know their child well across many settings but may be biased, while laboratory observations are more objective but capture only a short slice of behavior."],"example":"One baby in a playgroup cries at every new face and needs days to accept a new babysitter, while another greets strangers with smiles; their parents describe the first as slow-to-warm-up and the second as easy."},{"heading":"Stability of Temperament and Goodness of Fit","paragraphs":["Temperament shows only low to moderate stability. Children who are very high or very low on a trait tend to stay that way, but many others change. Temperament itself develops as the prefrontal cortex matures and effortful control improves. Heredity contributes to temperament, yet experience, including parenting and culture, also shapes it.","Jerome Kagan studied inhibited, or shy, children, who react negatively to and withdraw from novel stimuli, and uninhibited, or sociable, children, who display positive emotion to and approach novel stimuli. Inhibited children show stronger physiological arousal to new situations, linked to an easily excited amygdala. Still, many inhibited children become less shy over time, especially when parents gently encourage them to approach new situations rather than shielding them completely.","Thomas and Chess proposed the goodness-of-fit model, which describes how temperament and environment work together. A good fit occurs when the child-rearing environment recognizes the child's temperament while encouraging more adaptive functioning. A difficult child whose parents respond with patience and consistent, firm limits often becomes better adjusted. When parents react with anger and harsh punishment, a poor fit develops and the child's difficulties tend to grow."],"example":"A highly active boy struggles in a classroom that demands long periods of sitting, but thrives when his teacher builds in movement breaks and hands-on tasks."},{"heading":"Attachment: Theory and Measurement","paragraphs":["Attachment is the strong affectionate tie we have with special people in our lives that leads us to feel pleasure when we interact with them and comfort when they are near in times of stress. John Bowlby's ethological theory of attachment views the infant's emotional tie to the caregiver as an evolved response that promotes survival. Bowlby rejected the idea that attachment is based mainly on feeding, a view supported by Harlow's studies in which infant monkeys clung to a soft cloth surrogate rather than a wire one that provided food.","Bowlby described four phases. In the preattachment phase, from birth to about six weeks, built-in signals such as crying and grasping bring adults close. In the attachment-in-the-making phase, until about six to eight months, infants respond differently to familiar people. In the clear-cut attachment phase, from about six to eight months to about two years, babies show separation anxiety and use the caregiver as a secure base. In the formation of a reciprocal relationship, after about two years, language lets children negotiate with caregivers.","Mary Ainsworth developed the Strange Situation, a laboratory procedure with short episodes of separation from and reunion with the parent, to assess attachment between about one and two years. The key observation is how the baby responds at reunion. Ainsworth and later researchers identified four patterns: secure, insecure-avoidant, insecure-resistant and disorganized-disoriented. In naturalistic settings, researchers also use the Attachment Q-Sort, in which an observer sorts descriptions of the child's behavior at home."],"example":"At a park, a toddler wanders off to explore the sandbox but returns to touch his mother's knee every few minutes before heading out again, using her as a secure base."},{"heading":"Attachment Patterns, Influences and Later Development","paragraphs":["Securely attached infants use the parent as a secure base, may or may not cry at separation, and actively seek contact and are quickly comforted at reunion. Avoidant infants seem unresponsive to the parent, are not distressed by separation and avoid the parent at reunion. Resistant infants stay close before separation, are very upset when the parent leaves, and at reunion mix clinginess with angry resistive behavior. Disorganized-disoriented infants show the greatest insecurity, with confused and contradictory behavior such as approaching with a dazed look.","Several factors affect attachment security. Early opportunity to form a close bond matters, as studies of children adopted out of deprived institutions show. Quality of caregiving is central: sensitive caregiving, meaning prompt, consistent and appropriate responses, predicts security. Infant characteristics and temperament play a role, and family circumstances such as stress, conflict and poverty can undermine sensitive care. Parents' own internal working models, their mental representations of attachment figures, also predict how they relate to their babies.","Infants form multiple attachments to fathers, siblings, grandparents and professional caregivers. High-quality child care with sensitive, stable caregivers is not harmful to attachment, whereas long hours in poor-quality care combined with family stress can raise risk. A secure attachment predicts later social and emotional competence, but continuity of caregiving matters most. Secure infants whose care later deteriorates may not keep their advantages, and insecure infants can do well if care improves."],"example":"During the Strange Situation, a baby girl cries when her mother leaves and, at reunion, reaches to be held but then pushes away angrily and keeps crying; this fits the resistant pattern."}],"terms":[{"term":"Social smile","def":"A smile evoked by the stimulus of the human face, appearing at about six to ten weeks of age."},{"term":"Stranger anxiety","def":"An infant's expression of fear or wariness toward unfamiliar adults, common in the second half of the first year."},{"term":"Self-conscious emotions","def":"Emotions such as guilt, shame, embarrassment, envy and pride that involve injury to or enhancement of the sense of self."},{"term":"Emotional self-regulation","def":"Strategies for adjusting one's emotional state to a comfortable level of intensity so that goals can be achieved."},{"term":"Emotional display rules","def":"Cultural rules that specify when, where and how it is appropriate to express emotions."},{"term":"Social referencing","def":"Actively seeking emotional information from a trusted person in an uncertain situation."},{"term":"Empathy","def":"The ability to understand another's emotional state and to feel with that person, responding emotionally in a similar way."},{"term":"Temperament","def":"Early-appearing, stable individual differences in reactivity and self-regulation."},{"term":"Effortful control","def":"The capacity to voluntarily suppress a dominant response in order to plan and carry out a more adaptive one."},{"term":"Goodness-of-fit model","def":"Thomas and Chess's idea that adjustment depends on how well the child-rearing environment matches the child's temperament while encouraging adaptive behavior."},{"term":"Attachment","def":"A strong affectionate tie to special people that brings pleasure in interaction and comfort when they are near during stress."},{"term":"Secure base","def":"Use of the familiar caregiver as a point from which to explore and to return to for emotional support."},{"term":"Strange Situation","def":"Ainsworth's laboratory procedure that assesses attachment through brief separations from and reunions with the caregiver."},{"term":"Internal working model","def":"A set of expectations about the availability of attachment figures and their likelihood of providing support, which guides future close relationships."}],"questions":[{"type":"mc","section":"Functions and Development of Emotions","prompt":"At about what age does the social smile typically first appear?","choices":["At birth","Six to ten weeks","Six to eight months","Around the first birthday"],"answer":1,"explain":["Not quite. Newborns may smile during sleep or in response to gentle touch, but this is not yet a social smile evoked by faces.","Correct. The social smile, a smile in response to the human face, emerges at about six to ten weeks.","Not quite. By six to eight months the social smile is long established; this is closer to when stranger anxiety develops.","Not quite. The social smile appears much earlier, within the first few months."]},{"type":"mc","section":"Se
